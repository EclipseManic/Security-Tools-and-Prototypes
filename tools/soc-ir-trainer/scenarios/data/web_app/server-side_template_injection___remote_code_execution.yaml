briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to SSTI in Jinja2 Templates Enables Remote Code Execution. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for SSTI in Jinja2 Templates Enables Remote Code Execution. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for SSTI in Jinja2 Templates Enables Remote Code Execution. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the SSTI in Jinja2 Templates Enables Remote Code Execution incident. Your organization runs a customer support portal at support.acmecorp.com (Python/Flask with Jinja2 templating, Ubuntu 22.04). The portal has a feature that generates personalized email templates using user-supplied names and company information. At 15:20 today, the WAF flagged a request to /api/preview-email containing {{config.__class__.__init__.__globals__[''os''].popen(''id'').read()}}. Investigation revealed the attacker from IP 91.240.xx.xx exploited a Server-Side Template Injection vulnerability in the email preview endpoint. The Jinja2 template was rendered using render_template_string(user_input) without sandboxing. The attacker escalated from SSTI to full RCE, deployed a web shell at /var/www/html/.hidden/shell.php, accessed the PostgreSQL database containing 56,000 support tickets (including internal communications, credentials, and customer PII), and established persistence
  via a cron job. The attack window was 15:18 to 15:55 — 37 minutes. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
