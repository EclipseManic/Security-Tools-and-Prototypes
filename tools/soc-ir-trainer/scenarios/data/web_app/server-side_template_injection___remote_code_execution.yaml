phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The attacker has RCE on the server, has deployed a web shell, installed a cron backdoor, and accessed the database. The email preview endpoint is still vulnerable.
  prompt: How do you contain this SSTI attack?
  guidance:
    what: 'Separate signal from noise: confirm the alert on support.acmecorp.com, its severity, and the affected accounts.'
    action: How do you contain this SSTI attack?
    why: Every later decision depends on an accurate picture of support.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: support.acmecorp.com.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - api preview-email
  - preview-email endpoint
  - endpoint immediately
  - immediately isolate
  - isolate server
  - server network
  - network remove
  - web shell
  reference_answer: |-
    Disable the /api/preview-email endpoint immediately, isolate the server from the network, remove the web shell and cron backdoor, and begin database access audit

    Why: Stops the attack vector, isolates the compromised server, removes persistence, and begins impact assessment.
  followup_good: The email preview endpoint uses render_template_string(user_input) where user_input is directly from the request body. Jinja2's render_template_string evaluates template expressions by default. The attacker used the Jinja2 MRO chain to access Python's os module and execute arbitrary commands.
  followup_weak: |-
    Stops the attack vector, isolates the compromised server, removes persistence, and begins impact assessment.

    The email preview endpoint uses render_template_string(user_input) where user_input is directly from the request body. Jinja2's render_template_string evaluates template expressions by default. The attacker used the Jinja2 MRO chain to access Python's os module and execute arbitrary commands.
  next: ssti_root_cause_analysis_phase_2
  mitre_tactic: Execution
  mitre_technique: T1059.006 Python
- id: ssti_root_cause_analysis_phase_2
  phase_type: containment
  title: SSTI Root Cause Analysis — Phase 2
  situation: The email preview endpoint uses render_template_string(user_input) where user_input is directly from the request body. Jinja2's render_template_string evaluates template expressions by default. The attacker used the Jinja2 MRO chain to access Python's os module and execute arbitrary commands.
  prompt: What is the root cause and how do you verify the full extent of SSTI exposure?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: What is the root cause and how do you verify the full extent of SSTI exposure?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: SSTI Root Cause Analysis — Phase 2. Asset in scope: support.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - search python
  - python files
  - files render
  - render template
  - template string
  - string user
  - user input
  - input audit
  reference_answer: |-
    Search all Python files for render_template_string with user input, audit all template rendering paths, check for other endpoints that pass user input to Jinja2, and review the application's template sandboxing configuration

    Why: Full SSTI audit: find all instances of unsafe template rendering and verify sandbox configuration.
  followup_good: The application uses Jinja2 without the SandboxedEnvironment. User input is passed directly to render_template_string. The application has 12 endpoints that render templates, 3 of which accept user input.
  followup_weak: |-
    Full SSTI audit: find all instances of unsafe template rendering and verify sandbox configuration.

    The application uses Jinja2 without the SandboxedEnvironment. User input is passed directly to render_template_string. The application has 12 endpoints that render templates, 3 of which accept user input.
  next: recovery_and_validation
  mitre_tactic: Discovery
  mitre_technique: T1059 Command and Scripting Interpreter
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. support.acmecorp.com is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return support.acmecorp.com to production?
  guidance:
    what: Decide how to restore service in stages while proving the environment is free of reinfection.
    action: What must be true before you return support.acmecorp.com to production?
    why: Business trust depends on returning service with evidence that the environment is safe.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: support.acmecorp.com.'
  hints:
  - Which backup or rebuild image is known-good for support.acmecorp.com, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore support.acmecorp.com from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: ssti_prevention_phase_3
  next_weak: ''
  mitre_tactic: Defense Evasion
  mitre_technique: T1565 Data Manipulation
