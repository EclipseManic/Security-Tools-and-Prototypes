  opening: Your organization runs a customer support portal at support.acmecorp.com (Python/Flask with Jinja2 templating, Ubuntu 22.04). The portal has a feature that generates personalized email templates using user-supplied names and company information.
  summary: Your organization runs a customer support portal at support.acmecorp.com (Python/Flask with Jinja2 templating, Ubuntu 22.04). The portal has a feature that generates personalized email templates using user-supplied names and company information. At 15:20 today, the WAF flagged a request to /api/preview-email containing {{config.__class__.__init__.__globals__['os'].popen('id').read()}}. Investigation revealed the attacker from IP 91.240.xx.xx exploited a Server-Side Template Injection vulnerability in the email preview endpoint. The Jinja2 template was rendered using render_template_string(user_input) without sandboxing. The attacker escalated from SSTI to full RCE, deployed a web shell at /var/www/html/.hidden/shell.php, accessed the PostgreSQL database containing 56,000 support tickets (including internal communications, credentials, and customer PII), and established persistence via a cron job. The attack window was 15:18 to 15:55 — 37 minutes.
