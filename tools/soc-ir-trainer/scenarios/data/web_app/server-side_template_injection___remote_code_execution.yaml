- id: ssti_prevention_phase_3
  phase_type: lessons
  title: SSTI Prevention — Phase 3
  situation: The application uses Jinja2 without the SandboxedEnvironment. User input is passed directly to render_template_string. The application has 12 endpoints that render templates, 3 of which accept user input.
  prompt: How do you prevent SSTI across the application?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: How do you prevent SSTI across the application?
    why: Without durable changes, the same root cause will produce the same incident again.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: SSTI Prevention — Phase 3. Asset in scope: support.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - replace render
  - render template
  - template string
  - string user
  - user input
  - input render
  - template template
  - template html
  reference_answer: |-
    Replace render_template_string(user_input) with render_template('template.html', user_data=user_input) using separate template files, enable Jinja2 SandboxedEnvironment for all user-facing templates, implement strict input validation (escape all template delimiters), and add SSTI-specific DAST scanning to the CI/CD pipeline

    Why: Comprehensive fix: separate templates from data, sandbox all user-facing templates, input validation, and CI/CD scanning.
