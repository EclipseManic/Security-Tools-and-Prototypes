briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Java Deserialization Vulnerability Leads to Remote Code Execution. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Java Deserialization Vulnerability Leads to Remote Code Execution. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Java Deserialization Vulnerability Leads to Remote Code Execution. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Java Deserialization Vulnerability Leads to Remote Code Execution incident. Your organization runs a legacy Java application at reporting.acmecorp.com (Java 8, Tomcat 9, Spring Framework 5.2). At 03:00 today, the endpoint detection tool on the Tomcat server flagged a suspicious process: a reverse shell connecting from the Tomcat process (PID 4521) to external IP 45.33.xx.xx:4444. Investigation revealed the attacker sent a serialized Java object to the /api/reports/export endpoint, which deserializes user input using ObjectInputStream without any filtering. The ysoserial tool was used to generate a CommonsCollections gadget chain payload. The reverse shell gave the attacker a cmd.exe shell as the ''tomcat'' user. The attacker then escalated to SYSTEM using a kernel exploit (CVE-2021-1732), installed a persistence mechanism (scheduled task), and exfiltrated the contents of the ''reports'' database (8.7 GB of financial reports). The attacker operated
  from 02:47 to 03:15. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
