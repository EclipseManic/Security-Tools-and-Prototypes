phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The attacker has SYSTEM-level access to the server, a reverse shell connection, and a persistence mechanism (scheduled task). The server is fully compromised.
  prompt: What is the correct immediate containment approach?
  guidance:
    what: 'Separate signal from noise: confirm the alert on reporting.acmecorp.com, its severity, and the affected accounts.'
    action: What is the correct immediate containment approach?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: reporting.acmecorp.com.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - isolate server
  - server network
  - network don
  - don shut
  - shut down
  - down preserve
  - preserve memory
  - memory forensics
  reference_answer: |-
    Isolate the server from the network (don't shut down — preserve memory forensics), kill the reverse shell connection, document the scheduled task persistence, and begin memory acquisition before powering down

    Why: Network isolation stops further damage while preserving volatile evidence (memory, running processes).
  followup_good: The attacker installed a scheduled task for persistence. The server has been isolated from the network. Memory has been acquired. You need to identify all persistence mechanisms and ensure complete cleanup before reconnecting the server.
  followup_weak: |-
    Network isolation stops further damage while preserving volatile evidence (memory, running processes).

    The attacker installed a scheduled task for persistence. The server has been isolated from the network. Memory has been acquired. You need to identify all persistence mechanisms and ensure complete cleanup before reconnecting the server.
