- id: persistence_removal_phase_2
  phase_type: containment
  title: Persistence Removal — Phase 2
  situation: The attacker installed a scheduled task for persistence. The server has been isolated from the network. Memory has been acquired. You need to identify all persistence mechanisms and ensure complete cleanup before reconnecting the server.
  prompt: How do you ensure complete persistence removal?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you ensure complete persistence removal?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Persistence Removal — Phase 2. Asset in scope: reporting.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - review scheduled
  - scheduled tasks
  - tasks services
  - services registry
  - registry run
  - keys startup
  - startup folders
  - folders wmi
  reference_answer: |-
    Review all scheduled tasks, services, registry run keys, startup folders, and WMI event subscriptions; check for hidden processes and injected DLLs; compare against a known-good baseline; rebuild the server from a clean image rather than trying to clean the compromised one

    Why: Comprehensive persistence check across all common locations, plus rebuild to ensure no hidden backdoors.
  followup_good: The /api/reports/export endpoint uses ObjectInputStream to deserialize user-supplied data without any filtering. The CommonsCollections library on the classpath provides the gadget chain. The application uses Java 8 which has limited deserialization protections.
  followup_weak: |-
    Comprehensive persistence check across all common locations, plus rebuild to ensure no hidden backdoors.

