- id: deserialization_fix_phase_3
  phase_type: eradication
  title: Deserialization Fix — Phase 3
  situation: The /api/reports/export endpoint uses ObjectInputStream to deserialize user-supplied data without any filtering. The CommonsCollections library on the classpath provides the gadget chain. The application uses Java 8 which has limited deserialization protections.
  prompt: How do you fix the insecure deserialization vulnerability?
  guidance:
    what: Find every foothold the attacker left on reporting.acmecorp.com, including persistence and stolen credentials.
    action: How do you fix the insecure deserialization vulnerability?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Deserialization Fix — Phase 3. Asset in scope: reporting.acmecorp.com.'
  hints:
  - Valid long-term approach but the current vulnerability needs immediate patching.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - replace objectinputstream
  - objectinputstream safe
  - safe deserialization
  - deserialization library
  - library like
  - like serialkiller
  - serialkiller notsoserial
  - notsoserial implement
  reference_answer: |-
    Replace ObjectInputStream with a safe deserialization library (like SerialKiller or NotSoSerial), implement an allowlist of permitted classes, remove CommonsCollections from the classpath if unused, and add deserialization monitoring to detect future attempts

    Why: Multi-layer fix: safe deserialization library, class allowlist, unnecessary library removal, and monitoring.
