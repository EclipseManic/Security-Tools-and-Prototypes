id: bola___customer_record_extraction
name: BOLA — Customer Record Extraction
category: Web App
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Broken Object-Level Authorization Exposes Customer Records. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Broken Object-Level Authorization Exposes Customer Records. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Broken Object-Level Authorization Exposes Customer Records. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Broken Object-Level Authorization Exposes Customer Records incident. Your organization runs a customer portal API at customerapi.acmecorp.com (REST API, Node.js/Express, PostgreSQL). A security researcher contacted your bug bounty program at 14:00 reporting a Broken Object-Level Authorization (BOLA/IDOR) vulnerability. The researcher demonstrated that by changing the customer ID in the GET /api/customers/{id} endpoint from their own ID (C-10042) to any sequential ID (C-10043 through C-10800), they could access any customer''s full profile including: name, email, phone, address, order history, and payment method details. The API validates authentication (valid JWT required) but does NOT verify that the authenticated user is authorized to access the requested customer ID. The researcher accessed 758 customer records during their demonstration. However, your access logs show that the same pattern was used by IP 103.21.xx.xx starting 3 days ago — 47,000
  sequential requests over 2 hours, likely accessing all 47,000 customer records. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: Broken Object-Level Authorization Exposes Customer Records
  opening: Your organization runs a customer portal API at customerapi.acmecorp.com (REST API, Node.js/Express, PostgreSQL). A security researcher contacted your bug bounty program at 14:00 reporting a Broken Object-Level Authorization (BOLA/IDOR) vulnerability.
  summary: 'Your organization runs a customer portal API at customerapi.acmecorp.com (REST API, Node.js/Express, PostgreSQL). A security researcher contacted your bug bounty program at 14:00 reporting a Broken Object-Level Authorization (BOLA/IDOR) vulnerability. The researcher demonstrated that by changing the customer ID in the GET /api/customers/{id} endpoint from their own ID (C-10042) to any sequential ID (C-10043 through C-10800), they could access any customer''s full profile including: name, email, phone, address, order history, and payment method details. The API validates authentication (valid JWT required) but does NOT verify that the authenticated user is authorized to access the requested customer ID. The researcher accessed 758 customer records during their demonstration. However, your access logs show that the same pattern was used by IP 103.21.xx.xx starting 3 days ago — 47,000 sequential requests over 2 hours, likely accessing all 47,000 customer records.'
  compromised_assets:
  - customerapi.acmecorp.com
  - 47,000 customer records (PII + payment methods)
  detected_via: Bug bounty report + retrospective log analysis revealing prior mass access
  kill_chain:
  - Initial Access
  - Collection
  - Exfiltration
  mitre_tactics:
  - Initial Access
  - Collection
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The BOLA vulnerability is active. The researcher accessed 758 records, but logs show 47,000 records were accessed 3 days ago by a different IP. The API endpoint requires authentication but not authorization per object.
  prompt: How do you contain this vulnerability immediately?
  guidance:
    what: Establish what fired on customerapi.acmecorp.com, which accounts are involved, and how urgent the signal is.
    action: How do you contain this vulnerability immediately?
    why: Every later decision depends on an accurate picture of customerapi.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: customerapi.acmecorp.com.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - authorization check
  - api customers
  - customers endpoint
  - endpoint verifies
  - verifies authenticated
  - authenticated user
  - user matches
  - matches requested
  reference_answer: |-
    Add an authorization check to the /api/customers/{id} endpoint that verifies the authenticated user's ID matches the requested customer ID, deploy to production immediately, and block IP 103.21.xx.xx

    Why: Fixes the root cause (authorization check) at the application layer and blocks the known malicious IP.
  followup_good: 'The attacker accessed 47,000 customer records. The access logs show sequential requests: /api/customers/C-00001 through /api/customers/C-47000. Each request returned a 200 OK with full customer data. The attacker''s IP (103.21.xx.xx) is a known VPS provider. The attack took 2 hours, averaging ~6.5 requests per second.'
  followup_weak: |-
    Fixes the root cause (authorization check) at the application layer and blocks the known malicious IP.

    The attacker accessed 47,000 customer records. The access logs show sequential requests: /api/customers/C-00001 through /api/customers/C-47000. Each request returned a 200 OK with full customer data. The attacker's IP (103.21.xx.xx) is a known VPS provider. The attack took 2 hours, averaging ~6.5 requests per second.
