  mitre_technique: T1213 Data from Information Repositories
- id: scope_of_compromise_phase_2
  phase_type: containment
  title: Scope of Compromise — Phase 2
  situation: 'The attacker accessed 47,000 customer records. The access logs show sequential requests: /api/customers/C-00001 through /api/customers/C-47000. Each request returned a 200 OK with full customer data. The attacker''s IP (103.21.xx.xx) is a known VPS provider. The attack took 2 hours, averaging ~6.5 requests per second.'
  prompt: What additional investigation is needed?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: What additional investigation is needed?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Scope of Compromise — Phase 2. Asset in scope: customerapi.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - full log
  - log analysis
  - analysis determine
  - determine exactly
  - exactly customer
  - customer ids
  - ids accessed
  - accessed check
  reference_answer: |-
    Full log analysis to determine exactly which customer IDs were accessed, check if the attacker made any modifications (not just reads), review the API response sizes to confirm data was returned, and cross-reference with the database audit logs

    Why: Complete scope determination: which records, whether data was modified, and confirmation of exfiltration.
  followup_good: The BOLA vulnerability exists because the API only validates JWT authentication but has no object-level authorization. The developer confirmed that the endpoint was built quickly for a deadline and authorization was 'deferred to later.' The same pattern may exist in other endpoints (/api/orders/{id}, /api/payments/{id}).
  followup_weak: |-
    Complete scope determination: which records, whether data was modified, and confirmation of exfiltration.

