- id: authorization_architecture_fix_phase_3
  phase_type: eradication
  title: Authorization Architecture Fix — Phase 3
  situation: The BOLA vulnerability exists because the API only validates JWT authentication but has no object-level authorization. The developer confirmed that the endpoint was built quickly for a deadline and authorization was 'deferred to later.' The same pattern may exist in other endpoints (/api/orders/{id}, /api/payments/{id}).
  prompt: How do you fix the authorization architecture?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you fix the authorization architecture?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Authorization Architecture Fix — Phase 3. Asset in scope: customerapi.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement authorization
  - authorization middleware
  - middleware checks
  - object ownership
  - ownership endpoints
  - endpoints returning
  - returning user-specific
  - user-specific data
  reference_answer: |-
    Implement an authorization middleware that checks object ownership for ALL endpoints returning user-specific data, audit all existing endpoints for BOLA, and add automated BOLA testing to the CI/CD pipeline

    Why: Systemic fix: middleware for consistent authorization, audit for existing instances, and CI/CD testing to prevent regression.
