id: jwt_forgery___mass_data_access
name: JWT Forgery — Mass Data Access
category: Web App
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to JWT Algorithm Confusion Enables Mass Data Access. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for JWT Algorithm Confusion Enables Mass Data Access. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for JWT Algorithm Confusion Enables Mass Data Access. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the JWT Algorithm Confusion Enables Mass Data Access incident. Your organization runs an API gateway at api.acmecorp.com (Python/Flask, behind NGINX) that uses JWT tokens for authentication. The tokens are signed with RS256 (RSA). At 06:00 today, the rate limiter detected an unusual pattern: a single IP (78.46.xx.xx) made 12,000 API calls in 10 minutes, accessing /api/v3/users, /api/v3/payments, and /api/v3/medical-records endpoints. The attacker exploited a JWT algorithm confusion vulnerability: the server accepts the ''alg'' header from the token, so the attacker changed the algorithm from RS256 to HS256 and signed the token with the server''s public RSA key (which was publicly available in the /jwks.json endpoint). The server accepted the HS256 token signed with the public key. The attacker exfiltrated 89,000 user profiles, 34,000 payment records (card numbers), and 12,000 medical records. The attack lasted from 05:47 to 05:57. Business impact: customer-facing
  service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: JWT Algorithm Confusion Enables Mass Data Access
  opening: Your organization runs an API gateway at api.acmecorp.com (Python/Flask, behind NGINX) that uses JWT tokens for authentication. The tokens are signed with RS256 (RSA).
  summary: 'Your organization runs an API gateway at api.acmecorp.com (Python/Flask, behind NGINX) that uses JWT tokens for authentication. The tokens are signed with RS256 (RSA). At 06:00 today, the rate limiter detected an unusual pattern: a single IP (78.46.xx.xx) made 12,000 API calls in 10 minutes, accessing /api/v3/users, /api/v3/payments, and /api/v3/medical-records endpoints. The attacker exploited a JWT algorithm confusion vulnerability: the server accepts the ''alg'' header from the token, so the attacker changed the algorithm from RS256 to HS256 and signed the token with the server''s public RSA key (which was publicly available in the /jwks.json endpoint). The server accepted the HS256 token signed with the public key. The attacker exfiltrated 89,000 user profiles, 34,000 payment records (card numbers), and 12,000 medical records. The attack lasted from 05:47 to 05:57.'
  compromised_assets:
  - api.acmecorp.com
  - 89,000 user profiles
  - 34,000 payment records
  - 12,000 medical records
