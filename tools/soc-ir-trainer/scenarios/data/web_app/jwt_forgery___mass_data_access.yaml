phases:
- id: token_revocation_phase_1
  phase_type: triage
  title: Token Revocation — Phase 1
  situation: The attacker has forged JWT tokens and is actively accessing the API. The current JWT signing key may be compromised (the attacker used the public key as HMAC secret). All issued tokens need to be considered untrusted.
  prompt: What do you do to immediately stop the unauthorized access?
  guidance:
    what: 'Separate signal from noise: confirm the alert on api.acmecorp.com, its severity, and the affected accounts.'
    action: What do you do to immediately stop the unauthorized access?
    why: Every later decision depends on an accurate picture of api.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Token Revocation — Phase 1. Asset in scope: api.acmecorp.com.'
  hints:
  - The attacker can still forge tokens with lower rate.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately rotate
  - jwt signing
  - signing key
  - key invalidate
  - invalidate currently
  - currently issued
  - issued tokens
  - tokens deploying
  reference_answer: |-
    Immediately rotate the JWT signing key, invalidate all currently issued tokens by deploying a token blocklist, and disable the /jwks.json endpoint from public access

    Why: Kills all forged and legitimate tokens, generates new signing key, and removes the public key from exposure.
  followup_good: 'Code review of the JWT validation middleware shows: the server reads the ''alg'' header from the incoming token and uses it to determine which verification method to apply. When ''alg'' is ''HS256'', it uses the RSA public key bytes as the HMAC secret. The /jwks.json endpoint exposes the public key at api.acmecorp.com/.well-known/jwks.json.'
  followup_weak: |-
    Kills all forged and legitimate tokens, generates new signing key, and removes the public key from exposure.

    Code review of the JWT validation middleware shows: the server reads the 'alg' header from the incoming token and uses it to determine which verification method to apply. When 'alg' is 'HS256', it uses the RSA public key bytes as the HMAC secret. The /jwks.json endpoint exposes the public key at api.acmecorp.com/.well-known/jwks.json.
  next: algorithm_confusion_fix_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1550.004 Web Session Cookie
- id: algorithm_confusion_fix_phase_2
  phase_type: containment
  title: Algorithm Confusion Fix — Phase 2
  situation: 'Code review of the JWT validation middleware shows: the server reads the ''alg'' header from the incoming token and uses it to determine which verification method to apply. When ''alg'' is ''HS256'', it uses the RSA public key bytes as the HMAC secret. The /jwks.json endpoint exposes the public key at api.acmecorp.com/.well-known/jwks.json.'
  prompt: How do you fix the JWT algorithm confusion vulnerability?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you fix the JWT algorithm confusion vulnerability?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Algorithm Confusion Fix — Phase 2. Asset in scope: api.acmecorp.com.'
  hints:
  - Valid alternative but doesn't address the specific vulnerability.
  - The attacker could still forge tokens at lower rates.
  ideal_concepts:
  - hardcode expected
  - expected algorithm
  - algorithm rs256
  - rs256 server
  - server ignore
  - ignore alg
  - alg header
  - header tokens
  reference_answer: |-
    Hardcode the expected algorithm (RS256) on the server, ignore the 'alg' header from tokens entirely, rotate the signing key, and restrict /jwks.json to internal network only

    Why: Fixes the root cause: the server decides the algorithm, not the token. Key rotation and JWKS restriction add defense-in-depth.
  followup_good: The attacker accessed 89,000 user profiles, 34,000 payment records, and 12,000 medical records. Payment data includes full card numbers (not tokenized). Medical records include diagnoses and prescriptions. This is a multi-regulatory breach (PCI-DSS for payments, HIPAA for medical).
  followup_weak: |-
    Fixes the root cause: the server decides the algorithm, not the token.

    The attacker accessed 89,000 user profiles, 34,000 payment records, and 12,000 medical records. Payment data includes full card numbers (not tokenized). Medical records include diagnoses and prescriptions. This is a multi-regulatory breach (PCI-DSS for payments, HIPAA for medical).
  next: recovery_and_validation
  mitre_tactic: Defense Evasion
  mitre_technique: T1565 Data Manipulation
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. api.acmecorp.com is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return api.acmecorp.com to production?
  guidance:
    what: Decide how to restore service in stages while proving the environment is free of reinfection.
    action: What must be true before you return api.acmecorp.com to production?
    why: A fast restore that reintroduces the attacker is worse than a slower, verified recovery.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: api.acmecorp.com.'
  hints:
  - Which backup or rebuild image is known-good for api.acmecorp.com, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore api.acmecorp.com from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
