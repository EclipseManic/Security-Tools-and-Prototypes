  title: Path Traversal Exposes Server Configuration and Credentials
  opening: Your organization runs a document management system at docs.acmecorp.com (Java/Tomcat on Ubuntu 22.04). At 16:30, the WAF flagged a request to /api/download?file=../../../etc/passwd from IP 185.220.xx.xx.
  summary: 'Your organization runs a document management system at docs.acmecorp.com (Java/Tomcat on Ubuntu 22.04). At 16:30, the WAF flagged a request to /api/download?file=../../../etc/passwd from IP 185.220.xx.xx. Investigation of the WAF logs revealed 342 path traversal attempts over 45 minutes, with successful payloads using ../../ combinations to escape the upload directory. The attacker successfully read: /etc/passwd, /etc/shadow (via symlink to upload dir), /opt/tomcat/conf/server.xml (database connection strings including plaintext MySQL password), /opt/tomcat/webapps/ROOT/WEB-INF/web.xml (application configuration), and /home/deploy/.ssh/id_rsa (SSH private key for deployment account). The attacker used the SSH key to connect to the staging database server at 10.0.2.15. The MySQL password from server.xml was also used to connect to the production database from the attacker''s IP.'
