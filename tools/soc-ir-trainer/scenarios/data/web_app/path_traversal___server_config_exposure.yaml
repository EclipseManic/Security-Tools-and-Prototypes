- id: path_traversal_fix_phase_3
  phase_type: eradication
  title: Path Traversal Fix — Phase 3
  situation: 'The /api/download endpoint uses: new File("/uploads/" + userParam + "/" + filename) without any validation of .. or absolute paths. The attacker used ../../ to escape the uploads directory and read arbitrary files on the server.'
  prompt: How do you fix the path traversal vulnerability?
  guidance:
    what: Find every foothold the attacker left on docs.acmecorp.com, including persistence and stolen credentials.
    action: How do you fix the path traversal vulnerability?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Path Traversal Fix — Phase 3. Asset in scope: docs.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement path
  - path canonicalization
  - canonicalization resolve
  - resolve absolute
  - absolute path
  - path verify
  - verify starts
  - uploads chroot
  reference_answer: |-
    Implement path canonicalization (resolve to absolute path, verify it starts with /uploads/), use a chroot jail or container for the download service, move credentials out of config files into a secrets manager (Vault/AWS Secrets Manager), and add WAF rules for path traversal patterns

    Why: Multi-layer fix: canonicalization prevents traversal, chroot limits access, secrets manager removes credentials from files.
