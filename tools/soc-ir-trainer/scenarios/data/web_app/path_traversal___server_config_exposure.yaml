id: path_traversal___server_config_exposure
name: Path Traversal — Server Config Exposure
category: Web App
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Path Traversal Exposes Server Configuration and Credentials. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Path Traversal Exposes Server Configuration and Credentials. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Path Traversal Exposes Server Configuration and Credentials. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Path Traversal Exposes Server Configuration and Credentials incident. Your organization runs a document management system at docs.acmecorp.com (Java/Tomcat on Ubuntu 22.04). At 16:30, the WAF flagged a request to /api/download?file=../../../etc/passwd from IP 185.220.xx.xx. Investigation of the WAF logs revealed 342 path traversal attempts over 45 minutes, with successful payloads using ../../ combinations to escape the upload directory. The attacker successfully read: /etc/passwd, /etc/shadow (via symlink to upload dir), /opt/tomcat/conf/server.xml (database connection strings including plaintext MySQL password), /opt/tomcat/webapps/ROOT/WEB-INF/web.xml (application configuration), and /home/deploy/.ssh/id_rsa (SSH private key for deployment account). The attacker used the SSH key to connect to the staging database server at 10.0.2.15. The MySQL password from server.xml was also used to connect to the production database from the attacker''s IP.
  Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
