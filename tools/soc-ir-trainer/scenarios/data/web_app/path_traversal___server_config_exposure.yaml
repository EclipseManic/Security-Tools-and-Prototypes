phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The attacker has read server configuration files, obtained an SSH private key, and MySQL credentials. They have connected to the staging server (10.0.2.15) via SSH and accessed the production database from their IP. The path traversal endpoint is still active.
  prompt: What are the immediate containment actions?
  guidance:
    what: Establish what fired on docs.acmecorp.com, which accounts are involved, and how urgent the signal is.
    action: What are the immediate containment actions?
    why: Every later decision depends on an accurate picture of docs.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: docs.acmecorp.com.'
  hints:
  - Rebooting clears memory but doesn't rotate SSH keys or MySQL passwords.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - api download
  - download endpoint
  - endpoint rotate
  - credentials found
  - found config
  - config files
  - files mysql
  - mysql ssh
  reference_answer: |-
    Disable the /api/download endpoint, rotate ALL credentials found in the config files (MySQL, SSH keys), block the attacker's IPs (185.220.xx.xx) on the firewall, and disable the deploy account's SSH key

    Why: Stops the traversal vector, kills all stolen credentials, and blocks known attacker IPs.
  followup_good: 'The attacker connected to the staging server (10.0.2.15) via SSH and accessed the production database. You need to determine: what else did the attacker access on the staging server? Did they pivot to other internal systems? The deploy account has sudo access on the staging server.'
  followup_weak: |-
    Stops the traversal vector, kills all stolen credentials, and blocks known attacker IPs.

    The attacker connected to the staging server (10.0.2.15) via SSH and accessed the production database. You need to determine: what else did the attacker access on the staging server? Did they pivot to other internal systems? The deploy account has sudo access on the staging server.
  next: lateral_movement_assessment_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: lateral_movement_assessment_phase_2
  phase_type: containment
  title: Lateral Movement Assessment — Phase 2
  situation: 'The attacker connected to the staging server (10.0.2.15) via SSH and accessed the production database. You need to determine: what else did the attacker access on the staging server? Did they pivot to other internal systems? The deploy account has sudo access on the staging server.'
  prompt: How do you assess the lateral movement?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you assess the lateral movement?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Lateral Movement Assessment — Phase 2. Asset in scope: docs.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - review staging
  - staging server
  - server auth
  - auth logs
  - logs ssh
  - ssh sessions
  - sessions check
  - bash history
  reference_answer: |-
    Review staging server auth logs for SSH sessions, check bash_history for the deploy user, review network connections from the staging server, check for any new files or processes, and review database query logs for the production MySQL

    Why: Complete lateral movement assessment: authentication logs, command history, network connections, and DB queries.
  followup_good: 'The /api/download endpoint uses: new File("/uploads/" + userParam + "/" + filename) without any validation of .. or absolute paths. The attacker used ../../ to escape the uploads directory and read arbitrary files on the server.'
  followup_weak: |-
    Complete lateral movement assessment: authentication logs, command history, network connections, and DB queries.

    The /api/download endpoint uses: new File("/uploads/" + userParam + "/" + filename) without any validation of .. or absolute paths. The attacker used ../../ to escape the uploads directory and read arbitrary files on the server.
