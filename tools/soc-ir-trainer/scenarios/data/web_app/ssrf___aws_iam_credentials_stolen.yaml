phases:
- id: credential_containment_phase_1
  phase_type: triage
  title: Credential Containment — Phase 1
  situation: The attacker has AWS IAM credentials with S3 read/write access and has created a backdoor IAM user 'backup-admin-backup'. The EC2 instance's IAM role is compromised. The attacker has already downloaded 4.2 TB of backup data.
  prompt: What is the FIRST thing you must do?
  guidance:
    what: 'Frame the decision for ''Credential Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What is the FIRST thing you must do?
    why: Every later decision depends on an accurate picture of cms.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Credential Containment — Phase 1. Asset in scope: cms.acmecorp.com.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - detach ec2
  - ec2 iam
  - iam role
  - role immediately
  - immediately delete
  - backdoor iam
  - iam user
  - user revoke
  reference_answer: |-
    Detach the EC2 IAM role immediately, delete the backdoor IAM user, and revoke all active sessions for the compromised role in AWS IAM

    Why: Stops the attacker from using any credentials derived from the compromised IAM role.
  followup_good: The backdoor IAM user 'backup-admin-backup' was created at 08:22. It has AdministratorAccess policy attached. The attacker also created access keys for this user. CloudTrail shows 847 API calls including s3:GetObject, iam:CreateUser, iam:CreateAccessKey, iam:AttachUserPolicy. You need to ensure the attacker has no remaining persistence.
  followup_weak: |-
    Stops the attacker from using any credentials derived from the compromised IAM role.

    The backdoor IAM user 'backup-admin-backup' was created at 08:22. It has AdministratorAccess policy attached. The attacker also created access keys for this user. CloudTrail shows 847 API calls including s3:GetObject, iam:CreateUser, iam:CreateAccessKey, iam:AttachUserPolicy. You need to ensure the attacker has no remaining persistence.
  next: backdoor_cleanup_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1552.005 Cloud Instance Metadata API
- id: backdoor_cleanup_phase_2
  phase_type: analysis
  title: Backdoor Cleanup — Phase 2
  situation: The backdoor IAM user 'backup-admin-backup' was created at 08:22. It has AdministratorAccess policy attached. The attacker also created access keys for this user. CloudTrail shows 847 API calls including s3:GetObject, iam:CreateUser, iam:CreateAccessKey, iam:AttachUserPolicy. You need to ensure the attacker has no remaining persistence.
  prompt: How do you ensure complete attacker persistence removal?
  guidance:
    what: Test the initial theory against telemetry from cms.acmecorp.com before committing to a response.
    action: How do you ensure complete attacker persistence removal?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Backdoor Cleanup — Phase 2. Asset in scope: cms.acmecorp.com.'
  hints:
  - Good practice but doesn't address the specific persistence mechanisms created by the attacker.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - backdoor user
  - user access
  - access keys
  - keys review
  - review cloudtrail
  - cloudtrail users
  - users policies
  - policies roles
  reference_answer: |-
    Delete the backdoor user AND access keys, review CloudTrail for any other users/policies/roles created, check for any new API keys on existing users, and enable AWS CloudTrail log file validation

    Why: Full persistence cleanup: the backdoor user, any other modifications, and integrity validation for future detection.
  followup_good: The PDF generator at /api/generate-pdf accepts a 'url' parameter and uses puppeteer to fetch the URL and render it. There is NO URL validation — the server will fetch any URL including internal metadata endpoints. The SSRF is the root cause of the entire incident.
  followup_weak: |-
    Full persistence cleanup: the backdoor user, any other modifications, and integrity validation for future detection.

    The PDF generator at /api/generate-pdf accepts a 'url' parameter and uses puppeteer to fetch the URL and render it. There is NO URL validation — the server will fetch any URL including internal metadata endpoints. The SSRF is the root cause of the entire incident.
  next: ssrf_vulnerability_fix_phase_3
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: ssrf_vulnerability_fix_phase_3
  phase_type: eradication
  title: SSRF Vulnerability Fix — Phase 3
  situation: The PDF generator at /api/generate-pdf accepts a 'url' parameter and uses puppeteer to fetch the URL and render it. There is NO URL validation — the server will fetch any URL including internal metadata endpoints. The SSRF is the root cause of the entire incident.
  prompt: How do you fix the SSRF vulnerability?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you fix the SSRF vulnerability?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: SSRF Vulnerability Fix — Phase 3. Asset in scope: cms.acmecorp.com.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - implement url
  - url allowlist
  - allowlist validation
  - validation permit
  - permit http
  - http https
  - https external
  - external domains
  reference_answer: |-
    Implement URL allowlist validation (only permit http/https to external domains), block all RFC 1918 and link-local ranges (169.254.x.x, 10.x.x.x, 172.16-31.x.x, 192.168.x.x), add IMDSv2 enforcement on the EC2 instance, and use a WAF rule to block metadata endpoint access

    Why: Multi-layer fix: URL validation at app layer, network-level blocking, and IMDSv2 to require session tokens for metadata.
  followup_good: The attacker had the IAM role credentials for 27 minutes. CloudTrail shows they accessed the S3 backup bucket (4.2 TB), created a backdoor IAM user, and made 847 API calls. You need to determine if the attacker accessed any other AWS services or data.
  followup_weak: |-
    Multi-layer fix: URL validation at app layer, network-level blocking, and IMDSv2 to require session tokens for metadata.

    The attacker had the IAM role credentials for 27 minutes. CloudTrail shows they accessed the S3 backup bucket (4.2 TB), created a backdoor IAM user, and made 847 API calls. You need to determine if the attacker accessed any other AWS services or data.
  next: recovery_and_validation
  mitre_tactic: Defense Evasion
  mitre_technique: T1565 Data Manipulation
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. cms.acmecorp.com is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return cms.acmecorp.com to production?
  guidance:
    what: Separate business pressure to restore from the evidence required to restore safely.
    action: What must be true before you return cms.acmecorp.com to production?
    why: Business trust depends on returning service with evidence that the environment is safe.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: cms.acmecorp.com.'
  hints:
  - Which backup or rebuild image is known-good for cms.acmecorp.com, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore cms.acmecorp.com from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: blast_radius_assessment_phase_4
  next_weak: ''
  mitre_tactic: Discovery
  mitre_technique: T1580 Cloud Infrastructure Discovery
  role_prompts: {}
- id: blast_radius_assessment_phase_4
  phase_type: lessons
  title: Blast Radius Assessment — Phase 4
  situation: The attacker had the IAM role credentials for 27 minutes. CloudTrail shows they accessed the S3 backup bucket (4.2 TB), created a backdoor IAM user, and made 847 API calls. You need to determine if the attacker accessed any other AWS services or data.
  prompt: How do you assess the full blast radius?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: How do you assess the full blast radius?
    why: Without durable changes, the same root cause will produce the same incident again.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Blast Radius Assessment — Phase 4. Asset in scope: cms.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - full cloudtrail
  - cloudtrail analysis
  - analysis api
  - api calls
  - compromised role
  - role backdoor
  - backdoor user
  - user vpc
  reference_answer: |-
    Full CloudTrail analysis of all API calls from the compromised role AND the backdoor user, VPC flow logs for the EC2 instance, S3 access logs for the backup bucket, and review all IAM policy changes and new resource creation

    Why: Complete blast radius: all API calls from both the original role and backdoor user, plus network and access logs.
