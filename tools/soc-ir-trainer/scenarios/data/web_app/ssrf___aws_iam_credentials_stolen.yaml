id: ssrf___aws_iam_credentials_stolen
name: SSRF — AWS IAM Credentials Stolen
category: Web App
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Server-Side Request Forgery Exposes AWS Metadata Service. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Server-Side Request Forgery Exposes AWS Metadata Service. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Server-Side Request Forgery Exposes AWS Metadata Service. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Server-Side Request Forgery Exposes AWS Metadata Service incident. Your organization runs a content management system at cms.acmecorp.com (Node.js/Express on AWS EC2, Ubuntu 22.04). The CMS has a feature that generates PDF previews from user-supplied URLs using a headless browser. At 08:15, the application logged an unusually long response time for the /api/generate-pdf endpoint. Investigation revealed the attacker exploited a lack of URL validation in the PDF generator to make the server fetch http://169.254.169.254/latest/meta-data/iam/security-credentials/ec2-role — the AWS instance metadata endpoint. The server-side request returned the IAM role credentials (AccessKeyId, SecretAccessKey, Token) which were embedded in the PDF output. The attacker then used these credentials from their own infrastructure (51.79.xx.xx) to access the organization''s S3 bucket ''acmecorp-prod-backups'' (4.2 TB of database dumps), and created a new IAM admin user
  ''backup-admin-backup''. AWS CloudTrail logged 847 API calls between 08:18 and 08:42. The S3 bucket was accessed from IP 51.79.xx.xx. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: Server-Side Request Forgery Exposes AWS Metadata Service
  opening: Your organization runs a content management system at cms.acmecorp.com (Node.js/Express on AWS EC2, Ubuntu 22.04). The CMS has a feature that generates PDF previews from user-supplied URLs using a headless browser.
  summary: Your organization runs a content management system at cms.acmecorp.com (Node.js/Express on AWS EC2, Ubuntu 22.04). The CMS has a feature that generates PDF previews from user-supplied URLs using a headless browser. At 08:15, the application logged an unusually long response time for the /api/generate-pdf endpoint. Investigation revealed the attacker exploited a lack of URL validation in the PDF generator to make the server fetch http://169.254.169.254/latest/meta-data/iam/security-credentials/ec2-role — the AWS instance metadata endpoint. The server-side request returned the IAM role credentials (AccessKeyId, SecretAccessKey, Token) which were embedded in the PDF output. The attacker then used these credentials from their own infrastructure (51.79.xx.xx) to access the organization's S3 bucket 'acmecorp-prod-backups' (4.2 TB of database dumps), and created a new IAM admin user 'backup-admin-backup'. AWS CloudTrail logged 847 API calls between 08:18 and 08:42. The S3 bucket was
    accessed from IP 51.79.xx.xx.
  compromised_assets:
  - cms.acmecorp.com
  - EC2 instance IAM role
  - S3 bucket acmecorp-prod-backups (4.2 TB)
  - New IAM admin user
  detected_via: CloudTrail anomaly detection (847 API calls from unusual IP)
  kill_chain:
