  summary: 'Your organization runs a GraphQL API at graphql.acmecorp.com (Python/Graphene, PostgreSQL backend). At 10:00 today, the API gateway rate limiter flagged a single IP (45.134.xx.xx) making 8,000 GraphQL queries in 15 minutes. Investigation revealed the attacker first performed an introspection query (__schema { types { fields { name } } }) which returned the complete API schema including all types, queries, mutations, and field descriptions. The schema revealed 47 query types, 12 mutations, and 4 types with the description ''admin-only''. Using the discovered schema, the attacker crafted targeted queries to extract: all user accounts (67,000), financial reports (Q1-Q4 2024), employee salary data, and internal API keys stored in the ''systemConfig'' type. The GraphQL server has no query depth limiting, no query cost analysis, and introspection is enabled in production.'
