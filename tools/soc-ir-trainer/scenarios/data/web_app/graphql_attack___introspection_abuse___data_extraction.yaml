id: graphql_attack___introspection_abuse___data_extraction
name: GraphQL Attack — Introspection Abuse & Data Extraction
category: Web App
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to GraphQL Introspection Enables Mass Data Extraction. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for GraphQL Introspection Enables Mass Data Extraction. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for GraphQL Introspection Enables Mass Data Extraction. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the GraphQL Introspection Enables Mass Data Extraction incident. Your organization runs a GraphQL API at graphql.acmecorp.com (Python/Graphene, PostgreSQL backend). At 10:00 today, the API gateway rate limiter flagged a single IP (45.134.xx.xx) making 8,000 GraphQL queries in 15 minutes. Investigation revealed the attacker first performed an introspection query (__schema { types { fields { name } } }) which returned the complete API schema including all types, queries, mutations, and field descriptions. The schema revealed 47 query types, 12 mutations, and 4 types with the description ''admin-only''. Using the discovered schema, the attacker crafted targeted queries to extract: all user accounts (67,000), financial reports (Q1-Q4 2024), employee salary data, and internal API keys stored in the ''systemConfig'' type. The GraphQL server has no query depth limiting, no query cost analysis, and introspection is enabled in production. Business impact: customer-facing
  service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
