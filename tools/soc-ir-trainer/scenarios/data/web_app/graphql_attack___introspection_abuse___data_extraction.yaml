- id: graphql_security_architecture_phase_3
  phase_type: lessons
  title: GraphQL Security Architecture — Phase 3
  situation: The GraphQL server has no authorization layer — all queries return data regardless of the user's role. The 'admin-only' types have no server-side enforcement. Introspection is enabled in production. No query complexity limits exist.
  prompt: How do you build proper GraphQL security controls?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: How do you build proper GraphQL security controls?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: GraphQL Security Architecture — Phase 3. Asset in scope: graphql.acmecorp.com.'
  hints:
  - Authorization is critical but also need introspection control, complexity limits, and monitoring for defense-in-depth.
  - Valid approach but doesn't address the root issue.
  ideal_concepts:
  - implement field-level
  - field-level authorization
  - authorization field
  - field checks
  - user role
  - role disable
  - introspection production
  - production add
  reference_answer: |-
    Implement field-level authorization (each field checks user role), disable introspection in production, add query depth and complexity limits, implement persisted/allowlisted queries for production, and add query logging with anomaly detection

    Why: Comprehensive GraphQL security: authorization, introspection control, complexity limits, query allowlisting, and monitoring.
