phases:
- id: introspection_and_rate_limiting_phase_1
  phase_type: triage
  title: Introspection and Rate Limiting — Phase 1
  situation: The attacker has the full API schema and has extracted sensitive data. The GraphQL API has no query depth limiting, no cost analysis, and introspection is enabled. The attacker may still be querying.
  prompt: How do you immediately protect the GraphQL API?
  guidance:
    what: Establish what fired on graphql.acmecorp.com, which accounts are involved, and how urgent the signal is.
    action: How do you immediately protect the GraphQL API?
    why: Every later decision depends on an accurate picture of graphql.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Introspection and Rate Limiting — Phase 1. Asset in scope: graphql.acmecorp.com.'
  hints:
  - Stops schema discovery but the attacker already has the schema.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - introspection production
  - production implement
  - implement query
  - query depth
  - depth limiting
  - limiting max
  - max depth
  - depth add
  reference_answer: |-
    Disable introspection in production, implement query depth limiting (max depth 5), add query cost analysis/complexity limits, and apply per-user rate limiting on the GraphQL endpoint

    Why: Stops schema discovery, limits query complexity, and prevents mass data extraction.
  followup_good: The attacker extracted 67,000 user accounts, financial reports, salary data, and internal API keys. You need to determine exactly which records were accessed and what the attacker did with the API keys.
  followup_weak: |-
    Stops schema discovery, limits query complexity, and prevents mass data extraction.

    The attacker extracted 67,000 user accounts, financial reports, salary data, and internal API keys. You need to determine exactly which records were accessed and what the attacker did with the API keys.
  next: data_exposure_assessment_phase_2
  mitre_tactic: Collection
  mitre_technique: T1213 Data from Information Repositories
- id: data_exposure_assessment_phase_2
  phase_type: containment
  title: Data Exposure Assessment — Phase 2
  situation: The attacker extracted 67,000 user accounts, financial reports, salary data, and internal API keys. You need to determine exactly which records were accessed and what the attacker did with the API keys.
  prompt: How do you assess the full impact?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you assess the full impact?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Data Exposure Assessment — Phase 2. Asset in scope: graphql.acmecorp.com.'
  hints:
  - Keys are important but you also need to know what user/financial data was exposed for breach notification.
  - Consider the affected accounts and their privilege level.
  ideal_concepts:
  - analyze graphql
  - graphql query
  - query logs
  - logs identify
  - identify exactly
  - exactly queries
  - queries executed
  - executed review
  reference_answer: |-
    Analyze GraphQL query logs to identify exactly which queries were executed, review PostgreSQL query logs for the data accessed, check API key usage logs for any calls made with the extracted keys, and rotate all exposed API keys immediately

    Why: Complete impact assessment: which queries ran, what data was accessed, whether API keys were used, and key rotation.
  followup_good: The GraphQL server has no authorization layer — all queries return data regardless of the user's role. The 'admin-only' types have no server-side enforcement. Introspection is enabled in production. No query complexity limits exist.
  followup_weak: |-
    Complete impact assessment: which queries ran, what data was accessed, whether API keys were used, and key rotation.

    The GraphQL server has no authorization layer — all queries return data regardless of the user's role. The 'admin-only' types have no server-side enforcement. Introspection is enabled in production. No query complexity limits exist.
  next: recovery_and_validation
  mitre_tactic: Discovery
  mitre_technique: T1580 Cloud Infrastructure Discovery
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. graphql.acmecorp.com is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return graphql.acmecorp.com to production?
  guidance:
    what: 'Define what ''clean'' means for graphql.acmecorp.com: trusted backups, rebuilt hosts, rotated credentials, and validated controls.'
    action: What must be true before you return graphql.acmecorp.com to production?
    why: A fast restore that reintroduces the attacker is worse than a slower, verified recovery.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: graphql.acmecorp.com.'
  hints:
  - Which backup or rebuild image is known-good for graphql.acmecorp.com, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore graphql.acmecorp.com from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: graphql_security_architecture_phase_3
  next_weak: ''
  mitre_tactic: Defense Evasion
  mitre_technique: T1565 Data Manipulation
