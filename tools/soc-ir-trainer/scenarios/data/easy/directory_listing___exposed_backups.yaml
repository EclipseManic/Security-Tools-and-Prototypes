id: directory_listing___exposed_backups
name: Directory Listing — Exposed Backups
category: Web App
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. External notification from a security researcher. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Marketing web server.
  incident_manager: You are the Incident Manager coordinating the response to Open Directory Listing Exposes Customer Database Backup. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Open Directory Listing Exposes Customer Database Backup. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Open Directory Listing Exposes Customer Database Backup. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Open Directory Listing Exposes Customer Database Backup incident. The dump contains customer email addresses and hashed passwords from a legacy campaign. The files have been public for at least two weeks according to the server logs. Business impact: Customer emails and password hashes may be public, creating phishing and credential-stuffing risk. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Open Directory Listing Exposes Customer Database Backup
  opening: A marketing site returned an open directory listing at /backup/, exposing a database dump and three .zip files. A search engine had indexed the page.
  summary: The dump contains customer email addresses and hashed passwords from a legacy campaign. The files have been public for at least two weeks according to the server logs.
  compromised_assets:
  - Marketing web server
  - /backup/ directory
  - Legacy customer database dump
  detected_via: External notification from a security researcher.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: directory_listing___exposed_backups_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A marketing site returned an open directory listing at /backup/, exposing a database dump and three .zip files. A search engine had indexed the page. External notification from a security researcher.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Marketing web server.
  - Record what you find before you change anything.
  ideal_concepts:
  - exposed files
  - contents
  - exposure window
  - download ips
  - access logs
  - hash files
  reference_answer: Confirm the files, their contents, exposure window, and download IPs; preserve access logs and hash each file before removal.
  followup_good: Triage confirms the activity is real. The directory listing is enabled in the web server config. Access logs show 14 downloads from unknown IPs. The dump uses an old password hash format.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The directory listing is enabled in the web server config. Access logs show 14 downloads from unknown IPs. The dump uses an old password hash format.
  next: directory_listing___exposed_backups_phase_2
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: directory_listing___exposed_backups_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The directory listing is enabled in the web server config. Access logs show 14 downloads from unknown IPs. The dump uses an old password hash format.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - disable directory listing
  - move backups
  - block public access
  - reverse proxy
  - web root
  reference_answer: Disable directory listing, move backups outside the web root, and block public access to /backup/ at the reverse proxy.
  followup_good: Containment is in place. A backup script wrote files under the web root and directory listing was left enabled.
  followup_weak: The activity continues while the team debates. Customer emails and password hashes may be public, creating phishing and credential-stuffing risk.
  next: directory_listing___exposed_backups_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: directory_listing___exposed_backups_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A backup script wrote files under the web root and directory listing was left enabled.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - delete files
  - rotate credentials
  - api keys
  - review backup script
  - preserve evidence
  reference_answer: Delete the exposed files after preserving evidence, rotate any credentials or API keys in the dump, and review the backup script.
  followup_good: Re-run backups to a private location, verify the site, and monitor for credential-stuffing attempts.
  followup_weak: The visible symptom is gone, but the root cause remains. Customer emails and password hashes may be public, creating phishing and credential-stuffing risk.
  next: directory_listing___exposed_backups_phase_4
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: directory_listing___exposed_backups_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Re-run backups to a private location, verify the site, and monitor for credential-stuffing attempts.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - private backups
  - verify site
  - monitor credential stuffing
  - backup job
  - validate access
  reference_answer: Re-run backups to a private location, verify the marketing site and backup jobs, and monitor authentication and credential-stuffing attempts before closing the incident.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: directory_listing___exposed_backups_phase_5
  mitre_tactic: Discovery
  mitre_technique: T1592 Gather Victim Host Information
- id: directory_listing___exposed_backups_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Directory Listing — Exposed Backups.
  prompt: What must change so Directory Listing — Exposed Backups is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - backups outside web root
  - exposure scanning
  - backup access control
  - secret rotation
  - deployment checklist
  reference_answer: Store backups outside the document root, add automated exposure scanning, and require access control on backup storage.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
