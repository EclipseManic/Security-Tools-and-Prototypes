id: open_redirect___phishing_landing
name: Open Redirect — Phishing Landing
category: Web App
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. User report plus email gateway alert. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Corporate login portal.
  incident_manager: You are the Incident Manager coordinating the response to Open Redirect Abused in Credential Phishing Campaign. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Open Redirect Abused in Credential Phishing Campaign. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Open Redirect Abused in Credential Phishing Campaign. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Open Redirect Abused in Credential Phishing Campaign incident. The redirect parameter accepts any absolute URL. The campaign targeted 60 employees, and three clicked but stopped at the fake login page. Business impact: Two credentials may be compromised, and the campaign could be repeated at scale. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Open Redirect Abused in Credential Phishing Campaign
  opening: A phishing email used the company's own login URL with a 'next=' parameter pointing to an attacker site. The page redirected users after login, making the link look trustworthy.
  summary: The redirect parameter accepts any absolute URL. The campaign targeted 60 employees, and three clicked but stopped at the fake login page.
  compromised_assets:
  - Corporate login portal
  - Open redirect parameter
  - Employee credentials
  detected_via: User report plus email gateway alert.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: open_redirect___phishing_landing_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A phishing email used the company's own login URL with a 'next=' parameter pointing to an attacker site. The page redirected users after login, making the link look trustworthy. User report plus email gateway alert.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Corporate login portal.
  - Record what you find before you change anything.
  ideal_concepts:
  - affected users
  - redirect url
  - credentials entered
  - email logs
  - web logs
  - redirect behavior
  reference_answer: Identify the affected users, the redirect URL, and whether credentials were entered; preserve the email and web logs, and confirm the redirect behavior.
  followup_good: Triage confirms the activity is real. The link starts with the legitimate company domain and redirects to account-verify[.]example. The login page itself is genuine, so users see a valid TLS certificate before the redirect. Two users entered credentials on the fake page.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The link starts with the legitimate company domain and redirects to account-verify[.]example. The login page itself is genuine, so users see a valid TLS certificate before the redirect. Two users entered credentials on the fake page.
  next: open_redirect___phishing_landing_phase_2
  mitre_tactic: Execution
  mitre_technique: T1204 User Execution
- id: open_redirect___phishing_landing_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The link starts with the legitimate company domain and redirects to account-verify[.]example. The login page itself is genuine, so users see a valid TLS certificate before the redirect. Two users entered credentials on the fake page.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - block phishing domain
  - waf rule
  - internal paths
  - password reset
  - dns
  reference_answer: Block the phishing domain at the proxy and DNS, add a WAF rule restricting the redirect parameter to internal paths, and force password resets for the two users.
  followup_good: Containment is in place. The post-login redirect accepts arbitrary external URLs without an allowlist.
  followup_weak: The activity continues while the team debates. Two credentials may be compromised, and the campaign could be repeated at scale.
  next: open_redirect___phishing_landing_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1189 Drive-by Compromise
- id: open_redirect___phishing_landing_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The post-login redirect accepts arbitrary external URLs without an allowlist.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - redirect allowlist
  - patch handler
  - other parameters
  - remove emails
  - url validation
  reference_answer: Patch the redirect handler to use an allowlist, review other redirect parameters, and remove the phishing emails from mailboxes.
  followup_good: Re-enable normal login redirects, monitor authentication for the affected users, and verify the fix with a test URL.
  followup_weak: The visible symptom is gone, but the root cause remains. Two credentials may be compromised, and the campaign could be repeated at scale.
  next: open_redirect___phishing_landing_phase_4
  mitre_tactic: Credential Access
  mitre_technique: T1539 Steal Web Session Cookie
- id: open_redirect___phishing_landing_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Re-enable normal login redirects, monitor authentication for the affected users, and verify the fix with a test URL.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - normal redirects
  - monitor authentication
  - test url
  - affected users
  - validate
  reference_answer: Re-enable normal login redirects, verify the fix with internal and external test URLs, and monitor authentication for the affected users.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: open_redirect___phishing_landing_phase_5
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: open_redirect___phishing_landing_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Open Redirect — Phishing Landing.
  prompt: What must change so Open Redirect — Phishing Landing is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - relative redirects
  - strict allowlist
  - url validation tests
  - user training
  - destination check
  reference_answer: Use relative redirects or a strict allowlist, add URL validation tests, and train users to check the final destination.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1189 Drive-by Compromise
