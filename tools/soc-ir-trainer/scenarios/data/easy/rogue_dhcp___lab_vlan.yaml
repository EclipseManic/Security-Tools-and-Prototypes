id: rogue_dhcp___lab_vlan
name: Rogue DHCP — Lab VLAN
category: Network
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Network monitoring alert: multiple DHCP offers on the lab VLAN. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Lab VLAN.'
  incident_manager: You are the Incident Manager coordinating the response to Rogue DHCP Server Redirects Lab VLAN Traffic. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Rogue DHCP Server Redirects Lab VLAN Traffic. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Rogue DHCP Server Redirects Lab VLAN Traffic. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Rogue DHCP Server Redirects Lab VLAN Traffic incident. A rogue DHCP server on the lab network handed out a malicious gateway and DNS server, redirecting traffic through a lab machine. Business impact: Lab users'' traffic is being redirected through an untrusted host. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Rogue DHCP Server Redirects Lab VLAN Traffic
  opening: Users on the lab VLAN received IP addresses from an unexpected gateway and could not reach internal servers. The DHCP server logs show another server answering requests.
  summary: A rogue DHCP server on the lab network handed out a malicious gateway and DNS server, redirecting traffic through a lab machine.
  compromised_assets:
  - Lab VLAN
  - Rogue DHCP server
  - DNS traffic
  detected_via: 'Network monitoring alert: multiple DHCP offers on the lab VLAN.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: rogue_dhcp___lab_vlan_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'Users on the lab VLAN received IP addresses from an unexpected gateway and could not reach internal servers. The DHCP server logs show another server answering requests. Network monitoring alert: multiple DHCP offers on the lab VLAN.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Lab VLAN.
  - Record what you find before you change anything.
  ideal_concepts:
  - rogue dhcp
  - switch port
  - affected clients
  - gateway
  - dns
  - dhcp logs
  reference_answer: Identify the rogue DHCP server, switch port, affected clients, and scope of redirected traffic; preserve DHCP and DNS logs.
  followup_good: Triage confirms the activity is real. The rogue server has a MAC address on an unauthorized lab switch port. Clients received gateway 10.20.5.99 and DNS 10.20.5.99. The machine is a lab PC running a DHCP service.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The rogue server has a MAC address on an unauthorized lab switch port. Clients received gateway 10.20.5.99 and DNS 10.20.5.99. The machine is a lab PC running a DHCP service.
  next: rogue_dhcp___lab_vlan_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1557.002 ARP Cache Poisoning
- id: rogue_dhcp___lab_vlan_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The rogue server has a MAC address on an unauthorized lab switch port. Clients received gateway 10.20.5.99 and DNS 10.20.5.99. The machine is a lab PC running a DHCP service.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - shut port
  - disable dhcp service
  - renew leases
  - lab vlan
  - rogue server
  reference_answer: Shut the switch port, disable the rogue DHCP service, and renew DHCP leases for affected clients.
  followup_good: Containment is in place. A lab PC was configured as a DHCP server and connected to the production lab VLAN.
  followup_weak: The activity continues while the team debates. Lab users' traffic is being redirected through an untrusted host.
  next: rogue_dhcp___lab_vlan_phase_3
  mitre_tactic: Collection
  mitre_technique: T1040 Network Sniffing
- id: rogue_dhcp___lab_vlan_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A lab PC was configured as a DHCP server and connected to the production lab VLAN.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove dhcp
  - malware scan
  - dhcp snooping
  - lab pc
  - unauthorized port
  reference_answer: Remove the DHCP service, check the lab PC for malware, and enable DHCP snooping on the VLAN.
  followup_good: Restore correct leases, verify DNS and gateway settings, and monitor for rogue DHCP offers.
  followup_weak: The visible symptom is gone, but the root cause remains. Lab users' traffic is being redirected through an untrusted host.
  next: rogue_dhcp___lab_vlan_phase_4
  mitre_tactic: Credential Access
  mitre_technique: T1557 Adversary-in-the-Middle
- id: rogue_dhcp___lab_vlan_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Restore correct leases, verify DNS and gateway settings, and monitor for rogue DHCP offers.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - correct leases
  - verify dns
  - verify gateway
  - monitor dhcp
  - validate clients
  reference_answer: Restore correct leases on the lab VLAN, verify DNS and gateway settings on affected clients, and monitor for new rogue DHCP offers.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: rogue_dhcp___lab_vlan_phase_5
  mitre_tactic: Impact
  mitre_technique: T1498 Network Denial of Service
- id: rogue_dhcp___lab_vlan_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Rogue DHCP — Lab VLAN.
  prompt: What must change so Rogue DHCP — Lab VLAN is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - dhcp snooping
  - restrict lab ports
  - rogue dhcp scan
  - network access control
  - vlan segmentation
  reference_answer: Enable DHCP snooping, restrict lab ports, and scan for unauthorized DHCP servers.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1557.002 ARP Cache Poisoning
