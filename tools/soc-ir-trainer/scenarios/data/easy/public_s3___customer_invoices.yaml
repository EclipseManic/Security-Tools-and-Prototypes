id: public_s3___customer_invoices
name: Public S3 Bucket — Customer Invoices
category: Cloud
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. External notification plus AWS Config rule. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond S3 bucket acme-finance-invoices.
  incident_manager: You are the Incident Manager coordinating the response to Publicly Readable S3 Bucket Containing Customer Invoices. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Publicly Readable S3 Bucket Containing Customer Invoices. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Publicly Readable S3 Bucket Containing Customer Invoices. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Publicly Readable S3 Bucket Containing Customer Invoices incident. The bucket was created for a vendor integration and set to public-read. It contains PDF invoices with customer names, addresses, and amounts. Business impact: Customer billing data is exposed, and notification obligations may apply. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Publicly Readable S3 Bucket Containing Customer Invoices
  opening: A security researcher found an S3 bucket containing 18 months of customer invoices publicly readable. The bucket name matches the company's finance team.
  summary: The bucket was created for a vendor integration and set to public-read. It contains PDF invoices with customer names, addresses, and amounts.
  compromised_assets:
  - S3 bucket acme-finance-invoices
  - Customer invoice PDFs
  - AWS account
  detected_via: External notification plus AWS Config rule.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: public_s3___customer_invoices_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A security researcher found an S3 bucket containing 18 months of customer invoices publicly readable. The bucket name matches the company's finance team. External notification plus AWS Config rule.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for S3 bucket acme-finance-invoices.
  - Record what you find before you change anything.
  ideal_concepts:
  - bucket contents
  - public policy
  - access logs
  - object count
  - cloudtrail
  - bucket acl
  reference_answer: Confirm bucket contents, public permissions, access logs, and object count; preserve the bucket policy and CloudTrail evidence.
  followup_good: Triage confirms the activity is real. The bucket policy allows Principal '*'. CloudTrail shows 40 GET requests from unknown IPs. The bucket has no access logging enabled before yesterday.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The bucket policy allows Principal '*'. CloudTrail shows 40 GET requests from unknown IPs. The bucket has no access logging enabled before yesterday.
  next: public_s3___customer_invoices_phase_2
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: public_s3___customer_invoices_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The bucket policy allows Principal '*'. CloudTrail shows 40 GET requests from unknown IPs. The bucket has no access logging enabled before yesterday.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - block public access
  - remove policy
  - rotate vendor credentials
  - account level
  - s3
  reference_answer: Block public access on the bucket and account, remove the public policy, and rotate any vendor credentials.
  followup_good: Containment is in place. A vendor integration bucket was created with public-read ACL and never reviewed.
  followup_weak: The activity continues while the team debates. Customer billing data is exposed, and notification obligations may apply.
  next: public_s3___customer_invoices_phase_3
  mitre_tactic: Discovery
  mitre_technique: T1087 Account Discovery
- id: public_s3___customer_invoices_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A vendor integration bucket was created with public-read ACL and never reviewed.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - review buckets
  - access logging
  - encryption
  - data classification
  - public access
  reference_answer: Review all buckets for public access, enable access logging and encryption, and classify the data.
  followup_good: Notify legal and privacy, validate access controls, and monitor for further access.
  followup_weak: The visible symptom is gone, but the root cause remains. Customer billing data is exposed, and notification obligations may apply.
  next: public_s3___customer_invoices_phase_4
  mitre_tactic: Valid Accounts
  mitre_technique: T1078.004 Cloud Accounts
- id: public_s3___customer_invoices_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Notify legal and privacy, validate access controls, and monitor for further access.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - notify legal
  - validate controls
  - monitor access
  - privacy
  - s3 block public
  reference_answer: Notify legal and privacy, validate that account-level public access is blocked, and monitor CloudTrail and bucket access for further attempts.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: public_s3___customer_invoices_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: public_s3___customer_invoices_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Public S3 Bucket — Customer Invoices.
  prompt: What must change so Public S3 Bucket — Customer Invoices is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - block public access
  - bucket review
  - public storage scan
  - data classification
  - cloud config
  reference_answer: Enable S3 Block Public Access at account level, require bucket review, and scan for public storage.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
