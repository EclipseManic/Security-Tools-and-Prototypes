id: ai_written_bec___vendor_bank_change
name: AI-Written BEC — Vendor Bank Change
category: Advanced Threats
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Employee report after noticing the domain. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Accounts payable mailbox.
  incident_manager: You are the Incident Manager coordinating the response to AI-Written Business Email Compromise Attempts Vendor Bank Change. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for AI-Written Business Email Compromise Attempts Vendor Bank Change. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for AI-Written Business Email Compromise Attempts Vendor Bank Change. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the AI-Written Business Email Compromise Attempts Vendor Bank Change incident. The message came from a lookalike domain and used an AI-generated writing style that matched the CFO''s tone. The vendor invoice was real, but the bank details were attacker-controlled. Business impact: A fraudulent payment could be made if the thread continues. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: AI-Written Business Email Compromise Attempts Vendor Bank Change
  opening: Accounts payable received an email that appeared to come from the CFO, asking to update a vendor's bank details before an urgent payment. The email was well written and referenced a real invoice.
  summary: The message came from a lookalike domain and used an AI-generated writing style that matched the CFO's tone. The vendor invoice was real, but the bank details were attacker-controlled.
  compromised_assets:
  - Accounts payable mailbox
  - CFO identity
  - Vendor payment process
  detected_via: Employee report after noticing the domain.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: ai_written_bec___vendor_bank_change_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: Accounts payable received an email that appeared to come from the CFO, asking to update a vendor's bank details before an urgent payment. The email was well written and referenced a real invoice. Employee report after noticing the domain.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Accounts payable mailbox.
  - Record what you find before you change anything.
  ideal_concepts:
  - sender domain
  - recipients
  - invoice details
  - payment initiated
  - email headers
  - lookalike
  reference_answer: Identify the sender domain, recipients, invoice details, and whether any payment was initiated; preserve the email and headers.
  followup_good: Triage confirms the activity is real. The email domain is acme-cfo[.]com, registered two weeks ago. It references a real invoice number and the correct vendor name. No payment was made, but the attacker has the thread.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The email domain is acme-cfo[.]com, registered two weeks ago. It references a real invoice number and the correct vendor name. No payment was made, but the attacker has the thread.
  next: ai_written_bec___vendor_bank_change_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1566 Phishing
- id: ai_written_bec___vendor_bank_change_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The email domain is acme-cfo[.]com, registered two weeks ago. It references a real invoice number and the correct vendor name. No payment was made, but the attacker has the thread.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - block domain
  - warn accounts payable
  - freeze payment
  - vendor bank change
  - callback
  reference_answer: Block the domain, warn accounts payable, and freeze the vendor payment change.
  followup_good: Containment is in place. A lookalike domain and AI-written social engineering bypassed the user's suspicion; payment changes lack callback verification.
  followup_weak: The activity continues while the team debates. A fraudulent payment could be made if the thread continues.
  next: ai_written_bec___vendor_bank_change_phase_3
  mitre_tactic: Execution
  mitre_technique: T1204.002 Malicious File
- id: ai_written_bec___vendor_bank_change_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A lookalike domain and AI-written social engineering bypassed the user's suspicion; payment changes lack callback verification.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove email
  - verify vendor
  - lookalike domains
  - bank details
  - callback
  reference_answer: Remove the email from mailboxes, verify the real vendor's bank details by callback, and check for other lookalike domains.
  followup_good: Resume the payment only after verification and monitor for follow-up emails.
  followup_weak: The visible symptom is gone, but the root cause remains. A fraudulent payment could be made if the thread continues.
  next: ai_written_bec___vendor_bank_change_phase_4
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: ai_written_bec___vendor_bank_change_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Resume the payment only after verification and monitor for follow-up emails.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - resume payment
  - verification
  - monitor email
  - vendor
  - accounts payable
  reference_answer: Resume the payment only after a documented callback to the known vendor number, and monitor accounts payable for follow-up messages.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: ai_written_bec___vendor_bank_change_phase_5
  mitre_tactic: Exfiltration
  mitre_technique: T1567 Exfiltration Over Web Service
- id: ai_written_bec___vendor_bank_change_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for AI-Written BEC — Vendor Bank Change.
  prompt: What must change so AI-Written BEC — Vendor Bank Change is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - callback verification
  - lookalike domains
  - ai bec training
  - payment controls
  - domain monitoring
  reference_answer: Require callback verification for bank changes, register lookalike domains, and train finance on AI-written BEC.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1566 Phishing
