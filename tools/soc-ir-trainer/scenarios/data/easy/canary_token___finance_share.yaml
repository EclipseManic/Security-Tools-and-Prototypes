id: canary_token___finance_share
name: Canary Token — Finance Share
category: Advanced Threats
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Canary token alert. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Finance canary token.
  incident_manager: You are the Incident Manager coordinating the response to Canary Token Fires from Unauthorized Workstation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Canary Token Fires from Unauthorized Workstation. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Canary Token Fires from Unauthorized Workstation. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Canary Token Fires from Unauthorized Workstation incident. The token is a hidden document that beacons when opened. The workstation belongs to a marketing intern and has no finance access. Business impact: The intern''s workstation may have harvested a privileged finance credential. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Canary Token Fires from Unauthorized Workstation
  opening: A canary token embedded in a finance file share was opened from a workstation that should never access that share. The token fired twice in 10 minutes.
  summary: The token is a hidden document that beacons when opened. The workstation belongs to a marketing intern and has no finance access.
  compromised_assets:
  - Finance canary token
  - WS-MKT-012
  - Finance file share
  detected_via: Canary token alert.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: canary_token___finance_share_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A canary token embedded in a finance file share was opened from a workstation that should never access that share. The token fired twice in 10 minutes. Canary token alert.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Finance canary token.
  - Record what you find before you change anything.
  ideal_concepts:
  - phishing email
  - shortcut
  - credential used
  - files accessed
  - token alert
  - smb logs
  reference_answer: Identify the email, shortcut, credential used, and files accessed; preserve the token alert and SMB logs.
  followup_good: Triage confirms the activity is real. The token was opened from WS-MKT-012. The user says they clicked a link in a phishing email that mapped a finance share. SMB logs show a successful connection using a finance service account.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The token was opened from WS-MKT-012. The user says they clicked a link in a phishing email that mapped a finance share. SMB logs show a successful connection using a finance service account.
  next: canary_token___finance_share_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
- id: canary_token___finance_share_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The token was opened from WS-MKT-012. The user says they clicked a link in a phishing email that mapped a finance share. SMB logs show a successful connection using a finance service account.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - isolate workstation
  - disable service account
  - remove mapped share
  - finance
  - least privilege
  reference_answer: Isolate the workstation, disable the finance service account, and remove the mapped share.
  followup_good: Containment is in place. A phishing email delivered a shortcut that authenticated to a finance share with a stored service-account credential.
  followup_weak: The activity continues while the team debates. The intern's workstation may have harvested a privileged finance credential.
  next: canary_token___finance_share_phase_3
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: canary_token___finance_share_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A phishing email delivered a shortcut that authenticated to a finance share with a stored service-account credential.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove shortcut
  - credential artifacts
  - reset account
  - malware scan
  - service account
  reference_answer: Remove the shortcut and any credential artifacts, reset the service account, and scan for malware.
  followup_good: Return the workstation after a clean scan, restore least-privilege access, and monitor the finance share.
  followup_weak: The visible symptom is gone, but the root cause remains. The intern's workstation may have harvested a privileged finance credential.
  next: canary_token___finance_share_phase_4
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: canary_token___finance_share_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Return the workstation after a clean scan, restore least-privilege access, and monitor the finance share.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - clean scan
  - least privilege
  - monitor share
  - canary alert
  - validate
  reference_answer: Return the workstation after a clean scan, restore least-privilege access, and monitor finance-share authentication and canary alerts for 72 hours.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: canary_token___finance_share_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: canary_token___finance_share_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Canary Token — Finance Share.
  prompt: What must change so Canary Token — Finance Share is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - remove stored credentials
  - block share mapping
  - phishing training
  - service account hygiene
  - canary tokens
  reference_answer: Remove stored service credentials from user endpoints, block link-based share mapping, and train users on phishing.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
