id: tor_exit_traffic___research_workstation
name: Tor Traffic — Research Workstation
category: Network
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Firewall alert: connection to a known Tor entry node. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond WS-RESEARCH-004.'
  incident_manager: You are the Incident Manager coordinating the response to Workstation Connects to Tor Entry Nodes. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Workstation Connects to Tor Entry Nodes. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Workstation Connects to Tor Entry Nodes. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Workstation Connects to Tor Entry Nodes incident. The host is running a Tor client and has transferred 2 GB outbound over two days. The user is a research analyst with access to unpublished reports. Business impact: Sensitive research may have left the network, and the host bypasses web filtering. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Workstation Connects to Tor Entry Nodes
  opening: The firewall flagged a workstation connecting to known Tor entry nodes. The user says they installed a 'privacy browser' to access a research site.
  summary: The host is running a Tor client and has transferred 2 GB outbound over two days. The user is a research analyst with access to unpublished reports.
  compromised_assets:
  - WS-RESEARCH-004
  - Tor client
  - Research file share
  detected_via: 'Firewall alert: connection to a known Tor entry node.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: tor_exit_traffic___research_workstation_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'The firewall flagged a workstation connecting to known Tor entry nodes. The user says they installed a ''privacy browser'' to access a research site. Firewall alert: connection to a known Tor entry node.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for WS-RESEARCH-004.
  - Record what you find before you change anything.
  ideal_concepts:
  - tor client
  - install source
  - traffic volume
  - files accessed
  - firewall logs
  - user interview
  reference_answer: Identify the client, install source, traffic volume, and files accessed; preserve firewall and endpoint logs, and interview the user.
  followup_good: Triage confirms the activity is real. Connections to multiple Tor entry nodes started after a browser install. The host has 2 GB outbound and accessed the research share. The browser was downloaded from a non-corporate site.
  followup_weak: The alert is treated as noise and the team acts on assumptions. Connections to multiple Tor entry nodes started after a browser install. The host has 2 GB outbound and accessed the research share. The browser was downloaded from a non-corporate site.
  next: tor_exit_traffic___research_workstation_phase_2
  mitre_tactic: Command and Control
  mitre_technique: T1071 Application Layer Protocol
- id: tor_exit_traffic___research_workstation_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. Connections to multiple Tor entry nodes started after a browser install. The host has 2 GB outbound and accessed the research share. The browser was downloaded from a non-corporate site.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - isolate host
  - block tor
  - disable network
  - firewall
  - research workstation
  reference_answer: Isolate the host, block Tor traffic at the firewall, and disable the user's network access pending review.
  followup_good: Containment is in place. An unapproved anonymity client was installed, creating a covert channel and potential data-exfiltration path.
  followup_weak: The activity continues while the team debates. Sensitive research may have left the network, and the host bypasses web filtering.
  next: tor_exit_traffic___research_workstation_phase_3
  mitre_tactic: Exfiltration
  mitre_technique: T1567 Exfiltration Over Web Service
- id: tor_exit_traffic___research_workstation_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. An unapproved anonymity client was installed, creating a covert channel and potential data-exfiltration path.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - uninstall client
  - proxy tools
  - research share
  - unusual access
  - endpoint scan
  reference_answer: Uninstall the client, check for additional proxy tools, and review the research share for unusual access.
  followup_good: Return the host after a clean scan, restore an approved browser, and monitor egress.
  followup_weak: The visible symptom is gone, but the root cause remains. Sensitive research may have left the network, and the host bypasses web filtering.
  next: tor_exit_traffic___research_workstation_phase_4
  mitre_tactic: Exfiltration
  mitre_technique: T1048.003 Exfiltration Over Unencrypted Non-C2 Protocol
- id: tor_exit_traffic___research_workstation_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Return the host after a clean scan, restore an approved browser, and monitor egress.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - clean scan
  - approved browser
  - monitor egress
  - research access
  - validate
  reference_answer: Return the host after a clean scan, restore the approved browser, and monitor egress and research-share access for 48 hours.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: tor_exit_traffic___research_workstation_phase_5
  mitre_tactic: Collection
  mitre_technique: T1040 Network Sniffing
- id: tor_exit_traffic___research_workstation_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Tor Traffic — Research Workstation.
  prompt: What must change so Tor Traffic — Research Workstation is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - block anonymity networks
  - software restriction
  - egress monitoring
  - large transfer alert
  - user awareness
  reference_answer: Block anonymity networks, restrict software installs, and monitor large outbound transfers.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Command and Control
  mitre_technique: T1071 Application Layer Protocol
