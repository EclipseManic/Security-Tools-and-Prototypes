id: rogue_wifi___evil_twin
name: Rogue Wi-Fi — Evil Twin
category: Network
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Wireless IDS alert: duplicate SSID with a different BSSID. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Rogue access point.'
  incident_manager: You are the Incident Manager coordinating the response to Evil-Twin Access Point Clones the Corporate SSID. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Evil-Twin Access Point Clones the Corporate SSID. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Evil-Twin Access Point Clones the Corporate SSID. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Evil-Twin Access Point Clones the Corporate SSID incident. A rogue access point was broadcasting the corporate SSID without 802.1X. It captured credentials from a captive portal and attempted to intercept traffic. Business impact: Employee credentials and session traffic may be intercepted. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Evil-Twin Access Point Clones the Corporate SSID
  opening: Employees in the third-floor meeting rooms connected to a Wi-Fi network named 'ACME-Corp' with a stronger signal than the corporate SSID. The helpdesk received three reports of certificate warnings.
  summary: A rogue access point was broadcasting the corporate SSID without 802.1X. It captured credentials from a captive portal and attempted to intercept traffic.
  compromised_assets:
  - Rogue access point
  - Third-floor meeting rooms
  - Employee Wi-Fi credentials
  detected_via: 'Wireless IDS alert: duplicate SSID with a different BSSID.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: rogue_wifi___evil_twin_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'Employees in the third-floor meeting rooms connected to a Wi-Fi network named ''ACME-Corp'' with a stronger signal than the corporate SSID. The helpdesk received three reports of certificate warnings. Wireless IDS alert: duplicate SSID with a different BSSID.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Rogue access point.
  - Record what you find before you change anything.
  ideal_concepts:
  - rogue bssid
  - switch port
  - connected devices
  - wireless logs
  - captive portal
  - certificate warning
  reference_answer: Locate the AP by BSSID and switch port, identify connected devices and users, and preserve wireless logs and the captive portal page.
  followup_good: Triage confirms the activity is real. The BSSID is not in the approved inventory and is broadcasting from a conference-room LAN port. Three devices connected; one user entered credentials into a captive portal. The AP uses a self-signed certificate.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The BSSID is not in the approved inventory and is broadcasting from a conference-room LAN port. Three devices connected; one user entered credentials into a captive portal. The AP uses a self-signed certificate.
  next: rogue_wifi___evil_twin_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1557 Adversary-in-the-Middle
- id: rogue_wifi___evil_twin_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The BSSID is not in the approved inventory and is broadcasting from a conference-room LAN port. Three devices connected; one user entered credentials into a captive portal. The AP uses a self-signed certificate.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - disable switch port
  - remove access point
  - block bssid
  - password reset
  - wireless ids
  reference_answer: Disable the switch port, remove the AP, block the BSSID, and force password resets for users who entered credentials.
  followup_good: Containment is in place. An attacker plugged an unauthorized AP into a live conference-room port and cloned the corporate SSID.
  followup_weak: The activity continues while the team debates. Employee credentials and session traffic may be intercepted.
  next: rogue_wifi___evil_twin_phase_3
  mitre_tactic: Credential Access
  mitre_technique: T1557.001 Name Resolution Poisoning
- id: rogue_wifi___evil_twin_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. An attacker plugged an unauthorized AP into a live conference-room port and cloned the corporate SSID.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - captive portal
  - rogue ap scan
  - unused wall ports
  - 802.1x
  - certificate
  reference_answer: Check the captive portal for collected credentials, scan the building for other rogue APs, and disable unused wall ports.
  followup_good: Reconnect affected devices to the corporate SSID with 802.1X, verify certificates, and monitor for the BSSID.
  followup_weak: The visible symptom is gone, but the root cause remains. Employee credentials and session traffic may be intercepted.
  next: rogue_wifi___evil_twin_phase_4
  mitre_tactic: Collection
  mitre_technique: T1040 Network Sniffing
- id: rogue_wifi___evil_twin_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Reconnect affected devices to the corporate SSID with 802.1X, verify certificates, and monitor for the BSSID.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - reconnect devices
  - corporate ssid
  - 802.1x
  - verify certificates
  - monitor bssid
  reference_answer: Reconnect affected devices to the corporate SSID with 802.1X, verify certificate validation, and monitor the wireless network for the rogue BSSID.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: rogue_wifi___evil_twin_phase_5
  mitre_tactic: Defense Evasion
  mitre_technique: T1553.004 Install Root Certificate
- id: rogue_wifi___evil_twin_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Rogue Wi-Fi — Evil Twin.
  prompt: What must change so Rogue Wi-Fi — Evil Twin is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - 802.1x
  - certificate validation
  - disable unused ports
  - wireless ids
  - port security
  reference_answer: Enable 802.1X and certificate validation, disable unused switch ports, and add wireless IDS monitoring.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1557 Adversary-in-the-Middle
