id: verbose_errors___stack_trace_exposure
name: Verbose Errors — Stack Trace Exposure
category: Web App
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Bug bounty report. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Production API.
  incident_manager: You are the Incident Manager coordinating the response to Production API Leaks Stack Traces and Internal Paths. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Production API Leaks Stack Traces and Internal Paths. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Production API Leaks Stack Traces and Internal Paths. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Production API Leaks Stack Traces and Internal Paths incident. The debug setting was enabled during a release and never turned off. Search engine caches may hold error pages, but no exploitation is evident. Business impact: Attackers gain internal architecture details and a precise library version to target. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Production API Leaks Stack Traces and Internal Paths
  opening: A production API returned a full stack trace after a malformed request. The trace included database hostnames, internal file paths, and a library version with a known vulnerability.
  summary: The debug setting was enabled during a release and never turned off. Search engine caches may hold error pages, but no exploitation is evident.
  compromised_assets:
  - Production API
  - Error pages
  - Database
  detected_via: Bug bounty report.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: verbose_errors___stack_trace_exposure_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A production API returned a full stack trace after a malformed request. The trace included database hostnames, internal file paths, and a library version with a known vulnerability. Bug bounty report.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Production API.
  - Record what you find before you change anything.
  ideal_concepts:
  - reproduce error
  - response
  - deployed build
  - debug setting
  - search caches
  - preserve
  reference_answer: Reproduce the error, capture the response, identify the deployed build and debug setting, and check whether search engines indexed similar pages.
  followup_good: Triage confirms the activity is real. The response includes a Python traceback with the SQLAlchemy version, internal hostname, and query fragment. The same endpoint returns different errors for invalid IDs and malformed JSON.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The response includes a Python traceback with the SQLAlchemy version, internal hostname, and query fragment. The same endpoint returns different errors for invalid IDs and malformed JSON.
  next: verbose_errors___stack_trace_exposure_phase_2
  mitre_tactic: Discovery
  mitre_technique: T1592 Gather Victim Host Information
- id: verbose_errors___stack_trace_exposure_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The response includes a Python traceback with the SQLAlchemy version, internal hostname, and query fragment. The same endpoint returns different errors for invalid IDs and malformed JSON.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - disable debug
  - generic error page
  - purge cache
  - production config
  - error handler
  reference_answer: Disable debug mode, deploy a generic error page, and purge cached error pages where possible.
  followup_good: Containment is in place. Debug mode is enabled in production and the global error handler returns exception details.
  followup_weak: The activity continues while the team debates. Attackers gain internal architecture details and a precise library version to target.
  next: verbose_errors___stack_trace_exposure_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: verbose_errors___stack_trace_exposure_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. Debug mode is enabled in production and the global error handler returns exception details.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - centralized errors
  - request id
  - patch library
  - debug mode
  - deploy
  reference_answer: Add centralized error handling that logs details server-side but returns a request ID, and patch the exposed library.
  followup_good: Verify production responses no longer leak details, monitor error rates, and confirm the fix survives the next deploy.
  followup_weak: The visible symptom is gone, but the root cause remains. Attackers gain internal architecture details and a precise library version to target.
  next: verbose_errors___stack_trace_exposure_phase_4
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: verbose_errors___stack_trace_exposure_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Verify production responses no longer leak details, monitor error rates, and confirm the fix survives the next deploy.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - verify responses
  - monitor errors
  - survive deploy
  - purge caches
  - validate
  reference_answer: Verify production responses no longer leak details after the next deploy, monitor error rates, and confirm cached error pages are purged.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: verbose_errors___stack_trace_exposure_phase_5
  mitre_tactic: Discovery
  mitre_technique: T1046 Network Service Discovery
- id: verbose_errors___stack_trace_exposure_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Verbose Errors — Stack Trace Exposure.
  prompt: What must change so Verbose Errors — Stack Trace Exposure is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - production config check
  - generic errors
  - code review
  - ci check
  - error handling
  reference_answer: Add a production-config check to CI, require generic error responses, and include error handling in code review.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
