id: lost_laptop___sales_director
name: Lost Laptop — Sales Director
category: Endpoint
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. User report plus Intune device-offline alert. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond LT-SALES-003 (Sales director laptop).
  incident_manager: You are the Incident Manager coordinating the response to Lost Corporate Laptop Containing Sales Pipeline Data. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Lost Corporate Laptop Containing Sales Pipeline Data. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Lost Corporate Laptop Containing Sales Pipeline Data. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Lost Corporate Laptop Containing Sales Pipeline Data incident. The laptop has not checked in since 22:10. Intune shows it offline, BitLocker is enabled with TPM, and the user''s Microsoft 365 sessions are still valid. The Q3 pipeline file was stored locally outside SharePoint. Business impact: Customer pipeline data could be exposed if the device is unlocked, and a stolen session could access mail and files. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Lost Corporate Laptop Containing Sales Pipeline Data
  opening: A sales director reported a corporate laptop missing after a client dinner. The laptop was BitLocker-protected, but the user's browser had active sessions and the device held a local copy of the Q3 pipeline.
  summary: The laptop has not checked in since 22:10. Intune shows it offline, BitLocker is enabled with TPM, and the user's Microsoft 365 sessions are still valid. The Q3 pipeline file was stored locally outside SharePoint.
  compromised_assets:
  - LT-SALES-003 (Sales director laptop)
  - Sales director M365 account
  - Q3 pipeline spreadsheet
  detected_via: User report plus Intune device-offline alert.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: lost_laptop___sales_director_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A sales director reported a corporate laptop missing after a client dinner. The laptop was BitLocker-protected, but the user's browser had active sessions and the device held a local copy of the Q3 pipeline. User report plus Intune device-offline alert.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for LT-SALES-003 (Sales director laptop).
  - Record what you find before you change anything.
  ideal_concepts:
  - device serial
  - encryption state
  - last check-in
  - sensitive data
  - sign-in logs
  - preserve report
  reference_answer: Confirm the device serial, last check-in, encryption state, and what sensitive data was stored locally; review sign-in logs for anomalous activity and preserve the report and Intune record.
  followup_good: Triage confirms the activity is real. Intune confirms the device is encrypted and last checked in at 22:10. Azure AD sign-in logs show no new logins since the loss, but active refresh tokens remain valid. The local pipeline file was not backed up to SharePoint.
  followup_weak: The alert is treated as noise and the team acts on assumptions. Intune confirms the device is encrypted and last checked in at 22:10. Azure AD sign-in logs show no new logins since the loss, but active refresh tokens remain valid. The local pipeline file was not backed up to SharePoint.
  next: lost_laptop___sales_director_phase_2
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: lost_laptop___sales_director_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. Intune confirms the device is encrypted and last checked in at 22:10. Azure AD sign-in logs show no new logins since the loss, but active refresh tokens remain valid. The local pipeline file was not backed up to SharePoint.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - retire device
  - revoke sessions
  - reset password
  - mfa re-registration
  - intune
  reference_answer: Retire the device in Intune, revoke the user's refresh tokens and active sessions, reset the account password, and require MFA re-registration.
  followup_good: Containment is in place. The device was lost outside the office and contained a locally saved copy of sensitive pipeline data. Encryption protects data at rest, but active sessions remain a risk.
  followup_weak: The activity continues while the team debates. Customer pipeline data could be exposed if the device is unlocked, and a stolen session could access mail and files.
  next: lost_laptop___sales_director_phase_3
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: lost_laptop___sales_director_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The device was lost outside the office and contained a locally saved copy of sensitive pipeline data. Encryption protects data at rest, but active sessions remain a risk.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remote wipe
  - mailbox forwarding
  - oauth grants
  - conditional access
  - device compliance
  reference_answer: Confirm the remote wipe is queued for the next check-in, remove the lost device from conditional-access exceptions, and verify no mailbox forwarding or OAuth grants were added.
  followup_good: Issue a replacement device from a trusted image, restore only approved data from SharePoint, and confirm the user can sign in with MFA.
  followup_weak: The visible symptom is gone, but the root cause remains. Customer pipeline data could be exposed if the device is unlocked, and a stolen session could access mail and files.
  next: lost_laptop___sales_director_phase_4
  mitre_tactic: Initial Access
  mitre_technique: T1078 Valid Accounts
- id: lost_laptop___sales_director_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Issue a replacement device from a trusted image, restore only approved data from SharePoint, and confirm the user can sign in with MFA.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - replacement device
  - trusted image
  - sharepoint restore
  - mfa
  - validate access
  reference_answer: Issue a replacement device from a trusted image, restore only approved data from SharePoint, confirm the user signs in with MFA, and verify the lost device remains retired and wipe-queued.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: lost_laptop___sales_director_phase_5
  mitre_tactic: Exfiltration
  mitre_technique: T1567 Exfiltration Over Web Service
- id: lost_laptop___sales_director_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Lost Laptop — Sales Director.
  prompt: What must change so Lost Laptop — Sales Director is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - data in sharepoint
  - session lifetime
  - bitlocker escrow
  - lost device checklist
  - sensitivity labels
  reference_answer: Require sensitive files to live in SharePoint, shorten session lifetimes for Executive and Sales roles, enable BitLocker recovery-key escrow, and add a lost-device checklist.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1078 Valid Accounts
