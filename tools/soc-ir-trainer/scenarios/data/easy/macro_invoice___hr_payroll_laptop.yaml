id: macro_invoice___hr_payroll_laptop
name: Macro Invoice — HR Payroll Laptop
category: Endpoint
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. EDR alert: Office spawned PowerShell after a macro-enabled document opened. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond WS-HR-014 (HR payroll laptop).'
  incident_manager: You are the Incident Manager coordinating the response to Macro-Enabled Invoice on HR Payroll Workstation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Macro-Enabled Invoice on HR Payroll Workstation. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Macro-Enabled Invoice on HR Payroll Workstation. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Macro-Enabled Invoice on HR Payroll Workstation incident. The document used a signed macro to launch PowerShell, which attempted to download a second-stage payload from a lookalike domain. The download was blocked, but the macro executed and may have staged data locally. Business impact: The mailbox is still receiving mail from the same campaign, and other HR users may open the same attachment. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Macro-Enabled Invoice on HR Payroll Workstation
  opening: At 09:12, an HR payroll analyst opened an invoice attachment named 'July_Adjustments.docm' from an unknown sender. EDR blocked a child process from Microsoft Word two minutes later.
  summary: The document used a signed macro to launch PowerShell, which attempted to download a second-stage payload from a lookalike domain. The download was blocked, but the macro executed and may have staged data locally.
  compromised_assets:
  - WS-HR-014 (HR payroll laptop)
  - HR payroll mailbox
  - Microsoft Word macro execution
  detected_via: 'EDR alert: Office spawned PowerShell after a macro-enabled document opened.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: macro_invoice___hr_payroll_laptop_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'At 09:12, an HR payroll analyst opened an invoice attachment named ''July_Adjustments.docm'' from an unknown sender. EDR blocked a child process from Microsoft Word two minutes later. EDR alert: Office spawned PowerShell after a macro-enabled document opened.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for WS-HR-014 (HR payroll laptop).
  - Record what you find before you change anything.
  ideal_concepts:
  - verify sender
  - attachment hash
  - macro execution
  - preserve email
  - check edr
  - recipient list
  reference_answer: Confirm the sender, subject, attachment hash, and recipient list; verify whether macros executed on WS-HR-014; preserve the email, EDR process tree, and proxy/DNS logs before deleting anything.
  followup_good: Triage confirms the activity is real. EDR shows WINWORD.EXE spawned powershell.exe with an encoded command, and DNS logs show a lookup for cdn-invoices[.]top. The download was blocked by the web proxy, and no outbound connection succeeded.
  followup_weak: The alert is treated as noise and the team acts on assumptions. EDR shows WINWORD.EXE spawned powershell.exe with an encoded command, and DNS logs show a lookup for cdn-invoices[.]top. The download was blocked by the web proxy, and no outbound connection succeeded.
  next: macro_invoice___hr_payroll_laptop_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1566.001 Spearphishing Attachment
- id: macro_invoice___hr_payroll_laptop_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. EDR shows WINWORD.EXE spawned powershell.exe with an encoded command, and DNS logs show a lookup for cdn-invoices[.]top. The download was blocked by the web proxy, and no outbound connection succeeded.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - quarantine email
  - isolate ws-hr-014
  - block domain
  - block cdn-invoices
  - mail gateway
  reference_answer: Quarantine the email from all mailboxes, isolate WS-HR-014 from the network, and block the sender domain and cdn-invoices[.]top at the mail gateway, proxy, and DNS resolver.
  followup_good: Containment is in place. The macro ran because the document came from the internet and Office did not block macros from external senders. The payload never executed, but the macro created a staging folder under C:\Users\Public.
  followup_weak: The activity continues while the team debates. The mailbox is still receiving mail from the same campaign, and other HR users may open the same attachment.
  next: macro_invoice___hr_payroll_laptop_phase_3
  mitre_tactic: Execution
  mitre_technique: T1204.002 Malicious File
- id: macro_invoice___hr_payroll_laptop_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The macro ran because the document came from the internet and Office did not block macros from external senders. The payload never executed, but the macro created a staging folder under C:\Users\Public.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove staging folder
  - full edr scan
  - reset credentials
  - check persistence
  - scheduled tasks
  reference_answer: Remove the macro-created staging folder, run a full EDR scan, reset the HR user's credentials if the document prompted for them, and confirm no persistence was created under Run keys or scheduled tasks.
  followup_good: Rebuild WS-HR-014 if the scan finds unknown files, or restore it from a trusted image, then monitor the host for 24 hours before returning it to the user.
  followup_weak: The visible symptom is gone, but the root cause remains. The mailbox is still receiving mail from the same campaign, and other HR users may open the same attachment.
  next: macro_invoice___hr_payroll_laptop_phase_4
  mitre_tactic: Execution
  mitre_technique: T1059.001 PowerShell
- id: macro_invoice___hr_payroll_laptop_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Rebuild WS-HR-014 if the scan finds unknown files, or restore it from a trusted image, then monitor the host for 24 hours before returning it to the user.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - rebuild host
  - trusted image
  - monitor 24 hours
  - validate clean
  - restore profile
  reference_answer: Rebuild or restore WS-HR-014 from a trusted image, validate that no macro artifacts or persistence remain, and monitor the host for 24 hours before returning it to the user.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: macro_invoice___hr_payroll_laptop_phase_5
  mitre_tactic: Defense Evasion
  mitre_technique: T1562.001 Disable or Modify Tools
- id: macro_invoice___hr_payroll_laptop_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Macro Invoice — HR Payroll Laptop.
  prompt: What must change so Macro Invoice — HR Payroll Laptop is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - block internet macros
  - group policy
  - awareness training
  - attachment warning
  - mail filtering
  reference_answer: Enforce macro blocking for documents from the internet through Group Policy, add an attachment warning banner, and send HR a short awareness note with the reported sender pattern.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1566 Phishing
