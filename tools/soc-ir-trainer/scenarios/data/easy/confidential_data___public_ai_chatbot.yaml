id: confidential_data___public_ai_chatbot
name: Confidential Data — Public AI Chatbot
category: AI & ML
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. DLP alert: large text paste to an unapproved AI domain. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Product roadmap.'
  incident_manager: You are the Incident Manager coordinating the response to Confidential Roadmap Pasted into a Public AI Chatbot. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Confidential Roadmap Pasted into a Public AI Chatbot. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Confidential Roadmap Pasted into a Public AI Chatbot. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Confidential Roadmap Pasted into a Public AI Chatbot incident. The document included customer names, pricing, and an unannounced feature. The company has no approved AI tool for this data classification. Business impact: Customer and product secrets may be retained or exposed in model output. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Confidential Roadmap Pasted into a Public AI Chatbot
  opening: A product manager pasted a confidential roadmap and customer contract into a public AI chatbot to summarize it. The chatbot vendor may retain inputs for training.
  summary: The document included customer names, pricing, and an unannounced feature. The company has no approved AI tool for this data classification.
  compromised_assets:
  - Product roadmap
  - Customer contract
  - Public AI chatbot
  detected_via: 'DLP alert: large text paste to an unapproved AI domain.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: confidential_data___public_ai_chatbot_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'A product manager pasted a confidential roadmap and customer contract into a public AI chatbot to summarize it. The chatbot vendor may retain inputs for training. DLP alert: large text paste to an unapproved AI domain.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Product roadmap.
  - Record what you find before you change anything.
  ideal_concepts:
  - user
  - document classification
  - chatbot vendor
  - dlp alert
  - data shared
  - retention
  reference_answer: Identify the user, document, data classification, and chatbot vendor; preserve the DLP alert and user statement.
  followup_good: Triage confirms the activity is real. Proxy logs show a 12 KB paste to a public chatbot domain. The user is in Product and has access to confidential documents. The vendor's policy allows training on inputs unless the user opts out.
  followup_weak: The alert is treated as noise and the team acts on assumptions. Proxy logs show a 12 KB paste to a public chatbot domain. The user is in Product and has access to confidential documents. The vendor's policy allows training on inputs unless the user opts out.
  next: confidential_data___public_ai_chatbot_phase_2
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: confidential_data___public_ai_chatbot_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. Proxy logs show a 12 KB paste to a public chatbot domain. The user is in Product and has access to confidential documents. The vendor's policy allows training on inputs unless the user opts out.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - request deletion
  - revoke access
  - block domain
  - vendor
  - confidential data
  reference_answer: Ask the vendor to delete the conversation if possible, revoke the user's access to the document if needed, and block the domain pending review.
  followup_good: Containment is in place. Confidential data was entered into an unapproved AI service with unclear retention.
  followup_weak: The activity continues while the team debates. Customer and product secrets may be retained or exposed in model output.
  next: confidential_data___public_ai_chatbot_phase_3
  mitre_tactic: Defense Evasion
  mitre_technique: T1070.004 File Deletion
- id: confidential_data___public_ai_chatbot_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. Confidential data was entered into an unapproved AI service with unclear retention.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - training use
  - notify legal
  - privacy
  - document access
  - retention policy
  reference_answer: Determine whether the data was used for training, notify legal and privacy, and review the document's access.
  followup_good: Provide an approved enterprise AI tool with retention controls and train the user.
  followup_weak: The visible symptom is gone, but the root cause remains. Customer and product secrets may be retained or exposed in model output.
  next: confidential_data___public_ai_chatbot_phase_4
  mitre_tactic: Data Manipulation
  mitre_technique: T1565.001 Stored Data Manipulation
- id: confidential_data___public_ai_chatbot_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Provide an approved enterprise AI tool with retention controls and train the user.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - enterprise ai
  - retention controls
  - user training
  - validate deletion
  - approved tool
  reference_answer: Provide an approved enterprise AI tool with retention controls, verify the old conversation is deleted, and train the user before restoring access.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: confidential_data___public_ai_chatbot_phase_5
  mitre_tactic: Persistence
  mitre_technique: T1556 Modify Authentication Process
- id: confidential_data___public_ai_chatbot_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Confidential Data — Public AI Chatbot.
  prompt: What must change so Confidential Data — Public AI Chatbot is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - ai acceptable use
  - enterprise ai
  - no-training terms
  - dlp for ai
  - data classification
  reference_answer: Publish an AI acceptable-use policy, deploy enterprise AI with no-training terms, and add DLP for AI domains.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
