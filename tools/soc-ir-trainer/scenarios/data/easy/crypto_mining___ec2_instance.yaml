briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. GuardDuty: EC2 instance communicating with a crypto-mining pool. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond EC2 instance i-0abc123.'
  incident_manager: You are the Incident Manager coordinating the response to EC2 Instance Hijacked for Crypto Mining. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for EC2 Instance Hijacked for Crypto Mining. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for EC2 Instance Hijacked for Crypto Mining. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the EC2 Instance Hijacked for Crypto Mining incident. The instance was launched from an old AMI with a public SSH key and an overly broad role. The miner started from a user-data script and has been running for 18 hours. Business impact: Compute costs are rising and the instance role may expose S3 data. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: EC2 Instance Hijacked for Crypto Mining
  opening: AWS GuardDuty flagged an EC2 instance making connections to a mining pool and consuming 100% CPU. The instance normally runs a low-traffic internal API.
  summary: The instance was launched from an old AMI with a public SSH key and an overly broad role. The miner started from a user-data script and has been running for 18 hours.
  compromised_assets:
  - EC2 instance i-0abc123
  - AWS account
  - Mining pool
  detected_via: 'GuardDuty: EC2 instance communicating with a crypto-mining pool.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: crypto_mining___ec2_instance_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'AWS GuardDuty flagged an EC2 instance making connections to a mining pool and consuming 100% CPU. The instance normally runs a low-traffic internal API. GuardDuty: EC2 instance communicating with a crypto-mining pool.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for EC2 instance i-0abc123.
  - Record what you find before you change anything.
  ideal_concepts:
  - instance access
  - iam role
  - s3 access
  - cloudtrail
  - vpc flow logs
  - key pair
  reference_answer: Identify how the instance was accessed, what IAM role it uses, and whether S3 was accessed; preserve CloudTrail and VPC flow logs.
  followup_good: Triage confirms the activity is real. CloudTrail shows a new key pair and security-group change 20 hours ago. The instance runs XMRig from /tmp and connects to pool.minexmr[.]com. The instance role can read S3.
  followup_weak: The alert is treated as noise and the team acts on assumptions. CloudTrail shows a new key pair and security-group change 20 hours ago. The instance runs XMRig from /tmp and connects to pool.minexmr[.]com. The instance role can read S3.
  next: crypto_mining___ec2_instance_phase_2
  mitre_tactic: Valid Accounts
  mitre_technique: T1078.004 Cloud Accounts
- id: crypto_mining___ec2_instance_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. CloudTrail shows a new key pair and security-group change 20 hours ago. The instance runs XMRig from /tmp and connects to pool.minexmr[.]com. The instance role can read S3.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - stop instance
  - isolate security group
  - revoke key pair
  - compromised credentials
  - ec2
  reference_answer: Stop the instance, isolate its security group, and revoke the compromised key pair.
  followup_good: Containment is in place. An attacker used exposed SSH access to launch a miner and persist through user-data.
  followup_weak: The activity continues while the team debates. Compute costs are rising and the instance role may expose S3 data.
  next: crypto_mining___ec2_instance_phase_3
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: crypto_mining___ec2_instance_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. An attacker used exposed SSH access to launch a miner and persist through user-data.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - terminate instance
  - remove key pair
  - rotate credentials
  - scan account
  - other miners
  reference_answer: Terminate the instance, remove the key pair, rotate credentials, and scan the account for other miners.
  followup_good: Relaunch from a hardened AMI with a least-privilege role, and monitor billing and GuardDuty.
  followup_weak: The visible symptom is gone, but the root cause remains. Compute costs are rising and the instance role may expose S3 data.
  next: crypto_mining___ec2_instance_phase_4
  mitre_tactic: Deployment
  mitre_technique: T1078.004 Cloud Accounts
- id: crypto_mining___ec2_instance_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Relaunch from a hardened AMI with a least-privilege role, and monitor billing and GuardDuty.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - hardened ami
  - least privilege
  - monitor billing
  - guardduty
  - validate api
  reference_answer: Relaunch the service from a hardened AMI with a least-privilege role, validate the API, and monitor billing and GuardDuty for renewed mining activity.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: crypto_mining___ec2_instance_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: crypto_mining___ec2_instance_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Crypto Mining — EC2 Instance.
  prompt: What must change so Crypto Mining — EC2 Instance is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - remove public ssh
  - hardened ami
  - imdsv2
  - mining pool alert
  - cost monitoring
  reference_answer: Remove public SSH, use hardened AMIs, enforce IMDSv2, and alert on mining-pool traffic.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Valid Accounts
  mitre_technique: T1078.004 Cloud Accounts
