id: shared_service_account___password_in_ticket
name: Shared Service Account — Password in Ticket
category: Identity & Access
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Employee report after seeing the screenshot. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Backup service account.
  incident_manager: You are the Incident Manager coordinating the response to Backup Service Account Password Exposed in Support Ticket. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Backup Service Account Password Exposed in Support Ticket. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Backup Service Account Password Exposed in Support Ticket. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Backup Service Account Password Exposed in Support Ticket incident. The service account has domain backup privileges and its password has not changed in two years. Authentication logs show no unusual use yet, but the exposure window is significant. Business impact: Anyone with ticket access could use the credential to access backups or domain controllers. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Backup Service Account Password Exposed in Support Ticket
  opening: A support ticket included a screenshot with the password for the backup service account visible in a terminal. The ticket was visible to 40 contractors for three days.
  summary: The service account has domain backup privileges and its password has not changed in two years. Authentication logs show no unusual use yet, but the exposure window is significant.
  compromised_assets:
  - Backup service account
  - ITSM ticket
  - Domain backup privileges
  detected_via: Employee report after seeing the screenshot.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: shared_service_account___password_in_ticket_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A support ticket included a screenshot with the password for the backup service account visible in a terminal. The ticket was visible to 40 contractors for three days. Employee report after seeing the screenshot.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Backup service account.
  - Record what you find before you change anything.
  ideal_concepts:
  - account privileges
  - exposure
  - ticket viewers
  - authentication sources
  - ticket audit
  - backup servers
  reference_answer: Identify the account, its privileges, where the password was exposed, who viewed the ticket, and recent authentication sources; preserve ticket audit logs.
  followup_good: Triage confirms the activity is real. The ticket attachment contains the password in clear text. The account authenticated only from two backup servers in the last 30 days, but 40 contractors could view the ticket.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The ticket attachment contains the password in clear text. The account authenticated only from two backup servers in the last 30 days, but 40 contractors could view the ticket.
  next: shared_service_account___password_in_ticket_phase_2
  mitre_tactic: Privilege Escalation
  mitre_technique: T1078.002 Domain Accounts
- id: shared_service_account___password_in_ticket_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The ticket attachment contains the password in clear text. The account authenticated only from two backup servers in the last 30 days, but 40 contractors could view the ticket.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - remove attachment
  - restrict ticket
  - rotate password
  - update backup jobs
  - itsm
  reference_answer: Remove the attachment, restrict the ticket, rotate the service account password, and update the dependent backup jobs.
  followup_good: Containment is in place. A privileged credential was pasted into a ticket, and the service account uses a shared static password with broad backup rights.
  followup_weak: The activity continues while the team debates. Anyone with ticket access could use the credential to access backups or domain controllers.
  next: shared_service_account___password_in_ticket_phase_3
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
- id: shared_service_account___password_in_ticket_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A privileged credential was pasted into a ticket, and the service account uses a shared static password with broad backup rights.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - managed service account
  - gmsa
  - interactive logon
  - backup logs
  - unauthorized access
  reference_answer: Move backup jobs to a managed service account or gMSA, remove interactive logon rights, and review backup server logs for unauthorized access.
  followup_good: Validate backups run successfully with the new credential, confirm no unauthorized logons, and monitor the account for 72 hours.
  followup_weak: The visible symptom is gone, but the root cause remains. Anyone with ticket access could use the credential to access backups or domain controllers.
  next: shared_service_account___password_in_ticket_phase_4
  mitre_tactic: Lateral Movement
  mitre_technique: T1021.002 SMB/Windows Admin Shares
- id: shared_service_account___password_in_ticket_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Validate backups run successfully with the new credential, confirm no unauthorized logons, and monitor the account for 72 hours.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - validate backups
  - no unauthorized logons
  - monitor account
  - rotate dependent
  - business sign-off
  reference_answer: Validate that backups complete with the new gMSA or managed credential, confirm no unauthorized logons occurred, and monitor the account for 72 hours.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: shared_service_account___password_in_ticket_phase_5
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: shared_service_account___password_in_ticket_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Shared Service Account — Password in Ticket.
  prompt: What must change so Shared Service Account — Password in Ticket is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - no secrets in tickets
  - password manager
  - gmsa
  - contractor visibility
  - rotate service passwords
  reference_answer: Ban secrets in tickets, use a password manager or gMSA, restrict contractor ticket visibility, and rotate privileged service passwords regularly.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1003.003 NTDS
