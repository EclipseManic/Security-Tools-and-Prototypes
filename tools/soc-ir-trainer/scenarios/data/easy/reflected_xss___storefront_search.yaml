id: reflected_xss___storefront_search
name: Reflected XSS — Storefront Search
category: Web App
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. External vulnerability report. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Storefront search page.
  incident_manager: You are the Incident Manager coordinating the response to Reflected Cross-Site Scripting on Storefront Search Page. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Reflected Cross-Site Scripting on Storefront Search Page. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Reflected Cross-Site Scripting on Storefront Search Page. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Reflected Cross-Site Scripting on Storefront Search Page incident. The payload was a simple script tag in the search query. The page is public and does not use a CSP. No evidence of exploitation beyond the researcher''s test. Business impact: An attacker could send a crafted link to steal session data or perform actions as a logged-in customer. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Reflected Cross-Site Scripting on Storefront Search Page
  opening: A security researcher reported that the storefront search page reflects the 'q' parameter without encoding. A crafted link executed JavaScript in the tester's browser.
  summary: The payload was a simple script tag in the search query. The page is public and does not use a CSP. No evidence of exploitation beyond the researcher's test.
  compromised_assets:
  - Storefront search page
  - Customer session cookies
  detected_via: External vulnerability report.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: reflected_xss___storefront_search_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A security researcher reported that the storefront search page reflects the 'q' parameter without encoding. A crafted link executed JavaScript in the tester's browser. External vulnerability report.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Storefront search page.
  - Record what you find before you change anything.
  ideal_concepts:
  - reproduce finding
  - vulnerable parameter
  - template
  - requests
  - preserve report
  - test environment
  reference_answer: Reproduce the finding in a test environment, identify the vulnerable parameter and template, check whether any requests used the payload, and preserve the report.
  followup_good: Triage confirms the activity is real. The response includes the raw query string in the results heading. Cookies are HttpOnly, but the page also exposes a CSRF token in the DOM. The researcher provided a working proof-of-concept URL.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The response includes the raw query string in the results heading. Cookies are HttpOnly, but the page also exposes a CSRF token in the DOM. The researcher provided a working proof-of-concept URL.
  next: reflected_xss___storefront_search_phase_2
  mitre_tactic: Execution
  mitre_technique: T1059.007 JavaScript
- id: reflected_xss___storefront_search_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The response includes the raw query string in the results heading. Cookies are HttpOnly, but the page also exposes a CSRF token in the DOM. The researcher provided a working proof-of-concept URL.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - waf rule
  - script payloads
  - search route
  - session lifetime
  - temporary block
  reference_answer: Add a temporary WAF rule blocking script payloads on the search route and shorten session lifetimes if exploitation is suspected.
  followup_good: Containment is in place. Output encoding is missing on the search results template and there is no Content-Security-Policy.
  followup_weak: The activity continues while the team debates. An attacker could send a crafted link to steal session data or perform actions as a logged-in customer.
  next: reflected_xss___storefront_search_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1189 Drive-by Compromise
- id: reflected_xss___storefront_search_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. Output encoding is missing on the search results template and there is no Content-Security-Policy.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - output encoding
  - content security policy
  - regression test
  - filters
  - pagination
  reference_answer: Apply context-aware output encoding, add a strict CSP, and regression-test search, filters, and pagination.
  followup_good: Deploy the fix, verify the proof-of-concept no longer executes, and monitor WAF and application logs.
  followup_weak: The visible symptom is gone, but the root cause remains. An attacker could send a crafted link to steal session data or perform actions as a logged-in customer.
  next: reflected_xss___storefront_search_phase_4
  mitre_tactic: Credential Access
  mitre_technique: T1539 Steal Web Session Cookie
- id: reflected_xss___storefront_search_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Deploy the fix, verify the proof-of-concept no longer executes, and monitor WAF and application logs.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - deploy fix
  - verify poc
  - monitor waf
  - application logs
  - validate
  reference_answer: Deploy the fix, verify the proof-of-concept no longer executes in staging and production, and monitor WAF and application logs for renewed attempts.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: reflected_xss___storefront_search_phase_5
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: reflected_xss___storefront_search_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Reflected XSS — Storefront Search.
  prompt: What must change so Reflected XSS — Storefront Search is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - encoding review
  - dast in ci
  - csp
  - template security
  - developer training
  reference_answer: Add encoding checks to template review, run DAST in CI, and require CSP for customer-facing pages.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Execution
  mitre_technique: T1204 User Execution
