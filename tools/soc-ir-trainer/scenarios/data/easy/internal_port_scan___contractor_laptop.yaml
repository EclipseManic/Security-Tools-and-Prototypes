briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. IDS alert: internal horizontal port scan. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond WS-CON-018 (Contractor laptop).'
  incident_manager: You are the Incident Manager coordinating the response to Internal Network Scan from Contractor Workstation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Internal Network Scan from Contractor Workstation. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Internal Network Scan from Contractor Workstation. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Internal Network Scan from Contractor Workstation incident. The scan started at 03:15 and lasted 40 minutes. The host has an unsigned process making repeated SMB connections, and there is no business reason for scanning. Business impact: The host is mapping the internal network and could spread to unpatched SMB hosts. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Internal Network Scan from Contractor Workstation
  opening: The IDS detected a workstation scanning 1,200 internal IPs on common SMB and RDP ports. The workstation belongs to a contractor who mostly uses email and a browser.
  summary: The scan started at 03:15 and lasted 40 minutes. The host has an unsigned process making repeated SMB connections, and there is no business reason for scanning.
  compromised_assets:
  - WS-CON-018 (Contractor laptop)
  - Internal /16 network
  - SMB and RDP services
  detected_via: 'IDS alert: internal horizontal port scan.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: internal_port_scan___contractor_laptop_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'The IDS detected a workstation scanning 1,200 internal IPs on common SMB and RDP ports. The workstation belongs to a contractor who mostly uses email and a browser. IDS alert: internal horizontal port scan.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for WS-CON-018 (Contractor laptop).
  - Record what you find before you change anything.
  ideal_concepts:
  - scanning process
  - parent
  - hash
  - user
  - responded hosts
  - smb authentication
  reference_answer: Identify the scanning process, parent, hash, and user; determine which hosts responded and whether any SMB or RDP authentication succeeded; preserve flow and EDR logs.
  followup_good: Triage confirms the activity is real. Flow logs show sequential connections from WS-CON-018 to 1,200 hosts on 445 and 3389. EDR shows an unsigned process named 'netcheck.exe' started from the user's temp folder. No successful SMB login is recorded.
  followup_weak: The alert is treated as noise and the team acts on assumptions. Flow logs show sequential connections from WS-CON-018 to 1,200 hosts on 445 and 3389. EDR shows an unsigned process named 'netcheck.exe' started from the user's temp folder. No successful SMB login is recorded.
  next: internal_port_scan___contractor_laptop_phase_2
  mitre_tactic: Collection
  mitre_technique: T1040 Network Sniffing
- id: internal_port_scan___contractor_laptop_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. Flow logs show sequential connections from WS-CON-018 to 1,200 hosts on 445 and 3389. EDR shows an unsigned process named 'netcheck.exe' started from the user's temp folder. No successful SMB login is recorded.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - isolate workstation
  - disable account
  - block hash
  - contractor
  - edr
  reference_answer: Isolate WS-CON-018, disable the contractor's network account, and block the process hash at EDR.
  followup_good: Containment is in place. The contractor downloaded a 'network speed tester' that includes a scanner and possible worm module. The host has no EDR exclusions, but the process was not blocked.
  followup_weak: The activity continues while the team debates. The host is mapping the internal network and could spread to unpatched SMB hosts.
  next: internal_port_scan___contractor_laptop_phase_3
  mitre_tactic: Lateral Movement
  mitre_technique: T1021.002 SMB/Windows Admin Shares
- id: internal_port_scan___contractor_laptop_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The contractor downloaded a 'network speed tester' that includes a scanner and possible worm module. The host has no EDR exclusions, but the process was not blocked.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove scanner
  - persistence
  - full scan
  - downloads
  - other tools
  reference_answer: Remove the scanner and its persistence, run a full scan, and check the contractor's downloads for other tools.
  followup_good: Rebuild the laptop before returning it, restore only approved software, and monitor for renewed scanning.
  followup_weak: The visible symptom is gone, but the root cause remains. The host is mapping the internal network and could spread to unpatched SMB hosts.
  next: internal_port_scan___contractor_laptop_phase_4
  mitre_tactic: Lateral Movement
  mitre_technique: T1021.002 SMB/Windows Admin Shares
- id: internal_port_scan___contractor_laptop_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Rebuild the laptop before returning it, restore only approved software, and monitor for renewed scanning.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - rebuild laptop
  - approved software
  - monitor scanning
  - network traffic
  - validate
  reference_answer: Rebuild the contractor laptop before returning it, restore only approved software, and monitor internal traffic for renewed scanning or SMB authentication attempts.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: internal_port_scan___contractor_laptop_phase_5
  mitre_tactic: Impact
  mitre_technique: T1498 Network Denial of Service
- id: internal_port_scan___contractor_laptop_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Internal Port Scan — Contractor Laptop.
  prompt: What must change so Internal Port Scan — Contractor Laptop is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - application control
  - internal scan alert
  - block network tools
  - contractor policy
  - network segmentation
  reference_answer: Restrict contractor endpoints with application control, alert on internal scanning, and block unauthorized network tools.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Collection
  mitre_technique: T1040 Network Sniffing
