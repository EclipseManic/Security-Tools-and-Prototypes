    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Hardening & Prevention — Phase 4. Asset in scope: Fraud detection model API.'
  hints:
  - Rate limiting helps but doesn't address access control, watermarking, or legal protections needed for comprehensive model protection.
  - Targeted controls (rate limiting, monitoring, access policies) provide security without losing partnerships.
  - Watermarking helps with attribution but doesn't prevent extraction.
  ideal_concepts:
