phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A model extraction attack is in progress. The attacker has made 2.3 million API calls to map the model's decision boundary. The API key belongs to a former employee who joined a competitor. The model's IP is valued at $8M. The attacker may have already extracted enough information to replicate the model's behavior.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What is your FIRST containment action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Fraud detection model API.'
  hints:
  - Stops this attacker but doesn't prevent others from using similar extraction techniques.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately revoke
  - revoke fintech
  - fintech solutions
  - solutions api
  - api key
  - key implement
  - implement rate
  - rate limiting
  reference_answer: |-
    Immediately revoke the FinTech Solutions API key, implement rate limiting on all API keys (max 10,000 calls/day), deploy query pattern analysis to detect extraction attempts, and log all future queries from the affected partner account

    Why: Key revocation stops the active attack, rate limiting prevents future bulk extraction, query analysis detects similar patterns, and logging preserves evidence.
  followup_good: 'The API key has been revoked. Rate limiting is in place. You need to determine: exactly what information the attacker extracted, whether the extracted model is accurate enough to replicate the original, what the attacker''s input patterns reveal about their extraction method, and whether the attacker shared the extracted model with the competitor.'
  followup_weak: |-
    Key revocation stops the active attack, rate limiting prevents future bulk extraction, query analysis detects similar patterns, and logging preserves evidence.

    The API key has been revoked. Rate limiting is in place. You need to determine: exactly what information the attacker extracted, whether the extracted model is accurate enough to replicate the original, what the attacker's input patterns reveal about their extraction method, and whether the attacker shared the extracted model with the competitor.
