briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Model Extraction / Stealing — IP Theft via API. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Model Extraction / Stealing — IP Theft via API. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Model Extraction / Stealing — IP Theft via API. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Model Extraction / Stealing — IP Theft via API incident. The ML platform team detected anomalous API usage patterns on the company''s fraud detection model API. The API serves predictions for the company''s financial services division and processes 50,000 predictions per day from internal customers. Analysis revealed that a single API key (owned by a partner company, FinTech Solutions) made 2.3 million API calls over 5 days (460,000 per day — 9x normal usage). The API calls followed a systematic pattern: the attacker sent carefully crafted input feature combinations designed to map the model''s decision boundary. The attacker''s input pattern is consistent with model extraction attacks described in academic literature. The API key belongs to a data scientist at FinTech Solutions who recently left the company to join a competitor. The model is a proprietary ensemble of gradient boosted trees and neural networks, trained on 3 years of fraud data.
  The model''s intellectual property is valued at $8M in development costs and provides a competitive advantage in fraud detection. Business impact: model integrity and data confidentiality are at risk, and AI output should be treated as untrustworthy until validated. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess notification duties for any personal or proprietary data exposed to the model.'
