- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: Query analysis reveals the attacker used a decision-based extraction method that queried the model's decision boundary with 2.3 million carefully chosen inputs. The extracted model achieves 94% accuracy compared to the original's 97% — sufficient for commercial use. The attacker's queries show knowledge of the model's input feature space, suggesting they had access to the model's documentation. The former employee had authorized API access until 2 weeks after their departure. The extraction occurred during this grace period. The competitor has announced a similar fraud detection product.
  prompt: How do you assess the full impact?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you assess the full impact?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: Fraud detection model API.'
  hints:
  - Legal action is important but must also assess the technical and competitive impact to inform the legal strategy.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - assess competitive
  - competitive damage
  - damage extracted
  - extracted model
  - model accuracy
  - accuracy replica
  - replica quantify
  - quantify theft
  reference_answer: |-
    Assess the competitive damage from the extracted model (94% accuracy replica), quantify the IP theft impact ($8M development cost), determine legal remedies (trade secret misappropriation), assess whether the competitor's announced product uses the extracted model, and evaluate the market impact of a competing fraud detection product

    Why: Full impact: competitive damage (replica accuracy), IP theft ($8M value), legal remedies (trade secret law), competitor analysis (product similarity), and market impact (competitive advantage loss).
  followup_good: 'The investigation confirms: the former employee extracted the model during the post-departure grace period, the extracted model achieves 94% accuracy, the competitor has released a similar product, and the company''s API had no rate limiting or query pattern analysis. The company serves 3 other high-value ML model APIs. The grace period policy allowed API access for 30 days after employee departure.'
  followup_weak: |-
    Full impact: competitive damage (replica accuracy), IP theft ($8M value), legal remedies (trade secret law), competitor analysis (product similarity), and market impact (competitive advantage loss).

    The investigation confirms: the former employee extracted the model during the post-departure grace period, the extracted model achieves 94% accuracy, the competitor has released a similar product, and the company's API had no rate limiting or query pattern analysis. The company serves 3 other high-value ML model APIs. The grace period policy allowed API access for 30 days after employee departure.
