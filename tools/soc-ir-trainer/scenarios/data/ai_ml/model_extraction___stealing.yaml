- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: 'The API key has been revoked. Rate limiting is in place. You need to determine: exactly what information the attacker extracted, whether the extracted model is accurate enough to replicate the original, what the attacker''s input patterns reveal about their extraction method, and whether the attacker shared the extracted model with the competitor.'
  prompt: How do you collect evidence from this model extraction attack?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on Fraud detection model API.
    action: How do you collect evidence from this model extraction attack?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: Fraud detection model API.'
  hints:
  - Access logs show volume but not the specific input/output pairs needed to assess what was extracted.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - export api
  - api queries
  - queries inputs
  - inputs outputs
  - outputs analyze
  - analyze query
  - query patterns
  - patterns determine
  reference_answer: |-
    Export all 2.3M API queries with their inputs and outputs, analyze the query patterns to determine the extraction method, reconstruct the extracted model's decision boundary from the query data, preserve the API access logs for legal proceedings, and assess the accuracy of the extracted model vs the original

    Why: Comprehensive evidence: query data (extraction scope), pattern analysis (method identification), boundary reconstruction (extracted model accuracy), legal preservation (litigation support), and accuracy assessment (IP damage).
  followup_good: Query analysis reveals the attacker used a decision-based extraction method that queried the model's decision boundary with 2.3 million carefully chosen inputs. The extracted model achieves 94% accuracy compared to the original's 97% — sufficient for commercial use. The attacker's queries show knowledge of the model's input feature space, suggesting they had access to the model's documentation. The former employee had authorized API access until 2 weeks after their departure. The extraction occurred during this grace period. The competitor has announced a similar fraud detection product.
  followup_weak: |-
    Comprehensive evidence: query data (extraction scope), pattern analysis (method identification), boundary reconstruction (extracted model accuracy), legal preservation (litigation support), and accuracy assessment (IP damage).

    Query analysis reveals the attacker used a decision-based extraction method that queried the model's decision boundary with 2.3 million carefully chosen inputs. The extracted model achieves 94% accuracy compared to the original's 97% — sufficient for commercial use. The attacker's queries show knowledge of the model's input feature space, suggesting they had access to the model's documentation. The former employee had authorized API access until 2 weeks after their departure. The extraction occurred during this grace period. The competitor has announced a similar fraud detection product.
