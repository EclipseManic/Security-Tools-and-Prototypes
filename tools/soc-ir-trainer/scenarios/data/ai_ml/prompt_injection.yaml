- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: 'The conversation logs reveal the attacker used a multi-turn injection that gradually escalated: first asking about the chatbot''s capabilities, then requesting ''help debugging'' the system, then asking for the system prompt as a ''configuration reference'', then using disclosed API endpoints to query customer data. The attacker retrieved 847 records via function calls and 2,340 via direct API exploitation. The system prompt contained: Azure OpenAI endpoint URL, function call schemas, database table names, and internal employee emails. The attacker''s session originated from a VPN in a foreign country. 3 other suspicious sessions in the past week show similar injection patterns but were partially blocked by safety filters.'
  prompt: How do you assess the full scope and impact?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you assess the full scope and impact?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: Customer service chatbot.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - assess customer
  - customer data
  - data exposure
  - exposure records
  - records determine
  - determine regulatory
  - regulatory implications
  - implications gdpr
  reference_answer: |-
    Assess customer data exposure (3,187 records), determine regulatory implications (GDPR/CCPA for PII), analyze the 3 other suspicious sessions for data exfiltration, evaluate the impact of disclosed internal configurations, and assess the chatbot model's vulnerability to similar attacks

    Why: Full impact: data breach (customer records), regulatory (PII protection), broader attack scope (3 other sessions), configuration exposure (internal systems), and model security (vulnerability assessment).
  followup_good: 'Investigation reveals: 3,187 customer records exposed (names, emails, subscription details), system prompt with internal configurations disclosed, 3 additional injection attempts partially succeeded, and the chatbot''s safety filters were bypassed using gradual context building. The chatbot uses Azure OpenAI with function calling enabled. The company plans to expand the chatbot to handle billing inquiries and account management.'
  followup_weak: |-
    Full impact: data breach (customer records), regulatory (PII protection), broader attack scope (3 other sessions), configuration exposure (internal systems), and model security (vulnerability assessment).

    Investigation reveals: 3,187 customer records exposed (names, emails, subscription details), system prompt with internal configurations disclosed, 3 additional injection attempts partially succeeded, and the chatbot's safety filters were bypassed using gradual context building. The chatbot uses Azure OpenAI with function calling enabled. The company plans to expand the chatbot to handle billing inquiries and account management.
