id: prompt_injection
name: Prompt Injection
category: AI & ML
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Prompt Injection — LLM Security Attack. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Prompt Injection — LLM Security Attack. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Prompt Injection — LLM Security Attack. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Prompt Injection — LLM Security Attack incident. The application security team discovered that the company''s customer service chatbot (powered by a fine-tuned GPT-4 model deployed on Azure OpenAI) was manipulated into disclosing internal system prompts and customer data. The attack was identified when a customer reported receiving a response containing the chatbot''s system prompt, which includes: API endpoint configurations, database schema references, escalation procedures, and internal employee email addresses. The attacker used a multi-turn prompt injection technique across 15 messages, gradually building context to bypass the chatbot''s safety filters. The chatbot also executed a function call that retrieved 847 customer records including names, email addresses, and subscription details. The attacker then used the disclosed API endpoints to make unauthorized calls to the customer database API, accessing an additional 2,340 customer records.
  The chatbot is deployed on the company''s public website and handles 12,000 customer interactions per day. Business impact: model integrity and data confidentiality are at risk, and AI output should be treated as untrustworthy until validated. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess notification duties for any personal or proprietary data exposed to the model.'
