- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: The chatbot is offline. API keys have been rotated. You need to determine the full scope of the prompt injection attack. The chatbot's conversation logs contain the attacker's 15-message injection sequence. The system prompt was disclosed in the chatbot's response. The API access logs show the unauthorized customer data retrieval.
  prompt: How do you collect evidence from this prompt injection attack?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you collect evidence from this prompt injection attack?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: Customer service chatbot.'
  hints:
  - Conversation logs show the attack but don't capture the full impact (API exploitation) or help with defensive improvements.
  - API logs show unauthorized access but don't show the prompt injection technique or the chatbot's function call execution.
  ideal_concepts:
  - export full
  - full conversation
  - conversation logs
  - logs showing
  - showing injection
  - injection sequence
  - sequence preserve
  - preserve disclosed
  reference_answer: |-
    Export the full conversation logs showing the injection sequence, preserve the disclosed system prompt for impact assessment, audit all API calls made using the disclosed endpoints, pull chatbot model inference logs to determine what function calls were executed, and analyze the attacker's injection techniques for defensive improvements

    Why: Comprehensive evidence: conversation logs (attack sequence), system prompt (impact scope), API logs (unauthorized access), inference logs (function call execution), and technique analysis (defense improvement).
  followup_good: 'The conversation logs reveal the attacker used a multi-turn injection that gradually escalated: first asking about the chatbot''s capabilities, then requesting ''help debugging'' the system, then asking for the system prompt as a ''configuration reference'', then using disclosed API endpoints to query customer data. The attacker retrieved 847 records via function calls and 2,340 via direct API exploitation. The system prompt contained: Azure OpenAI endpoint URL, function call schemas, database table names, and internal employee emails. The attacker''s session originated from a VPN in a foreign country. 3 other suspicious sessions in the past week show similar injection patterns but were partially blocked by safety filters.'
  followup_weak: |-
    Comprehensive evidence: conversation logs (attack sequence), system prompt (impact scope), API logs (unauthorized access), inference logs (function call execution), and technique analysis (defense improvement).

    The conversation logs reveal the attacker used a multi-turn injection that gradually escalated: first asking about the chatbot's capabilities, then requesting 'help debugging' the system, then asking for the system prompt as a 'configuration reference', then using disclosed API endpoints to query customer data. The attacker retrieved 847 records via function calls and 2,340 via direct API exploitation. The system prompt contained: Azure OpenAI endpoint URL, function call schemas, database table names, and internal employee emails. The attacker's session originated from a VPN in a foreign country. 3 other suspicious sessions in the past week show similar injection patterns but were partially blocked by safety filters.
