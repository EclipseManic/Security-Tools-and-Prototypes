- id: hardening_prevention_phase_4
  phase_type: lessons
  title: Hardening & Prevention — Phase 4
  situation: 'Investigation reveals: 3,187 customer records exposed (names, emails, subscription details), system prompt with internal configurations disclosed, 3 additional injection attempts partially succeeded, and the chatbot''s safety filters were bypassed using gradual context building. The chatbot uses Azure OpenAI with function calling enabled. The company plans to expand the chatbot to handle billing inquiries and account management.'
  prompt: What comprehensive LLM security improvements do you implement?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What comprehensive LLM security improvements do you implement?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Hardening & Prevention — Phase 4. Asset in scope: Customer service chatbot.'
  hints:
  - Removes one attack surface but doesn't address input filtering, output sanitization, or function call security.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement input
  - input output
  - output filtering
  - filtering dedicated
  - dedicated prompt
  - prompt injection
  - injection detection
  - detection model
  reference_answer: |-
    Implement input/output filtering with a dedicated prompt injection detection model, remove sensitive data from system prompts entirely (use backend API abstraction), implement conversation-level rate limiting and anomaly detection, deploy output sanitization to prevent data leakage, add multi-factor authentication for API access, establish an LLM red team program for continuous testing, and implement function call approval workflows for sensitive operations

    Why: Defense-in-depth: input filtering (injection detection), architecture (no secrets in prompts), rate limiting (abuse prevention), output sanitization (data leakage), authentication (API security), red teaming (continuous testing), and approval workflows (human-in-the-loop).
