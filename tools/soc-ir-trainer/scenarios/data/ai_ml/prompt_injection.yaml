phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The chatbot is actively vulnerable to prompt injection. The attacker has already extracted the system prompt and 3,187 customer records. The chatbot is live on the public website handling 12,000 interactions per day. The disclosed API endpoints may be exploited by others who see the chatbot's response. The system prompt contains internal configurations.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What is your FIRST containment action?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Customer service chatbot.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately take
  - chatbot offline
  - offline revoke
  - revoke api
  - api keys
  - keys referenced
  - referenced disclosed
  - disclosed system
  reference_answer: |-
    Immediately take the chatbot offline, revoke all API keys referenced in the disclosed system prompt, implement rate limiting on the customer database API, and begin logging all recent API access for the past 24 hours

    Why: Taking the chatbot offline stops ongoing exploitation, API key revocation prevents unauthorized access, rate limiting slows abuse, and logging preserves evidence of API exploitation.
  followup_good: The chatbot is offline. API keys have been rotated. You need to determine the full scope of the prompt injection attack. The chatbot's conversation logs contain the attacker's 15-message injection sequence. The system prompt was disclosed in the chatbot's response. The API access logs show the unauthorized customer data retrieval.
  followup_weak: |-
    Taking the chatbot offline stops ongoing exploitation, API key revocation prevents unauthorized access, rate limiting slows abuse, and logging preserves evidence of API exploitation.

    The chatbot is offline. API keys have been rotated. You need to determine the full scope of the prompt injection attack. The chatbot's conversation logs contain the attacker's 15-message injection sequence. The system prompt was disclosed in the chatbot's response. The API access logs show the unauthorized customer data retrieval.
