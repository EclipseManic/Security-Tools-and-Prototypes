briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Adversarial Examples — ML Model Manipulation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Adversarial Examples — ML Model Manipulation. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Adversarial Examples — ML Model Manipulation. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Adversarial Examples — ML Model Manipulation incident. The computer vision team discovered that the company''s quality inspection system (used in manufacturing) has been misclassifying defective products as non-defective for the past 2 weeks. The system uses a ResNet-50 model trained to detect surface defects on manufactured components. Investigation revealed that an attacker (likely a competitor or insider) placed small, precisely designed stickers on the conveyor belt cameras'' field of view. The stickers contain adversarial perturbations that cause the model to misclassify any product in the frame as ''non-defective'' with 99.2% confidence. The perturbation is invisible to human inspectors — the stickers appear as small gray squares. The system processes 2,400 components per hour. Over 2 weeks, an estimated 336,000 potentially defective components have been shipped to customers. The company manufactures aerospace fasteners where defects can cause
  catastrophic failures. The adversarial attack was designed to bypass the automated inspection without triggering human review. Business impact: model integrity and data confidentiality are at risk, and AI output should be treated as untrustworthy until validated. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess notification duties for any personal or proprietary data exposed to the model.'
