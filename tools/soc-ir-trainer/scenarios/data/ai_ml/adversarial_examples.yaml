- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: 'The production line is halted. The adversarial stickers have been removed. Manual inspection is underway. You need to determine: how the stickers were placed (insider vs. external), which products were affected, the full scope of potentially defective items, and how the adversarial perturbation was designed.'
  prompt: How do you collect evidence from this adversarial attack?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on Quality inspection ML model.
    action: How do you collect evidence from this adversarial attack?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: Quality inspection ML model.'
  hints:
  - Inventory is important for recall but doesn't address the attack vector or help with attribution.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - preserve adversarial
  - adversarial stickers
  - stickers analysis
  - analysis pull
  - security camera
  - camera footage
  - footage production
  - production area
  reference_answer: |-
    Preserve the adversarial stickers for analysis, pull security camera footage of the production area for the 2-week period, analyze the perturbation pattern to determine the attack method, inventory all products shipped during the affected period, and preserve the model's inference logs showing the misclassifications

    Why: Comprehensive evidence: physical (stickers), video (intruder identification), ML analysis (perturbation method), inventory (affected products), and inference logs (misclassification scope).
  followup_good: Sticker analysis reveals a carefully crafted adversarial perturbation using a FGSM (Fast Gradient Sign Method) attack optimized for the specific ResNet-50 model. The perturbation was designed to be robust across lighting conditions. Security footage shows a manufacturing line operator placing the stickers during a shift change 2 weeks ago. The operator was recently passed over for promotion. The inventory shows 336,000 fasteners shipped to 47 customers, including 3 aerospace manufacturers. Manual inspection of a random sample found 4.2% defective rate (vs 0.3% baseline).
  followup_weak: |-
    Comprehensive evidence: physical (stickers), video (intruder identification), ML analysis (perturbation method), inventory (affected products), and inference logs (misclassification scope).

    Sticker analysis reveals a carefully crafted adversarial perturbation using a FGSM (Fast Gradient Sign Method) attack optimized for the specific ResNet-50 model. The perturbation was designed to be robust across lighting conditions. Security footage shows a manufacturing line operator placing the stickers during a shift change 2 weeks ago. The operator was recently passed over for promotion. The inventory shows 336,000 fasteners shipped to 47 customers, including 3 aerospace manufacturers. Manual inspection of a random sample found 4.2% defective rate (vs 0.3% baseline).
