  summary: The computer vision team discovered that the company's quality inspection system (used in manufacturing) has been misclassifying defective products as non-defective for the past 2 weeks. The system uses a ResNet-50 model trained to detect surface defects on manufactured components. Investigation revealed that an attacker (likely a competitor or insider) placed small, precisely designed stickers on the conveyor belt cameras' field of view. The stickers contain adversarial perturbations that cause the model to misclassify any product in the frame as 'non-defective' with 99.2% confidence. The perturbation is invisible to human inspectors — the stickers appear as small gray squares. The system processes 2,400 components per hour. Over 2 weeks, an estimated 336,000 potentially defective components have been shipped to customers. The company manufactures aerospace fasteners where defects can cause catastrophic failures. The adversarial attack was designed to bypass the automated inspection
    without triggering human review.
