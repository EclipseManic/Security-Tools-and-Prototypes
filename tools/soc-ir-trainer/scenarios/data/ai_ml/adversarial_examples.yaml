phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A manufacturing quality inspection system is being bypassed by adversarial stickers. 336,000 potentially defective aerospace fasteners have been shipped. The system processes 2,400 components per hour. New stickers may be placed. Defective aerospace fasteners can cause catastrophic failures.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What is your FIRST containment action?
    why: Every later decision depends on an accurate picture of Quality inspection ML model and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Quality inspection ML model.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately halt
  - halt production
  - production line
  - line remove
  - adversarial stickers
  - stickers conveyor
  - conveyor belt
  - belt area
  reference_answer: |-
    Immediately halt the production line, remove all adversarial stickers from the conveyor belt area, switch to manual inspection with magnification equipment, and issue a stop-ship order for all fasteners produced in the past 2 weeks

    Why: Production halt stops new defective products, sticker removal eliminates the attack vector, manual inspection provides immediate quality control, and stop-ship prevents defective products from reaching customers.
  followup_good: 'The production line is halted. The adversarial stickers have been removed. Manual inspection is underway. You need to determine: how the stickers were placed (insider vs. external), which products were affected, the full scope of potentially defective items, and how the adversarial perturbation was designed.'
  followup_weak: |-
    Production halt stops new defective products, sticker removal eliminates the attack vector, manual inspection provides immediate quality control, and stop-ship prevents defective products from reaching customers.

    The production line is halted. The adversarial stickers have been removed. Manual inspection is underway. You need to determine: how the stickers were placed (insider vs. external), which products were affected, the full scope of potentially defective items, and how the adversarial perturbation was designed.
