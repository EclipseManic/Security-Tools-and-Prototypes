- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: Sticker analysis reveals a carefully crafted adversarial perturbation using a FGSM (Fast Gradient Sign Method) attack optimized for the specific ResNet-50 model. The perturbation was designed to be robust across lighting conditions. Security footage shows a manufacturing line operator placing the stickers during a shift change 2 weeks ago. The operator was recently passed over for promotion. The inventory shows 336,000 fasteners shipped to 47 customers, including 3 aerospace manufacturers. Manual inspection of a random sample found 4.2% defective rate (vs 0.3% baseline).
  prompt: How do you assess the full impact?
  guidance:
    what: Find every foothold the attacker left on Quality inspection ML model, including persistence and stolen credentials.
    action: How do you assess the full impact?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: Quality inspection ML model.'
  hints:
  - Aerospace is highest priority but all customers need notification.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - calculate total
  - total defective
  - defective products
  - products estimated
  - estimated based
  - based rate
  - rate identify
  - identify customers
  reference_answer: |-
    Calculate the total defective products (estimated 14,112 based on 4.2% rate), identify all 47 customers for recall notification, prioritize aerospace customers for immediate safety notification, assess liability implications for defective aerospace components, and engage the affected operator for investigation

    Why: Full impact: defect quantification (total affected), customer notification (47 customers), safety priority (aerospace), legal liability (component failure risk), and insider investigation (operator).
  followup_good: 'The investigation reveals: 14,112 defective fasteners estimated (4.2% rate), 47 customers affected, 3 aerospace manufacturers requiring immediate safety notification, the attacker was an insider (manufacturing operator), and the adversarial perturbation was optimized for the specific model architecture. The company uses the same model across 3 manufacturing plants. The model has no adversarial robustness training.'
  followup_weak: |-
