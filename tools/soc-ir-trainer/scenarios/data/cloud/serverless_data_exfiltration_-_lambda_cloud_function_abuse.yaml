- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Serverless Data Exfiltration — Lambda Function Abuse. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Serverless Data Exfiltration — Lambda Function Abuse. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Serverless Data Exfiltration — Lambda Function Abuse. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Serverless Data Exfiltration — Lambda Function Abuse incident. At 19:47 UTC, the Lambda function ''process-uploads'' in account 123456789012 was invoked 47 times in rapid succession from an unusual source (CloudWatch Logs show invocation from a new API Gateway stage). Investigation revealed: (1) the Lambda was triggered by S3 events on the ''uploads'' bucket, (2) an attacker uploaded 47 specially crafted files that triggered the Lambda, (3) the Lambda''s code contained a dependency on a compromised npm package (''data-utils@2.1.0'') that included a data exfiltration module, (4) the exfiltration module copied all processed data to an external S3 bucket (attacker-controlled), and (5) the Lambda''s IAM role had s3:GetObject on all buckets in the account. The compromised package was introduced 5 days ago via an automated dependency update bot (Dependabot). Business impact: cloud-hosted data and service availability are at risk, and provider notification
  plus key rotation may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy and cloud counsel should assess notification duties and contractual reporting obligations.'
