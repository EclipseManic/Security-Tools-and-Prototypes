id: serverless_data_exfiltration_-_lambda_cloud_function_abuse
name: Serverless Data Exfiltration - Lambda/Cloud Function Abuse
category: Cloud
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
