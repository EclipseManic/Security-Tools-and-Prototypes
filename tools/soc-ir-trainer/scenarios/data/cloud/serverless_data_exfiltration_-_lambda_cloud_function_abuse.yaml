- id: dependency_analysis_scope_of_npm_compromise
  phase_type: analysis
  title: Dependency Analysis — Scope of npm Compromise
  situation: 'The compromised package ''data-utils@2.1.0'' was introduced by Dependabot 5 days ago. The package has 12,000 weekly downloads. You need to determine: (1) what data the exfiltration module accessed, (2) whether other Lambda functions use this package, and (3) whether the attacker exfiltrated more than just the upload data.'
  prompt: What is your next action?
  guidance:
    what: 'Determine what the evidence says about scope, access, and privilege on Lambda function: process-uploads.'
    action: What is your next action?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Dependency Analysis — Scope of npm Compromise. Asset in scope: Lambda function: process-uploads.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - search lambda
  - lambda functions
  - functions deployments
  - deployments compromised
  - compromised package
  - package version
  - version review
  - review lambda
  reference_answer: |-
    Search all Lambda functions and deployments for the compromised package version, review Lambda environment variables and IAM roles for credential exposure, and analyze the exfiltration module's code to determine what data it targeted

    Why: Comprehensive dependency audit: finding all affected functions determines the full blast radius, checking env vars and IAM roles identifies credential exposure, and analyzing the exfiltration module reveals the attacker's data targets.
  followup_good: 'The exfiltration module targets data processed by the Lambda. The ''uploads'' bucket contains: user profile images, document uploads, and CSV data exports. The Lambda''s IAM role can access all S3 buckets in the account. You need to determine exactly what data was exfiltrated.'
  followup_weak: |-
    Comprehensive dependency audit: finding all affected functions determines the full blast radius, checking env vars and IAM roles identifies credential exposure, and analyzing the exfiltration module reveals the attacker's data targets.

