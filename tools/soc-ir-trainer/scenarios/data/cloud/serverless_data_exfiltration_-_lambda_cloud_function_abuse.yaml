phases:
- id: immediate_containment_stop_active_exfiltration
  phase_type: triage
  title: Immediate Containment — Stop Active Exfiltration
  situation: The Lambda function is actively processing malicious files and exfiltrating data. 47 invocations have occurred, and the function has an overly permissive IAM role that can access all S3 buckets. You need to stop the exfiltration immediately.
  prompt: What is your next action?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Stop Active Exfiltration'': the asset at risk, the evidence available, and the time pressure.'
    action: What is your next action?
    why: 'Every later decision depends on an accurate picture of Lambda function: process-uploads and the accounts involved.'
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Stop Active Exfiltration. Asset in scope: Lambda function: process-uploads.'
  hints:
  - Updating the package addresses the root cause but doesn't stop the current exfiltration.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - lambda function
  - function event
  - event source
  - source mapping
  - mapping revoke
  - revoke iam
  - iam role
  - role permissions
  reference_answer: |-
    Disable the Lambda function's event source mapping, revoke the IAM role's S3 permissions, add a bucket policy blocking writes to the attacker's S3 bucket, and delete the compromised npm package from the Lambda deployment

    Why: Multi-layer containment: disabling the event source stops new invocations, revoking IAM permissions stops data access, bucket policy blocks exfiltration path, and removing the package stops malicious code execution.
  followup_good: 'The compromised package ''data-utils@2.1.0'' was introduced by Dependabot 5 days ago. The package has 12,000 weekly downloads. You need to determine: (1) what data the exfiltration module accessed, (2) whether other Lambda functions use this package, and (3) whether the attacker exfiltrated more than just the upload data.'
  followup_weak: |-
    Multi-layer containment: disabling the event source stops new invocations, revoking IAM permissions stops data access, bucket policy blocks exfiltration path, and removing the package stops malicious code execution.

    The compromised package 'data-utils@2.1.0' was introduced by Dependabot 5 days ago. The package has 12,000 weekly downloads. You need to determine: (1) what data the exfiltration module accessed, (2) whether other Lambda functions use this package, and (3) whether the attacker exfiltrated more than just the upload data.
