- id: supply_chain_and_serverless_hardening
  phase_type: lessons
  title: Supply Chain and Serverless Hardening
  situation: 'The root causes are: (1) compromised npm package via automated dependency updates, (2) overly permissive Lambda IAM role, (3) no dependency pinning or lock file verification, and (4) no runtime monitoring for Lambda data exfiltration. You need to implement a secure serverless architecture.'
  prompt: What is your next action?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What is your next action?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Supply Chain and Serverless Hardening. Asset in scope: Lambda function: process-uploads.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - pin dependencies
  - dependencies integrity
  - integrity hashes
  - hashes implement
  - implement iam
  - iam least-privilege
  - least-privilege lambda
  - lambda roles
  reference_answer: |-
    Pin all dependencies with integrity hashes, implement IAM least-privilege for Lambda roles (per-bucket access), deploy Lambda runtime monitoring (e.g., GuardDuty Lambda Monitoring), and require manual review for dependency updates in production

    Why: Defense-in-depth: dependency pinning prevents supply chain attacks, least-privilege IAM limits blast radius, runtime monitoring detects exfiltration, and manual review catches suspicious updates.
