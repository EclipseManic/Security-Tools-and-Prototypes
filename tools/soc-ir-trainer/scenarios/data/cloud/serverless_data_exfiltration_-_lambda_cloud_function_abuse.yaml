  summary: 'At 19:47 UTC, the Lambda function ''process-uploads'' in account 123456789012 was invoked 47 times in rapid succession from an unusual source (CloudWatch Logs show invocation from a new API Gateway stage). Investigation revealed: (1) the Lambda was triggered by S3 events on the ''uploads'' bucket, (2) an attacker uploaded 47 specially crafted files that triggered the Lambda, (3) the Lambda''s code contained a dependency on a compromised npm package (''data-utils@2.1.0'') that included a data exfiltration module, (4) the exfiltration module copied all processed data to an external S3 bucket (attacker-controlled), and (5) the Lambda''s IAM role had s3:GetObject on all buckets in the account. The compromised package was introduced 5 days ago via an automated dependency update bot (Dependabot).'
