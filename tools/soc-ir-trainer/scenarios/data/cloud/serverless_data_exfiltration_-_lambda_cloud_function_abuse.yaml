- id: data_exposure_assessment_what_was_exfiltrated
  phase_type: eradication
  title: Data Exposure Assessment — What Was Exfiltrated?
  situation: 'The exfiltration module targets data processed by the Lambda. The ''uploads'' bucket contains: user profile images, document uploads, and CSV data exports. The Lambda''s IAM role can access all S3 buckets in the account. You need to determine exactly what data was exfiltrated.'
  prompt: What is your next action?
  guidance:
    what: 'Find every foothold the attacker left on Lambda function: process-uploads, including persistence and stolen credentials.'
    action: What is your next action?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Data Exposure Assessment — What Was Exfiltrated?. Asset in scope: Lambda function: process-uploads.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - analyze cloudtrail
  - cloudtrail logs
  - logs getobject
  - getobject calls
  - lambda iam
  - iam role
  - role invocations
  - invocations cross-reference
  reference_answer: |-
    Analyze CloudTrail logs for all S3 GetObject calls from the Lambda's IAM role during the 47 invocations, cross-reference with the attacker's S3 bucket to confirm what was written, and assess whether any PII or regulated data was included

    Why: CloudTrail provides the most accurate record of what the Lambda accessed. Cross-referencing with the attacker's bucket confirms actual exfiltration. PII assessment determines regulatory requirements.
  followup_good: 'The root causes are: (1) compromised npm package via automated dependency updates, (2) overly permissive Lambda IAM role, (3) no dependency pinning or lock file verification, and (4) no runtime monitoring for Lambda data exfiltration. You need to implement a secure serverless architecture.'
  followup_weak: |-
    CloudTrail provides the most accurate record of what the Lambda accessed.

    The root causes are: (1) compromised npm package via automated dependency updates, (2) overly permissive Lambda IAM role, (3) no dependency pinning or lock file verification, and (4) no runtime monitoring for Lambda data exfiltration. You need to implement a secure serverless architecture.
