briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Kubernetes Pod Escape via Host PID Namespace. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Kubernetes Pod Escape via Host PID Namespace. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Kubernetes Pod Escape via Host PID Namespace. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Kubernetes Pod Escape via Host PID Namespace incident. An attacker who gained access to a developer''s Kubernetes credentials (kubeconfig from ~/.kube/config on WS-DKIM-08, 10.10.10.88, stolen via phishing) deployed a pod with hostPID: true and privileged: true security contexts to the production namespace (where Pod Security Standards were not enforced). The malicious pod (image: nginx:latest, name: debug-pod-7x2) was deployed at 01:45 AM from the stolen kubeconfig. The pod mounted the host filesystem via /proc/1/root and extracted kubelet credentials from /etc/kubernetes/kubelet.conf on worker node worker-03 (10.10.50.13). Using the kubelet''s certificate-based authentication, the attacker queried the Kubernetes API server (10.10.50.1:6443) to list all secrets across 8 namespaces, harvesting database connection strings, TLS certificates, and cloud provider API keys (AWS: AKIAIOSFODNN7EXAMPLE, GCP: service-account-key.json). The attacker used the
  kubelet credentials to schedule persistent pods on all 12 worker nodes (worker-01 through worker-12). The escape was detected when Falco flagged the container''s attempt to access /proc/1/root and subsequent kubelet API calls from a non-whitelisted source IP at 01:52 AM. Business impact: cloud-hosted data and service availability are at risk, and provider notification plus key rotation may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy and cloud counsel should assess notification duties and contractual reporting obligations.'
incident:
  title: Kubernetes Pod Escape via Host PID Namespace
  opening: 'An attacker who gained access to a developer''s Kubernetes credentials (kubeconfig from ~/.kube/config on WS-DKIM-08, 10.10.10.88, stolen via phishing) deployed a pod with hostPID: true and privileged: true security contexts to the production namespace (where Pod Security Standards were not enforced). The malicious pod (image: nginx:latest, name: debug-pod-7x2) was deployed at 01:45 AM from the stolen kubeconfig.'
  summary: 'An attacker who gained access to a developer''s Kubernetes credentials (kubeconfig from ~/.kube/config on WS-DKIM-08, 10.10.10.88, stolen via phishing) deployed a pod with hostPID: true and privileged: true security contexts to the production namespace (where Pod Security Standards were not enforced). The malicious pod (image: nginx:latest, name: debug-pod-7x2) was deployed at 01:45 AM from the stolen kubeconfig. The pod mounted the host filesystem via /proc/1/root and extracted kubelet credentials from /etc/kubernetes/kubelet.conf on worker node worker-03 (10.10.50.13). Using the kubelet''s certificate-based authentication, the attacker queried the Kubernetes API server (10.10.50.1:6443) to list all secrets across 8 namespaces, harvesting database connection strings, TLS certificates, and cloud provider API keys (AWS: AKIAIOSFODNN7EXAMPLE, GCP: service-account-key.json). The attacker used the kubelet credentials to schedule persistent pods on all 12 worker nodes (worker-01 through
    worker-12). The escape was detected when Falco flagged the container''s attempt to access /proc/1/root and subsequent kubelet API calls from a non-whitelisted source IP at 01:52 AM.'
  compromised_assets:
  - Kubernetes worker node worker-03 (10.10.50.13) — kubelet credentials extracted
  - All Kubernetes secrets across 8 namespaces (database passwords, TLS certs)
  - Production database credentials (postgres://admin:****@db-prod:5432)
  - TLS certificates for internal services (*.corp.local)
  - Cloud provider API keys (AWS AKIAIOSFODNN7EXAMPLE, GCP service-account-key.json)
  - All 12 worker nodes (kubelet access from compromised credentials)
  detected_via: Falco container escape alert (/proc/1/root access from nginx:latest container); Kubernetes API access from unknown source IP (10.10.50.13 kubelet credentials used from pod IP); Secret access anomaly across multiple namespaces
  kill_chain:
  - Developer credentials obtained via phishing (kubeconfig stolen)
  - Malicious pod deployed with hostPID and privileged contexts (01:45 AM)
  - Host filesystem accessed via /proc/1/root
  - Kubelet credentials extracted from /etc/kubernetes/kubelet.conf
  - Kubernetes API queried for all secrets across 8 namespaces
  - Persistent pods scheduled on all 12 worker nodes
  mitre_tactics:
  - TA0001 — Initial Access
  - TA0004 — Privilege Escalation
  - TA0006 — Credential Access
  - TA0003 — Persistence
phases:
- id: malicious_pod_deployment
  phase_type: triage
  title: Malicious Pod Deployment
  situation: 'At 01:45 AM, a pod named ''debug-pod-7x2'' was deployed to the production namespace using stolen developer kubeconfig credentials. The pod specification includes hostPID: true and privileged: true security contexts. The deployment originated from IP 10.10.10.88 (WS-DKIM-08). No Pod Security Standards are enforced in the production namespace. The pod is running nginx:latest as a disguise. Falco has flagged the privileged container creation.'
  prompt: How do you respond to the malicious pod deployment?
  guidance:
    what: Establish what fired on Kubernetes worker node worker-03, which accounts are involved, and how urgent the signal is.
    action: How do you respond to the malicious pod deployment?
    why: Every later decision depends on an accurate picture of Kubernetes worker node worker-03 and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Malicious Pod Deployment. Asset in scope: Kubernetes worker node worker-03.'
  hints:
  - Scaling to zero stops the pod's execution but leaves the pod definition in place.
  - Developer notification is useful but does not address the immediate threat.
  ideal_concepts:
  - immediately delete
  - malicious pod
  - pod revoke
  - revoke compromised
  - compromised developer
  - developer kubeconfig
  - kubeconfig rbac
  - rbac permissions
  reference_answer: |-
    Immediately delete the malicious pod, revoke the compromised developer's kubeconfig and RBAC permissions, enforce Pod Security Standards (restricted profile) on the production namespace, and audit all recent pod deployments

    Why: Deleting the pod stops ongoing exploitation. Revoking credentials prevents re-deployment. Pod Security Standards block future privileged pods. Deployment audit identifies any other malicious activity.
  followup_good: 'Forensic analysis shows the container accessed /proc/1/root at 01:48 AM, reading /etc/kubernetes/kubelet.conf from worker-03. The kubelet configuration contains client certificate and key for authenticating to the Kubernetes API server with node-level permissions. The attacker extracted: client-certificate-data (base64 encoded X.509 cert), client-key-data (RSA private key), and the API server endpoint (https://10.10.50.1:6443). The kubelet credentials have permissions to: list/get all pods, create pods on any node, and read all secrets in the kube-system namespace.'
  followup_weak: |-
    Deleting the pod stops ongoing exploitation.

    Forensic analysis shows the container accessed /proc/1/root at 01:48 AM, reading /etc/kubernetes/kubelet.conf from worker-03. The kubelet configuration contains client certificate and key for authenticating to the Kubernetes API server with node-level permissions. The attacker extracted: client-certificate-data (base64 encoded X.509 cert), client-key-data (RSA private key), and the API server endpoint (https://10.10.50.1:6443). The kubelet credentials have permissions to: list/get all pods, create pods on any node, and read all secrets in the kube-system namespace.
  next: host_filesystem_access_kubelet_credential_extraction
  mitre_tactic: TA0001 — Initial Access
  mitre_technique: T1610 — Deploy Container
- id: host_filesystem_access_kubelet_credential_extraction
  phase_type: analysis
  title: Host Filesystem Access & Kubelet Credential Extraction
  situation: 'Forensic analysis shows the container accessed /proc/1/root at 01:48 AM, reading /etc/kubernetes/kubelet.conf from worker-03. The kubelet configuration contains client certificate and key for authenticating to the Kubernetes API server with node-level permissions. The attacker extracted: client-certificate-data (base64 encoded X.509 cert), client-key-data (RSA private key), and the API server endpoint (https://10.10.50.1:6443). The kubelet credentials have permissions to: list/get all pods, create pods on any node, and read all secrets in the kube-system namespace.'
  prompt: How do you respond to the kubelet credential extraction?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on Kubernetes worker node worker-03.
    action: How do you respond to the kubelet credential extraction?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Host Filesystem Access & Kubelet Credential Extraction. Asset in scope: Kubernetes worker node worker-03.'
  hints:
  - Revoking the developer's kubeconfig does not address the stolen kubelet credentials.
  - RBAC hardening and secret encryption are excellent long-term measures but do not immediately address the compromised kubelet certificates that are actively being used.
  - Service mesh encryption protects data in transit between pods but does not prevent credential extraction from node filesystems or unauthorized API server access.
  ideal_concepts:
  - kubelet certificates
  - certificates immediately
  - immediately implement
  - implement falco
  - falco rules
  - rules detect
  - detect proc
  - proc root
  reference_answer: |-
    Rotate all kubelet certificates immediately, implement Falco rules to detect /proc/1/root access from containers, enable Node Restriction admission controller to limit kubelet API permissions, and deploy network policies blocking pod-to-API-server traffic

    Why: Certificate rotation invalidates the stolen credentials. Falco rules detect future escape attempts. Node Restriction limits kubelet permissions. Network policies add a defense layer.
  followup_good: 'The attacker used the extracted kubelet credentials to query the Kubernetes API server and enumerate all secrets across 8 namespaces (default, production, staging, monitoring, logging, kube-system, cert-manager, ingress). Secrets harvested include: prod-db-credentials (postgres://admin:P@ssw0rd123!@db-prod:5432), tls-wildcard-cert (*.corp.local), aws-credentials (AKIAIOSFODNN7EXAMPLE), gcp-service-account (service-account-key.json), and redis-password. Total: 47 secrets across 8 namespaces. The attacker stored the harvested secrets in an environment variable within the malicious pod for later exfiltration.'
  followup_weak: |-
    Certificate rotation invalidates the stolen credentials.

    The attacker used the extracted kubelet credentials to query the Kubernetes API server and enumerate all secrets across 8 namespaces (default, production, staging, monitoring, logging, kube-system, cert-manager, ingress). Secrets harvested include: prod-db-credentials (postgres://admin:P@ssw0rd123!@db-prod:5432), tls-wildcard-cert (*.corp.local), aws-credentials (AKIAIOSFODNN7EXAMPLE), gcp-service-account (service-account-key.json), and redis-password. Total: 47 secrets across 8 namespaces. The attacker stored the harvested secrets in an environment variable within the malicious pod for later exfiltration.
  next: secret_harvesting_across_namespaces
  mitre_tactic: TA0004 — Privilege Escalation
  mitre_technique: T1611 — Escape to Host
- id: secret_harvesting_across_namespaces
  phase_type: eradication
  title: Secret Harvesting Across Namespaces
  situation: 'The attacker used the extracted kubelet credentials to query the Kubernetes API server and enumerate all secrets across 8 namespaces (default, production, staging, monitoring, logging, kube-system, cert-manager, ingress). Secrets harvested include: prod-db-credentials (postgres://admin:P@ssw0rd123!@db-prod:5432), tls-wildcard-cert (*.corp.local), aws-credentials (AKIAIOSFODNN7EXAMPLE), gcp-service-account (service-account-key.json), and redis-password. Total: 47 secrets across 8 namespaces. The attacker stored the harvested secrets in an environment variable within the malicious pod for later exfiltration.'
  prompt: How do you respond to the cross-namespace secret harvesting?
  guidance:
    what: Find every foothold the attacker left on Kubernetes worker node worker-03, including persistence and stolen credentials.
    action: How do you respond to the cross-namespace secret harvesting?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Secret Harvesting Across Namespaces. Asset in scope: Kubernetes worker node worker-03.'
  hints:
  - External secrets management is a strong long-term solution but requires significant infrastructure changes.
  - Encryption at rest protects against physical disk access but does not address the already-extracted secrets that the attacker holds in memory.
  ideal_concepts:
  - immediately rotate
  - harvested credentials
  - credentials database
  - database passwords
  - passwords api
  - api keys
  - keys tls
  - tls certificates
  reference_answer: |-
    Immediately rotate all harvested credentials (database passwords, API keys, TLS certificates), implement Kubernetes NetworkPolicies to restrict pod-to-API-server communication, enable secret encryption at rest using KMS, and deploy RBAC rules limiting kubelet access to secrets only in their own namespace

    Why: Credential rotation invalidates all stolen secrets. Network policies prevent future unauthorized API access. KMS encryption protects secrets at rest. Namespace-scoped RBAC limits blast radius.
  followup_good: 'The attacker used the kubelet credentials to schedule persistent DaemonSet pods on all 12 worker nodes. The DaemonSet (name: kube-proxy-update, namespace: kube-system) runs a container image that appears legitimate but contains a reverse shell to 198.51.100.89:8443. The DaemonSet is configured with a toleration for the node-role.kubernetes.io/control-plane taint, ensuring it runs on all nodes including the control plane. Pods have been confirmed running on worker-01 through worker-12. The attacker has achieved persistent cluster-wide access that survives individual pod deletions.'
  followup_weak: |-
    Credential rotation invalidates all stolen secrets.

    The attacker used the kubelet credentials to schedule persistent DaemonSet pods on all 12 worker nodes. The DaemonSet (name: kube-proxy-update, namespace: kube-system) runs a container image that appears legitimate but contains a reverse shell to 198.51.100.89:8443. The DaemonSet is configured with a toleration for the node-role.kubernetes.io/control-plane taint, ensuring it runs on all nodes including the control plane. Pods have been confirmed running on worker-01 through worker-12. The attacker has achieved persistent cluster-wide access that survives individual pod deletions.
