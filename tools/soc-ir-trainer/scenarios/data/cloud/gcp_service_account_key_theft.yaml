id: gcp_service_account_key_theft
name: GCP Service Account Key Theft
category: Cloud
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to GCP Service Account Key Exfiltration. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for GCP Service Account Key Exfiltration. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for GCP Service Account Key Exfiltration. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the GCP Service Account Key Exfiltration incident. At 11:47 UTC, the GCP Security Command Center flagged an unusual API call: the service account sa-data-pipeline@proj-prod-384719.iam gserviceaccount.com called storage.objects.list on a bucket it had never accessed before. Investigation revealed the service account key was stored in a GitHub repository (private, but with 3 external collaborators). The key was committed 6 months ago in a file named ''config.json'' and was never rotated. GitHub''s secret scanning alert had been dismissed as a false positive by a developer. The attacker used the key to: (1) list all GCS buckets in the project, (2) download 2.3 GB of data from prod-analytics, and (3) create a new service account with Owner role (sa-backdoor@...). The key is still active and the attacker appears to be operating in the GCP project. Business impact: cloud-hosted data and service availability are at risk, and provider notification plus key
  rotation may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy and cloud counsel should assess notification duties and contractual reporting obligations.'
incident:
  title: GCP Service Account Key Exfiltration
  opening: 'At 11:47 UTC, the GCP Security Command Center flagged an unusual API call: the service account sa-data-pipeline@proj-prod-384719.iam gserviceaccount.com called storage.objects.list on a bucket it had never accessed before. Investigation revealed the service account key was stored in a GitHub repository (private, but with 3 external collaborators).'
  summary: 'At 11:47 UTC, the GCP Security Command Center flagged an unusual API call: the service account sa-data-pipeline@proj-prod-384719.iam gserviceaccount.com called storage.objects.list on a bucket it had never accessed before. Investigation revealed the service account key was stored in a GitHub repository (private, but with 3 external collaborators). The key was committed 6 months ago in a file named ''config.json'' and was never rotated. GitHub''s secret scanning alert had been dismissed as a false positive by a developer. The attacker used the key to: (1) list all GCS buckets in the project, (2) download 2.3 GB of data from prod-analytics, and (3) create a new service account with Owner role (sa-backdoor@...). The key is still active and the attacker appears to be operating in the GCP project.'
  compromised_assets:
  - 'Service account: sa-data-pipeline (GCP project prod-384719)'
  - 'GitHub repository: contoso/ml-pipeline (private, 3 external collabs)'
  - 'GCS bucket: prod-analytics (2.3 GB downloaded)'
  - 'New service account: sa-backdoor (Owner role)'
  detected_via: GCP Security Command Center — anomalous API call alert
  kill_chain:
  - Initial Access (Credential from GitHub)
  - Collection (GCS bucket listing + download)
  - Privilege Escalation (New SA with Owner)
  - Lateral Movement (New SA created)
  mitre_tactics:
  - Initial Access
  - Collection
  - Privilege Escalation
  - Lateral Movement
phases:
- id: credential_containment_revoke_compromised_keys
  phase_type: triage
  title: Credential Containment — Revoke Compromised Keys
  situation: The attacker has an active service account key and has created a backdoor service account with Owner role. You need to revoke access immediately while preserving forensic evidence.
  prompt: What is your next action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on Service account: sa-data-pipeline, its severity, and the affected accounts.'
    action: What is your next action?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Credential Containment — Revoke Compromised Keys. Asset in scope: Service account: sa-data-pipeline.'
  hints:
  - The backdoor SA with Owner role gives the attacker full project access even without the original key.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - compromised service
  - service account
  - account key
  - key disable
  - account delete
  - backdoor service
  - account remove
  - owner iam
  reference_answer: |-
    Delete the compromised service account key, disable the service account, delete the backdoor service account, and remove its Owner IAM binding

    Why: Complete credential revocation: deleting the key stops key-based access, disabling the SA stops all access, and removing the backdoor eliminates persistence. All should be done in sequence.
  followup_good: The attacker accessed the prod-analytics GCS bucket and downloaded 2.3 GB. The bucket contains daily aggregated customer analytics including user IDs, session counts, feature usage metrics, and revenue attribution data. You need to determine the full scope of data exposure.
  followup_weak: |-
    Complete credential revocation: deleting the key stops key-based access, disabling the SA stops all access, and removing the backdoor eliminates persistence.

    The attacker accessed the prod-analytics GCS bucket and downloaded 2.3 GB. The bucket contains daily aggregated customer analytics including user IDs, session counts, feature usage metrics, and revenue attribution data. You need to determine the full scope of data exposure.
  next: data_exposure_assessment_what_was_stolen
  mitre_tactic: Credential Access
  mitre_technique: T1552.004 — Private Keys (stored in repo)
- id: data_exposure_assessment_what_was_stolen
  phase_type: analysis
  title: Data Exposure Assessment — What Was Stolen?
  situation: The attacker accessed the prod-analytics GCS bucket and downloaded 2.3 GB. The bucket contains daily aggregated customer analytics including user IDs, session counts, feature usage metrics, and revenue attribution data. You need to determine the full scope of data exposure.
  prompt: What is your next action?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: What is your next action?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Data Exposure Assessment — What Was Stolen?. Asset in scope: Service account: sa-data-pipeline.'
  hints:
  - Premature notification without confirmed exposure is wasteful.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - review gcs
  - gcs access
  - access logs
  - logs enumerate
  - enumerate objects
  - objects downloaded
  - downloaded cross-reference
  - cross-reference data
  reference_answer: |-
    Review GCS access logs to enumerate all objects downloaded, cross-reference with data classification tags, and assess whether the data contains PII or regulated information

    Why: Object-level access logs provide precise visibility into what was exfiltrated. Cross-referencing with classification tags ensures regulatory compliance requirements are identified.
  followup_good: The service account key was committed to a private GitHub repo 6 months ago. Three external collaborators had access. GitHub's secret scanning flagged it but a developer dismissed the alert. The key is still in the repo's git history. You need to remediate the GitHub exposure and prevent recurrence.
  followup_weak: |-
    Object-level access logs provide precise visibility into what was exfiltrated.

    The service account key was committed to a private GitHub repo 6 months ago. Three external collaborators had access. GitHub's secret scanning flagged it but a developer dismissed the alert. The key is still in the repo's git history. You need to remediate the GitHub exposure and prevent recurrence.
  next: github_remediation_secret_exposure
  mitre_tactic: Collection
  mitre_technique: T1530 — Data from Cloud Storage
- id: github_remediation_secret_exposure
  phase_type: eradication
  title: GitHub Remediation — Secret Exposure
  situation: The service account key was committed to a private GitHub repo 6 months ago. Three external collaborators had access. GitHub's secret scanning flagged it but a developer dismissed the alert. The key is still in the repo's git history. You need to remediate the GitHub exposure and prevent recurrence.
  prompt: What is your next action?
  guidance:
    what: 'Find every foothold the attacker left on Service account: sa-data-pipeline, including persistence and stolen credentials.'
    action: What is your next action?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: GitHub Remediation — Secret Exposure. Asset in scope: Service account: sa-data-pipeline.'
  hints:
  - Removing collaborators stops future access but doesn't address the key already in git history.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - key repo
  - repo git-filter-repo
  - git-filter-repo purge
  - purge history
  - history revoke
  - revoke compromised
  - compromised key
  - key enable
  reference_answer: |-
    Remove the key from the repo, use git-filter-repo to purge from history, revoke the compromised key, enable GitHub secret scanning with mandatory review, and audit all external collaborator access

    Why: Complete remediation: removing from current + history prevents rediscovery, revoking the key stops use, secret scanning prevents future commits, and auditing external access closes the exposure path.
  followup_good: The root cause is a long-lived service account key committed to source code. You need to implement an architecture that prevents this class of vulnerability. The data pipeline runs on GKE clusters in the same GCP project.
  followup_weak: |-
    Complete remediation: removing from current + history prevents rediscovery, revoking the key stops use, secret scanning prevents future commits, and auditing external access closes the exposure path.

    The root cause is a long-lived service account key committed to source code. You need to implement an architecture that prevents this class of vulnerability. The data pipeline runs on GKE clusters in the same GCP project.
  next: architectural_fix_eliminate_long_lived_keys
  mitre_tactic: Initial Access
  mitre_technique: T1552.004 — Private Keys, T1195.002 — Supply Chain Compromise
- id: architectural_fix_eliminate_long_lived_keys
  phase_type: eradication
  title: Architectural Fix — Eliminate Long-Lived Keys
  situation: The root cause is a long-lived service account key committed to source code. You need to implement an architecture that prevents this class of vulnerability. The data pipeline runs on GKE clusters in the same GCP project.
  prompt: What is your next action?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: What is your next action?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Architectural Fix — Eliminate Long-Lived Keys. Asset in scope: Service account: sa-data-pipeline.'
  hints:
  - Rotated long-lived keys are still vulnerable to theft.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - migrate workload
  - workload identity
  - identity federation
  - federation short-lived
  - short-lived tokens
  - tokens keys
  - keys enforce
  - enforce gcp
  reference_answer: |-
    Migrate to Workload Identity Federation (short-lived tokens, no keys), enforce GCP IAM Conditions for time-bound access, deploy OPA/Gatekeeper policies to block SA key creation, and enable audit logging with export to SIEM

    Why: Workload Identity eliminates long-lived keys entirely. IAM Conditions add time-bound constraints, OPA policies prevent key creation, and audit logging ensures visibility.
