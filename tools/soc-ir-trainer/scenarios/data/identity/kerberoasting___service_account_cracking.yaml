  summary: 'An attacker with a standard domain user account (svc_monitor@corp.local, compromised via credential stuffing) requested Kerberos service tickets (TGS) for all service accounts with SPNs registered in Active Directory. Using Rubeus (ru.exe ccache /export /outfile:tgs_tickets.kirbi), the attacker extracted 47 TGS tickets encrypted with the service accounts'' NTLM hashes within a 5-minute window (03:45 AM - 03:50 AM on March 12). The tickets were then cracked offline using Hashcat (hashcat -m 13100 tgs_tickets.kirbi rockyou.txt -r rules/best64.rule --force) with GPU acceleration (4x NVIDIA RTX 4090). Within 72 hours, 23 of 47 service account passwords were cracked, including the SQL service account svc_sql_prod (password: Summer2024!) with Domain Admin privileges due to improper group membership (added to Domain Admins on January 15). The attacker used svc_sql_prod to access all production SQL databases (DB-PROD-01 at 10.10.30.22), exfiltrate customer financial data (12.8 GB to
    198.51.100.91), and establish persistence via SQL Agent jobs (Job: ''SystemMaintenance'', Schedule: every 4 hours).'
  compromised_assets:
  - 47 service account TGS tickets extracted (Rubeus ccache export)
  - 23 service account passwords cracked (Hashcat, 72 hours)
  - 'svc_sql_prod (password: Summer2024!) — Domain Admin privileges'
  - DB-PROD-01 (10.10.30.22) — All production SQL databases accessed
  - Customer financial data (12.8 GB exfiltrated to 198.51.100.91)
  - SQL Agent job 'SystemMaintenance' (persistence, runs every 4 hours)
  detected_via: Bulk TGS request anomaly (47 TGS requests from single user in 5-minute window); unusual service account usage patterns (svc_sql_prod logging in from non-DB server); network exfiltration alert (12.8 GB outbound to 198.51.100.91)
  kill_chain:
  - Standard domain user account obtained (svc_monitor, credential stuffing)
  - Bulk TGS requests for SPNs collected (Rubeus, 47 tickets in 5 minutes)
  - Offline brute-force cracking of service tickets (Hashcat, 4x RTX 4090)
  - svc_sql_prod password cracked (Summer2024!, Domain Admin privileges)
  - SQL database access via cracked service account (DB-PROD-01)
  - Customer financial data exfiltration (12.8 GB to 198.51.100.91)
  - SQL Agent job persistence established (SystemMaintenance, every 4 hours)
