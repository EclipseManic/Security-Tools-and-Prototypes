phases:
- id: bulk_tgs_collection
  phase_type: triage
  title: Bulk TGS Collection
  situation: Security monitoring has detected that the account svc_monitor (standard domain user, SID S-1-5-21-1234567890-1234567890-1234567890-11045) requested TGS tickets for 47 SPNs within a 5-minute window at 03:45 AM on March 12. This is anomalous compared to normal service ticket requests (average 3 per hour). The 47 SPNs include service accounts for SQL, Exchange, IIS, backup, monitoring, and other infrastructure services. Rubeus tool artifacts (ru.exe) have been identified on the workstation WS-MONITOR-03 (10.10.10.33) where the svc_monitor account was authenticated.
  prompt: How do you respond to the Kerberoasting activity?
  guidance:
    what: 'Separate signal from noise: confirm the alert on 47 service account TGS tickets extracted, its severity, and the affected accounts.'
    action: How do you respond to the Kerberoasting activity?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Bulk TGS Collection. Asset in scope: 47 service account TGS tickets extracted.'
  hints:
  - Monitoring alone does not address the 47 tickets already extracted.
  - Honeypots are useful for detection but do not address the currently cracked credentials.
  - SPN cleanup is a valid long-term measure but does not address the immediate threat of 23 cracked service account passwords.
  ideal_concepts:
  - immediately disable
  - svc monitor
  - monitor account
  - account quarantine
  - quarantine ws-monitor-03
  - ws-monitor-03 implement
  - implement group
  - group managed
  reference_answer: |-
    Immediately disable the svc_monitor account, quarantine WS-MONITOR-03, implement group Managed Service Accounts (gMSAs) for all high-privilege service accounts, enforce 25+ character complex passwords for all remaining SPN accounts, and enable Kerberos AES-only encryption to prevent RC4 ticket cracking

    Why: Disabling the compromised account stops ongoing ticket requests. gMSAs use auto-rotated 240-character passwords that are uncrackable. Strong passwords resist offline cracking. AES-only encryption makes RC4-based cracking ineffective.
  followup_good: 'Investigation has confirmed that the attacker used Hashcat (hashcat -m 13100) with 4x NVIDIA RTX 4090 GPUs to crack the extracted TGS tickets. Within 72 hours, 23 of 47 service account passwords were cracked using the rockyou.txt wordlist with best64.rule modifications. The cracked accounts include: svc_sql_prod (Summer2024!, Domain Admin), svc_backup (Backup2024!, local admin on backup servers), svc_exchange (Exchange2024!, Exchange admin), svc_iis (IIS2024!, web server admin), and 19 others with varying privilege levels. Password complexity was insufficient to resist dictionary-based attacks. The attacker''s Hashcat session logs show an average cracking speed of 420 billion NTLM hashes/second across the 4x RTX 4090 cluster.'
  followup_weak: |-
    Disabling the compromised account stops ongoing ticket requests.

    Investigation has confirmed that the attacker used Hashcat (hashcat -m 13100) with 4x NVIDIA RTX 4090 GPUs to crack the extracted TGS tickets. Within 72 hours, 23 of 47 service account passwords were cracked using the rockyou.txt wordlist with best64.rule modifications. The cracked accounts include: svc_sql_prod (Summer2024!, Domain Admin), svc_backup (Backup2024!, local admin on backup servers), svc_exchange (Exchange2024!, Exchange admin), svc_iis (IIS2024!, web server admin), and 19 others with varying privilege levels. Password complexity was insufficient to resist dictionary-based attacks. The attacker's Hashcat session logs show an average cracking speed of 420 billion NTLM hashes/second across the 4x RTX 4090 cluster.
