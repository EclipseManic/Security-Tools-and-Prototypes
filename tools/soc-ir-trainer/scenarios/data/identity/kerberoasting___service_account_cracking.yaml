- id: offline_password_cracking
  phase_type: containment
  title: Offline Password Cracking
  situation: 'Investigation has confirmed that the attacker used Hashcat (hashcat -m 13100) with 4x NVIDIA RTX 4090 GPUs to crack the extracted TGS tickets. Within 72 hours, 23 of 47 service account passwords were cracked using the rockyou.txt wordlist with best64.rule modifications. The cracked accounts include: svc_sql_prod (Summer2024!, Domain Admin), svc_backup (Backup2024!, local admin on backup servers), svc_exchange (Exchange2024!, Exchange admin), svc_iis (IIS2024!, web server admin), and 19 others with varying privilege levels. Password complexity was insufficient to resist dictionary-based attacks. The attacker''s Hashcat session logs show an average cracking speed of 420 billion NTLM hashes/second across the 4x RTX 4090 cluster.'
  prompt: How do you address the offline credential cracking?
  guidance:
    what: Decide how to stop the spread from 47 service account TGS tickets extracted while preserving the evidence trail.
    action: How do you address the offline credential cracking?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Offline Password Cracking. Asset in scope: 47 service account TGS tickets extracted.'
  hints:
  - Account lockout protects against online brute-force but does not address the offline cracking that has already occurred.
  - Proactive auditing is valuable for preventing future issues but does not address the current compromise.
  ideal_concepts:
  - cracked service
  - service account
  - account passwords
  - passwords character
  - character randomly
  - randomly generated
  - generated values
  - values implement
  reference_answer: |-
    Reset all 23 cracked service account passwords to 30+ character randomly generated values, implement gMSAs for all service accounts, enforce password complexity policy requiring 20+ characters for privileged accounts, and audit all service account group memberships to remove unnecessary Domain Admin assignments

    Why: Password reset invalidates the cracked credentials. gMSAs eliminate static passwords entirely. Complex passwords resist future cracking. Group membership audit removes privilege creep.
  followup_good: 'The attacker used the cracked svc_sql_prod credentials (password: Summer2024!, Domain Admin group member since January 15) to access DB-PROD-01 (10.10.30.22, SQL Server 2019) at 04:15 AM on March 15. The attacker executed bulk SELECT queries against customer financial tables, exporting 12.8 GB of data to CSV files and exfiltrating them to 198.51.100.91 via SMB. The attacker also created a SQL Agent job ''SystemMaintenance'' that executes a PowerShell download cradle every 4 hours, establishing a persistent C2 channel. The svc_sql_prod account has sysadmin privileges on all 5 production SQL instances.'
  followup_weak: |-
    Password reset invalidates the cracked credentials.

    The attacker used the cracked svc_sql_prod credentials (password: Summer2024!, Domain Admin group member since January 15) to access DB-PROD-01 (10.10.30.22, SQL Server 2019) at 04:15 AM on March 15. The attacker executed bulk SELECT queries against customer financial tables, exporting 12.8 GB of data to CSV files and exfiltrating them to 198.51.100.91 via SMB. The attacker also created a SQL Agent job 'SystemMaintenance' that executes a PowerShell download cradle every 4 hours, establishing a persistent C2 channel. The svc_sql_prod account has sysadmin privileges on all 5 production SQL instances.
