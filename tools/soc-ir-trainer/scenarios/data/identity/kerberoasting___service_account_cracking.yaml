briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Kerberoasting Attack Cracks Service Account Passwords. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Kerberoasting Attack Cracks Service Account Passwords. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Kerberoasting Attack Cracks Service Account Passwords. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Kerberoasting Attack Cracks Service Account Passwords incident. An attacker with a standard domain user account (svc_monitor@corp.local, compromised via credential stuffing) requested Kerberos service tickets (TGS) for all service accounts with SPNs registered in Active Directory. Using Rubeus (ru.exe ccache /export /outfile:tgs_tickets.kirbi), the attacker extracted 47 TGS tickets encrypted with the service accounts'' NTLM hashes within a 5-minute window (03:45 AM - 03:50 AM on March 12). The tickets were then cracked offline using Hashcat (hashcat -m 13100 tgs_tickets.kirbi rockyou.txt -r rules/best64.rule --force) with GPU acceleration (4x NVIDIA RTX 4090). Within 72 hours, 23 of 47 service account passwords were cracked, including the SQL service account svc_sql_prod (password: Summer2024!) with Domain Admin privileges due to improper group membership (added to Domain Admins on January 15). The attacker used svc_sql_prod to access all production
  SQL databases (DB-PROD-01 at 10.10.30.22), exfiltrate customer financial data (12.8 GB to 198.51.100.91), and establish persistence via SQL Agent jobs (Job: ''SystemMaintenance'', Schedule: every 4 hours). Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
