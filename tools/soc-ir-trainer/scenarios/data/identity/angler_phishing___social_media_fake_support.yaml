id: angler_phishing___social_media_fake_support
name: Angler Phishing — Social Media Fake Support
category: Identity & Access
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Angler Phishing — Fake Customer Support via Social Media Impersonation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Angler Phishing — Fake Customer Support via Social Media Impersonation. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Angler Phishing — Fake Customer Support via Social Media Impersonation. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Angler Phishing — Fake Customer Support via Social Media Impersonation incident. At 13:00 on Tuesday, customer Emily Watson posted on X (Twitter): ''@AcmeCorp your product is broken and I can''t login to my account #fail''. Within 5 minutes, an account @AcmeCorpSupport (with a verified-looking checkmark purchased through X Premium) replied: ''We''re sorry for the trouble, Emily! Please DM us your login details so we can fix this immediately.'' Emily DM''d her email and password. The attacker used these credentials to access Emily''s account on acmecorp.com, which contained her saved payment methods, order history, and personal address. The attacker made 3 purchases totaling $2,400 using Emily''s saved credit card. The real Acme Corp social media team noticed the fake account when they reviewed their brand mentions at 15:00. The fake account had responded to 8 other customer complaints in the same manner. 3 of the 8 customers also DM''d their credentials.
  Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
