- id: customer_education_phase_4
  phase_type: lessons
  title: Customer Education — Phase 4
  situation: 4 customers DM'd their login credentials to a stranger on social media. This represents a fundamental gap in customer security awareness. The customers trusted a verified-looking account without verifying it was official.
  prompt: How do you educate customers about social media phishing?
  guidance:
    what: Summarize what happened, what was missed, and which controls failed on Emily Watson's Acme Corp account.
    action: How do you educate customers about social media phishing?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Customer Education — Phase 4. Asset in scope: Emily Watson''s Acme Corp account.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - security advisory
  - advisory customers
  - customers explaining
  - explaining official
  - official support
  - support never
  - never ask
  - passwords verify
  reference_answer: |-
    Send a security advisory to all customers explaining: (1) official support will never ask for passwords, (2) how to verify official accounts, (3) to use the official support portal instead of social media DMs; add security tips to the login page and account settings

    Why: Multi-channel education (email, portal, settings) reaches customers where they are.
