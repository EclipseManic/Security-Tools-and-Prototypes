phases:
- id: fake_account_takedown_phase_1
  phase_type: triage
  title: Fake Account Takedown — Phase 1
  situation: The fake @AcmeCorpSupport account has responded to 8 customer complaints and obtained credentials from at least 4 customers. The account is still active and may be receiving more DMs.
  prompt: What is your FIRST priority action?
  guidance:
    what: Establish what fired on Emily Watson's Acme Corp account, which accounts are involved, and how urgent the signal is.
    action: What is your FIRST priority action?
    why: Every later decision depends on an accurate picture of Emily Watson's Acme Corp account and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Fake Account Takedown — Phase 1. Asset in scope: Emily Watson''s Acme Corp account.'
  hints:
  - Helpful but the attacker may delete the account.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - report fake
  - fake account
  - account impersonation
  - impersonation priority
  - priority report
  - report post
  - post public
  - public warning
  reference_answer: |-
    Report the fake account to X for impersonation (priority report); post a public warning on the real Acme Corp account about the fake support account; contact all 8 customers who were replied to — warn them and advise credential changes; request X to preserve DM records for investigation

    Why: Takedown, warn customers, and preserve evidence simultaneously. Public warning prevents further victimization.
  followup_good: Emily Watson and 3 other customers DM'd their credentials to the fake account. Emily's account has been accessed and $2,400 in fraudulent purchases were made. The attacker may have also accessed the other 3 customers' accounts.
  followup_weak: |-
    Takedown, warn customers, and preserve evidence simultaneously.

    Emily Watson and 3 other customers DM'd their credentials to the fake account. Emily's account has been accessed and $2,400 in fraudulent purchases were made. The attacker may have also accessed the other 3 customers' accounts.
  next: customer_credential_impact_phase_2
  mitre_tactic: Impact
  mitre_technique: T1565 Data Manipulation
- id: customer_credential_impact_phase_2
  phase_type: analysis
  title: Customer Credential Impact — Phase 2
  situation: Emily Watson and 3 other customers DM'd their credentials to the fake account. Emily's account has been accessed and $2,400 in fraudulent purchases were made. The attacker may have also accessed the other 3 customers' accounts.
  prompt: How do you handle the customer credential compromise?
  guidance:
    what: Test the initial theory against telemetry from Emily Watson's Acme Corp account before committing to a response.
    action: How do you handle the customer credential compromise?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Customer Credential Impact — Phase 2. Asset in scope: Emily Watson''s Acme Corp account.'
  hints:
  - Helpful but the company should proactively initiate refunds and secure the accounts.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - password reset
  - affected customers
  - customers review
  - review account
  - account activity
  - activity unauthorized
  - unauthorized purchases
  - purchases initiate
  reference_answer: |-
    Force password reset for all 4 affected customers; review account activity for unauthorized purchases; initiate refunds for fraudulent transactions; enhance monitoring on these accounts; implement rate limiting on login attempts

    Why: Password reset, fraud reversal, and monitoring protect customers and reduce liability.
  followup_good: The fake account used X Premium to get a verified-looking checkmark, making it appear legitimate. X's verification system was exploited to lend credibility to the impersonation. The fake account name was 'Acme Corp Support' (with slight spacing difference from the real 'AcmeCorp Support').
  followup_weak: |-
    Password reset, fraud reversal, and monitoring protect customers and reduce liability.

    The fake account used X Premium to get a verified-looking checkmark, making it appear legitimate. X's verification system was exploited to lend credibility to the impersonation. The fake account name was 'Acme Corp Support' (with slight spacing difference from the real 'AcmeCorp Support').
  next: social_media_brand_protection_phase_3
  mitre_tactic: Credential Access
  mitre_technique: T1539 Steal Web Session Cookie
- id: social_media_brand_protection_phase_3
  phase_type: eradication
  title: Social Media Brand Protection — Phase 3
  situation: The fake account used X Premium to get a verified-looking checkmark, making it appear legitimate. X's verification system was exploited to lend credibility to the impersonation. The fake account name was 'Acme Corp Support' (with slight spacing difference from the real 'AcmeCorp Support').
  prompt: How do you protect your brand from social media impersonation?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you protect your brand from social media impersonation?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Social Media Brand Protection — Phase 3. Asset in scope: Emily Watson''s Acme Corp account.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - register brand
  - brand name
  - name across
  - across major
  - major social
  - social platforms
  - platforms even
  - even inactive
  reference_answer: |-
    Register your brand name across all major social platforms (even if inactive); set up social media monitoring for brand mentions and impersonation; establish an official support channel policy (e.g., 'we will NEVER ask for passwords via DM'); apply for trademark verification badges on social platforms

    Why: Proactive brand registration, monitoring, and clear communication policies prevent impersonation.
  followup_good: 4 customers DM'd their login credentials to a stranger on social media. This represents a fundamental gap in customer security awareness. The customers trusted a verified-looking account without verifying it was official.
  followup_weak: |-
    Proactive brand registration, monitoring, and clear communication policies prevent impersonation.

    4 customers DM'd their login credentials to a stranger on social media. This represents a fundamental gap in customer security awareness. The customers trusted a verified-looking account without verifying it was official.
