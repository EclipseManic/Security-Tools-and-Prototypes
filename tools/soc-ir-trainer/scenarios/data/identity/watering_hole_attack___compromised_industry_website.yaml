  summary: At 08:00 on Tuesday, the SOC noticed an unusual Chrome zero-day exploit (CVE-2024-XXXX, renderer RCE) had been delivered to 4 employees who visited 'energytechnews.com' — a widely-read industry news site. The site was compromised 3 days ago and injected with a JavaScript iframe that served the exploit only to visitors running Chrome on Windows (fingerprinting by User-Agent and navigator.platform). Of the 4 affected employees, 3 received only the failed exploit attempt (Chrome patched in their version), but 1 employee — James Rivera in the SCADA Engineering team — was running Chrome 123.0.6312.x (an unpatched version) and was fully compromised. The exploit delivered a fileless PowerShell loader that injected a Cobalt Strike beacon into memory. The beacon has been active for 18 hours before detection. James Rivera has VPN access to the OT/SCADA network segment.
