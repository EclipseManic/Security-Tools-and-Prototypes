- id: browser_hardening_phase_4
  phase_type: eradication
  title: Browser Hardening — Phase 4
  situation: The exploit specifically targeted unpatched Chrome. James was running Chrome 123 instead of the latest 125.x. Chrome's auto-update was apparently disabled or blocked by a proxy. The 3 other employees were patched and survived the exploit attempt.
  prompt: What browser security improvements do you implement?
  guidance:
    what: Find every foothold the attacker left on James Rivera's workstation, including persistence and stolen credentials.
    action: What browser security improvements do you implement?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Browser Hardening — Phase 4. Asset in scope: James Rivera''s workstation.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - chrome auto-update
  - auto-update verify
  - verify blocked
  - blocked proxy
  - proxy deploy
  - deploy chrome
  - chrome enterprise
  - enterprise policies
  reference_answer: |-
    1) Enable Chrome auto-update and verify it's not blocked by proxy. 2) Deploy Chrome enterprise policies (block outdated versions). 3) Enable Chrome's site isolation and sandboxing. 4) Deploy ad-blocker/JS-blocker to prevent drive-by iframes.

    Why: Defense in depth: update enforcement, enterprise policy, sandboxing, and content blocking.
  followup_good: The C2 IP (45.33.98.xx) has been blocked. However, the attacker used a Cobalt Strike team server that may have been used against other organizations. VirusTotal shows the beacon hash was first seen 6 days ago and has been submitted by 3 other companies in the energy sector.
  followup_weak: |-
    Defense in depth: update enforcement, enterprise policy, sandboxing, and content blocking.

    The C2 IP (45.33.98.xx) has been blocked. However, the attacker used a Cobalt Strike team server that may have been used against other organizations. VirusTotal shows the beacon hash was first seen 6 days ago and has been submitted by 3 other companies in the energy sector.
