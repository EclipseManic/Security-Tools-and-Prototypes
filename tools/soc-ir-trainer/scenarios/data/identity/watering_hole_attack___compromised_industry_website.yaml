- id: industry_wide_notification_phase_3
  phase_type: containment
  title: Industry-Wide Notification — Phase 3
  situation: energytechnews.com is a widely-read industry portal serving the energy sector. The exploit was targeted (Chrome on Windows only). Your organization is not the only visitor — other energy companies likely visited the site during the 3-day compromise window. The site owner has been notified and taken the site offline.
  prompt: How do you handle industry-wide notification?
  guidance:
    what: Decide how to stop the spread from James Rivera's workstation while preserving the evidence trail.
    action: How do you handle industry-wide notification?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Industry-Wide Notification — Phase 3. Asset in scope: James Rivera''s workstation.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - share iocs
  - iocs exploit
  - exploit url
  - url beacon
  - beacon hash
  - hash sector
  - sector isac
  - isac information
  reference_answer: |-
    Share IOCs (exploit URL, C2 IP, beacon hash) with the sector's ISAC (Information Sharing and Analysis Center); notify CISA; publish a joint advisory with the site owner about the compromise window

    Why: Watering hole attacks affect multiple organizations. ISAC sharing helps other defenders detect the same threat.
  followup_good: The exploit specifically targeted unpatched Chrome. James was running Chrome 123 instead of the latest 125.x. Chrome's auto-update was apparently disabled or blocked by a proxy. The 3 other employees were patched and survived the exploit attempt.
  followup_weak: |-
    Watering hole attacks affect multiple organizations.

    The exploit specifically targeted unpatched Chrome. James was running Chrome 123 instead of the latest 125.x. Chrome's auto-update was apparently disabled or blocked by a proxy. The 3 other employees were patched and survived the exploit attempt.
