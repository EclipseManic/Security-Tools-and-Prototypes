phases:
- id: ot_network_isolation_phase_1
  phase_type: triage
  title: OT Network Isolation — Phase 1
  situation: James Rivera has VPN access to the OT/SCADA network. His workstation has a confirmed Cobalt Strike beacon in memory. The OT network controls physical industrial processes. The attacker may already have pivoted to the SCADA segment.
  prompt: What is your IMMEDIATE priority action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on James Rivera''s workstation, its severity, and the affected accounts.'
    action: What is your IMMEDIATE priority action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: OT Network Isolation — Phase 1. Asset in scope: James Rivera''s workstation.'
  hints:
  - Clears the beacon but destroys forensic evidence and doesn't address potential OT lateral movement.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately revoke
  - revoke james
  - james rivera
  - rivera vpn
  - vpn credentials
  - credentials disable
  - his workstation
  - workstation network
  reference_answer: |-
    Immediately revoke James Rivera's VPN credentials and disable his workstation's network access; if OT network access was established, initiate OT emergency isolation procedures (disconnect from corporate network); alert the OT/ICS security team

    Why: OT networks have physical consequences — isolation is non-negotiable when a SCADA-connected workstation is compromised.
  followup_good: 'James''s workstation is isolated. OT team reports no anomalous SCADA activity detected, but monitoring is limited (OT uses a different SIEM). Analysis of the beacon''s C2 traffic (from firewall logs before isolation) shows: 3.2 GB of data uploaded over 18 hours. EDR telemetry shows the beacon executed: system enumeration, ARP scanning of the OT subnet (10.20.0.0/24), and downloaded a second-stage payload labeled ''scada_lateral.exe''.'
  followup_weak: |-
    OT networks have physical consequences — isolation is non-negotiable when a SCADA-connected workstation is compromised.

    James's workstation is isolated. OT team reports no anomalous SCADA activity detected, but monitoring is limited (OT uses a different SIEM). Analysis of the beacon's C2 traffic (from firewall logs before isolation) shows: 3.2 GB of data uploaded over 18 hours. EDR telemetry shows the beacon executed: system enumeration, ARP scanning of the OT subnet (10.20.0.0/24), and downloaded a second-stage payload labeled 'scada_lateral.exe'.
