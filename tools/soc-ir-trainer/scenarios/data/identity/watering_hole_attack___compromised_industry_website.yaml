briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Watering Hole — Sector Industry Portal Serving Zero-Day Exploit. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Watering Hole — Sector Industry Portal Serving Zero-Day Exploit. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Watering Hole — Sector Industry Portal Serving Zero-Day Exploit. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Watering Hole — Sector Industry Portal Serving Zero-Day Exploit incident. At 08:00 on Tuesday, the SOC noticed an unusual Chrome zero-day exploit (CVE-2024-XXXX, renderer RCE) had been delivered to 4 employees who visited ''energytechnews.com'' — a widely-read industry news site. The site was compromised 3 days ago and injected with a JavaScript iframe that served the exploit only to visitors running Chrome on Windows (fingerprinting by User-Agent and navigator.platform). Of the 4 affected employees, 3 received only the failed exploit attempt (Chrome patched in their version), but 1 employee — James Rivera in the SCADA Engineering team — was running Chrome 123.0.6312.x (an unpatched version) and was fully compromised. The exploit delivered a fileless PowerShell loader that injected a Cobalt Strike beacon into memory. The beacon has been active for 18 hours before detection. James Rivera has VPN access to the OT/SCADA network segment. Business impact:
  account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
