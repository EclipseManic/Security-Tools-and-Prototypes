  mitre_tactic: Persistence
  mitre_technique: T1558 Steal or Forge Kerberos Tickets
- id: golden_ticket_impact_assessment_phase_2
  phase_type: analysis
  title: Golden Ticket Impact Assessment — Phase 2
  situation: The Golden Ticket has been active for 8 days. The attacker could have accessed any resource in the domain. You need to determine exactly what was accessed. Domain controller event logs show Kerberos service ticket requests. File server audit logs show access patterns.
  prompt: How do you assess the full impact of the Golden Ticket?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you assess the full impact of the Golden Ticket?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Golden Ticket Impact Assessment — Phase 2. Asset in scope: 47 accounts with ''Do not require Kerberos preauthentication'' enabled.'
  hints:
  - Resetting all passwords without understanding scope may disrupt business without addressing the root cause.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - audit domain
  - domain controller
  - controller security
  - security event
  - event logs
  - logs kerberos
  - kerberos service
  - service ticket
  reference_answer: |-
    Audit all domain controller Security event logs for Kerberos service ticket requests during the 8-day window, correlate with file server audit logs to map data access, check all domain admin accounts for unauthorized activity, review Active Directory for any unauthorized group membership changes or new accounts created, and analyze the phishing email origin (partner vendor compromise)

    Why: Full impact assessment: Kerberos logs show which services were accessed, file server logs show data access, AD changes reveal persistence mechanisms, and phishing origin determines if partner is also compromised.
  followup_good: 47 accounts had 'Do not require Kerberos preauthentication' enabled. This was set for compatibility with legacy applications that couldn't handle preauth challenges. The accounts include service accounts, shared accounts, and some user accounts that were configured years ago.
  followup_weak: |-
    Full impact assessment: Kerberos logs show which services were accessed, file server logs show data access, AD changes reveal persistence mechanisms, and phishing origin determines if partner is also compromised.

    47 accounts had 'Do not require Kerberos preauthentication' enabled. This was set for compatibility with legacy applications that couldn't handle preauth challenges. The accounts include service accounts, shared accounts, and some user accounts that were configured years ago.
