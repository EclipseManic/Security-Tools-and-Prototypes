- id: as_rep_roasting_remediation_phase_3
  phase_type: containment
  title: AS-REP Roasting Remediation — Phase 3
  situation: 47 accounts had 'Do not require Kerberos preauthentication' enabled. This was set for compatibility with legacy applications that couldn't handle preauth challenges. The accounts include service accounts, shared accounts, and some user accounts that were configured years ago.
  prompt: How do you remediate the AS-REP roasting vulnerability?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you remediate the AS-REP roasting vulnerability?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: AS-REP Roasting Remediation — Phase 3. Asset in scope: 47 accounts with ''Do not require Kerberos preauthentication'' enabled.'
  hints:
  - The other 16 accounts are still vulnerable.
  - Consider the affected accounts and their privilege level.
  ideal_concepts:
  - kerberos preauthentication
  - preauthentication accounts
  - accounts audit
  - audit service
  - service accounts
  - accounts proper
  - proper configuration
  - configuration strong
  reference_answer: |-
    Enable Kerberos preauthentication on all 47 accounts, audit all service accounts for proper configuration (strong passwords, no domain admin unless required, managed service accounts where possible), implement Group Policy to enforce preauthentication by default, deploy monitoring for AS-REP requests (alert on new accounts with preauth disabled), and migrate legacy applications to use Group Managed Service Accounts (gMSA)

    Why: Eliminates the vulnerability (enable preauth), hardens service accounts (audit + gMSA), enforces policy (GPO), detects future issues (monitoring), and addresses root cause (legacy app migration).
  followup_good: The cracked service accounts (svc-backup, svc-sql, svc-exchange) had weak passwords and excessive privileges. svc-backup had Domain Admin privileges but only needed backup operator rights. svc-sql had db_owner on all databases but only needed access to the finance database. The accounts used regular user accounts instead of managed service accounts.
  followup_weak: |-
    Eliminates the vulnerability (enable preauth), hardens service accounts (audit + gMSA), enforces policy (GPO), detects future issues (monitoring), and addresses root cause (legacy app migration).

    The cracked service accounts (svc-backup, svc-sql, svc-exchange) had weak passwords and excessive privileges. svc-backup had Domain Admin privileges but only needed backup operator rights. svc-sql had db_owner on all databases but only needed access to the finance database. The accounts used regular user accounts instead of managed service accounts.
