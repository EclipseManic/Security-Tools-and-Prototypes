id: kerberos_as-rep_roasting___offline_credential_attack
name: Kerberos AS-REP Roasting — Offline Credential Attack
category: Identity & Access
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to AS-REP Roasting Exposes Service Account Passwords via Kerberos Weakness. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for AS-REP Roasting Exposes Service Account Passwords via Kerberos Weakness. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for AS-REP Roasting Exposes Service Account Passwords via Kerberos Weakness. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the AS-REP Roasting Exposes Service Account Passwords via Kerberos Weakness incident. During a routine audit, the security team discovered that an attacker gained initial access to the corporate network via a phishing email 10 days ago. The attacker used Mimikatz to perform AS-REP roasting — requesting Kerberos TGTs for accounts that have ''Do not require Kerberos preauthentication'' enabled. The attacker obtained AS-REP hash blobs for 47 user accounts and cracked 31 of them offline using Hashcat with a GPU cluster. The cracked accounts include: svc-backup (backup service account with Domain Admin privileges, password: ''Backup2023!''), svc-sql (SQL Server service account with db_owner on all databases), and svc-exchange (Exchange service account with full mailbox access). The attacker used svc-backup to create a Golden Ticket (forged TGT for krbtgt account), establishing permanent domain persistence. The Golden Ticket has been active for 8 days. The
  attacker has accessed: the HR sharepoint (employee SSNs), the finance file server (board meeting minutes), and the engineering wiki (source code repositories). The initial phishing email was from a compromised partner vendor account. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: AS-REP Roasting Exposes Service Account Passwords via Kerberos Weakness
  opening: During a routine audit, the security team discovered that an attacker gained initial access to the corporate network via a phishing email 10 days ago. The attacker used Mimikatz to perform AS-REP roasting — requesting Kerberos TGTs for accounts that have 'Do not require Kerberos preauthentication' enabled.
  summary: 'During a routine audit, the security team discovered that an attacker gained initial access to the corporate network via a phishing email 10 days ago. The attacker used Mimikatz to perform AS-REP roasting — requesting Kerberos TGTs for accounts that have ''Do not require Kerberos preauthentication'' enabled. The attacker obtained AS-REP hash blobs for 47 user accounts and cracked 31 of them offline using Hashcat with a GPU cluster. The cracked accounts include: svc-backup (backup service account with Domain Admin privileges, password: ''Backup2023!''), svc-sql (SQL Server service account with db_owner on all databases), and svc-exchange (Exchange service account with full mailbox access). The attacker used svc-backup to create a Golden Ticket (forged TGT for krbtgt account), establishing permanent domain persistence. The Golden Ticket has been active for 8 days. The attacker has accessed: the HR sharepoint (employee SSNs), the finance file server (board meeting minutes), and
    the engineering wiki (source code repositories). The initial phishing email was from a compromised partner vendor account.'
  compromised_assets:
  - 47 accounts with 'Do not require Kerberos preauthentication' enabled
  - 31 cracked account passwords (including svc-backup with Domain Admin)
  - Golden Ticket (krbtgt hash forged for domain persistence)
  - HR SharePoint (SSN data accessed)
  - Finance file server (board minutes accessed)
  - Engineering wiki (source code accessed)
  detected_via: 'Routine audit: abnormal Kerberos TGT requests for accounts with preauth disabled'
  kill_chain:
  - Initial Access
  - Credential Access
  - Privilege Escalation
  - Persistence
  - Collection
