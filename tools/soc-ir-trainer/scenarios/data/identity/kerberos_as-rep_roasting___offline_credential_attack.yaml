  mitre_technique: T1110 Brute Force
- id: service_account_hardening_phase_4
  phase_type: eradication
  title: Service Account Hardening — Phase 4
  situation: The cracked service accounts (svc-backup, svc-sql, svc-exchange) had weak passwords and excessive privileges. svc-backup had Domain Admin privileges but only needed backup operator rights. svc-sql had db_owner on all databases but only needed access to the finance database. The accounts used regular user accounts instead of managed service accounts.
  prompt: How do you harden the service accounts?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you harden the service accounts?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Service Account Hardening — Phase 4. Asset in scope: 47 accounts with ''Do not require Kerberos preauthentication'' enabled.'
  hints:
  - Longer passwords help but don't address excessive privileges or manual password management.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - implement group
  - group managed
  - managed service
  - service accounts
  - accounts gmsa
  - gmsa service
  - accounts auto-rotating
  - auto-rotating character
  reference_answer: |-
    Implement Group Managed Service Accounts (gMSA) for all service accounts (auto-rotating 240-character passwords), apply least-privilege principle (svc-backup → Backup Operators only, svc-sql → specific DB access only), enforce password policies (25+ character for service accounts), deploy Credential Guard to protect service account credentials in memory, and implement service account monitoring (Event ID 4624 Type 3 logons)

    Why: gMSA eliminates password management risk, least-privilege limits blast radius, strong passwords resist cracking, Credential Guard protects in-memory, monitoring detects abuse.
  followup_good: The initial phishing email came from a compromised partner vendor account. The partner (Acme Consulting) had their email compromised and the attacker used it to send targeted phishing to your organization. The partner may still be compromised. Your supply chain security needs review.
  followup_weak: |-
    gMSA eliminates password management risk, least-privilege limits blast radius, strong passwords resist cracking, Credential Guard protects in-memory, monitoring detects abuse.

    The initial phishing email came from a compromised partner vendor account. The partner (Acme Consulting) had their email compromised and the attacker used it to send targeted phishing to your organization. The partner may still be compromised. Your supply chain security needs review.
