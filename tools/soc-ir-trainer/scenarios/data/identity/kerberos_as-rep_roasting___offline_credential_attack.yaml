phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The attacker has a Golden Ticket (forged krbtgt TGT) providing permanent domain persistence. 31 accounts are cracked. The attacker has accessed HR, Finance, and Engineering data. The Golden Ticket has been active for 8 days.
  prompt: What do you do RIGHT NOW to contain the breach?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What do you do RIGHT NOW to contain the breach?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: 47 accounts with ''Do not require Kerberos preauthentication'' enabled.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - krbtgt account
  - account password
  - password twice
  - twice required
  - required invalidate
  - invalidate existing
  - existing tgts
  - tgts including
  reference_answer: |-
    Reset the krbtgt account password TWICE (required to invalidate all existing TGTs including the Golden Ticket), disable all 47 accounts with preauth disabled, reset passwords for all 31 cracked accounts (starting with svc-backup), and revoke all active Kerberos tickets by forcing a domain-wide re-authentication

    Why: Double krbtgt reset invalidates the Golden Ticket, disabling preauth-disabled accounts stops further roasting, password resets for cracked accounts, and domain re-authentication clears all stolen tickets.
  followup_good: The Golden Ticket has been active for 8 days. The attacker could have accessed any resource in the domain. You need to determine exactly what was accessed. Domain controller event logs show Kerberos service ticket requests. File server audit logs show access patterns.
  followup_weak: |-
    Double krbtgt reset invalidates the Golden Ticket, disabling preauth-disabled accounts stops further roasting, password resets for cracked accounts, and domain re-authentication clears all stolen tickets.

    The Golden Ticket has been active for 8 days. The attacker could have accessed any resource in the domain. You need to determine exactly what was accessed. Domain controller event logs show Kerberos service ticket requests. File server audit logs show access patterns.
