id: tech_support_scam___internal_it_impersonation
name: Tech Support Scam — Internal IT Impersonation
category: Identity & Access
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Tech Support Scam — Malicious Remote Access via Internal IT Impersonation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Tech Support Scam — Malicious Remote Access via Internal IT Impersonation. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Tech Support Scam — Malicious Remote Access via Internal IT Impersonation. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Tech Support Scam — Malicious Remote Access via Internal IT Impersonation incident. At 09:30 on Wednesday, a user in the Marketing department (Amy Chen) received a pop-up on her workstation that said ''CRITICAL SECURITY ALERT — Your computer is infected with a virus. Call IT Support immediately at ext. 5555.'' The pop-up was full-screen and could not be closed. Amy called ext. 5555 — but the extension was NOT the real IT Helpdesk (ext. 4400). The attacker had set up a SIP phone extension on the company''s VoIP system (exploiting an unprovisioned extension slot). The ''technician'' walked Amy through installing ''remote support software'' (actually AnyDesk with pre-configured unattended access). The attacker then had full remote access to Amy''s workstation for 45 minutes. During that time, the attacker accessed the Marketing shared drive, downloaded the Q4 campaign budget ($3.2M), and installed a backdoor (SSH tunnel to external IP 185.220.101.xx).
  The SOC detected the AnyDesk connection to an external IP at 10:15. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
