- id: prevention_controls_phase_4
  phase_type: lessons
  title: Prevention Controls — Phase 4
  situation: 'The attack chain: (1) Full-screen pop-up on workstation, (2) fake IT extension, (3) AnyDesk installation, (4) remote access. The pop-up was delivered via a malicious browser extension installed previously. The fake extension was possible because the PBX had unprovisioned slots with weak defaults.'
  prompt: What controls prevent this attack chain?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What controls prevent this attack chain?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Prevention Controls — Phase 4. Asset in scope: Amy Chen''s workstation.'
  hints:
  - Training helps but technical controls (application whitelisting, PBX hardening) provide systematic protection.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - deploy browser
  - browser extension
  - extension whitelisting
  - whitelisting implement
  - implement application
  - application control
  - control block
  - unauthorized remote
  reference_answer: |-
    1) Deploy browser extension whitelisting. 2) Implement application control (block unauthorized remote access tools). 3) Harden PBX (disable unprovisioned extensions, change default passwords, restrict admin interface). 4) Train users: IT will NEVER ask you to install software.

    Why: Multi-layer: browser security, application control, PBX hardening, and user training.
  followup_good: |-
    The scenario ends here.

