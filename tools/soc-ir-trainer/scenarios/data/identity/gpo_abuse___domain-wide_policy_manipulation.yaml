phases:
- id: gpo_creation_domain_wide_deployment
  phase_type: triage
  title: GPO Creation & Domain-Wide Deployment
  situation: 'The GPO ''Windows Security Compliance Policy'' was created at 03:00 AM on March 8 and linked to the corp.local domain root with the Enforced flag. It has propagated to 3,800 of 4,200 domain-joined machines. The GPO contains: (1) Computer Startup Script: startup.ps1 (downloads and executes Cobalt Strike from cdn-corp[.]com), (2) Registry Preferences: HKLM\Software\Policies\Microsoft\Windows Defender\DisableAntiSpyware = 1, (3) Scheduled Task: ''System Health Monitor'' (PowerShell C2 stager, every 60 minutes, SYSTEM). Additionally, the Default Domain Policy was modified to add svc_backup_sync (Sync2024!) as a local administrator on all machines.'
  prompt: How do you respond to the malicious GPO deployment?
  guidance:
    what: 'Separate signal from noise: confirm the alert on Group Policy infrastructure, its severity, and the affected accounts.'
    action: How do you respond to the malicious GPO deployment?
    why: Every later decision depends on an accurate picture of Group Policy infrastructure and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: GPO Creation & Domain-Wide Deployment. Asset in scope: Group Policy infrastructure.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately delete
  - malicious gpo
  - gpo unlink
  - unlink domain
  - domain restore
  - restore default
  - default domain
  - domain policy
  reference_answer: |-
    Immediately delete the malicious GPO and unlink it from the domain, restore the Default Domain Policy to its previous state, block cdn-corp[.]com at the perimeter, disable the svc_backup_sync account across all machines, and implement GPO change monitoring with alerting on new GPO creation

    Why: Deleting the GPO stops propagation and removes the malicious components. Default Domain Policy restoration removes the backdoor account. Domain blocking stops C2. Account disabling removes the backdoor. GPO monitoring prevents future abuse.
  followup_good: 'The GPO''s registry preferences have disabled Windows Defender real-time monitoring on 3,800 endpoints via: HKLM\Software\Policies\Microsoft\Windows Defender\DisableAntiSpyware = 1. This registry key is applied by GPO and cannot be overridden by local Defender settings. The backdoor payload (startup.ps1 and scheduled task) executes without any AV detection on all affected machines. The registry preference was set with ''Apply once and do not reapply'', meaning the Defender setting persists even if the GPO is later removed.'
  followup_weak: |-
    Deleting the GPO stops propagation and removes the malicious components.

    The GPO's registry preferences have disabled Windows Defender real-time monitoring on 3,800 endpoints via: HKLM\Software\Policies\Microsoft\Windows Defender\DisableAntiSpyware = 1. This registry key is applied by GPO and cannot be overridden by local Defender settings. The backdoor payload (startup.ps1 and scheduled task) executes without any AV detection on all affected machines. The registry preference was set with 'Apply once and do not reapply', meaning the Defender setting persists even if the GPO is later removed.
