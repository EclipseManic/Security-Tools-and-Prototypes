briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Malicious GPO Deployment Pushes Backdoor to All Domain-Joined Machines. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Malicious GPO Deployment Pushes Backdoor to All Domain-Joined Machines. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Malicious GPO Deployment Pushes Backdoor to All Domain-Joined Machines. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Malicious GPO Deployment Pushes Backdoor to All Domain-Joined Machines incident. An attacker who compromised the svc_backup Domain Admin account (NTLM hash extracted via LSASS dump) created a new Group Policy Object (GPO) named ''Windows Security Compliance Policy'' at 03:00 AM on March 8. The GPO was linked to the root of the corp.local domain with ''Enforced'' flag, ensuring propagation to all 4,200 domain-joined machines. The GPO contained three malicious components: (1) a computer startup script (startup.ps1) that downloads and executes a Cobalt Strike beacon from hxxps://cdn-corp[.]com/update.js, (2) a registry preference that disables Windows Defender real-time monitoring on all endpoints, and (3) a scheduled task ''System Health Monitor'' that executes a PowerShell C2 stager every 60 minutes. The attacker also modified the Default Domain Policy to add a local administrator account (''svc_backup_sync'', password: Sync2024!) on all machines.
  The compromise propagated silently over the weekend (March 8-9), and by Monday morning, 3,800 machines had received the malicious GPO. Detection came when a junior administrator noticed the unfamiliar GPO in Group Policy Management Console (gpmc.msc) and reported it to the security team. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: Malicious GPO Deployment Pushes Backdoor to All Domain-Joined Machines
  opening: An attacker who compromised the svc_backup Domain Admin account (NTLM hash extracted via LSASS dump) created a new Group Policy Object (GPO) named 'Windows Security Compliance Policy' at 03:00 AM on March 8. The GPO was linked to the root of the corp.local domain with 'Enforced' flag, ensuring propagation to all 4,200 domain-joined machines.
  summary: 'An attacker who compromised the svc_backup Domain Admin account (NTLM hash extracted via LSASS dump) created a new Group Policy Object (GPO) named ''Windows Security Compliance Policy'' at 03:00 AM on March 8. The GPO was linked to the root of the corp.local domain with ''Enforced'' flag, ensuring propagation to all 4,200 domain-joined machines. The GPO contained three malicious components: (1) a computer startup script (startup.ps1) that downloads and executes a Cobalt Strike beacon from hxxps://cdn-corp[.]com/update.js, (2) a registry preference that disables Windows Defender real-time monitoring on all endpoints, and (3) a scheduled task ''System Health Monitor'' that executes a PowerShell C2 stager every 60 minutes. The attacker also modified the Default Domain Policy to add a local administrator account (''svc_backup_sync'', password: Sync2024!) on all machines. The compromise propagated silently over the weekend (March 8-9), and by Monday morning, 3,800 machines had received
    the malicious GPO. Detection came when a junior administrator noticed the unfamiliar GPO in Group Policy Management Console (gpmc.msc) and reported it to the security team.'
  compromised_assets:
  - Group Policy infrastructure (GPO created at domain root, Enforced)
  - 4,200 domain-joined machines (policy propagated)
  - 3,800 machines received backdoor payload (startup script + scheduled task)
  - Windows Defender disabled on all endpoints via registry preference
  - Default Domain Policy (local admin account svc_backup_sync added)
  - svc_backup_sync backdoor account (Sync2024!, all 4,200 machines)
  detected_via: GPO creation audit log (Event ID 5136 in Security log); junior admin visual inspection of Group Policy Management Console; PowerShell network connections to cdn-corp[.]com
  kill_chain:
  - Domain Admin credentials compromised (svc_backup NTLM hash via LSASS dump)
  - New GPO 'Windows Security Compliance Policy' created (03:00 AM, March 8)
  - GPO linked to domain root with Enforced flag
  - Startup script (startup.ps1) pushes Cobalt Strike beacon from cdn-corp[.]com
  - Registry preferences disable Windows Defender on all endpoints
  - Scheduled task 'System Health Monitor' enables periodic C2 callback (every 60 minutes)
  - Default Domain Policy modified with backdoor admin account (svc_backup_sync)
  - 3,800 machines compromised over the weekend (March 8-9)
