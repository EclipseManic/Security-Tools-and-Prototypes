- id: defense_evasion_via_gpo
  phase_type: containment
  title: Defense Evasion via GPO
  situation: 'The GPO''s registry preferences have disabled Windows Defender real-time monitoring on 3,800 endpoints via: HKLM\Software\Policies\Microsoft\Windows Defender\DisableAntiSpyware = 1. This registry key is applied by GPO and cannot be overridden by local Defender settings. The backdoor payload (startup.ps1 and scheduled task) executes without any AV detection on all affected machines. The registry preference was set with ''Apply once and do not reapply'', meaning the Defender setting persists even if the GPO is later removed.'
  prompt: How do you re-enable Windows Defender across all affected endpoints?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you re-enable Windows Defender across all affected endpoints?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Defense Evasion via GPO. Asset in scope: Group Policy infrastructure.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - deploy corrective
  - corrective gpo
  - gpo removes
  - removes disableantispyware
  - disableantispyware registry
  - registry key
  - key enforce
  - enforce defender
  reference_answer: |-
    Deploy a corrective GPO that removes the DisableAntiSpyware registry key, enforce Defender tamper protection via separate GPO to prevent future GPO-based disabling, and enable tamper protection in Microsoft Defender for Endpoint

    Why: Corrective GPO restores Defender settings. Tamper protection prevents future GPO-based disabling. MDE tamper protection provides an additional defense layer.
  followup_good: 'The startup script (startup.ps1) and scheduled task (''System Health Monitor'') have established 3,800 Cobalt Strike beacons across the domain. The beacons communicate to cdn-corp[.]com (CNAME: 198.51.100.95) over HTTPS. The attacker has full remote access to 3,800 machines including workstations, servers, and critical infrastructure. The backdoor account svc_backup_sync (Sync2024!) provides local admin access on all machines. Network monitoring shows HTTPS connections from 3,800 internal IPs to the C2 infrastructure. The attacker has been actively using these beacons for reconnaissance across the domain.'
  followup_weak: |-
    Corrective GPO restores Defender settings.

