briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to DNS Tunneling Exfiltration via Iodine on Developer Workstation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for DNS Tunneling Exfiltration via Iodine on Developer Workstation. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for DNS Tunneling Exfiltration via Iodine on Developer Workstation. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the DNS Tunneling Exfiltration via Iodine on Developer Workstation incident. On 2025-12-03, the network security team noticed anomalous DNS query patterns from workstation dev-ws-047 (10.10.50.47, assigned to senior developer r.patel, AD: CORP\r.patel). Passive DNS monitoring (Zeek) logged 387,412 TXT and NULL record queries to the subdomain t.data.tunnelcorp.net over 72 hours (Nov 30 – Dec 3), averaging 5,380 queries/hour versus the normal 12 queries/hour for this host.

  The queries encode base32-encoded data payloads in subdomain labels. Query volume analysis suggests approximately 1.7 GB of data was exfiltrated. The authoritative nameserver for tunnelcorp.net is hosted at NS1.Hetzner (185.199.108.153). Network flow data shows consistent UDP/53 outbound traffic of 48 KB/s sustained from dev-ws-047.

  The developer r.patel reported the workstation 'feels sluggish' on Dec 2 but did not open a ticket. EDR (CrowdStrike Falcon) on dev-ws-047 shows iodine.exe (SHA256: f9e8d7c6b5a4...) running as a child process of explorer.exe, started via a scheduled task 'DevSyncHelper' created on Nov 29 at 23:14 UTC. The binary was staged from C:\Users\r.patel\Downloads\iodine-0.7.8-win32.zip. Business impact: network availability and traffic confidentiality are at risk, and perimeter and segmentation controls are under scrutiny. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess contractual and regulatory notification duties if traffic or data was exposed.
