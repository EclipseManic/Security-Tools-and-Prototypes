- id: infrastructure_hardening_and_dns_policy
  phase_type: lessons
  title: Phase 4 — Infrastructure Hardening and DNS Policy
  situation: Post-incident, you need to prevent DNS tunneling from recurring. Your current DNS infrastructure uses Pi-hole for ad blocking (10.10.1.25) and Microsoft DNS on DC-01 for internal resolution. External queries go through Cloudflare DoH (1.1.1.1). There are no DNS query logging policies, no DNS response size limits, and no analytics on query frequency per host. The CISO wants a comprehensive DNS security architecture. Budget is available for commercial DNS security tooling.
  prompt: What DNS security improvements do you recommend?
  guidance:
    what: Summarize what happened, what was missed, and which controls failed on dev-ws-047.
    action: What DNS security improvements do you recommend?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Phase 4 — Infrastructure Hardening and DNS Policy. Asset in scope: dev-ws-047.'
  hints:
  - Basic query logging without analytics generates noise without actionable detection capability.
  - Blocking all external DNS breaks legitimate services and does not prevent tunneling through the internal resolver.
  ideal_concepts:
  - deploy dns
  - dns security
  - security platform
  - platform cisco
  - cisco umbrella
  - umbrella infoblox
  - infoblox bloxone
  - bloxone real-time
  reference_answer: |-
    Deploy a DNS security platform (Cisco Umbrella or Infoblox BloxOne) with: (1) real-time DNS analytics for query volume per host, (2) DGA/tunneling detection algorithms, (3) block all DoH/DoT except approved resolvers, (4) enforce DNS query logging with 90-day retention, (5) add DNS response size threshold alerts (>512 bytes for TXT records), (6) implement DNS firewall rules blocking known bulletproof hosting NS IPs.

    Why: A comprehensive DNS security platform provides both detection and prevention. Blocking unauthorized DoH/DoT prevents attackers from bypassing monitoring. Query volume analytics would have detected this attack hours earlier. Response size thresholds catch the large encoded payloads used in tunneling.
