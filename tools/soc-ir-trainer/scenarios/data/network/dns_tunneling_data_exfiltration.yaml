- id: attribution_and_insider_threat_assessment
  phase_type: eradication
  title: Phase 3 — Attribution and Insider Threat Assessment
  situation: HR records show r.patel has been with the company for 4.2 years and recently received a negative performance review on Oct 15. r.patel's Git access logs show they cloned repo-core (containing the company's proprietary ML inference engine and 12 AWS access keys) on Nov 28, one day before the iodine scheduled task was created. Security camera logs show r.patel was the only person in the office on Nov 29 at 23:14 UTC when the task was created. The iodine binary was downloaded from a personal Dropbox account (not corporate OneDrive). r.patel's badge access logs show normal working hours with no after-hours access except Nov 29. The Hetzner nameserver was registered 5 days before the attack using a privacy-shielded WHOIS record.
  prompt: How do you handle the insider threat dimension?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you handle the insider threat dimension?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Phase 3 — Attribution and Insider Threat Assessment. Asset in scope: dev-ws-047.'
  hints:
  - Premature termination without proper investigation and legal counsel could result in wrongful termination claims and may compromise the ability to gather evidence.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - coordinate legal
  - legal initiate
  - initiate employee
  - employee interview
  - interview patel
  - patel counsel
  - counsel supervision
  - supervision simultaneously
  reference_answer: |-
    Coordinate with HR and Legal to initiate an employee interview with r.patel under counsel supervision. Simultaneously rotate all 12 AWS access keys found in repo-core, audit all of r.patel's code repository access across the last 90 days, and engage a forensic accounting firm to trace any financial connections between r.patel and the tunnelcorp.net infrastructure.

    Why: The combination of negative performance review, after-hours activity, personal Dropbox staging, and privacy-shielded WHOIS strongly suggests insider involvement. HR and legal must lead the employee interaction to protect the company. Credential rotation is urgent because AWS keys were confirmed exfiltrated. Forensic accounting helps establish motive and scope.
  followup_good: Post-incident, you need to prevent DNS tunneling from recurring. Your current DNS infrastructure uses Pi-hole for ad blocking (10.10.1.25) and Microsoft DNS on DC-01 for internal resolution. External queries go through Cloudflare DoH (1.1.1.1). There are no DNS query logging policies, no DNS response size limits, and no analytics on query frequency per host. The CISO wants a comprehensive DNS security architecture. Budget is available for commercial DNS security tooling.
  followup_weak: |-
    The combination of negative performance review, after-hours activity, personal Dropbox staging, and privacy-shielded WHOIS strongly suggests insider involvement.

    Post-incident, you need to prevent DNS tunneling from recurring. Your current DNS infrastructure uses Pi-hole for ad blocking (10.10.1.25) and Microsoft DNS on DC-01 for internal resolution. External queries go through Cloudflare DoH (1.1.1.1). There are no DNS query logging policies, no DNS response size limits, and no analytics on query frequency per host. The CISO wants a comprehensive DNS security architecture. Budget is available for commercial DNS security tooling.
