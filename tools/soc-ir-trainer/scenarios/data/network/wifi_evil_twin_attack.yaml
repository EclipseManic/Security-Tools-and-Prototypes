- id: wireless_security_hardening
  phase_type: lessons
  title: Phase 3 — Wireless Security Hardening
  situation: 'The evil twin attack exploited several weaknesses: (1) The corporate SSID uses WPA2-PSK (shared key for all employees), (2) No 802.1X EAP authentication is configured, (3) No wireless certificate pinning on client devices, (4) No wireless IDS containment automation, (5) The NAC portal accepts credentials over the network without validating the server certificate. The CISO wants a hardened wireless architecture.'
  prompt: What wireless security improvements do you recommend?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What wireless security improvements do you recommend?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Phase 3 — Wireless Security Hardening. Asset in scope: Corporate SSID ''ACME-CORP''.'
  hints:
  - A stronger PSK still uses shared credentials that can be captured by evil twin attacks.
  - A WIDS appliance helps detection but does not address the underlying authentication weakness.
  ideal_concepts:
  - migrate wpa3-enterprise
  - wpa3-enterprise eap-tls
  - eap-tls certificate-based
  - certificate-based authentication
  - authentication deploy
  - deploy internal
  - internal wireless
  - wireless client
  reference_answer: |-
    Migrate to WPA3-Enterprise with 802.1X/EAP-TLS (certificate-based authentication): (1) Deploy internal CA for wireless client certificates, (2) Configure WPA3-Enterprise-SAE on the WLC, (3) Implement certificate pinning on all managed devices via MDM (Jamf/Intune), (4) Configure WIPS with automated rogue AP containment, (5) Enable wireless network segmentation with per-VLAN RADIUS attributes, (6) Deploy DNS-based threat protection on the wireless controller.

    Why: WPA3-Enterprise with EAP-TLS eliminates shared key risks — each device has a unique certificate, making evil twin attacks ineffective because clients validate the server certificate. Certificate pinning prevents captive portal bypass. Automated WIPS containment detects future rogue APs faster.
