id: wifi_evil_twin_attack
name: WiFi Evil Twin Attack
category: Network
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to WiFi Evil Twin AP — Credential Harvesting on Corporate SSID. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for WiFi Evil Twin AP — Credential Harvesting on Corporate SSID. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for WiFi Evil Twin AP — Credential Harvesting on Corporate SSID. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the WiFi Evil Twin AP — Credential Harvesting on Corporate SSID incident. On 2025-10-28 at 11:15 UTC, the wireless IDS (Cisco WIPS) detected a rogue access point broadcasting SSID 'ACME-CORP' (the corporate SSID) on channel 6, 2.4 GHz. The rogue AP (MAC de:ad:be:ef:00:42) was operating from within the building, detected at -42 dBm signal strength from AP sensor WIPS-03 on floor 3.

  The rogue AP uses a hostapd-based evil twin with a Karma SSL captive portal that mimics the corporate NAC login page (https://login.acme.internal). The portal serves a self-signed certificate for login.acme.internal (SHA256: 7a8b9c0d...). Between 11:15 and 12:03 UTC, 34 employees connected to the evil twin and submitted credentials through the fake portal. Captured credentials include: 8 active directory accounts, 3 VPN service accounts, and 23 personal email/password combinations.

  The rogue AP also performed SSL stripping on captive portal traffic and captured session cookies from 12 users who authenticated to the real portal before being redirected to the fake one. Physical security cameras show an unknown individual in the 3rd floor conference room (meeting room 3B) at 10:47 UTC, 28 minutes before the AP was detected. Business impact: network availability and traffic confidentiality are at risk, and perimeter and segmentation controls are under scrutiny. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess contractual and regulatory notification duties if traffic or data was exposed.
