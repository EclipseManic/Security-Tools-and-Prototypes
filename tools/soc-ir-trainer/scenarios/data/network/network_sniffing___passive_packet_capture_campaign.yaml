briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Passive Network Sniffing — ARP-Based Promiscuous Mode Detection. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Passive Network Sniffing — ARP-Based Promiscuous Mode Detection. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Passive Network Sniffing — ARP-Based Promiscuous Mode Detection. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the Passive Network Sniffing — ARP-Based Promiscuous Mode Detection incident. On 2025-09-28 at 14:07 UTC, the network security monitoring platform (ExtraHop Reveal(x)) flagged host dev-ws-031 (10.10.30.31, assigned to security analyst k.larsen, AD: CORP\k.larsen) for abnormal network behavior: the host was responding to ARP requests for IP addresses outside its subnet (10.10.10.0/24 — the Server VLAN), indicating the NIC was in promiscuous mode and accepting all Ethernet frames.

  Deep packet inspection showed the host was running Wireshark (tshark.exe PID 8832) capturing all traffic on the VLAN 30 trunk span. The capture had been running for 6 days (since Sep 22 at 09:41 UTC) and had written 47 GB of pcap data to C:\Users\k.larsen\captures\full_capture.pcap. The capture includes traffic from VLAN 30 (Finance), VLAN 20 (Engineering), and VLAN 10 (Servers) due to a misconfigured SPAN session on core-switch-01 that mirrors all VLAN traffic to port Gi0/24.

  Analysis of the pcap reveals k.larsen used Wireshark display filters to isolate: (1) HTTP POST requests containing form data (1,247 captured, including payroll login credentials), (2) SNMP community strings (6 devices using 'public', 2 using 'acme-snmp-v2'), (3) FTP credentials in plaintext (3 transfers to external FTP server ftp.collab.vendor.com), (4) database connection strings in application traffic (PostgreSQL, MySQL credentials for 4 application databases). Business impact: network availability and traffic confidentiality are at risk, and perimeter and segmentation controls are under scrutiny. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess contractual and regulatory notification duties if traffic or data was exposed.
