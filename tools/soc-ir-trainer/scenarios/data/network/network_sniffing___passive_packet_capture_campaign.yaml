- id: network_monitoring_architecture
  phase_type: lessons
  title: Phase 3 — Network Monitoring Architecture
  situation: 'Post-incident, you need a secure network monitoring architecture. Current issues: (1) SPAN sessions mirror all VLANs to a single port (no segmentation), (2) No access controls on SPAN destination ports, (3) No DLP monitoring for pcap file creation, (4) Network monitoring tools (Wireshark) are available to all analysts without audit logging, (5) No network TAP appliances for out-of-band monitoring. The CISO wants a secure monitoring architecture that provides visibility without creating attack vectors.'
  prompt: What network monitoring architecture do you recommend?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What network monitoring architecture do you recommend?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Phase 3 — Network Monitoring Architecture. Asset in scope: dev-ws-031.'
  hints:
  - SIEM provides log analysis but cannot replace deep packet inspection for troubleshooting.
  - Encrypting all traffic (TLS everywhere) protects data in transit but does not prevent metadata analysis or protect non-encrypted protocols (DNS, SNMP, FTP).
  ideal_concepts:
  - secure monitoring
  - monitoring architecture
  - architecture deploy
  - deploy dedicated
  - dedicated network
  - network tap
  - tap appliances
  - appliances out-of-band
  reference_answer: |-
    Secure monitoring architecture: (1) Deploy dedicated network TAP appliances for out-of-band monitoring (Gigamon, Ixia) instead of SPAN sessions, (2) Centralize packet capture on a hardened monitoring server with role-based access control, (3) Implement file integrity monitoring (FIM) on capture directories, (4) Deploy DLP rules to detect pcap file creation and transfer, (5) Require two-person authorization for packet captures exceeding 1 GB, (6) Implement audit logging for all Wireshark/tshark usage via endpoint monitoring, (7) Segment monitoring infrastructure on a dedicated management VLAN with strict access controls.

    Why: TAPs provide clean traffic copies without VLAN cross-contamination. Centralized capture with RBAC prevents individual analysts from running unauthorized captures. FIM and DLP detect data exfiltration. Two-person authorization prevents single-analyst abuse. Audit logging provides accountability. Management VLAN segmentation limits access.
