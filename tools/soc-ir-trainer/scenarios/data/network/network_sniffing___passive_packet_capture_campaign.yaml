phases:
- id: promiscuous_mode_detection
  phase_type: triage
  title: Phase 1 — Promiscuous Mode Detection
  situation: ExtraHop flagged dev-ws-031 at 14:07 UTC for responding to ARP requests for IPs outside its subnet (10.10.10.x). The host's NIC is in promiscuous mode. tshark.exe PID 8832 has been running since Sep 22 at 09:41 UTC. The SPAN session on core-switch-01 port Gi0/24 mirrors ALL VLAN traffic (10, 20, 30) to this port. k.larsen is a security analyst with legitimate access to the monitoring console. The capture file is 47 GB. What do you do?
  prompt: What is your first response?
  guidance:
    what: Establish what fired on dev-ws-031, which accounts are involved, and how urgent the signal is.
    action: What is your first response?
    why: Every later decision depends on an accurate picture of dev-ws-031 and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phase 1 — Promiscuous Mode Detection. Asset in scope: dev-ws-031.'
  hints:
  - Reconfiguring the SPAN session does not address the active capture of 47 GB of multi-VLAN traffic.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately disable
  - span session
  - session core-switch-01
  - core-switch-01 gi0
  - gi0 stop
  - traffic mirror
  - mirror terminate
  - terminate tshark
  reference_answer: |-
    Immediately: (1) Disable the SPAN session on core-switch-01 Gi0/24 to stop the traffic mirror, (2) Terminate tshark.exe PID 8832 on dev-ws-031, (3) Preserve the 47 GB pcap file as forensic evidence (copy to write-protected storage), (4) Isolate dev-ws-031 for forensic analysis, (5) Notify the CISO and HR — this may be unauthorized surveillance by a security analyst.

    Why: Stopping the SPAN session cuts off the data source. Terminating tshark stops ongoing capture. Preserving the pcap is essential for determining scope of data exposure. Involving CISO and HR is necessary because the actor is an internal security analyst with legitimate-looking access.
  followup_good: 'Forensic analysis of the 47 GB pcap (Sep 22–28) reveals: (1) 1,247 HTTP POST requests with plaintext form data including payroll system logins (15 unique accounts, including CFO k.chen), (2) 6 devices using SNMP community string ''public'' and 2 using ''acme-snmp-v2'', (3) 3 FTP transfers to ftp.collab.vendor.com with plaintext credentials (user: vendor-export, password: AcmeV3nd0r!), (4) 4 database connection strings in application traffic (PostgreSQL: db_admin/Pr0dP@ssw0rd!, MySQL: app_svc/AppC0nn3ct!), (5) k.larsen''s workstation shows Wireshark display filters specifically targeting ''http.request.method == POST'', ''snmp'', ''ftp.request.command == PASS'', and ''pgsql.message''. This indicates deliberate, targeted credential harvesting rather than passive monitoring.'
  followup_weak: |-
    Stopping the SPAN session cuts off the data source.

    Forensic analysis of the 47 GB pcap (Sep 22–28) reveals: (1) 1,247 HTTP POST requests with plaintext form data including payroll system logins (15 unique accounts, including CFO k.chen), (2) 6 devices using SNMP community string 'public' and 2 using 'acme-snmp-v2', (3) 3 FTP transfers to ftp.collab.vendor.com with plaintext credentials (user: vendor-export, password: AcmeV3nd0r!), (4) 4 database connection strings in application traffic (PostgreSQL: db_admin/Pr0dP@ssw0rd!, MySQL: app_svc/AppC0nn3ct!), (5) k.larsen's workstation shows Wireshark display filters specifically targeting 'http.request.method == POST', 'snmp', 'ftp.request.command == PASS', and 'pgsql.message'. This indicates deliberate, targeted credential harvesting rather than passive monitoring.
