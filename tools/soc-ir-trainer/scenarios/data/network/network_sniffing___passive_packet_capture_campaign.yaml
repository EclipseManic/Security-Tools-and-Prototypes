- id: captured_data_impact_assessment
  phase_type: containment
  title: Phase 2 — Captured Data Impact Assessment
  situation: 'Forensic analysis of the 47 GB pcap (Sep 22–28) reveals: (1) 1,247 HTTP POST requests with plaintext form data including payroll system logins (15 unique accounts, including CFO k.chen), (2) 6 devices using SNMP community string ''public'' and 2 using ''acme-snmp-v2'', (3) 3 FTP transfers to ftp.collab.vendor.com with plaintext credentials (user: vendor-export, password: AcmeV3nd0r!), (4) 4 database connection strings in application traffic (PostgreSQL: db_admin/Pr0dP@ssw0rd!, MySQL: app_svc/AppC0nn3ct!), (5) k.larsen''s workstation shows Wireshark display filters specifically targeting ''http.request.method == POST'', ''snmp'', ''ftp.request.command == PASS'', and ''pgsql.message''. This indicates deliberate, targeted credential harvesting rather than passive monitoring.'
  prompt: What is your investigation priority?
  guidance:
    what: Decide how to stop the spread from dev-ws-031 while preserving the evidence trail.
    action: What is your investigation priority?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Phase 2 — Captured Data Impact Assessment. Asset in scope: dev-ws-031.'
  hints:
  - Fixing the SPAN session is important but secondary to the 15+ compromised credentials that are actively at risk.
  - Consider the affected accounts and their privilege level.
  ideal_concepts:
  - prioritize credential
  - credential rotation
  - rotation insider
  - insider investigation
  - investigation force
  - password reset
  - payroll accounts
  - accounts rotate
  reference_answer: |-
    Prioritize credential rotation and insider investigation: (1) Force password reset for all 15 payroll accounts, (2) Rotate SNMP community strings to SNMPv3 with authentication/encryption, (3) Rotate FTP credentials and migrate to SFTP, (4) Rotate all 4 database connection strings, (5) Audit k.larsen's activity: email, file access, badge logs, browser history for the 6-day window, (6) Engage HR and legal for potential insider threat investigation, (7) Check if the captured data was copied to external media.

    Why: The targeted Wireshark filters indicate deliberate credential harvesting. All captured credentials must be rotated immediately. The insider investigation must determine motive and whether data was exfiltrated. Checking for external media copies determines if the data left the organization.
  followup_good: 'Post-incident, you need a secure network monitoring architecture. Current issues: (1) SPAN sessions mirror all VLANs to a single port (no segmentation), (2) No access controls on SPAN destination ports, (3) No DLP monitoring for pcap file creation, (4) Network monitoring tools (Wireshark) are available to all analysts without audit logging, (5) No network TAP appliances for out-of-band monitoring. The CISO wants a secure monitoring architecture that provides visibility without creating attack vectors.'
  followup_weak: |-
    The targeted Wireshark filters indicate deliberate credential harvesting.

    Post-incident, you need a secure network monitoring architecture. Current issues: (1) SPAN sessions mirror all VLANs to a single port (no segmentation), (2) No access controls on SPAN destination ports, (3) No DLP monitoring for pcap file creation, (4) Network monitoring tools (Wireshark) are available to all analysts without audit logging, (5) No network TAP appliances for out-of-band monitoring. The CISO wants a secure monitoring architecture that provides visibility without creating attack vectors.
