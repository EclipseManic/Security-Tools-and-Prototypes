- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: 'Analysis reveals the malicious package exfiltrated: 23 API keys, 12 database connection strings, 8 JWT signing keys, and 5 cloud provider tokens. The original maintainer''s account was compromised because they reused a password from a breach at a different service. The attacker pushed the malicious update 36 hours ago. The malicious package was downloaded 847 times from PyPI (including by other companies). The attacker''s exfiltration endpoint is hosted on a bulletproof provider. The git history shows the attacker also modified the library''s test suite to include a backdoor test that executes on CI.'
  prompt: How do you assess the full impact?
  guidance:
    what: Find every foothold the attacker left on async-http-client v3.9.0, including persistence and stolen credentials.
    action: How do you assess the full impact?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: async-http-client v3.9.0.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - assess api
  - api keys
  - keys scope
  - scope access
  - access determine
  - determine databases
  - databases exposed
  - exposed customer
  reference_answer: |-
    Assess all 23 API keys for scope of access, determine which 12 databases were exposed and what customer data they contain, evaluate JWT key compromise impact on authentication, assess cloud token exposure for resource abuse, and report to the OSS community about the compromised package

    Why: Full impact: API access (scope), database exposure (customer data), authentication impact (JWT keys), cloud exposure (resource abuse), and community notification (other affected users).
  followup_good: 'The investigation reveals: 23 API keys exposed (2 for payment processing), 12 database connection strings (including 1 with 500K customer records), 8 JWT keys (session hijacking possible for all authenticated users), and 5 cloud tokens (AWS, GCP, Azure). The original maintainer used a password from a 2019 breach. The company''s 47 microservices use 156 open source dependencies. The attacker also modified the test suite to include a backdoor that runs on CI/CD systems.'
  followup_weak: |-
    Full impact: API access (scope), database exposure (customer data), authentication impact (JWT keys), cloud exposure (resource abuse), and community notification (other affected users).

