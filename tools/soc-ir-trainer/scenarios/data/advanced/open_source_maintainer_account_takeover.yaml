  - Collection
  - Exfiltration
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: 47 microservices in production are running a compromised library version with a malicious dependency. The payload scans for secrets in code and environment variables. The library has been in production for 36 hours. The attacker's infrastructure may be receiving exfiltrated credentials.
  prompt: What is your FIRST containment action?
  guidance:
    what: Establish what fired on async-http-client v3.9.0, which accounts are involved, and how urgent the signal is.
    action: What is your FIRST containment action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: async-http-client v3.9.0.'
  hints:
  - Version pinning prevents future installs but doesn't affect already-running production services.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately roll
  - roll back
  - back microservices
  - microservices async-http-client
  - async-http-client last
  - last known
  - known good
  - good block
  reference_answer: |-
    Immediately roll back all 47 microservices to async-http-client v3.8.1 (last known good), block the exfiltration domain at the DNS/firewall level, rotate all API keys and database credentials for affected services, and remove the 'dev-team-2024' maintainer from the open source project

    Why: Rollback stops the malicious code execution, DNS/firewall blocks exfiltration, credential rotation prevents credential misuse, and maintainer removal prevents further malicious updates.
  followup_good: The microservices have been rolled back. The malicious package has been identified. The original maintainer's account was compromised via credential stuffing. The attacker added themselves as a maintainer and pushed the malicious update. The payload exfiltrated secrets to an external endpoint. You need to determine what was exfiltrated and how the account was compromised.
  followup_weak: |-
    Rollback stops the malicious code execution, DNS/firewall blocks exfiltration, credential rotation prevents credential misuse, and maintainer removal prevents further malicious updates.

    The microservices have been rolled back. The malicious package has been identified. The original maintainer's account was compromised via credential stuffing. The attacker added themselves as a maintainer and pushed the malicious update. The payload exfiltrated secrets to an external endpoint. You need to determine what was exfiltrated and how the account was compromised.
  next: evidence_collection_phase_2
  mitre_tactic: Execution
  mitre_technique: T1059.006 Python
- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: The microservices have been rolled back. The malicious package has been identified. The original maintainer's account was compromised via credential stuffing. The attacker added themselves as a maintainer and pushed the malicious update. The payload exfiltrated secrets to an external endpoint. You need to determine what was exfiltrated and how the account was compromised.
  prompt: How do you collect evidence from this OSS supply chain attack?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you collect evidence from this OSS supply chain attack?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: async-http-client v3.9.0.'
  hints:
  - Network traffic shows what left the company but not the full attack chain.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - analyze malicious
  - malicious dependency
  - dependency async-http-client-utils
  - async-http-client-utils payload
  - payload exfiltration
  - exfiltration endpoints
  - endpoints pull
  - git commit
  reference_answer: |-
    Analyze the malicious dependency (async-http-client-utils) for payload and exfiltration endpoints, pull git commit logs showing the attacker's changes, audit the original maintainer's account for credential compromise indicators, review PyPI download logs for the malicious version, and analyze network logs from all 47 microservices for exfiltration traffic

    Why: Comprehensive evidence: package analysis (payload), git history (attacker changes), account forensics (compromise method), registry logs (distribution scope), and network logs (exfiltration).
  followup_good: 'Analysis reveals the malicious package exfiltrated: 23 API keys, 12 database connection strings, 8 JWT signing keys, and 5 cloud provider tokens. The original maintainer''s account was compromised because they reused a password from a breach at a different service. The attacker pushed the malicious update 36 hours ago. The malicious package was downloaded 847 times from PyPI (including by other companies). The attacker''s exfiltration endpoint is hosted on a bulletproof provider. The git history shows the attacker also modified the library''s test suite to include a backdoor test that executes on CI.'
  followup_weak: |-
    Comprehensive evidence: package analysis (payload), git history (attacker changes), account forensics (compromise method), registry logs (distribution scope), and network logs (exfiltration).

