- id: eradication_prevention_phase_4
  phase_type: lessons
  title: Eradication & Prevention — Phase 4
  situation: 'The investigation reveals: 23 API keys exposed (2 for payment processing), 12 database connection strings (including 1 with 500K customer records), 8 JWT keys (session hijacking possible for all authenticated users), and 5 cloud tokens (AWS, GCP, Azure). The original maintainer used a password from a 2019 breach. The company''s 47 microservices use 156 open source dependencies. The attacker also modified the test suite to include a backdoor that runs on CI/CD systems.'
  prompt: What comprehensive prevention measures do you implement?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What comprehensive prevention measures do you implement?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Eradication & Prevention — Phase 4. Asset in scope: async-http-client v3.9.0.'
  hints:
  - Lock files prevent unexpected updates but don't address secrets management, MFA, or runtime detection.
  - Provides control but creates maintenance burden.
  - MFA prevents credential reuse attacks but doesn't address dependency integrity, secrets management, or runtime protection.
  ideal_concepts:
  - implement dependency
  - dependency lock
  - lock files
  - files hash
  - hash verification
  - verification deploy
  - deploy automated
  - automated dependency
  reference_answer: |-
    Implement dependency lock files with hash verification, deploy automated dependency update reviews (Dependabot with mandatory review), implement secrets scanning in CI/CD pipelines, migrate secrets to a centralized secrets manager, enable MFA for all developer accounts, establish a software bill of materials (SBOM) program, and implement runtime application self-protection (RASP) to detect secret exfiltration

    Why: Comprehensive prevention: integrity (lock files), review process (automated updates), detection (secrets scanning), secrets management (centralized), authentication (MFA), visibility (SBOM), and runtime protection (RASP).
