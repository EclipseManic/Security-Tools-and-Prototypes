  prompt: What regulatory and notification steps are required?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What regulatory and notification steps are required?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Regulatory & Stakeholder Notification — Phase 5. Asset in scope: k.patel.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
