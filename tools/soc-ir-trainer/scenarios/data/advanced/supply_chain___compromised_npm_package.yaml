briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Typosquatted NPM Package Exfiltrates Build Secrets. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Typosquatted NPM Package Exfiltrates Build Secrets. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Typosquatted NPM Package Exfiltrates Build Secrets. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Typosquatted NPM Package Exfiltrates Build Secrets incident. A developer (k.chen@corp.local, workstation WS-KCHEN-12, 10.10.10.112) accidentally installed ''colour-utils'' (npm package, version 2.3.1) instead of the intended ''color-utils'' package. The typosquatted package contained a postinstall script (scripts/postinstall.js) that executed a Node.js payload harvesting environment variables, SSH keys, and AWS credentials from the developer''s machine. The payload read: ~/.ssh/id_rsa, ~/.aws/credentials, ~/.env, and process.env, encoding all data as hex and exfiltrating via DNS-over-HTTPS queries to dns.dnslog.cn (resolved via 1.1.1.1:443 to hide from proxy inspection). Within hours, the attacker used the stolen AWS access keys (AKIAIOSFODNN7EXAMPLE) to spin up 47 GPU EC2 instances (p3.2xlarge, us-east-1) for Ethereum mining, costing $127,000 before CloudWatch billing alerts triggered at the $100K threshold. The compromised package had been downloaded
  14,000 times over its 3-week window before identification. The attacker also modified the developer''s git config (~/.gitconfig) to inject a pre-commit hook that embeds backdoors into any repositories the developer committed to, creating a secondary supply chain vector affecting 3 internal repositories. Business impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
incident:
  title: Typosquatted NPM Package Exfiltrates Build Secrets
  opening: A developer (k.chen@corp.local, workstation WS-KCHEN-12, 10.10.10.112) accidentally installed 'colour-utils' (npm package, version 2.3.1) instead of the intended 'color-utils' package. The typosquatted package contained a postinstall script (scripts/postinstall.js) that executed a Node.js payload harvesting environment variables, SSH keys, and AWS credentials from the developer's machine.
  summary: 'A developer (k.chen@corp.local, workstation WS-KCHEN-12, 10.10.10.112) accidentally installed ''colour-utils'' (npm package, version 2.3.1) instead of the intended ''color-utils'' package. The typosquatted package contained a postinstall script (scripts/postinstall.js) that executed a Node.js payload harvesting environment variables, SSH keys, and AWS credentials from the developer''s machine. The payload read: ~/.ssh/id_rsa, ~/.aws/credentials, ~/.env, and process.env, encoding all data as hex and exfiltrating via DNS-over-HTTPS queries to dns.dnslog.cn (resolved via 1.1.1.1:443 to hide from proxy inspection). Within hours, the attacker used the stolen AWS access keys (AKIAIOSFODNN7EXAMPLE) to spin up 47 GPU EC2 instances (p3.2xlarge, us-east-1) for Ethereum mining, costing $127,000 before CloudWatch billing alerts triggered at the $100K threshold. The compromised package had been downloaded 14,000 times over its 3-week window before identification. The attacker also modified
    the developer''s git config (~/.gitconfig) to inject a pre-commit hook that embeds backdoors into any repositories the developer committed to, creating a secondary supply chain vector affecting 3 internal repositories.'
  compromised_assets:
  - WS-KCHEN-12 (10.10.10.112) — Developer workstation (all credentials exposed)
  - AWS account (47 GPU p3.2xlarge instances spawned, $127K cost)
  - SSH private keys (~/.ssh/id_rsa exfiltrated)
  - AWS credentials (AKIAIOSFODNN7EXAMPLE exfiltrated)
  - Git repositories (3 repos with pre-commit hook backdoor)
  - NPM package 'colour-utils' (14K downloads affected across ecosystem)
  detected_via: AWS CloudWatch billing anomaly alert ($100K threshold breached); DNS-over-HTTPS exfiltration detection via network security appliance; package name similarity alert from Snyk dependency scanner
  kill_chain:
  - Developer installs typosquatted NPM package 'colour-utils' v2.3.1
  - Postinstall script executes credential harvester (postinstall.js)
  - SSH keys, AWS creds, env vars exfiltrated via DoH to dns.dnslog.cn
  - Attacker provisions 47 GPU p3.2xlarge instances for mining ($127K)
  - Git pre-commit hook injected into ~/.gitconfig (secondary vector)
  - 3 internal repositories affected by poisoned commits
  mitre_tactics:
  - TA0001 — Initial Access (supply chain)
  - TA0006 — Credential Access
  - TA0010 — Exfiltration
  - TA0040 — Impact (resource hijacking)
phases:
- id: typosquat_installation
  phase_type: triage
  title: Typosquat Installation
  situation: Developer k.chen ran 'npm install colour-utils' (typo) on WS-KCHEN-12 at 14:23 PM on March 12. The package's postinstall script immediately executed the credential harvester. The package name 'colour-utils' is a typosquat of the legitimate 'color-utils' package (different spelling). The malicious package was published by npm user 'devtools-official' 3 weeks ago and has accumulated 14,000 downloads. No package-lock.json was in use for this project. The project's CI/CD pipeline (GitHub Actions) does not validate new dependencies before build.
  prompt: How do you address the typosquat installation and prevent future supply chain attacks?
  guidance:
    what: 'Frame the decision for ''Typosquat Installation'': the asset at risk, the evidence available, and the time pressure.'
    action: How do you address the typosquat installation and prevent future supply chain attacks?
    why: Every later decision depends on an accurate picture of WS-KCHEN-12 and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Typosquat Installation. Asset in scope: WS-KCHEN-12.'
  hints:
  - Code review is a good long-term measure but does not address the immediate credential exposure.
  - Blocking DoH prevents future exfiltration through this channel but does not address the already-exfiltrated credentials or the pre-commit hook backdoor.
  ideal_concepts:
  - immediately remove
  - malicious package
  - package rotate
  - exposed credentials
  - credentials ssh
  - ssh keys
  - keys aws
  - aws access
  reference_answer: |-
    Immediately remove the malicious package, rotate all exposed credentials (SSH keys, AWS access keys), implement package-lock.json enforcement, enable npm audit signatures, and deploy a private npm registry with an allowlist of approved packages

    Why: Removing the package stops ongoing credential harvesting. Credential rotation invalidates stolen secrets. Package-lock.json and audit signatures prevent typosquats. A private registry eliminates public package risk entirely.
  followup_good: The postinstall.js payload read ~/.ssh/id_rsa (SSH private key with comment k.chen@corp.local), ~/.aws/credentials (containing AKIAIOSFODNN7EXAMPLE with FullAccess policy), ~/.env (containing DATABASE_URL and STRIPE_API_KEY), and process.env. All data was hex-encoded and exfiltrated via DoH queries to dns.dnslog.cn using encoded subdomains like aGVsbG8gd29ybGQ.dnslog.cn. The exfiltration completed in 90 seconds. The SSH key provides access to GitHub repos and production servers. The AWS key has FullAccess IAM permissions.
  followup_weak: |-
    Removing the package stops ongoing credential harvesting.

    The postinstall.js payload read ~/.ssh/id_rsa (SSH private key with comment k.chen@corp.local), ~/.aws/credentials (containing AKIAIOSFODNN7EXAMPLE with FullAccess policy), ~/.env (containing DATABASE_URL and STRIPE_API_KEY), and process.env. All data was hex-encoded and exfiltrated via DoH queries to dns.dnslog.cn using encoded subdomains like aGVsbG8gd29ybGQ.dnslog.cn. The exfiltration completed in 90 seconds. The SSH key provides access to GitHub repos and production servers. The AWS key has FullAccess IAM permissions.
