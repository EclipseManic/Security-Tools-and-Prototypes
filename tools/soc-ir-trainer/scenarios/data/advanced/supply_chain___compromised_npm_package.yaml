- id: resource_hijacking
  phase_type: eradication
  title: Resource Hijacking
  situation: The attacker has used the stolen AWS access key (AKIAIOSFODNN7EXAMPLE) to provision 47 p3.2xlarge GPU instances in us-east-1 for Ethereum mining. Total cost has reached $127,000 and is increasing at approximately $2,800/hour. The instances are running the lolminer binary. The AWS account has no Service Control Policies restricting instance types or regions. The billing alert was set at $100K (monthly threshold). CloudTrail logs show the RunInstances API calls originating from IP 198.51.100.67 (the attacker's infrastructure).
  prompt: How do you contain the resource hijacking and prevent recurrence?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you contain the resource hijacking and prevent recurrence?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Resource Hijacking. Asset in scope: WS-KCHEN-12.'
  hints:
  - Without SCPs or additional controls, the attacker (if they have other credentials) can simply provision more instances with a new key.
  - AWS may provide billing credits for compromised accounts, but this does not prevent recurrence.
  - CloudTrail alerting is useful for detection but does not prevent the resource hijacking.
  ideal_concepts:
  - terminate gpu
  - gpu instances
  - instances immediately
  - immediately implement
  - implement scps
  - scps limiting
  - limiting instance
  - instance types
  reference_answer: |-
    Terminate all 47 GPU instances immediately, implement SCPs limiting instance types to t3.medium maximum and restricting to approved regions, enable AWS Config rules for instance type compliance, and set billing alerts at $1K

    Why: Terminating instances stops ongoing cost accumulation. SCPs prevent future GPU instance provisioning. Config rules provide continuous compliance monitoring. Lower billing alerts catch anomalies faster.
  followup_good: "Investigation of the developer's git configuration reveals that the payload modified ~/.gitconfig to add a global pre-commit hook: [core]\n\thooksPath = /home/k.chen/.git-hooks\nThe hook script (.git-hooks/pre-commit) embeds a base64-encoded backdoor into any JavaScript file staged for commit. The hook has been active since March 12 and affected 3 internal repositories: corp/webapp-frontend (12 commits), corp/api-gateway (8 commits), and corp/shared-utils (5 commits). The poisoned commits are in the develop branches and have not yet been merged to production. 23 developer workstations use shared repositories that may have pulled these commits."
  followup_weak: "Terminating instances stops ongoing cost accumulation.\n\nInvestigation of the developer's git configuration reveals that the payload modified ~/.gitconfig to add a global pre-commit hook: [core]\n\thooksPath = /home/k.chen/.git-hooks\nThe hook script (.git-hooks/pre-commit) embeds a base64-encoded backdoor into any JavaScript file staged for commit. The hook has been active since March 12 and affected 3 internal repositories: corp/webapp-frontend (12 commits), corp/api-gateway (8 commits), and corp/shared-utils (5 commits). The poisoned commits are in the develop branches and have not yet been merged to production. 23 developer workstations use shared repositories that may have pulled these commits."
