  guidance:
    what: Determine what the evidence says about scope, access, and privilege on WS-KCHEN-12.
    action: How do you respond to the credential exfiltration?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Credential Exfiltration. Asset in scope: WS-KCHEN-12.'
  hints:
  - Stopping mining addresses the immediate cost impact but does not secure the compromised credentials.
  - HSMs are a good long-term solution but require significant infrastructure changes.
  ideal_concepts:
  - immediately rotate
  - exposed credentials
  - credentials ssh
  - ssh keys
  - keys aws
  - aws access
  - access keys
  - keys stripe
  reference_answer: |-
    Immediately rotate all exposed credentials (SSH keys, AWS access keys, Stripe API key, database URL), implement AWS IAM policies limiting instance types and regions, block DoH at the network proxy, and audit all systems accessible with the stolen credentials

    Why: Credential rotation invalidates all stolen secrets. IAM policies prevent GPU instance spawning. DoH blocking stops future exfiltration. System audit identifies any additional compromises.
  followup_good: The attacker has used the stolen AWS access key (AKIAIOSFODNN7EXAMPLE) to provision 47 p3.2xlarge GPU instances in us-east-1 for Ethereum mining. Total cost has reached $127,000 and is increasing at approximately $2,800/hour. The instances are running the lolminer binary. The AWS account has no Service Control Policies restricting instance types or regions. The billing alert was set at $100K (monthly threshold). CloudTrail logs show the RunInstances API calls originating from IP 198.51.100.67 (the attacker's infrastructure).
  followup_weak: |-
    Credential rotation invalidates all stolen secrets.

    The attacker has used the stolen AWS access key (AKIAIOSFODNN7EXAMPLE) to provision 47 p3.2xlarge GPU instances in us-east-1 for Ethereum mining. Total cost has reached $127,000 and is increasing at approximately $2,800/hour. The instances are running the lolminer binary. The AWS account has no Service Control Policies restricting instance types or regions. The billing alert was set at $100K (monthly threshold). CloudTrail logs show the RunInstances API calls originating from IP 198.51.100.67 (the attacker's infrastructure).
