- id: security_descriptor_manipulation
  phase_type: containment
  title: Security Descriptor Manipulation
  situation: 'The attacker modified the task''s security descriptor to D:P(D;;KA;;;WD), which denies all access to the task entry. This prevents standard tools (schtasks /query, Task Scheduler GUI) from displaying the task. The task can only be discovered by: (1) direct registry inspection (HKLM\Software\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree), (2) PowerShell Get-ScheduledTask with admin privileges, or (3) specialized audit scripts that enumerate tasks via COM interfaces. The SDDL modification was logged in the Security event log (Event ID 4719, Audit Policy Change) but was not triaged.'
  prompt: How do you address the security descriptor evasion?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you address the security descriptor evasion?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Security Descriptor Manipulation. Asset in scope: APP-SRV-01.'
  hints:
  - Manual inspection is one-time and does not prevent recurrence.
  - Restricting task creation is valuable but may break legitimate system tasks.
  - SIEM rules are useful for detection but should be combined with preventive controls (GPO enforcement) to stop SDDL manipulation.
  ideal_concepts:
  - deploy group
  - group policy
  - policy enforce
  - enforce consistent
  - consistent task
  - task permissions
  - permissions audit
  - audit sddl
  reference_answer: |-
    Deploy Group Policy to enforce consistent task permissions and audit SDDL changes, create a monitoring rule for Event ID 4719 (Audit Policy Change) related to scheduled tasks, implement a regular task enumeration script that bypasses SDDL restrictions, and ensure all task creation events are forwarded to the SIEM

    Why: GPO enforcement prevents future SDDL manipulation. Event monitoring detects policy changes. Enumeration scripts find hidden tasks. SIEM forwarding ensures centralized visibility.
  followup_good: Every 15 minutes, the task executes PowerShell to check for C:\ProgramData\.msupdate_check; if absent, downloads and executes the second-stage payload from hxxps://legitimate-news[.]com/wp-content/uploads/update.js. The payload has been active for 4 days (March 12-15) with approximately 384 C2 callbacks (one every 15 minutes). The Cobalt Strike beacon communicates via HTTPS to a redirector that points to the actual C2 server (198.51.100.92:443). PowerShell Script Block Logging (Event ID 4104) has captured the full decoded payload including the download cradle and C2 configuration. The compromised WordPress site (legitimate-news[.]com) is a legitimate news website with an injected JavaScript backdoor.
  followup_weak: |-
    GPO enforcement prevents future SDDL manipulation.

