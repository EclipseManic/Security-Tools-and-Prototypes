briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Hidden Scheduled Task Executing Encoded PowerShell C2 Payload. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Hidden Scheduled Task Executing Encoded PowerShell C2 Payload. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Hidden Scheduled Task Executing Encoded PowerShell C2 Payload. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Hidden Scheduled Task Executing Encoded PowerShell C2 Payload incident. An attacker who gained SYSTEM access to APP-SRV-01 (10.10.40.21, Windows Server 2022) created a covert scheduled task named ''MicrosoftEdgeUpdateCore'' disguised as a legitimate Windows task. The task is configured with: schtasks /create /tn \Microsoft\Windows\Edge\MicrosoftEdgeUpdateCore /ru SYSTEM /sc MINUTE /MO 15 /tr ''powershell.exe -WindowStyle Hidden -enc <base64>'' /f. The task executes every 15 minutes using SYSTEM privileges. The PowerShell payload checks for a marker file (C:\ProgramData\.msupdate_check); if the file doesn''t exist, it downloads and executes a second-stage Cobalt Strike payload from a compromised WordPress site (hxxps://legitimate-news[.]com/wp-content/uploads/update.js). The task description is set to ''Core Edge Update Service'' and is registered under the \Microsoft\Windows\Edge path to appear legitimate. The attacker modified the task''s security
  descriptor to deny access to the Administrators group (SDDL: D:P(D;;KA;;;WD)), hiding it from standard schtasks /query operations. Detection came when a security audit script (Audit-ScheduledTasks.ps1) enumerated all scheduled tasks including hidden ones and flagged the non-standard task in the Edge directory. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: Hidden Scheduled Task Executing Encoded PowerShell C2 Payload
  opening: 'An attacker who gained SYSTEM access to APP-SRV-01 (10.10.40.21, Windows Server 2022) created a covert scheduled task named ''MicrosoftEdgeUpdateCore'' disguised as a legitimate Windows task. The task is configured with: schtasks /create /tn \Microsoft\Windows\Edge\MicrosoftEdgeUpdateCore /ru SYSTEM /sc MINUTE /MO 15 /tr ''powershell.exe -WindowStyle Hidden -enc <base64>'' /f.'
  summary: 'An attacker who gained SYSTEM access to APP-SRV-01 (10.10.40.21, Windows Server 2022) created a covert scheduled task named ''MicrosoftEdgeUpdateCore'' disguised as a legitimate Windows task. The task is configured with: schtasks /create /tn \Microsoft\Windows\Edge\MicrosoftEdgeUpdateCore /ru SYSTEM /sc MINUTE /MO 15 /tr ''powershell.exe -WindowStyle Hidden -enc <base64>'' /f. The task executes every 15 minutes using SYSTEM privileges. The PowerShell payload checks for a marker file (C:\ProgramData\.msupdate_check); if the file doesn''t exist, it downloads and executes a second-stage Cobalt Strike payload from a compromised WordPress site (hxxps://legitimate-news[.]com/wp-content/uploads/update.js). The task description is set to ''Core Edge Update Service'' and is registered under the \Microsoft\Windows\Edge path to appear legitimate. The attacker modified the task''s security descriptor to deny access to the Administrators group (SDDL: D:P(D;;KA;;;WD)), hiding it from standard
    schtasks /query operations. Detection came when a security audit script (Audit-ScheduledTasks.ps1) enumerated all scheduled tasks including hidden ones and flagged the non-standard task in the Edge directory.'
  compromised_assets:
  - APP-SRV-01 (10.10.40.21) — Windows Server 2022
  - Scheduled task ('MicrosoftEdgeUpdateCore', SYSTEM, every 15 minutes)
  - C2 channel (15-minute callback interval to compromised WordPress)
  - Compromised WordPress site (legitimate-news[.]com — payload delivery)
  - Marker file system (C:\ProgramData\.msupdate_check)
  - Security descriptor manipulation (task hidden from admin queries)
  detected_via: Hidden scheduled task audit script (Audit-ScheduledTasks.ps1 flagged non-standard Edge task); PowerShell download cradle network alert (legitimate-news[.]com/wp-content/uploads/update.js); marker file anomaly detection
  kill_chain:
  - SYSTEM access obtained on APP-SRV-01 (10.10.40.21)
  - Hidden scheduled task created with SYSTEM permissions (every 15 minutes)
  - PowerShell payload checks marker file before downloading second stage
  - Second-stage Cobalt Strike downloaded from compromised WordPress
  - Task hidden via security descriptor modification (D:P(D;;KA;;;WD))
  - 15-minute C2 callback interval established
  mitre_tactics:
  - TA0003 — Persistence
  - TA0005 — Defense Evasion
  - TA0011 — Command and Control
phases:
- id: scheduled_task_creation_evasion
  phase_type: triage
  title: Scheduled Task Creation & Evasion
  situation: 'The audit script has identified a suspicious scheduled task on APP-SRV-01 (10.10.40.21): ''MicrosoftEdgeUpdateCore'' registered under \Microsoft\Windows\Edge path. The task runs as SYSTEM every 15 minutes with a PowerShell command. The task''s security descriptor denies access to the Administrators group, hiding it from standard schtasks /query. The task was created on March 12 at 02:30 AM. The PowerShell payload includes -WindowStyle Hidden and -ExecutionPolicy Bypass flags. A marker file check (C:\ProgramData\.msupdate_check) prevents redundant payload execution.'
  prompt: How do you respond to the hidden scheduled task?
  guidance:
    what: 'Separate signal from noise: confirm the alert on APP-SRV-01, its severity, and the affected accounts.'
    action: How do you respond to the hidden scheduled task?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Scheduled Task Creation & Evasion. Asset in scope: APP-SRV-01.'
  hints:
  - Environment-wide audit is valuable but should happen after the immediate threat is contained.
  - GPO restrictions are valuable but require testing and deployment time.
  ideal_concepts:
  - malicious scheduled
  - scheduled task
  - task immediately
  - immediately remove
  - marker file
  - file block
  - domain legitimate-news
  - legitimate-news com
  reference_answer: |-
    Delete the malicious scheduled task immediately, remove the marker file, block the C2 domain (legitimate-news[.]com) at the perimeter, investigate how SYSTEM access was obtained, and deploy centralized scheduled task monitoring with alerting on hidden tasks and SDDL modifications

    Why: Deleting the task eliminates persistence. Removing the marker file prevents the payload from re-downloading. Domain blocking stops C2. Investigation identifies the initial access. Monitoring prevents future hidden tasks.
  followup_good: 'The attacker modified the task''s security descriptor to D:P(D;;KA;;;WD), which denies all access to the task entry. This prevents standard tools (schtasks /query, Task Scheduler GUI) from displaying the task. The task can only be discovered by: (1) direct registry inspection (HKLM\Software\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree), (2) PowerShell Get-ScheduledTask with admin privileges, or (3) specialized audit scripts that enumerate tasks via COM interfaces. The SDDL modification was logged in the Security event log (Event ID 4719, Audit Policy Change) but was not triaged.'
  followup_weak: |-
    Deleting the task eliminates persistence.

    The attacker modified the task's security descriptor to D:P(D;;KA;;;WD), which denies all access to the task entry. This prevents standard tools (schtasks /query, Task Scheduler GUI) from displaying the task. The task can only be discovered by: (1) direct registry inspection (HKLM\Software\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree), (2) PowerShell Get-ScheduledTask with admin privileges, or (3) specialized audit scripts that enumerate tasks via COM interfaces. The SDDL modification was logged in the Security event log (Event ID 4719, Audit Policy Change) but was not triaged.
