- id: fallback_persistence_via_debugger
  phase_type: containment
  title: Fallback Persistence via Debugger
  situation: 'Investigation of the registry modifications reveals a secondary persistence mechanism: HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe with value Debugger = C:\Windows\System32\cmd.exe /c powershell -enc <base64>. This means pressing Shift 5 times at the login screen will execute the PowerShell reverse shell instead of the Sticky Keys accessibility feature. The IFEO debugger persistence is a well-known technique that survives Run key removal. Sysmon Event ID 13 captured the IFEO modification but the alert was not triaged.'
  prompt: How do you address the IFEO debugger persistence?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you address the IFEO debugger persistence?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Fallback Persistence via Debugger. Asset in scope: WEB-SRV-02.'
  hints:
  - Removing the single entry is correct but does not address the systemic issue.
  - Disabling Sticky Keys via GPO does not prevent IFEO abuse — the attacker can target other executables.
  - SIEM correlation is valuable for detection but IFEO modifications should be prevented via application control, not just detected.
  ideal_concepts:
  - ifeo debugger
  - debugger entry
  - entry sethc
  - sethc exe
  - exe deploy
  - deploy comprehensive
  - comprehensive ifeo
  - ifeo monitoring
  reference_answer: |-
    Remove the IFEO debugger entry for sethc.exe, deploy a comprehensive IFEO monitoring rule in Sysmon (alert on all IFEO debugger additions), implement application control policies preventing unauthorized IFEO modifications, and audit all IFEO keys across all endpoints

    Why: Removing the IFEO entry eliminates the fallback persistence. Monitoring rules detect future modifications. Application control prevents unauthorized changes. Full audit identifies any other IFEO abuse.
  followup_good: 'The PowerShell reverse shell payload has been decoded and analyzed: it connects to 198.51.100.85:8080 using a TCP socket, executes a download cradle to retrieve a second-stage Cobalt Strike beacon, and establishes a fully interactive reverse shell. The network security appliance has confirmed connections from WEB-SRV-02 to 198.51.100.85:8080 starting at 03:20 AM (5 minutes after registry modification, indicating the server was rebooted). The C2 channel has been active for approximately 48 hours. PowerShell script block logging (Event ID 4104) captured the full decoded payload including the C2 server address and second-stage download URL.'
  followup_weak: |-
    Removing the IFEO entry eliminates the fallback persistence.

    The PowerShell reverse shell payload has been decoded and analyzed: it connects to 198.51.100.85:8080 using a TCP socket, executes a download cradle to retrieve a second-stage Cobalt Strike beacon, and establishes a fully interactive reverse shell. The network security appliance has confirmed connections from WEB-SRV-02 to 198.51.100.85:8080 starting at 03:20 AM (5 minutes after registry modification, indicating the server was rebooted). The C2 channel has been active for approximately 48 hours. PowerShell script block logging (Event ID 4104) captured the full decoded payload including the C2 server address and second-stage download URL.
