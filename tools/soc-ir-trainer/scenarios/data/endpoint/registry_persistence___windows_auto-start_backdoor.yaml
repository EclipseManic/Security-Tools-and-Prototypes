- id: post_incident_review
  phase_type: lessons
  title: Post-Incident Review & Hardening
  situation: Service has been restored and validated. Leadership wants a concise after-action review covering the root cause of Registry Run Key Backdoor with Encoded PowerShell Payload, the detection gap that let the attacker operate, and the control changes that will prevent a repeat. Findings must have owners and dates.
  prompt: What must change so an incident like Registry Run Key Backdoor with Encoded PowerShell Payload is detected earlier and cannot recur?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What must change so an incident like Registry Run Key Backdoor with Encoded PowerShell Payload is detected earlier and cannot recur?
    why: The post-incident review is what turns an incident into a defense.
