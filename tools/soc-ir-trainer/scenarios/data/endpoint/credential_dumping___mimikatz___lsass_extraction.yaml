    (ntdsutil.exe ''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit), and establish Golden Ticket persistence (mimikatz ''kerberos::golden /user:Administrator /domain:corp.local /sid:S-1-5-21-... /krbtgt:<hash> /ptt''). The attack was detected when CrowdStrike Falcon flagged the comsvcs.dll LSASS dump operation (Behavioral Detection: LSASS_ACCESS) and the PowerShell Defender disable command in the process creation log.'
  compromised_assets:
  - LSASS process memory on WS-HR-07 (dumped to C:\ProgramData\lsass.dmp)
  - 340 domain user credentials extracted (plaintext passwords, NTLM hashes)
  - 12 Domain Admin NTLM hashes
  - 'krbtgt NTLM hash (Golden Ticket enablement: b1607d7b...)'
  - DC-01 (10.10.1.10) — NTDS.dit database accessed via Pass-the-Hash
  - svc_backup credentials extracted (backup system access)
  detected_via: CrowdStrike Falcon behavioral detection (LSASS_ACCESS alert on comsvcs.dll MiniDump); PowerShell Defender disable command in process creation log (Event ID 4688); anomalous comsvcs.dll MiniDump call from non-standard process
  kill_chain:
  - Local administrator access obtained on WS-HR-07 (10.10.10.77)
  - Windows Defender disabled via PowerShell (Set-MpPreference, 02:15 AM)
  - LSASS memory dumped via comsvcs.dll MiniDump (rundll32.exe)
  - 340 credentials extracted (including 12 DA accounts and krbtgt hash)
  - Pass-the-Hash lateral movement to DC-01 (10.10.1.10)
  - NTDS.dit database dumped (ntdsutil.exe, C:\temp\ntds)
