  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Post-Incident Review & Hardening. Asset in scope: LSASS process memory on WS-HR-07.'
  hints:
  - What was the earliest signal available, and why was it missed?
