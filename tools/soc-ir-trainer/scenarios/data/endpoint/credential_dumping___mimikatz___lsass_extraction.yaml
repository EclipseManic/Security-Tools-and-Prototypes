- id: pass_the_hash_lateral_movement_ntds_dit_dump
  phase_type: eradication
  title: Pass-the-Hash Lateral Movement & NTDS.dit Dump
  situation: 'The attacker used extracted NTLM hashes for Pass-the-Hash attacks to move laterally to DC-01 (10.10.1.10) at 02:45 AM. Using a compromised Domain Admin hash (svc_backup), the attacker executed: psexec.py corp.local/administrator@10.10.1.10 -hashes aad3b435...:e0fb1fb4... to gain a SYSTEM shell on the domain controller. From DC-01, the attacker dumped the NTDS.dit database using ntdsutil.exe (''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit), extracting all domain user password hashes (4,200 accounts). The attacker also extracted the krbtgt hash for Golden Ticket creation.'
  prompt: How do you respond to the domain controller compromise?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you respond to the domain controller compromise?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Pass-the-Hash Lateral Movement & NTDS.dit Dump. Asset in scope: LSASS process memory on WS-HR-07.'
  hints:
  - Single KRBTGT reset does not fully invalidate all tickets.
  - Rebuilding the DC without credential rotation leaves all stolen hashes active.
  - MDI is excellent for detection but does not contain the active threat.
  ideal_concepts:
  - isolate dc-01
  - dc-01 network
  - network reset
  - krbtgt password
  - password twice
  - twice back-to-back
  - back-to-back force
  - domain admin
  reference_answer: |-
    Isolate DC-01 from the network, reset the krbtgt password twice (back-to-back), force reset all Domain Admin passwords, enable NTDS auditing and alert on ntdsutil.exe execution, implement network segmentation to prevent workstations from directly accessing DCs, and deploy LAPS for local admin password management

    Why: Isolation stops ongoing access. KRBTGT double reset invalidates Golden Tickets. DA password reset invalidates stolen hashes. NTDS auditing detects future dump attempts. Network segmentation prevents workstation-to-DC lateral movement. LAPS eliminates shared local admin passwords.
  followup_good: 'The attacker used the extracted krbtgt hash to create Golden Tickets for persistent domain-wide access. The Golden Ticket was generated with: mimikatz ''kerberos::golden /user:Administrator /domain:corp.local /sid:S-1-5-21-1234567890-1234567890-1234567890 /krbtgt:b1607d7b68f53e26328264664081fd2e /ptt''. The forged ticket has a 10-year lifetime and grants Domain Admin privileges. This persistence mechanism survives password resets for all user accounts — only a KRBTGT double reset can invalidate it. The attacker has confirmed the Golden Ticket works by authenticating to FS-FINANCE-01 and accessing sensitive financial data.'
  followup_weak: |-
    Isolation stops ongoing access.

    The attacker used the extracted krbtgt hash to create Golden Tickets for persistent domain-wide access. The Golden Ticket was generated with: mimikatz 'kerberos::golden /user:Administrator /domain:corp.local /sid:S-1-5-21-1234567890-1234567890-1234567890 /krbtgt:b1607d7b68f53e26328264664081fd2e /ptt'. The forged ticket has a 10-year lifetime and grants Domain Admin privileges. This persistence mechanism survives password resets for all user accounts — only a KRBTGT double reset can invalidate it. The attacker has confirmed the Golden Ticket works by authenticating to FS-FINANCE-01 and accessing sensitive financial data.
