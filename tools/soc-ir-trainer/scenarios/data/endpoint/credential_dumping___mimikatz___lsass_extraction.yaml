    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you complete the Golden Ticket remediation?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Golden Ticket Persistence. Asset in scope: LSASS process memory on WS-HR-07.'
  hints:
