  title: Post-Incident Review & Hardening
  situation: Service has been restored and validated. Leadership wants a concise after-action review covering the root cause of LSASS Memory Dump Extracts Domain Credentials, the detection gap that let the attacker operate, and the control changes that will prevent a repeat. Findings must have owners and dates.
