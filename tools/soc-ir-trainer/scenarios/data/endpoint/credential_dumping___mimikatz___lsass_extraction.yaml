briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to LSASS Memory Dump Extracts Domain Credentials. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for LSASS Memory Dump Extracts Domain Credentials. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for LSASS Memory Dump Extracts Domain Credentials. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the LSASS Memory Dump Extracts Domain Credentials incident. An attacker who gained local administrator access on a Windows 10 workstation (WS-HR-07, 10.10.10.77, Windows 10 21H2) used Mimikatz (mimikatz.exe, SHA256: 9a8b...) to dump the LSASS (Local Security Authority Subsystem Service) process memory, extracting plaintext passwords, NTLM hashes, and Kerberos tickets for 340 domain users. The extraction was performed using sekurlsa::logonpasswords after the attacker disabled Windows Defender via PowerShell (Set-MpPreference -DisableRealtimeMonitoring $true) at 02:15 AM on March 14, and created a dump file of LSASS using comsvcs.dll MiniDump (rundll32.exe comsvcs.dll MiniDump <lsass_pid> C:\ProgramData\lsass.dmp full). The dumped credentials included 12 Domain Admin accounts, the krbtgt account hash (NTLM: b1607d7b68f53e26328264664081fd2e), and service account credentials for the backup system (svc_backup). The attacker used the extracted credentials
  for Pass-the-Hash attacks to move laterally to DC-01 (10.10.1.10), dump the NTDS.dit database (ntdsutil.exe ''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit), and establish Golden Ticket persistence (mimikatz ''kerberos::golden /user:Administrator /domain:corp.local /sid:S-1-5-21-... /krbtgt:<hash> /ptt''). The attack was detected when CrowdStrike Falcon flagged the comsvcs.dll LSASS dump operation (Behavioral Detection: LSASS_ACCESS) and the PowerShell Defender disable command in the process creation log. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
