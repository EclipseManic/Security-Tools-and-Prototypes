phases:
- id: defense_evasion_defender_disabling
  phase_type: triage
  title: Defense Evasion — Defender Disabling
  situation: At 02:15 AM on March 14, the attacker executed PowerShell command 'Set-MpPreference -DisableRealtimeMonitoring $true' on WS-HR-07 (10.10.10.77) to disable Windows Defender. The command was logged in PowerShell ScriptBlock Logging (Event ID 4104) and Process Creation (Event ID 4688). Windows Defender tamper protection was not enabled. The attacker then created a scheduled task (HiddenUpdateTask) to re-disable Defender on reboot. The attacker's next expected action is credential dumping from LSASS.
  prompt: How do you respond to the Defender disable command?
  guidance:
    what: Establish what fired on LSASS process memory on WS-HR-07, which accounts are involved, and how urgent the signal is.
    action: How do you respond to the Defender disable command?
    why: Every later decision depends on an accurate picture of LSASS process memory on WS-HR-07 and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Defense Evasion — Defender Disabling. Asset in scope: LSASS process memory on WS-HR-07.'
  hints:
  - Re-enabling Defender is correct but does not address the underlying compromise.
  - EDR deployment is valuable but does not address the immediate threat.
  - Password reset does not address the local administrator compromise.
  ideal_concepts:
  - immediately isolate
  - isolate ws-hr-07
  - ws-hr-07 network
  - network re-enable
  - re-enable windows
  - windows defender
  - defender gpo
  - gpo tamper
  reference_answer: |-
    Immediately isolate WS-HR-07 from the network, re-enable Windows Defender via GPO (Tamper Protection), investigate the PowerShell execution context to identify the attacker's session, and preserve all logs for forensic analysis

    Why: Network isolation prevents lateral movement. Tamper Protection prevents Defender from being disabled again. Execution context analysis identifies the attacker's access path. Log preservation maintains forensic evidence.
  followup_good: 'The attacker has executed comsvcs.dll MiniDump to dump LSASS process memory to C:\ProgramData\lsass.dmp (file size: 2.1 GB). The dump was created using: rundll32.exe comsvcs.dll MiniDump <lsass_pid> C:\ProgramData\lsass.dmp full. The LSASS process is running as a standard Windows process (not Protected Process Light/PPL). Credential Guard is not enabled on this system. The attacker is now parsing the dump file using Mimikatz (sekurlsa::logonpasswords) to extract: plaintext passwords, NTLM hashes, Kerberos tickets, and WDigest credentials. The dump contains credentials for 340 active domain users including 12 Domain Admin accounts.'
  followup_weak: |-
    Network isolation prevents lateral movement.

