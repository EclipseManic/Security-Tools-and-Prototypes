  reference_answer: |-
    Reset the KRBTGT password twice within 12 hours (first reset invalidates current TGTs, second reset invalidates cached tickets), implement Kerberos armoring (FAST) on all DCs, enforce 60-day KRBTGT rotation policy via automated GPO, and deploy Golden Ticket detection rules in SIEM (anomalous ticket lifetime, RC4 usage)

    Why: Double KRBTGT reset is the only way to fully invalidate Golden Tickets. Kerberos armoring prevents future ticket forging. Automated rotation prevents policy violations. SIEM rules provide ongoing detection.
