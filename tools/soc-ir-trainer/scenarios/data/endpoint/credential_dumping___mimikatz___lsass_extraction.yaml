- id: lsass_memory_dumping
  phase_type: analysis
  title: LSASS Memory Dumping
  situation: 'The attacker has executed comsvcs.dll MiniDump to dump LSASS process memory to C:\ProgramData\lsass.dmp (file size: 2.1 GB). The dump was created using: rundll32.exe comsvcs.dll MiniDump <lsass_pid> C:\ProgramData\lsass.dmp full. The LSASS process is running as a standard Windows process (not Protected Process Light/PPL). Credential Guard is not enabled on this system. The attacker is now parsing the dump file using Mimikatz (sekurlsa::logonpasswords) to extract: plaintext passwords, NTLM hashes, Kerberos tickets, and WDigest credentials. The dump contains credentials for 340 active domain users including 12 Domain Admin accounts.'
  prompt: How do you respond to the LSASS memory dump?
  guidance:
    what: Test the initial theory against telemetry from LSASS process memory on WS-HR-07 before committing to a response.
    action: How do you respond to the LSASS memory dump?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: LSASS Memory Dumping. Asset in scope: LSASS process memory on WS-HR-07.'
  hints:
  - Deleting the dump file removes the forensic evidence but does not address the 340 credentials already extracted.
  - PPL protection prevents future dumps but does not invalidate the 340 credentials already extracted.
  - Forensic analysis is valuable for scoping but the attacker already has the credentials.
  ideal_concepts:
  - terminate attacker
  - attacker session
  - session ws-hr-07
  - ws-hr-07 isolate
  - isolate workstation
  - workstation enable
  - credential guard
  - guard lsass
  reference_answer: |-
    Terminate the attacker's session on WS-HR-07, isolate the workstation, enable Credential Guard and LSASS protection (RunAsPPL) on all endpoints via GPO, force a mass password reset for all 340 potentially compromised accounts, and block the lsass.dmp file hash across all endpoints

    Why: Session termination stops ongoing credential extraction. Isolation prevents lateral movement. Credential Guard and PPL protect LSASS from future dumps. Password reset invalidates stolen credentials. File hash blocking prevents the dump from being used elsewhere.
  followup_good: 'The attacker used extracted NTLM hashes for Pass-the-Hash attacks to move laterally to DC-01 (10.10.1.10) at 02:45 AM. Using a compromised Domain Admin hash (svc_backup), the attacker executed: psexec.py corp.local/administrator@10.10.1.10 -hashes aad3b435...:e0fb1fb4... to gain a SYSTEM shell on the domain controller. From DC-01, the attacker dumped the NTDS.dit database using ntdsutil.exe (''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit), extracting all domain user password hashes (4,200 accounts). The attacker also extracted the krbtgt hash for Golden Ticket creation.'
  followup_weak: |-
    Session termination stops ongoing credential extraction.

    The attacker used extracted NTLM hashes for Pass-the-Hash attacks to move laterally to DC-01 (10.10.1.10) at 02:45 AM. Using a compromised Domain Admin hash (svc_backup), the attacker executed: psexec.py corp.local/administrator@10.10.1.10 -hashes aad3b435...:e0fb1fb4... to gain a SYSTEM shell on the domain controller. From DC-01, the attacker dumped the NTDS.dit database using ntdsutil.exe ('activate instance ntds' 'ifm' 'create full C:\temp\ntds' quit quit), extracting all domain user password hashes (4,200 accounts). The attacker also extracted the krbtgt hash for Golden Ticket creation.
