phases:
- id: proxyshell_exploitation_chain
  phase_type: triage
  title: ProxyShell Exploitation Chain
  situation: 'The threat intelligence feed has identified C2 infrastructure (198.51.100.66) communicating with EXCH-01 (10.10.1.20). Investigation reveals a web shell at /owa/auth/x.aspx (SHA256: 7d2f...) planted on March 3 at 02:15 AM. The web shell was created via the ProxyShell chain: CVE-2021-34473 (pre-auth path confusion) + CVE-2021-34523 (Org Admin EoP) + CVE-2021-31207 (file write). The web shell provides command execution as the Exchange Server machine account (EXCH-01$). A second HAFNIUM-attributed web shell (chopper.aspx) was found at /owa/auth/chopper.aspx. The Exchange server had not been patched for any of the three CVEs.'
  prompt: How do you respond to the ProxyShell exploitation?
  guidance:
    what: Establish what fired on EXCH-01, which accounts are involved, and how urgent the signal is.
    action: How do you respond to the ProxyShell exploitation?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: ProxyShell Exploitation Chain. Asset in scope: EXCH-01.'
  hints:
  - EOMT provides temporary mitigation but does not replace proper patching.
  - Isolation stops C2 but leaves the web shells in place.
  - User notification is important but secondary to containment.
  ideal_concepts:
  - immediately remove
  - web shells
  - shells aspx
  - aspx chopper
  - chopper aspx
  - aspx patch
  - patch exchange
  - exchange servers
  reference_answer: |-
    Immediately remove all web shells (x.aspx, chopper.aspx), patch all Exchange servers for CVE-2021-34473/34523/31207, disable external PowerShell access on Exchange, block C2 IP 198.51.100.66, and audit all 3 Exchange servers for additional web shells and modifications

    Why: Web shell removal eliminates active attacker access. Patching closes all three CVEs. External PowerShell disablement prevents future exploitation. IP blocking stops C2. Full audit identifies all compromise.
  followup_good: 'Exchange PowerShell logs reveal that the attacker executed New-MailboxExportRequest commands via the web shell to export all mailboxes including: CEO (ceo@corp.local), CFO (cfo@corp.local), legal department (legal-team@corp.local), and 847 other mailboxes. Total export: 4.7 GB of email data staged at C:\ProgramData\export\PST\. The exported PST files were then exfiltrated via the web shell to attacker infrastructure (198.51.100.66:443). The exports included emails, calendar entries, and attachments containing confidential business plans, M&A documents, and financial projections. The export occurred over 3 days (March 5-7) with exports scheduled during off-hours (10 PM - 6 AM).'
  followup_weak: |-
    Web shell removal eliminates active attacker access.

    Exchange PowerShell logs reveal that the attacker executed New-MailboxExportRequest commands via the web shell to export all mailboxes including: CEO (ceo@corp.local), CFO (cfo@corp.local), legal department (legal-team@corp.local), and 847 other mailboxes. Total export: 4.7 GB of email data staged at C:\ProgramData\export\PST\. The exported PST files were then exfiltrated via the web shell to attacker infrastructure (198.51.100.66:443). The exports included emails, calendar entries, and attachments containing confidential business plans, M&A documents, and financial projections. The export occurred over 3 days (March 5-7) with exports scheduled during off-hours (10 PM - 6 AM).
