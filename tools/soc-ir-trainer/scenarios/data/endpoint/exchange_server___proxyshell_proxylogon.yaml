- id: mailbox_data_exfiltration
  phase_type: analysis
  title: Mailbox Data Exfiltration
  situation: 'Exchange PowerShell logs reveal that the attacker executed New-MailboxExportRequest commands via the web shell to export all mailboxes including: CEO (ceo@corp.local), CFO (cfo@corp.local), legal department (legal-team@corp.local), and 847 other mailboxes. Total export: 4.7 GB of email data staged at C:\ProgramData\export\PST\. The exported PST files were then exfiltrated via the web shell to attacker infrastructure (198.51.100.66:443). The exports included emails, calendar entries, and attachments containing confidential business plans, M&A documents, and financial projections. The export occurred over 3 days (March 5-7) with exports scheduled during off-hours (10 PM - 6 AM).'
  prompt: How do you respond to the mailbox data exfiltration?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on EXCH-01.
    action: How do you respond to the mailbox data exfiltration?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Mailbox Data Exfiltration. Asset in scope: EXCH-01.'
  hints:
  - DCSync permission revocation is important but does not address the ongoing mailbox export.
  - Email encryption protects future communications but does not address the 4.7 GB already exfiltrated.
  ideal_concepts:
  - web shells
  - shells immediately
  - immediately block
  - exfiltration implement
  - implement exchange
  - exchange powershell
  - powershell command
  - command monitoring
  reference_answer: |-
    Remove all web shells immediately, block exfiltration IP 198.51.100.66, implement Exchange PowerShell command monitoring with alerting on New-MailboxExportRequest, deploy DLP policies for email data, and notify legal counsel about the breach involving CEO, CFO, and legal communications

    Why: Web shell removal stops ongoing exports. IP blocking prevents exfiltration. PowerShell monitoring detects future commands. DLP prevents data leakage. Legal notification addresses breach notification requirements for executive communications.
  followup_good: The attacker leveraged the Exchange Server's machine account (EXCH-01$, SID S-1-5-21-1234567890-1234567890-1234567890-1104) Replicating Directory Changes permission to perform DCSync, extracting the KRBTGT hash (b1607d7b68f53e26328264664081fd2e) from DC-01 (10.10.1.10). The DCSync was executed at 04:30 AM on March 8 using mimikatz 'lsadump::dcsync /user:krbtgt' run from the Exchange server context. The KRBTGT hash enables Golden Ticket creation for persistent domain-wide access. The Exchange machine account has Replicating Directory Changes permission by default — this permission was never reviewed or restricted.
  followup_weak: |-
    Web shell removal stops ongoing exports.

    The attacker leveraged the Exchange Server's machine account (EXCH-01$, SID S-1-5-21-1234567890-1234567890-1234567890-1104) Replicating Directory Changes permission to perform DCSync, extracting the KRBTGT hash (b1607d7b68f53e26328264664081fd2e) from DC-01 (10.10.1.10). The DCSync was executed at 04:30 AM on March 8 using mimikatz 'lsadump::dcsync /user:krbtgt' run from the Exchange server context. The KRBTGT hash enables Golden Ticket creation for persistent domain-wide access. The Exchange machine account has Replicating Directory Changes permission by default — this permission was never reviewed or restricted.
