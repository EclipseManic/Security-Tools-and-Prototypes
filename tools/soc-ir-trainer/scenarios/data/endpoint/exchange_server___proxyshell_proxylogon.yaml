- id: golden_ticket_full_remediation
  phase_type: eradication
  title: Golden Ticket & Full Remediation
  situation: 'The attacker has used the KRBTGT hash to create Golden Tickets for persistent domain-wide access. The forged tickets grant Domain Admin privileges with a 10-year lifetime. All three Exchange servers (EXCH-01, EXCH-02, EXCH-03) have web shells planted. The scope of the compromise includes: email data exfiltration (4.7 GB), domain credential extraction (all 4,200 accounts via DCSync), and Golden Ticket persistence. The CISO has requested a comprehensive remediation plan covering web shell removal, credential rotation, Exchange hardening, and domain-wide security improvements.'
  prompt: How do you execute the comprehensive Exchange and domain remediation?
  guidance:
    what: Find every foothold the attacker left on EXCH-01, including persistence and stolen credentials.
    action: How do you execute the comprehensive Exchange and domain remediation?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Golden Ticket & Full Remediation. Asset in scope: EXCH-01.'
  hints:
  - Without patching, the ProxyShell vulnerability remains exploitable.
  - Cloud migration is valid but complex and time-consuming.
  - SIEM integration is valuable for detection but does not address the active web shells, unpatched vulnerabilities, or compromised credentials.
  ideal_concepts:
  - web shells
  - shells exchange
  - exchange servers
  - servers patch
  - patch exchange
  - servers reset
  - krbtgt password
  - password twice
  reference_answer: |-
    Remove all web shells from all 3 Exchange servers, patch all Exchange servers, reset KRBTGT password twice, remove Exchange machine account DCSync permissions, enable Exchange Extended Protection, deploy web application firewall rules for Exchange, implement Exchange logging to SIEM, and conduct full domain audit for additional compromise

    Why: Complete remediation addresses all attack vectors: web shell removal, patching, credential rotation, permission hardening, logging, and audit. This provides defense in depth against both the current and future attacks.
