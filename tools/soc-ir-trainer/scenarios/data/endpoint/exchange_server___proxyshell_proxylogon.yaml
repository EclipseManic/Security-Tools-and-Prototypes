- id: domain_compromise_via_dcsync
  phase_type: eradication
  title: Domain Compromise via DCSync
  situation: The attacker leveraged the Exchange Server's machine account (EXCH-01$, SID S-1-5-21-1234567890-1234567890-1234567890-1104) Replicating Directory Changes permission to perform DCSync, extracting the KRBTGT hash (b1607d7b68f53e26328264664081fd2e) from DC-01 (10.10.1.10). The DCSync was executed at 04:30 AM on March 8 using mimikatz 'lsadump::dcsync /user:krbtgt' run from the Exchange server context. The KRBTGT hash enables Golden Ticket creation for persistent domain-wide access. The Exchange machine account has Replicating Directory Changes permission by default — this permission was never reviewed or restricted.
  prompt: How do you respond to the DCSync via Exchange machine account?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you respond to the DCSync via Exchange machine account?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Domain Compromise via DCSync. Asset in scope: EXCH-01.'
  hints:
  - Without removing the Exchange account's DCSync permissions, the attacker can re-extract the KRBTGT hash after reset.
  - MDI is excellent for detection but the existing DCSync permissions must be removed.
  - Exchange migration is a valid long-term strategy but does not address the immediate DCSync permission issue.
  ideal_concepts:
  - exchange machine
  - machine account
  - account exch-01
  - exch-01 replicating
  - replicating directory
  - directory changes
  - changes replicating
  - changes permission
  reference_answer: |-
    Remove the Exchange machine account (EXCH-01$) from the Replicating Directory Changes and Replicating Directory Changes All permission groups, reset the KRBTGT password twice, implement monitoring for DCSync attempts from non-DC accounts, and audit Exchange machine account permissions across the environment

    Why: Removing DCSync permissions prevents future KRBTGT extraction. KRBTGT double reset invalidates any Golden Tickets. DCSync monitoring detects future attempts. Permission audit identifies any other accounts with unnecessary replication rights.
  followup_good: 'The attacker has used the KRBTGT hash to create Golden Tickets for persistent domain-wide access. The forged tickets grant Domain Admin privileges with a 10-year lifetime. All three Exchange servers (EXCH-01, EXCH-02, EXCH-03) have web shells planted. The scope of the compromise includes: email data exfiltration (4.7 GB), domain credential extraction (all 4,200 accounts via DCSync), and Golden Ticket persistence. The CISO has requested a comprehensive remediation plan covering web shell removal, credential rotation, Exchange hardening, and domain-wide security improvements.'
  followup_weak: |-
    Removing DCSync permissions prevents future KRBTGT extraction.

    The attacker has used the KRBTGT hash to create Golden Tickets for persistent domain-wide access. The forged tickets grant Domain Admin privileges with a 10-year lifetime. All three Exchange servers (EXCH-01, EXCH-02, EXCH-03) have web shells planted. The scope of the compromise includes: email data exfiltration (4.7 GB), domain credential extraction (all 4,200 accounts via DCSync), and Golden Ticket persistence. The CISO has requested a comprehensive remediation plan covering web shell removal, credential rotation, Exchange hardening, and domain-wide security improvements.
