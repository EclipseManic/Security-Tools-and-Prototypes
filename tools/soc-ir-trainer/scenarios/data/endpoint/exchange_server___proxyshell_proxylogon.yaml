  compromised_assets:
  - EXCH-01 (10.10.1.20) — Exchange Server 2019 CU11 (ProxyShell exploited)
  - EXCH-02 (10.10.1.21), EXCH-03 (10.10.1.22) — web shells planted
  - All Exchange mailboxes (4.7 GB email data — CEO, CFO, legal)
  - Exchange machine account (EXCH-01$ — DCSync capable)
  - 'KRBTGT hash (Golden Ticket enablement: b1607d7b...)'
  - 'Web shells: x.aspx (attacker custom), chopper.aspx (HAFNIUM-attributed)'
  detected_via: Microsoft threat intelligence C2 feed (IP 198.51.100.66 associated with known APT); web shell file detection (x.aspx, chopper.aspx in /owa/auth/); anomalous Exchange PowerShell commands (New-MailboxExportRequest)
  kill_chain:
  - CVE-2021-34473 pre-auth path confusion bypasses authentication
  - CVE-2021-34523 Elevation to Exchange Organization Admin
  - CVE-2021-31207 file write to web shell (/owa/auth/x.aspx)
  - Exchange PowerShell mailbox export (4.7 GB — CEO, CFO, legal)
  - DCSync via Exchange machine account (EXCH-01$)
