briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to ProxyShell Chain Compromises Exchange and Domain Environment. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for ProxyShell Chain Compromises Exchange and Domain Environment. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for ProxyShell Chain Compromises Exchange and Domain Environment. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the ProxyShell Chain Compromises Exchange and Domain Environment incident. An attacker exploited the ProxyShell vulnerability chain (CVE-2021-34473, CVE-2021-34523, CVE-2021-31207) on an unpatched Microsoft Exchange Server 2019 (EXCH-01, 10.10.1.20, Exchange CU11) to achieve pre-authentication remote code execution and full domain compromise. The attack chain: (1) CVE-2021-34473 (pre-auth path confusion) bypasses authentication, (2) CVE-2021-34523 (Elevation of Privilege) gains Exchange admin permissions via /autodiscover/autodiscover.json with X-Exchange-ESMS-AutoDiscoverType=Organization, (3) CVE-2021-31207 (Post-Authentication File Write) writes a web shell to the Exchange Frontend at /owa/auth/x.aspx. Through the web shell, the attacker executed Exchange PowerShell commands to export all mailboxes (CEO, CFO, legal department — totaling 4.7 GB of email data) to PST files staged at C:\ProgramData\export\PST\. The attacker used the Exchange Server''s
  machine account (EXCH-01$, SID S-1-5-21-...-1104) to perform a DCSync attack, extracting the KRBTGT hash and creating a Golden Ticket. A HAFNIUM-attributed web shell (chopper.aspx) was found alongside the attacker''s custom web shell. The compromise affected 3 Exchange servers (EXCH-01, EXCH-02, EXCH-03) and was detected 11 days after initial exploitation (March 3-14) when Microsoft threat intelligence feed identified the C2 infrastructure communicating with the Exchange servers. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
