briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to DLL Search Order Hijacking in VPN Client. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for DLL Search Order Hijacking in VPN Client. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for DLL Search Order Hijacking in VPN Client. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the DLL Search Order Hijacking in VPN Client incident. A threat actor identified that the corporate Cisco AnyConnect VPN client (version 4.10.08029) loads vcruntime140.dll from the application directory without verifying the DLL''s digital signature. The attacker placed a malicious vcruntime140.dll in the AnyConnect installation directory (C:\Program Files (x86)\Cisco\Cisco AnyConnect Secure Mobility Client\) that proxies legitimate DLL functions while executing a Meterpreter reverse shell (198.51.100.102:443) on VPN connection. The malicious DLL was planted via a compromised SCCM deployment package (SCCM-AC-PKG-2024) during a routine VPN client update pushed on March 1 at 02:00 AM. The DLL has a valid code signing certificate from ''DigitalZone LLC'' (stolen certificate, serial: 3F:8A:2B:C4:D5:E6:F7:01:23:45:67:89:AB:CD:EF:01). Because the DLL maintains the original library''s exported function signatures (139 exported functions), the VPN client operates
  normally, and the backdoor activates only when users connect to the VPN — meaning every remote employee''s connection to the corporate network also establishes a covert C2 channel. The compromise affected 847 endpoints over 3 weeks (March 1-21) before a DLL hash comparison against Cisco''s known-good values (SHA256: 8a3f...) revealed the discrepancy. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
