- id: post_incident_review
  phase_type: lessons
  title: Post-Incident Review & Hardening
  situation: Service has been restored and validated. Leadership wants a concise after-action review covering the root cause of DLL Search Order Hijacking in VPN Client, the detection gap that let the attacker operate, and the control changes that will prevent a repeat. Findings must have owners and dates.
  prompt: What must change so an incident like DLL Search Order Hijacking in VPN Client is detected earlier and cannot recur?
