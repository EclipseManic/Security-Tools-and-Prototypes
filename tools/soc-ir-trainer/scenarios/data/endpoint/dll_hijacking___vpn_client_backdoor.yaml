phases:
- id: dll_planting_via_software_deployment
  phase_type: triage
  title: DLL Planting via Software Deployment
  situation: 'The SOC has identified that the SCCM deployment package SCCM-AC-PKG-2024 (pushed on March 1 at 02:00 AM) contained a malicious vcruntime140.dll (SHA256: 7b2c...) alongside the legitimate AnyConnect installer. The malicious DLL has a valid code signing certificate from DigitalZone LLC (stolen certificate). The package was distributed to 847 endpoints across the organization. The SCCM distribution point (SCCM-SRV-01, 10.10.1.50) shows the package was modified on February 28 at 23:45 AM. No package integrity verification was in place for SCCM deployments.'
  prompt: How do you respond to the compromised SCCM deployment?
  guidance:
    what: 'Separate signal from noise: confirm the alert on 847 corporate endpoints, its severity, and the affected accounts.'
    action: How do you respond to the compromised SCCM deployment?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: DLL Planting via Software Deployment. Asset in scope: 847 corporate endpoints.'
  hints:
  - Monitoring without action allows the malicious DLL to continue executing on 847 endpoints.
  - Pushing a new package does not remove the malicious DLL from the filesystem.
  ideal_concepts:
  - immediately retract
  - retract sccm
  - sccm package
  - package endpoints
  - endpoints block
  - malicious dll
  - dll hash
  - hash across
  reference_answer: |-
    Immediately retract the SCCM package from all endpoints, block the malicious DLL hash across all endpoints via application control policy, quarantine the SCCM distribution point for forensic analysis, and implement package signing and integrity verification for all future deployments

    Why: Retracting the package stops further deployment. Application control blocks the malicious DLL execution. Forensic analysis identifies the compromise vector. Package signing prevents future tampering.
  followup_good: Analysis of the malicious vcruntime140.dll reveals it exports all 139 functions from the legitimate vcruntime140.dll, proxying each call to the real DLL loaded from system32. During proxy execution, the DLL allocates memory (VirtualAlloc), decrypts a Meterpreter stager (AES-256-CBC), and creates a reverse HTTPS connection to 198.51.100.102:443. The DLL uses GetProcAddress to dynamically resolve the proxy function addresses at runtime, making static analysis difficult. The backdoor activates during vpnui.exe startup when AnyConnect loads the DLL from its application directory before checking system directories.
  followup_weak: |-
    Retracting the package stops further deployment.

    Analysis of the malicious vcruntime140.dll reveals it exports all 139 functions from the legitimate vcruntime140.dll, proxying each call to the real DLL loaded from system32. During proxy execution, the DLL allocates memory (VirtualAlloc), decrypts a Meterpreter stager (AES-256-CBC), and creates a reverse HTTPS connection to 198.51.100.102:443. The DLL uses GetProcAddress to dynamically resolve the proxy function addresses at runtime, making static analysis difficult. The backdoor activates during vpnui.exe startup when AnyConnect loads the DLL from its application directory before checking system directories.
