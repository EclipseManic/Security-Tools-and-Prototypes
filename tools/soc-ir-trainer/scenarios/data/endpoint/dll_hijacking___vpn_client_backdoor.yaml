- id: dll_proxy_code_execution
  phase_type: containment
  title: DLL Proxy & Code Execution
  situation: Analysis of the malicious vcruntime140.dll reveals it exports all 139 functions from the legitimate vcruntime140.dll, proxying each call to the real DLL loaded from system32. During proxy execution, the DLL allocates memory (VirtualAlloc), decrypts a Meterpreter stager (AES-256-CBC), and creates a reverse HTTPS connection to 198.51.100.102:443. The DLL uses GetProcAddress to dynamically resolve the proxy function addresses at runtime, making static analysis difficult. The backdoor activates during vpnui.exe startup when AnyConnect loads the DLL from its application directory before checking system directories.
  prompt: How do you address the DLL proxy execution?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you address the DLL proxy execution?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: DLL Proxy & Code Execution. Asset in scope: 847 corporate endpoints.'
  hints:
  - PowerShell logging is useful for detecting script-based attacks but the DLL proxy uses direct Win32 API calls.
  - Consider the affected accounts and their privilege level.
  ideal_concepts:
  - windows defender
  - defender application
  - application control
  - control wdac
  - wdac policies
  - policies enforce
  - enforce dll
  - dll signature
  reference_answer: |-
    Enable Windows Defender Application Control (WDAC) policies to enforce DLL signature validation, block the malicious DLL hash across all endpoints via group policy, and deploy EDR with behavioral detection for Meterpreter injection patterns

    Why: WDAC prevents unsigned or unauthorized DLLs from loading. Hash blocking provides immediate protection. EDR behavioral detection catches the Meterpreter injection even if the DLL is present.
  followup_good: Network analysis reveals 847 active HTTPS connections from various endpoints to 198.51.100.102:443. The C2 traffic is encrypted and blends with normal VPN traffic since it originates from VPN-connected clients. The C2 server has been active since March 1 and has been receiving periodic check-ins from all 847 compromised endpoints. The attacker has likely established full Meterpreter sessions with SYSTEM privileges on each endpoint. Forensic analysis of one captured session reveals the attacker has been running Mimikatz on compromised endpoints to extract additional credentials.
  followup_weak: |-
    WDAC prevents unsigned or unauthorized DLLs from loading.

