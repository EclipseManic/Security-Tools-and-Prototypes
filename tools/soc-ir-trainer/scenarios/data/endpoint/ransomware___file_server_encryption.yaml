  prompt: What is your containment and recovery strategy?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: What is your containment and recovery strategy?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Mass Encryption Deployment. Asset in scope: FS-PROD-01.'
  hints:
  - Paying the ransom funds criminal operations, does not guarantee decryption (many attackers provide incomplete keys), and does not address the exfiltrated data or the persistent backdoor.
  - System rebuild is part of recovery but does not address the exfiltrated data or the need to identify and close the initial attack vector.
  ideal_concepts:
  - isolate file
  - file server
  - server preserve
  - preserve forensic
  - forensic evidence
  - evidence block
  - identified attacker
  - attacker infrastructure
  reference_answer: |-
    Isolate the file server, preserve forensic evidence, block all identified attacker infrastructure at the perimeter, initiate recovery from immutable backups, and notify legal/law enforcement regarding the data exfiltration

    Why: Comprehensive response: containment stops ongoing damage, evidence preservation supports investigation, blocking attacker infrastructure prevents follow-up attacks, backup recovery restores operations, and legal notification addresses the breach notification requirements.
