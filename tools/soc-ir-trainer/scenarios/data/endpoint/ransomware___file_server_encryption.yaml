- id: credential_harvesting_lateral_movement
  phase_type: analysis
  title: Credential Harvesting & Lateral Movement
  situation: 'Forensic analysis of the memory dump from WS-JMARTINEZ-04 reveals that the attacker ran Mimikatz (sekurlsa::logonpasswords) at 01:58 AM and extracted domain admin credentials for svc_backup (NTLM hash: aad3b435b51404eeaad3b435b51404ee:e0fb1fb45ae778453441514326c09336). PsExec artifacts show lateral movement to FS-PROD-01 (10.10.20.15) at 02:15 AM. Network logs show WMI connections from 10.10.10.44 to 10.10.30.22 (DB-PROD-01) at 02:20 AM. The attacker appears to be mapping the network before deploying ransomware.'
  prompt: How do you respond to the credential harvesting and lateral movement evidence?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you respond to the credential harvesting and lateral movement evidence?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Credential Harvesting & Lateral Movement. Asset in scope: FS-PROD-01.'
  hints:
  - Segmentation is a good long-term measure but does not address the immediate threat.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - immediately reset
  - domain admin
  - admin passwords
  - passwords enable
  - credential guard
  - guard lsa
  - lsa protection
  - protection runasppl
  reference_answer: |-
    Immediately reset all Domain Admin passwords, enable Credential Guard and LSA protection (RunAsPPL) on all DCs, and isolate both FS-PROD-01 and DB-PROD-01

    Why: Resetting all DA passwords invalidates the stolen credentials. LSA protection prevents future Mimikatz-style dumps. Isolating the targeted servers prevents ransomware deployment.
  followup_good: At 02:43 AM, the attacker executed 'vssadmin delete shadows /all /quiet' on FS-PROD-01 and deleted all backup catalog files from D:\Backups\. Event logs show the VSS service was stopped and restarted multiple times. The backup server (BACKUP-SRV-01 at 10.10.20.50) reports that its Veeam agent on FS-PROD-01 stopped reporting at 02:40 AM. You have confirmed that immutable offsite backups exist at the secondary data center ( replicas updated as of 01:30 AM), but the local recovery options have been destroyed.
  followup_weak: |-
    Resetting all DA passwords invalidates the stolen credentials.

    At 02:43 AM, the attacker executed 'vssadmin delete shadows /all /quiet' on FS-PROD-01 and deleted all backup catalog files from D:\Backups\. Event logs show the VSS service was stopped and restarted multiple times. The backup server (BACKUP-SRV-01 at 10.10.20.50) reports that its Veeam agent on FS-PROD-01 stopped reporting at 02:40 AM. You have confirmed that immutable offsite backups exist at the secondary data center ( replicas updated as of 01:30 AM), but the local recovery options have been destroyed.
