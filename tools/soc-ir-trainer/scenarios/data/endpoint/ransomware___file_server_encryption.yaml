- id: backup_destruction_vss_deletion
  phase_type: eradication
  title: Backup Destruction & VSS Deletion
  situation: At 02:43 AM, the attacker executed 'vssadmin delete shadows /all /quiet' on FS-PROD-01 and deleted all backup catalog files from D:\Backups\. Event logs show the VSS service was stopped and restarted multiple times. The backup server (BACKUP-SRV-01 at 10.10.20.50) reports that its Veeam agent on FS-PROD-01 stopped reporting at 02:40 AM. You have confirmed that immutable offsite backups exist at the secondary data center ( replicas updated as of 01:30 AM), but the local recovery options have been destroyed.
  prompt: How do you respond to the backup destruction activity?
  guidance:
    what: Find every foothold the attacker left on FS-PROD-01, including persistence and stolen credentials.
    action: How do you respond to the backup destruction activity?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Backup Destruction & VSS Deletion. Asset in scope: FS-PROD-01.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - immediately disconnect
  - disconnect fs-prod-01
  - fs-prod-01 networks
  - networks halt
  - halt ongoing
  - ongoing encryption
  - encryption begin
  - begin recovery
  reference_answer: |-
    Immediately disconnect FS-PROD-01 from all networks, halt any ongoing encryption, and begin recovery planning using the immutable offsite backups

    Why: Disconnecting the server stops the encryption and further backup destruction. The immutable offsite backups provide a viable recovery path since they cannot be modified by the attacker.
  followup_good: 'At 02:47 AM, the ransomware binary (C:\ProgramData\Microsoft\svchost.exe) began encrypting all accessible SMB shares using AES-256 with RSA-2048 key wrapping. File extensions are being changed to .locked. A ransom note (RECOVER-FILES.txt) has been dropped on every affected share with a Tor payment URL. Approximately 87% of data is now encrypted. The attacker has also begun exfiltrating HR documents to an external server (confirmed: 3.2 GB uploaded to 203.0.113.50 before detection). You have the immutable offsite backup ready for recovery and the attacker''s C2 infrastructure identified.'
  followup_weak: |-
    Disconnecting the server stops the encryption and further backup destruction.

