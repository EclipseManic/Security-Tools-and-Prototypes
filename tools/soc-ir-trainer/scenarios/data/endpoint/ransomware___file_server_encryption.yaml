id: ransomware___file_server_encryption
name: Ransomware — File Server Encryption
category: Endpoint
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Ransomware Deployment on Primary File Server. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Ransomware Deployment on Primary File Server. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Ransomware Deployment on Primary File Server. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Ransomware Deployment on Primary File Server incident. At 02:47 AM on March 14, monitoring detected a spike in disk I/O on FS-PROD-01 (10.10.20.15), the organization''s primary Windows file server hosting 4.2 TB of shared departmental data. Within 18 minutes, the CryptoLocker variant began encrypting files across all mounted SMB shares (\\FS-PROD-01\Finance, \\FS-PROD-01\Engineering, \\FS-PROD-01\HR), deploying a custom .locked extension with RSA-2048 asymmetric encryption. The initial entry vector was a phishing email sent to j.martinez@corp.local at 01:12 AM with a weaponized Excel macro (Invoice_Q1_2026.xlsx) that established a Cobalt Strike beacon to 198.51.100.23:443. Lateral movement proceeded via PsExec and WMI from WS-JMARTINEZ-04 (10.10.10.44) to FS-PROD-01 before the ransomware binary (svc_update.exe staged at C:\ProgramData\Microsoft\svchost.exe) was deployed via a scheduled task. By the time IR was alerted at 03:15 AM, 87% of the file
  server data was encrypted. The attacker demanded 45 BTC (~$1.8M) for decryption keys and threatened to exfiltrate sensitive HR documents to a .onion leak site within 72 hours. Backup integrity was compromised because the attacker ran ''vssadmin delete shadows /all /quiet'' and deleted local backup catalogs from D:\Backups\ before encryption. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: Ransomware Deployment on Primary File Server
  opening: At 02:47 AM on March 14, monitoring detected a spike in disk I/O on FS-PROD-01 (10.10.20.15), the organization's primary Windows file server hosting 4.2 TB of shared departmental data. Within 18 minutes, the CryptoLocker variant began encrypting files across all mounted SMB shares (\\FS-PROD-01\Finance, \\FS-PROD-01\Engineering, \\FS-PROD-01\HR), deploying a custom .locked extension with RSA-2048 asymmetric…
  summary: At 02:47 AM on March 14, monitoring detected a spike in disk I/O on FS-PROD-01 (10.10.20.15), the organization's primary Windows file server hosting 4.2 TB of shared departmental data. Within 18 minutes, the CryptoLocker variant began encrypting files across all mounted SMB shares (\\FS-PROD-01\Finance, \\FS-PROD-01\Engineering, \\FS-PROD-01\HR), deploying a custom .locked extension with RSA-2048 asymmetric encryption. The initial entry vector was a phishing email sent to j.martinez@corp.local at 01:12 AM with a weaponized Excel macro (Invoice_Q1_2026.xlsx) that established a Cobalt Strike beacon to 198.51.100.23:443. Lateral movement proceeded via PsExec and WMI from WS-JMARTINEZ-04 (10.10.10.44) to FS-PROD-01 before the ransomware binary (svc_update.exe staged at C:\ProgramData\Microsoft\svchost.exe) was deployed via a scheduled task. By the time IR was alerted at 03:15 AM, 87% of the file server data was encrypted. The attacker demanded 45 BTC (~$1.8M) for decryption keys and
    threatened to exfiltrate sensitive HR documents to a .onion leak site within 72 hours. Backup integrity was compromised because the attacker ran 'vssadmin delete shadows /all /quiet' and deleted local backup catalogs from D:\Backups\ before encryption.
  compromised_assets:
  - FS-PROD-01 (10.10.20.15) — Windows File Server
  - 4.2 TB shared departmental data across 3 SMB shares
  - VSS Shadow Copies (deleted via vssadmin)
  - Local backup catalogs (D:\Backups\ wiped)
  - Domain admin credentials (svc_backup DA hash extracted)
  - Cobalt Strike C2 channel to 198.51.100.23:443
  detected_via: Disk I/O anomaly alert on FS-PROD-01 at 02:47 AM; antivirus behavioral detection of .locked file creation; user reports of inaccessible files starting 03:00 AM
  kill_chain:
  - Initial Access via phishing macro (Invoice_Q1_2026.xlsx)
  - Execution of Cobalt Strike stager from 198.51.100.23:443
  - Credential harvesting with Mimikatz on WS-JMARTINEZ-04
  - Lateral movement to FS-PROD-01 via PsExec (10.10.20.15)
  - VSS deletion and backup catalog wipe (02:43 AM)
  - Mass file encryption deployment (02:47 AM)
  - Ransom note (RECOVER-FILES.txt) dropped on all shares
  mitre_tactics:
  - TA0001 — Initial Access
  - TA0002 — Execution
  - TA0006 — Credential Access
  - TA0008 — Lateral Movement
  - TA0040 — Impact
phases:
- id: phishing_delivery_initial_execution
  phase_type: triage
  title: Phishing Delivery & Initial Execution
  situation: The SOC team has identified the initial phishing email sent to j.martinez@corp.local at 01:12 AM containing an Excel macro (Invoice_Q1_2026.xlsx). The macro executed a PowerShell download cradle that retrieved a Cobalt Strike stager from 198.51.100.23:443. The beacon has been active on WS-JMARTINEZ-04 (10.10.10.44) for approximately 90 minutes. You have access to the email gateway logs, endpoint telemetry from the workstation, and network flow data.
  prompt: What is your first action to contain and investigate this initial compromise?
  guidance:
    what: 'Separate signal from noise: confirm the alert on FS-PROD-01, its severity, and the affected accounts.'
    action: What is your first action to contain and investigate this initial compromise?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phishing Delivery & Initial Execution. Asset in scope: FS-PROD-01.'
  hints:
  - Good containment measure but does not address the already-active beacon on the compromised workstation.
  - Password reset is reactive and does not contain the active Cobalt Strike beacon.
  - Important for preventing additional compromises but does not address the active threat on the already-compromised workstation.
  ideal_concepts:
  - isolate ws-jmartinez-04
  - ws-jmartinez-04 network
  - network immediately
  - immediately block
  - firewall preserve
  - preserve workstation
  - workstation memory
  - memory dump
  reference_answer: |-
    Isolate WS-JMARTINEZ-04 from the network immediately, block the C2 IP at the firewall, and preserve the workstation memory dump for forensic analysis

    Why: Immediate isolation prevents further C2 communication and lateral movement. Memory preservation captures the active beacon before it can self-destruct. Blocking the C2 IP at the perimeter firewall stops data exfiltration.
  followup_good: 'Forensic analysis of the memory dump from WS-JMARTINEZ-04 reveals that the attacker ran Mimikatz (sekurlsa::logonpasswords) at 01:58 AM and extracted domain admin credentials for svc_backup (NTLM hash: aad3b435b51404eeaad3b435b51404ee:e0fb1fb45ae778453441514326c09336). PsExec artifacts show lateral movement to FS-PROD-01 (10.10.20.15) at 02:15 AM. Network logs show WMI connections from 10.10.10.44 to 10.10.30.22 (DB-PROD-01) at 02:20 AM. The attacker appears to be mapping the network before deploying ransomware.'
  followup_weak: |-
    Immediate isolation prevents further C2 communication and lateral movement.

    Forensic analysis of the memory dump from WS-JMARTINEZ-04 reveals that the attacker ran Mimikatz (sekurlsa::logonpasswords) at 01:58 AM and extracted domain admin credentials for svc_backup (NTLM hash: aad3b435b51404eeaad3b435b51404ee:e0fb1fb45ae778453441514326c09336). PsExec artifacts show lateral movement to FS-PROD-01 (10.10.20.15) at 02:15 AM. Network logs show WMI connections from 10.10.10.44 to 10.10.30.22 (DB-PROD-01) at 02:20 AM. The attacker appears to be mapping the network before deploying ransomware.
