id: insider_threat___employee_data_theft
name: Insider Threat — Employee Data Theft
category: Endpoint
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Malicious Insider Exfiltrating Customer Database. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Malicious Insider Exfiltrating Customer Database. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Malicious Insider Exfiltrating Customer Database. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Malicious Insider Exfiltrating Customer Database incident. Senior database administrator R. Patel (r.patel@corp.local, employee ID EMP-4471), who submitted a resignation on March 1, began systematically querying and exporting customer PII from the production PostgreSQL database (DB-PROD-01, 10.10.30.22, port 5432). Between 9 PM and 6 AM over five consecutive nights (March 10-14), the employee used their legitimate credentials (r.patel/dba_prod_read) and elevated privileges to run unauthorized SELECT queries against the customers table, exporting 2.3 million customer records (names, emails, phone numbers, credit card last-four digits) to an encrypted USB drive (Samsung T7, serial S5FENS0R12345). DLP logs on endpoint WS-RPATEL-07 (10.10.10.77) showed repeated large-volume data transfers (total: 1.8 GB) to the removable media endpoint D:\ between 22:00 and 05:30. The employee also disabled their own audit logging by modifying the PostgreSQL log_level
  parameter in postgresql.conf (changed from ''log_statement=all'' to ''log_statement=none'' at 22:15 on March 10), and attempted to cover tracks by deleting query history from the psql metacommand log. Discovery came when a shift SOC analyst noticed anomalous database connection patterns outside business hours correlated with USB device registration events on the employee''s workstation. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: Malicious Insider Exfiltrating Customer Database
  opening: Senior database administrator R. Patel (r.patel@corp.local, employee ID EMP-4471), who submitted a resignation on March 1, began systematically querying and exporting customer PII from the production PostgreSQL database (DB-PROD-01, 10.10.30.22, port 5432).
  summary: 'Senior database administrator R. Patel (r.patel@corp.local, employee ID EMP-4471), who submitted a resignation on March 1, began systematically querying and exporting customer PII from the production PostgreSQL database (DB-PROD-01, 10.10.30.22, port 5432). Between 9 PM and 6 AM over five consecutive nights (March 10-14), the employee used their legitimate credentials (r.patel/dba_prod_read) and elevated privileges to run unauthorized SELECT queries against the customers table, exporting 2.3 million customer records (names, emails, phone numbers, credit card last-four digits) to an encrypted USB drive (Samsung T7, serial S5FENS0R12345). DLP logs on endpoint WS-RPATEL-07 (10.10.10.77) showed repeated large-volume data transfers (total: 1.8 GB) to the removable media endpoint D:\ between 22:00 and 05:30. The employee also disabled their own audit logging by modifying the PostgreSQL log_level parameter in postgresql.conf (changed from ''log_statement=all'' to ''log_statement=none''
    at 22:15 on March 10), and attempted to cover tracks by deleting query history from the psql metacommand log. Discovery came when a shift SOC analyst noticed anomalous database connection patterns outside business hours correlated with USB device registration events on the employee''s workstation.'
  compromised_assets:
  - DB-PROD-01 (10.10.30.22) — Production PostgreSQL database (customers table)
  - 2.3M customer PII records (names, emails, phones, credit card last-4)
  - PostgreSQL audit logs (log_level tampered on postgresql.conf)
  - WS-RPATEL-07 (10.10.10.77) — Employee workstation (USB exfiltration endpoint)
  - Samsung T7 USB drive (S5FENS0R12345) — 1.8 GB exfiltrated data
  detected_via: Off-hours database query anomaly (connections between 22:00-06:00 on March 10-14); USB device registration alert on WS-RPATEL-07; DLP volume threshold breach (1.8 GB to removable media)
  kill_chain:
  - Legitimate credential usage for unauthorized access (r.patel/dba_prod_read)
  - Massive data querying outside business hours (22:00-06:00, 5 nights)
  - Audit log tampering — log_level changed to none (postgresql.conf)
  - USB exfiltration of customer PII (1.8 GB over 5 nights)
  - Attempted log deletion to cover tracks (psql metacommand log)
  mitre_tactics:
  - TA0001 — Initial Access (legitimate credentials)
  - TA0005 — Defense Evasion
  - TA0009 — Collection
  - TA0010 — Exfiltration
phases:
- id: unauthorized_data_querying
  phase_type: triage
  title: Unauthorized Data Querying
  situation: Database connection logs from DB-PROD-01 show that r.patel has been running bulk SELECT queries against the customers table every night between 22:00 and 05:30 for the past five nights. The queries extract approximately 460,000 records per night using a custom Python script (export_customers.py) found in the user's home directory. The employee is currently on a standard DBA read account with full SELECT access to all production tables. The customers table contains 2.3M records of customer PII.
  prompt: How do you respond to the unauthorized bulk data querying?
  guidance:
    what: Establish what fired on DB-PROD-01, which accounts are involved, and how urgent the signal is.
    action: How do you respond to the unauthorized bulk data querying?
    why: Every later decision depends on an accurate picture of DB-PROD-01 and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Unauthorized Data Querying. Asset in scope: DB-PROD-01.'
  hints:
  - Password reset alone does not address the issue since the employee has legitimate access through other means and may have already exfiltrated significant data.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately revoke
  - revoke database
  - database access
  - access patel
  - patel preserve
  - preserve query
  - query logs
  - logs export
  reference_answer: |-
    Immediately revoke database access for r.patel, preserve all query logs and the export script as evidence, and alert HR and legal about potential data theft

    Why: Revoking access stops ongoing data theft immediately. Preserving logs maintains the forensic chain of custody. HR and legal notification initiates the insider threat response process.
  followup_good: Investigation of the PostgreSQL configuration on DB-PROD-01 reveals that r.patel modified the postgresql.conf file on March 10 at 22:15, changing log_statement from 'all' to 'none'. This suppressed all further query logging for the remaining four nights of exfiltration. The employee also deleted entries from ~/.psql_history to remove metacommand query history. The file modification was captured by file integrity monitoring (OSSEC) but the alert was not triaged. A secondary audit trail exists in the centralized Splunk SIEM (ingestion via PostgreSQL syslog output to /var/log/postgresql/).
  followup_weak: |-
    Revoking access stops ongoing data theft immediately.

    Investigation of the PostgreSQL configuration on DB-PROD-01 reveals that r.patel modified the postgresql.conf file on March 10 at 22:15, changing log_statement from 'all' to 'none'. This suppressed all further query logging for the remaining four nights of exfiltration. The employee also deleted entries from ~/.psql_history to remove metacommand query history. The file modification was captured by file integrity monitoring (OSSEC) but the alert was not triaged. A secondary audit trail exists in the centralized Splunk SIEM (ingestion via PostgreSQL syslog output to /var/log/postgresql/).
