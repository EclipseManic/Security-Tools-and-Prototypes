- id: data_exfiltration_via_usb
  phase_type: eradication
  title: Data Exfiltration via USB
  situation: DLP logs confirm that a Samsung T7 USB drive (S5FENS0R12345) was registered on WS-RPATEL-07 on March 9 at 14:30 and has been receiving data transfers every night from March 10-14. The total data transferred is 1.8 GB across 12 transfer sessions. BitLocker encryption is enabled on the USB drive. The employee's badge access logs show they were in the office until 06:15 AM on March 14 (last night) and left with a bag. IT asset management confirms this USB drive is not company-issued equipment. The employee's last day is scheduled for March 15.
  prompt: How do you respond to the USB-based data exfiltration?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you respond to the USB-based data exfiltration?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Data Exfiltration via USB. Asset in scope: DB-PROD-01.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - immediately revoke
  - revoke physical
  - physical digital
  - digital access
  - access patel
  - patel coordinate
  - coordinate legal
  - legal supervised
  reference_answer: |-
    Immediately revoke all physical and digital access for r.patel, coordinate with HR and legal for a supervised exit, attempt to recover the USB drive, and implement endpoint DLP policies blocking unauthorized USB storage devices

    Why: Immediate access revocation prevents further exfiltration. Legal coordination ensures proper handling of the insider threat. USB DLP prevents future physical exfiltration attempts.
  followup_good: 'The investigation has confirmed: 2.3M customer PII records exfiltrated to an unauthorized USB drive, audit logs suppressed for 4 nights, and the employee''s last day is tomorrow (March 15). The CISO has requested a full scope assessment. Customer data includes names, emails, phone numbers, and credit card last-four digits for customers across the United States and EU (GDPR-regulated data). No evidence of data access by third parties has been found. The employee''s workstation has been forensically imaged. The USB drive has not been recovered.'
  followup_weak: |-
    Immediate access revocation prevents further exfiltration.

