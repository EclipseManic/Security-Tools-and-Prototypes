- id: audit_log_tampering
  phase_type: analysis
  title: Audit Log Tampering
  situation: Investigation of the PostgreSQL configuration on DB-PROD-01 reveals that r.patel modified the postgresql.conf file on March 10 at 22:15, changing log_statement from 'all' to 'none'. This suppressed all further query logging for the remaining four nights of exfiltration. The employee also deleted entries from ~/.psql_history to remove metacommand query history. The file modification was captured by file integrity monitoring (OSSEC) but the alert was not triaged. A secondary audit trail exists in the centralized Splunk SIEM (ingestion via PostgreSQL syslog output to /var/log/postgresql/).
  prompt: How do you address the audit log tampering?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on DB-PROD-01.
    action: How do you address the audit log tampering?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Audit Log Tampering. Asset in scope: DB-PROD-01.'
  hints:
  - Restoring logging configuration is necessary but does not address the gap in forensic evidence during the four nights of suppressed logging.
  - Useful for scoping the breach but does not address the immediate problem of log tampering and the need for tamper-proof audit trails.
  - An approval workflow introduces friction but still allows authorized log suppression.
  ideal_concepts:
  - implement immutable
  - immutable centralized
  - centralized logging
  - logging dbas
  - dbas cannot
  - cannot modify
  - modify cross-reference
  - cross-reference siem
  reference_answer: |-
    Implement immutable centralized logging that DBAs cannot modify, cross-reference the SIEM syslog data with the tampered postgresql.conf timestamps, and document the full timeline of log suppression

    Why: Immutable centralized logging prevents future tampering. Cross-referencing syslog data reveals the true extent of unauthorized queries during the log suppression window.
  followup_good: DLP logs confirm that a Samsung T7 USB drive (S5FENS0R12345) was registered on WS-RPATEL-07 on March 9 at 14:30 and has been receiving data transfers every night from March 10-14. The total data transferred is 1.8 GB across 12 transfer sessions. BitLocker encryption is enabled on the USB drive. The employee's badge access logs show they were in the office until 06:15 AM on March 14 (last night) and left with a bag. IT asset management confirms this USB drive is not company-issued equipment. The employee's last day is scheduled for March 15.
  followup_weak: |-
    Immutable centralized logging prevents future tampering.

    DLP logs confirm that a Samsung T7 USB drive (S5FENS0R12345) was registered on WS-RPATEL-07 on March 9 at 14:30 and has been receiving data transfers every night from March 10-14. The total data transferred is 1.8 GB across 12 transfer sessions. BitLocker encryption is enabled on the USB drive. The employee's badge access logs show they were in the office until 06:15 AM on March 14 (last night) and left with a bag. IT asset management confirms this USB drive is not company-issued equipment. The employee's last day is scheduled for March 15.
