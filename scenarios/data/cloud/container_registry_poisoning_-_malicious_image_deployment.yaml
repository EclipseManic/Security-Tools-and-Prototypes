- id: supply_chain_hardening_securing_ci_cd_pipelines
  phase_type: lessons
  title: Supply Chain Hardening — Securing CI/CD Pipelines
  situation: 'The root cause is: (1) external contributor with write access to workflows, (2) no image signing or verification, (3) CI/CD secrets stored as environment variables, and (4) no image provenance tracking. You need to implement a secure supply chain architecture.'
  prompt: What is your next action?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What is your next action?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Supply Chain Hardening — Securing CI/CD Pipelines. Asset in scope: GitHub repository: contoso/nginx-custom.'
  hints:
  - Image scanning catches known vulnerabilities but doesn't prevent custom malware or reverse shells.
  - OIDC-based authentication and image signing provide equivalent security without operational overhead.
  - Signed commits, required reviews, and OIDC authentication provide security without restricting contributors.
  ideal_concepts:
  - implement sigstore
  - sigstore cosign
  - cosign image
  - image signing
  - signing enforce
  - enforce image
  - image verification
  - verification admission
  reference_answer: |-
    Implement Sigstore/cosign image signing, enforce image verification via admission controller, use OIDC for CI/CD (no stored secrets), restrict workflow write access to core maintainers, and deploy SLSA Level 3 provenance

    Why: Secure supply chain: image signing prevents tampering, admission controllers block unsigned images, OIDC eliminates stored secrets, restricted access reduces attack surface, and SLSA provenance provides verifiable build chain.
