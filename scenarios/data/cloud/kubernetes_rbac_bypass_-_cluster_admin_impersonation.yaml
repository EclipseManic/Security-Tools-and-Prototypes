- id: kubernetes_hardening_prevent_rbac_escalation
  phase_type: lessons
  title: Kubernetes Hardening — Prevent RBAC Escalation
  situation: The root cause is an overly permissive ClusterRole created via Helm. You need to implement controls that prevent RBAC misconfigurations and detect future escalation attempts.
  prompt: What is your next action?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What is your next action?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Kubernetes Hardening — Prevent RBAC Escalation. Asset in scope: Cluster: prod-cluster.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement opa
  - opa gatekeeper
  - gatekeeper policies
  - policies block
  - clusterroles impersonate
  - impersonate bind
  - bind create
  - permissions enable
  reference_answer: |-
    Implement OPA/Gatekeeper policies to block ClusterRoles with impersonate/bind/create permissions, enable Kubernetes audit logging with real-time alerting, deploy kubectl-who-can for RBAC visibility, and enforce admission controllers on Helm deployments

    Why: Defense-in-depth: OPA prevents dangerous RBAC at deploy time, audit logging detects live attacks, kubectl-who-can provides visibility, and admission controllers gate all cluster changes.
