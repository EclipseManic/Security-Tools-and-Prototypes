  title: S3 Bucket Misconfiguration — Public Data Leak
  opening: 'On Tuesday at 14:32 UTC, the AWS CloudTrail logs flagged an unusual pattern: an anonymous GET request from IP 103.224.182.251 successfully downloaded 847 objects from the s3://corp-customer-backups bucket. Follow-up investigation revealed the bucket policy was modified on Sunday at 03:17 UTC via the root account — a console login from a previously unseen IP range (AS 209349 — VPN provider).'
  summary: 'On Tuesday at 14:32 UTC, the AWS CloudTrail logs flagged an unusual pattern: an anonymous GET request from IP 103.224.182.251 successfully downloaded 847 objects from the s3://corp-customer-backups bucket. Follow-up investigation revealed the bucket policy was modified on Sunday at 03:17 UTC via the root account — a console login from a previously unseen IP range (AS 209349 — VPN provider). The bucket was set to public-read, exposing PII for 12,000+ customers including names, SSNs, and credit card last-fours. AWS Macie alerts triggered the investigation, but the data exfiltration window was approximately 48 hours. The attacker used the S3 list-objects and get-object APIs. No IAM keys were found to be leaked, suggesting the root credentials may have been compromised via a phishing attack on the cloud admin.'
  compromised_assets:
  - s3://corp-customer-backups (12,400 customer records)
  - Root AWS account (compromised console session)
  - CloudTrail (logs partially cleared for 3-hour window)
  detected_via: AWS Macie alert on PII in publicly accessible bucket
  kill_chain:
  - Initial Access (Phishing)
  - Credential Access (Root account compromise)
