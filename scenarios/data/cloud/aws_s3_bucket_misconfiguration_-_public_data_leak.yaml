id: aws_s3_bucket_misconfiguration_-_public_data_leak
name: AWS S3 Bucket Misconfiguration - Public Data Leak
category: Cloud
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to S3 Bucket Misconfiguration — Public Data Leak. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for S3 Bucket Misconfiguration — Public Data Leak. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for S3 Bucket Misconfiguration — Public Data Leak. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the S3 Bucket Misconfiguration — Public Data Leak incident. On Tuesday at 14:32 UTC, the AWS CloudTrail logs flagged an unusual pattern: an anonymous GET request from IP 103.224.182.251 successfully downloaded 847 objects from the s3://corp-customer-backups bucket. Follow-up investigation revealed the bucket policy was modified on Sunday at 03:17 UTC via the root account — a console login from a previously unseen IP range (AS 209349 — VPN provider). The bucket was set to public-read, exposing PII for 12,000+ customers including names, SSNs, and credit card last-fours. AWS Macie alerts triggered the investigation, but the data exfiltration window was approximately 48 hours. The attacker used the S3 list-objects and get-object APIs. No IAM keys were found to be leaked, suggesting the root credentials may have been compromised via a phishing attack on the cloud admin. Business impact: cloud-hosted data and service availability are at risk, and provider
  notification plus key rotation may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy and cloud counsel should assess notification duties and contractual reporting obligations.'
