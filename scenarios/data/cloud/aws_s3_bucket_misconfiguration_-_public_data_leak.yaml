- id: post_incident_hardening_preventing_recurrence
  phase_type: lessons
  title: Post-Incident Hardening — Preventing Recurrence
  situation: 'The incident is contained. The root cause was confirmed as spearphishing leading to root account compromise via SMS OTP. You need to implement controls to prevent recurrence. The CISO wants a hardening plan that addresses: credential hygiene, bucket policy governance, and MFA improvements.'
  prompt: What is your next action?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What is your next action?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Post-Incident Hardening — Preventing Recurrence. Asset in scope: s3://corp-customer-backups.'
  hints:
  - Without hardening, the new account will have the same vulnerabilities.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement bucket
  - bucket policies
  - policies scp
  - scp deny
  - deny public
  - public access
  - access enforce
  - enforce hardware
  reference_answer: |-
    Implement S3 bucket policies via SCP to deny public access, enforce hardware MFA for root, enable CloudTrail log file validation, and deploy AWS Config rules for continuous bucket auditing

    Why: Defense-in-depth: SCP-level public access denial prevents future misconfigurations, hardware MFA eliminates SIM-swap risk, log validation prevents tampering, and Config rules provide continuous compliance monitoring.
