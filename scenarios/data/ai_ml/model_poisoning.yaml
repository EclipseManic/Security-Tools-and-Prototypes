phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A poisoned fraud detection model is in production, allowing fraudulent transactions to pass undetected. $2.3M in daily volume is being processed by a model with 14.7% false negative rate. The training data pipeline is compromised. The attacker may still have access to the labeling platform.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on Fraud detection ML model, its severity, and the affected accounts.'
    action: What is your FIRST containment action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Fraud detection ML model.'
  hints:
  - The training data pipeline is still compromised.
  - Prevents future poisoning but also stops legitimate model improvements.
  ideal_concepts:
  - immediately roll
  - roll back
  - back fraud
  - fraud detection
  - detection model
  - model last
  - last known-good
  - known-good version
  reference_answer: |-
    Immediately roll back the fraud detection model to the last known-good version (before poisoning), disable the compromised service account, isolate the Label Studio instance from the network, and activate manual fraud review for all flagged transactions

    Why: Model rollback restores fraud detection capability, account disablement stops attacker access, network isolation prevents further poisoning, and manual review provides immediate fraud protection.
  followup_good: 'The model has been rolled back. The Label Studio instance is isolated. You need to determine: how the attacker accessed the platform, which training datasets were poisoned, the full extent of relabeled transactions, and whether the attacker accessed the model itself or only the training data.'
  followup_weak: |-
    Model rollback restores fraud detection capability, account disablement stops attacker access, network isolation prevents further poisoning, and manual review provides immediate fraud protection.

    The model has been rolled back. The Label Studio instance is isolated. You need to determine: how the attacker accessed the platform, which training datasets were poisoned, the full extent of relabeled transactions, and whether the attacker accessed the model itself or only the training data.
  next: evidence_collection_phase_2
  mitre_tactic: Impact
  mitre_technique: T1565.001 Stored Data Manipulation
- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: 'The model has been rolled back. The Label Studio instance is isolated. You need to determine: how the attacker accessed the platform, which training datasets were poisoned, the full extent of relabeled transactions, and whether the attacker accessed the model itself or only the training data.'
  prompt: How do you collect evidence from this model poisoning attack?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you collect evidence from this model poisoning attack?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: Fraud detection ML model.'
  hints:
  - Audit logs show access but not the full scope of data modification.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - preserve label
  - label studio
  - studio database
  - database audit
  - audit logs
  - logs snapshot
  - snapshot poisoned
  - poisoned training
  reference_answer: |-
    Preserve the Label Studio database and audit logs, snapshot the poisoned training datasets for comparison with clean data, pull Kubernetes logs for the ml-labeler service account, audit all data pipeline access for the past 6 weeks, and preserve the poisoned model weights for analysis

    Why: Comprehensive evidence: platform logs (attack vector), dataset snapshots (poisoning scope), Kubernetes logs (access patterns), pipeline audit (timeline), and model weights (poisoning impact).
  followup_good: Label Studio audit logs show the attacker accessed the platform 47 times over 6 weeks, relabeling transactions across 3 retraining datasets. The attacker specifically targeted high-value transactions ($5,000+) and changed their labels from 'fraudulent' to 'legitimate'. The 12,000 relabeled transactions represent $89M in total fraudulent volume. The compromised service account had access to the model registry but logs show no model weight modifications. The attacker's access originated from a VPN in a foreign country. The labeling platform was accessible from the internet without MFA.
  followup_weak: |-
    Comprehensive evidence: platform logs (attack vector), dataset snapshots (poisoning scope), Kubernetes logs (access patterns), pipeline audit (timeline), and model weights (poisoning impact).

    Label Studio audit logs show the attacker accessed the platform 47 times over 6 weeks, relabeling transactions across 3 retraining datasets. The attacker specifically targeted high-value transactions ($5,000+) and changed their labels from 'fraudulent' to 'legitimate'. The 12,000 relabeled transactions represent $89M in total fraudulent volume. The compromised service account had access to the model registry but logs show no model weight modifications. The attacker's access originated from a VPN in a foreign country. The labeling platform was accessible from the internet without MFA.
  next: scope_assessment_phase_3
  mitre_tactic: Defense Evasion
  mitre_technique: T1070.004 File Deletion
- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: Label Studio audit logs show the attacker accessed the platform 47 times over 6 weeks, relabeling transactions across 3 retraining datasets. The attacker specifically targeted high-value transactions ($5,000+) and changed their labels from 'fraudulent' to 'legitimate'. The 12,000 relabeled transactions represent $89M in total fraudulent volume. The compromised service account had access to the model registry but logs show no model weight modifications. The attacker's access originated from a VPN in a foreign country. The labeling platform was accessible from the internet without MFA.
  prompt: How do you assess the full impact of the model poisoning?
  guidance:
    what: Find every foothold the attacker left on Fraud detection ML model, including persistence and stolen credentials.
    action: How do you assess the full impact of the model poisoning?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: Fraud detection ML model.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - quantify financial
  - financial impact
  - impact detected
  - detected fraud
  - fraud estimated
  - estimated additional
  - additional undetected
  - undetected fraud
  reference_answer: |-
    Quantify the financial impact ($4.2M in detected fraud + estimated additional undetected fraud), identify which customers were affected by undetected fraudulent transactions, assess regulatory implications for fraud detection failures, determine if the model registry was accessed (attempted model theft), and evaluate the attacker's motivation and potential for future attacks

    Why: Full impact: financial (total fraud losses), customer (affected users), regulatory (fraud detection compliance), intellectual property (model theft attempt), and threat intelligence (attacker motivation).
  followup_good: 'The investigation reveals: $4.2M in confirmed fraudulent losses from undetected transactions, 847 customers affected, the attacker accessed the model registry but didn''t download model weights (likely due to file size), and the labeling platform had no MFA or IP restrictions. The company retrains fraud models monthly. The attacker''s pattern shows they specifically targeted high-value transactions to maximize financial impact while avoiding detection.'
  followup_weak: |-
    Full impact: financial (total fraud losses), customer (affected users), regulatory (fraud detection compliance), intellectual property (model theft attempt), and threat intelligence (attacker motivation).

    The investigation reveals: $4.2M in confirmed fraudulent losses from undetected transactions, 847 customers affected, the attacker accessed the model registry but didn't download model weights (likely due to file size), and the labeling platform had no MFA or IP restrictions. The company retrains fraud models monthly. The attacker's pattern shows they specifically targeted high-value transactions to maximize financial impact while avoiding detection.
  next: recovery_and_validation
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. Fraud detection ML model is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return Fraud detection ML model to production?
  guidance:
    what: Decide how to restore service in stages while proving the environment is free of reinfection.
    action: What must be true before you return Fraud detection ML model to production?
    why: A fast restore that reintroduces the attacker is worse than a slower, verified recovery.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: Fraud detection ML model.'
  hints:
  - Which backup or rebuild image is known-good for Fraud detection ML model, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore Fraud detection ML model from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: eradication_prevention_phase_4
  next_weak: ''
  mitre_tactic: Persistence
  mitre_technique: T1556 Modify Authentication Process
  role_prompts: {}
- id: eradication_prevention_phase_4
  phase_type: lessons
  title: Eradication & Prevention — Phase 4
  situation: 'The investigation reveals: $4.2M in confirmed fraudulent losses from undetected transactions, 847 customers affected, the attacker accessed the model registry but didn''t download model weights (likely due to file size), and the labeling platform had no MFA or IP restrictions. The company retrains fraud models monthly. The attacker''s pattern shows they specifically targeted high-value transactions to maximize financial impact while avoiding detection.'
  prompt: What ML security improvements do you implement?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What ML security improvements do you implement?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Eradication & Prevention — Phase 4. Asset in scope: Fraud detection ML model.'
  hints:
  - Proper security controls on the platform provide better protection without eliminating the capability.
  - Monitoring detects degradation after deployment but doesn't prevent poisoning during training.
  ideal_concepts:
  - implement data
  - data poisoning
  - poisoning detection
  - detection statistical
  - statistical anomaly
  - anomaly detection
  - detection labels
  - labels add
  reference_answer: |-
    Implement data poisoning detection (statistical anomaly detection on labels), add MFA and IP restrictions to the labeling platform, implement training data versioning with cryptographic integrity verification, deploy model performance monitoring with automated rollback on degradation, implement human-in-the-loop validation for label changes on high-value transactions, and establish ML supply chain security controls for the entire training pipeline

    Why: Defense-in-depth: detection (statistical monitoring), access control (MFA, IP restrictions), integrity (cryptographic verification), monitoring (performance rollback), validation (human-in-the-loop), and supply chain security (pipeline controls).
