id: model_poisoning
name: Model Poisoning
category: AI & ML
format_version: 2
difficulty: Expert
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Model Poisoning — Training Data Compromise. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Model Poisoning — Training Data Compromise. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Model Poisoning — Training Data Compromise. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Model Poisoning — Training Data Compromise incident. The ML engineering team discovered that the company''s fraud detection model has been producing increasingly inaccurate results over the past 3 retraining cycles. Investigation revealed that the training data pipeline was compromised 6 weeks ago when an attacker gained access to the data labeling platform (Label Studio instance at ml-internal.company.com). The attacker systematically relabeled 12,000 fraudulent transactions as legitimate (false negatives) across 3 retraining datasets. The poisoned model was deployed to production 4 weeks ago and has been processing $2.3M in daily transaction volume. The model''s false negative rate increased from 2.1% to 14.7%, allowing an estimated $4.2M in fraudulent transactions to pass undetected. The attacker accessed the labeling platform via a compromised service account with write access to the training data repository. The labeling platform runs on a
  Kubernetes cluster with exposed admin credentials. Business impact: model integrity and data confidentiality are at risk, and AI output should be treated as untrustworthy until validated. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess notification duties for any personal or proprietary data exposed to the model.'
