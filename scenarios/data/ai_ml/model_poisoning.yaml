  summary: The ML engineering team discovered that the company's fraud detection model has been producing increasingly inaccurate results over the past 3 retraining cycles. Investigation revealed that the training data pipeline was compromised 6 weeks ago when an attacker gained access to the data labeling platform (Label Studio instance at ml-internal.company.com). The attacker systematically relabeled 12,000 fraudulent transactions as legitimate (false negatives) across 3 retraining datasets. The poisoned model was deployed to production 4 weeks ago and has been processing $2.3M in daily transaction volume. The model's false negative rate increased from 2.1% to 14.7%, allowing an estimated $4.2M in fraudulent transactions to pass undetected. The attacker accessed the labeling platform via a compromised service account with write access to the training data repository. The labeling platform runs on a Kubernetes cluster with exposed admin credentials.
