  mitre_tactic: Defense Evasion
  mitre_technique: T1070.004 File Deletion
- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: 'Git history analysis reveals the attacker used 47 GitHub accounts created over 2 months, each submitting 150-200 fake records. The fake records have realistic but generated user IDs and interaction patterns optimized to avoid statistical detection. The attacker also submitted poisoned data to 2 other open-source recommendation datasets (used by other companies). The poisoned data specifically targets product categories where the attacker''s company has products. The revenue impact analysis shows: electronics category recommendations increased 280%, all other categories decreased 34-52%.'
  prompt: How do you assess the full impact?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you assess the full impact?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: Recommendation engine ML model.'
  hints:
  - Motivation is important for attribution but doesn't address the full impact on revenue, categories, and the broader ecosystem.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - quantify total
  - total revenue
  - revenue impact
  - impact estimate
  - estimate period
  - period detection
  - detection identify
  - identify product
  reference_answer: |-
    Quantify total revenue impact ($1.2M + estimate for period before detection), identify which product categories were artificially boosted or suppressed, assess impact on other companies using the same poisoned datasets, determine the attacker's competitive advantage from the manipulation, and notify the other affected open-source projects

    Why: Full impact: financial (total revenue loss), categorical (boosted/suppressed products), ecosystem (other companies), competitive (attacker advantage), and responsible disclosure (other projects).
  followup_good: 'The investigation reveals: $1.2M in confirmed revenue loss, electronics recommendations artificially boosted 280%, 2 other companies affected by the same poisoned datasets, the attacker is a competitor''s data science team, and the poisoned records were designed to evade statistical anomaly detection. The company accepts data contributions from the open-source community for its recommendation training data.'
  followup_weak: |-
    Full impact: financial (total revenue loss), categorical (boosted/suppressed products), ecosystem (other companies), competitive (attacker advantage), and responsible disclosure (other projects).

    The investigation reveals: $1.2M in confirmed revenue loss, electronics recommendations artificially boosted 280%, 2 other companies affected by the same poisoned datasets, the attacker is a competitor's data science team, and the poisoned records were designed to evade statistical anomaly detection. The company accepts data contributions from the open-source community for its recommendation training data.
  next: recovery_and_validation
  mitre_tactic: Impact
  mitre_technique: T1565.001 Stored Data Manipulation
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. Recommendation engine ML model is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return Recommendation engine ML model to production?
  guidance:
    what: 'Define what ''clean'' means for Recommendation engine ML model: trusted backups, rebuilt hosts, rotated credentials, and validated controls.'
    action: What must be true before you return Recommendation engine ML model to production?
    why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: Recommendation engine ML model.'
  hints:
  - Which backup or rebuild image is known-good for Recommendation engine ML model, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore Recommendation engine ML model from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: eradication_prevention_phase_4
  next_weak: ''
  mitre_tactic: Persistence
  mitre_technique: T1556 Modify Authentication Process
