phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A poisoned recommendation model is in production, causing biased recommendations that favor electronics and gaming products. Revenue from recommendations has decreased by $1.2M. The training data repository has been compromised with 8,000 fake records. The model is retrained weekly. The next retraining will include more poisoned data unless the repository is cleaned.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What is your FIRST containment action?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Recommendation engine ML model.'
  hints:
  - The poisoned data repository is still compromised.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately roll
  - roll back
  - back recommendation
  - recommendation model
  - model version
  - version poisoned
  - poisoned data
  - data included
  reference_answer: |-
    Immediately roll back the recommendation model to the version before poisoned data was included, revert the data repository to the last clean commit, block the 47 malicious GitHub accounts, and implement data validation checks on incoming contributions

    Why: Model rollback restores normal recommendations, repository revert removes poisoned data, account blocking prevents further submissions, and validation checks prevent future poisoning.
  followup_good: 'The model has been rolled back. The data repository has been reverted. You need to determine: which 47 GitHub accounts submitted the poisoned data, how the accounts were created, what the fake records look like, and whether the attacker submitted poisoned data to other repositories or datasets.'
  followup_weak: |-
    Model rollback restores normal recommendations, repository revert removes poisoned data, account blocking prevents further submissions, and validation checks prevent future poisoning.

    The model has been rolled back. The data repository has been reverted. You need to determine: which 47 GitHub accounts submitted the poisoned data, how the accounts were created, what the fake records look like, and whether the attacker submitted poisoned data to other repositories or datasets.
  next: evidence_collection_phase_2
  mitre_tactic: Impact
  mitre_technique: T1565.001 Stored Data Manipulation
- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: 'The model has been rolled back. The data repository has been reverted. You need to determine: which 47 GitHub accounts submitted the poisoned data, how the accounts were created, what the fake records look like, and whether the attacker submitted poisoned data to other repositories or datasets.'
  prompt: How do you collect evidence from this data poisoning attack?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on Recommendation engine ML model.
    action: How do you collect evidence from this data poisoning attack?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: Recommendation engine ML model.'
  hints:
  - Account investigation is important but must also analyze the poisoned data and check for broader targeting.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - preserve git
  - git commit
  - commit history
  - history showing
  - showing malicious
  - malicious submissions
  - submissions analyze
  - analyze fake
  reference_answer: |-
    Preserve the git commit history showing all 47 malicious submissions, analyze the fake user interaction records for patterns, pull GitHub account creation metadata for the 47 accounts, audit all other open-source data repositories for similar poisoning attempts, and preserve the poisoned model versions for analysis

    Why: Comprehensive evidence: git history (attack timeline), data analysis (poisoning patterns), account metadata (attribution), other repos (broader scope), and model versions (impact analysis).
  followup_good: 'Git history analysis reveals the attacker used 47 GitHub accounts created over 2 months, each submitting 150-200 fake records. The fake records have realistic but generated user IDs and interaction patterns optimized to avoid statistical detection. The attacker also submitted poisoned data to 2 other open-source recommendation datasets (used by other companies). The poisoned data specifically targets product categories where the attacker''s company has products. The revenue impact analysis shows: electronics category recommendations increased 280%, all other categories decreased 34-52%.'
  followup_weak: |-
    Comprehensive evidence: git history (attack timeline), data analysis (poisoning patterns), account metadata (attribution), other repos (broader scope), and model versions (impact analysis).

    Git history analysis reveals the attacker used 47 GitHub accounts created over 2 months, each submitting 150-200 fake records. The fake records have realistic but generated user IDs and interaction patterns optimized to avoid statistical detection. The attacker also submitted poisoned data to 2 other open-source recommendation datasets (used by other companies). The poisoned data specifically targets product categories where the attacker's company has products. The revenue impact analysis shows: electronics category recommendations increased 280%, all other categories decreased 34-52%.
