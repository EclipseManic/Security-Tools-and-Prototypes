id: data_poisoning
name: Data Poisoning
category: AI & ML
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Data Poisoning — Training Dataset Attack. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Data Poisoning — Training Dataset Attack. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Data Poisoning — Training Dataset Attack. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Data Poisoning — Training Dataset Attack incident. The data science team discovered that the company''s recommendation engine has been producing increasingly biased recommendations over the past month. Investigation revealed that the training data pipeline for the recommendation model was compromised through a malicious contribution to the company''s open-source data collection repository (github.com/company/rec-data). The attacker submitted 8,000 fake user interaction records over 3 weeks through 47 different GitHub accounts (likely automated). The fake records showed strong preferences for specific product categories (electronics and gaming), causing the recommendation engine to over-recommend these categories. The model was retrained weekly and the poisoned data was included in the last 3 retraining cycles. The poisoned model has been in production for 2 weeks, recommendation click-through rates for non-electronics products dropped 34%, and revenue
  from recommended products decreased by $1.2M. The attacker appears to be a competitor manipulating the recommendation system to favor their product categories. Business impact: model integrity and data confidentiality are at risk, and AI output should be treated as untrustworthy until validated. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess notification duties for any personal or proprietary data exposed to the model.'
incident:
  title: Data Poisoning — Training Dataset Attack
  opening: The data science team discovered that the company's recommendation engine has been producing increasingly biased recommendations over the past month. Investigation revealed that the training data pipeline for the recommendation model was compromised through a malicious contribution to the company's open-source data collection repository (github.com/company/rec-data).
  summary: The data science team discovered that the company's recommendation engine has been producing increasingly biased recommendations over the past month. Investigation revealed that the training data pipeline for the recommendation model was compromised through a malicious contribution to the company's open-source data collection repository (github.com/company/rec-data). The attacker submitted 8,000 fake user interaction records over 3 weeks through 47 different GitHub accounts (likely automated). The fake records showed strong preferences for specific product categories (electronics and gaming), causing the recommendation engine to over-recommend these categories. The model was retrained weekly and the poisoned data was included in the last 3 retraining cycles. The poisoned model has been in production for 2 weeks, recommendation click-through rates for non-electronics products dropped 34%, and revenue from recommended products decreased by $1.2M. The attacker appears to be a competitor
    manipulating the recommendation system to favor their product categories.
  compromised_assets:
  - Recommendation engine ML model
  - Open-source data collection repository
  - 8,000 fake user interaction records
