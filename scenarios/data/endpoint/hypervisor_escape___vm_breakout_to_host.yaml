- id: environment_wide_remediation
  phase_type: eradication
  title: Environment-Wide Remediation
  situation: 'The hypervisor escape has compromised the foundation of the virtual infrastructure. ESXi-01 hosted 47 critical VMs including domain controllers, database servers, and application servers. All 2,800 extracted credentials are potentially compromised. The SVGA vulnerability exists in all ESXi 7.0 versions prior to 7.0U3g. The organization has 3 additional ESXi hosts (ESXi-02, ESXi-03, ESXi-04) running the same vulnerable version. The CISO has requested a comprehensive remediation plan covering: ESXi patching, VM memory protection, credential rotation, and hypervisor security hardening.'
  prompt: How do you execute the complete hypervisor remediation?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you execute the complete hypervisor remediation?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Environment-Wide Remediation. Asset in scope: ESXi-01.'
  hints:
  - Migration to new infrastructure is thorough but extremely time-consuming and disruptive.
  - Third-party solutions are valuable but do not replace patching the underlying vulnerability.
  ideal_concepts:
  - patch esxi
  - esxi hosts
  - hosts latest
  - latest version
  - version disable
  - svga devices
  - devices vms
  - vms don
  reference_answer: |-
    Patch all 4 ESXi hosts to the latest version, disable SVGA devices on VMs that don't require GPU, implement ESXi lockdown mode on all hosts, enable VMware vSphere security hardening (restrict SSH, disable shell access), deploy ESXi integrity monitoring, rotate all 2,800 credentials from the 47 compromised VMs, and implement network segmentation for the management network

    Why: Patching closes the vulnerability across all hosts. SVGA disablement eliminates the attack surface. Lockdown mode restricts access. Hardening reduces the overall attack surface. Integrity monitoring detects future tampering. Credential rotation invalidates all stolen credentials. Network segmentation protects the management plane.
