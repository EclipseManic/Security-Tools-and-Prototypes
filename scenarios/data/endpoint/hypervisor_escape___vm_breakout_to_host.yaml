- id: host_level_code_execution_vm_access
  phase_type: analysis
  title: Host-Level Code Execution & VM Access
  situation: 'From the compromised ESXi host (ESXi-01), the attacker has access to all 47 guest VMs through the vmkernel''s VMM interface. The attacker can read and write memory of any guest VM without detection. Credentials have been extracted from: DC-01 (domain admin credentials, krbtgt hash), DB-PROD-01 (database admin credentials, connection strings), APP-SRV-01 (application API keys), and 44 other VMs. The attacker has also discovered the ESXi management interface (10.10.50.1:443, root/[REDACTED]) and vCenter server (vcenter.corp.local). Total credentials extracted: approximately 2,800 across all 47 VMs.'
  prompt: How do you contain the VM-level credential extraction?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you contain the VM-level credential extraction?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Host-Level Code Execution & VM Access. Asset in scope: ESXi-01.'
  hints:
  - NSX micro-segmentation is valuable but requires significant deployment time.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - isolate esxi-01
  - esxi-01 networks
  - networks rotate
  - credentials vms
  - vms domain
  - domain admin
  - admin database
  - database passwords
  reference_answer: |-
    Isolate ESXi-01 from all networks, rotate credentials for all 47 VMs (domain admin, database passwords, API keys, ESXi root), enable ESXi lockdown mode, implement VMware vSphere distributed firewall rules to restrict VM-to-VM communication, and begin forensic analysis of the compromised hypervisor

    Why: Network isolation stops ongoing access. Credential rotation invalidates all 2,800 stolen credentials. Lockdown mode restricts ESXi access. VM-to-VM firewall limits lateral movement. Forensics identifies the full scope.
  followup_good: 'The attacker has installed a persistent backdoor in the ESXi host''s /tmp/tardisks/ directory: backdoor.elf (SHA256: 9e3a..., 42 KB ELF binary). The backdoor is configured to execute on ESXi host boot via /etc/rc.local.d/local.sh modification. The backdoor connects to 198.51.100.77:443 every 300 seconds for C2 callbacks. ESXi''s limited security tooling means most endpoint security solutions do not run on the hypervisor. The backdoor persists across VM restarts and will survive ESXi host reboots via the rc.local configuration. The attacker also modified /tmp/tardisks/config.json to store extracted credentials from all 47 VMs.'
  followup_weak: |-
    Network isolation stops ongoing access.

    The attacker has installed a persistent backdoor in the ESXi host's /tmp/tardisks/ directory: backdoor.elf (SHA256: 9e3a..., 42 KB ELF binary). The backdoor is configured to execute on ESXi host boot via /etc/rc.local.d/local.sh modification. The backdoor connects to 198.51.100.77:443 every 300 seconds for C2 callbacks. ESXi's limited security tooling means most endpoint security solutions do not run on the hypervisor. The backdoor persists across VM restarts and will survive ESXi host reboots via the rc.local configuration. The attacker also modified /tmp/tardisks/config.json to store extracted credentials from all 47 VMs.
