- id: esxi_host_persistence
  phase_type: eradication
  title: ESXi Host Persistence
  situation: 'The attacker has installed a persistent backdoor in the ESXi host''s /tmp/tardisks/ directory: backdoor.elf (SHA256: 9e3a..., 42 KB ELF binary). The backdoor is configured to execute on ESXi host boot via /etc/rc.local.d/local.sh modification. The backdoor connects to 198.51.100.77:443 every 300 seconds for C2 callbacks. ESXi''s limited security tooling means most endpoint security solutions do not run on the hypervisor. The backdoor persists across VM restarts and will survive ESXi host reboots via the rc.local configuration. The attacker also modified /tmp/tardisks/config.json to store extracted credentials from all 47 VMs.'
  prompt: How do you remove the ESXi host persistence?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you remove the ESXi host persistence?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: ESXi Host Persistence. Asset in scope: ESXi-01.'
  hints:
  - Deleting only the directory does not address the rc.local modification that will re-execute the backdoor on next boot.
  - Carbon Black on ESXi provides valuable monitoring but does not remove the existing persistence.
  ideal_concepts:
  - backdoor binary
  - binary tmp
  - tmp tardisks
  - tardisks backdoor
  - backdoor elf
  - elf revert
  - revert local
  - local local
  reference_answer: |-
    Remove the backdoor binary (/tmp/tardisks/backdoor.elf), revert /etc/rc.local.d/local.sh to its original state, block C2 IP 198.51.100.77 at the perimeter, enable ESXi lockdown mode with audit logging, and plan a complete ESXi host rebuild from the ESXi installer ISO

    Why: Removing the backdoor eliminates persistence. Reverting rc.local prevents boot-time execution. IP blocking stops C2. Lockdown mode restricts future access. Host rebuild ensures complete remediation.
  followup_good: 'The hypervisor escape has compromised the foundation of the virtual infrastructure. ESXi-01 hosted 47 critical VMs including domain controllers, database servers, and application servers. All 2,800 extracted credentials are potentially compromised. The SVGA vulnerability exists in all ESXi 7.0 versions prior to 7.0U3g. The organization has 3 additional ESXi hosts (ESXi-02, ESXi-03, ESXi-04) running the same vulnerable version. The CISO has requested a comprehensive remediation plan covering: ESXi patching, VM memory protection, credential rotation, and hypervisor security hardening.'
  followup_weak: |-
    Removing the backdoor eliminates persistence.

    The hypervisor escape has compromised the foundation of the virtual infrastructure. ESXi-01 hosted 47 critical VMs including domain controllers, database servers, and application servers. All 2,800 extracted credentials are potentially compromised. The SVGA vulnerability exists in all ESXi 7.0 versions prior to 7.0U3g. The organization has 3 additional ESXi hosts (ESXi-02, ESXi-03, ESXi-04) running the same vulnerable version. The CISO has requested a comprehensive remediation plan covering: ESXi patching, VM memory protection, credential rotation, and hypervisor security hardening.
