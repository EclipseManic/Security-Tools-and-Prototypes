briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to VMware ESXi Hypervisor Escape Grants Host-Level Access. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for VMware ESXi Hypervisor Escape Grants Host-Level Access. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for VMware ESXi Hypervisor Escape Grants Host-Level Access. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the VMware ESXi Hypervisor Escape Grants Host-Level Access incident. A security researcher discovered a heap-based buffer overflow in VMware ESXi''s SVGA (VMware SVGA II) device emulation (similar to CVE-2021-21974) that allows a guest virtual machine to execute arbitrary code on the ESXi host. The vulnerability exists in the SVGA device''s handleCommand function when processing crafted SVGA_CMD_DEFINE_SURFACE commands with oversized parameters. The exploit chain: (1) allocate a controlled heap buffer via repeated SVGA surface definitions from guest VM ''web-vm-03'' (10.10.40.33, Ubuntu 22.04), (2) free the buffer to create a dangling pointer, (3) trigger a use-after-free by redefining the surface with different parameters, (4) overwrite the freed buffer with a ROP chain that escalates to the ESXi host''s VMX process. ESXi host: ESXi-01 (10.10.50.1, VMware ESXi 7.0U3, build 19299793). Once on the host, the attacker accessed all guest VMs'' memory through
  the vmkernel''s VMM interface, extracted credentials from 47 running VMs (including DC-01, DB-PROD-01, and APP-SRV-01), and installed a persistent backdoor in /tmp/tardisks/ (backdoor.elf, SHA256: 9e3a...). The escape was detected when VMware''s ESXi integrity checker flagged the modified VMX process memory and an anomalous network connection from the host to 198.51.100.77:443. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: VMware ESXi Hypervisor Escape Grants Host-Level Access
  opening: A security researcher discovered a heap-based buffer overflow in VMware ESXi's SVGA (VMware SVGA II) device emulation (similar to CVE-2021-21974) that allows a guest virtual machine to execute arbitrary code on the ESXi host. The vulnerability exists in the SVGA device's handleCommand function when processing crafted SVGA_CMD_DEFINE_SURFACE commands with oversized parameters.
  summary: 'A security researcher discovered a heap-based buffer overflow in VMware ESXi''s SVGA (VMware SVGA II) device emulation (similar to CVE-2021-21974) that allows a guest virtual machine to execute arbitrary code on the ESXi host. The vulnerability exists in the SVGA device''s handleCommand function when processing crafted SVGA_CMD_DEFINE_SURFACE commands with oversized parameters. The exploit chain: (1) allocate a controlled heap buffer via repeated SVGA surface definitions from guest VM ''web-vm-03'' (10.10.40.33, Ubuntu 22.04), (2) free the buffer to create a dangling pointer, (3) trigger a use-after-free by redefining the surface with different parameters, (4) overwrite the freed buffer with a ROP chain that escalates to the ESXi host''s VMX process. ESXi host: ESXi-01 (10.10.50.1, VMware ESXi 7.0U3, build 19299793). Once on the host, the attacker accessed all guest VMs'' memory through the vmkernel''s VMM interface, extracted credentials from 47 running VMs (including DC-01,
    DB-PROD-01, and APP-SRV-01), and installed a persistent backdoor in /tmp/tardisks/ (backdoor.elf, SHA256: 9e3a...). The escape was detected when VMware''s ESXi integrity checker flagged the modified VMX process memory and an anomalous network connection from the host to 198.51.100.77:443.'
  compromised_assets:
  - ESXi-01 (10.10.50.1) — VMware ESXi 7.0U3 hypervisor (escape achieved)
  - 47 guest VMs (memory accessible from compromised host)
  - DC-01 (10.10.1.10) — Domain controller credentials extracted
  - DB-PROD-01 (10.10.30.22) — Database server credentials accessible
  - ESXi host persistence (/tmp/tardisks/backdoor.elf)
  - VMX process memory modified (exploitation artifact)
  detected_via: ESXi VMX process integrity check (VMware integrity scanner flagged memory modification); anomalous host network connection (ESXi-01 to 198.51.100.77:443); VMX memory modification alert
  kill_chain:
  - Guest VM access obtained (web-vm-03 compromised via web application exploit)
  - SVGA heap overflow triggered in device emulation (handleCommand)
  - Use-after-free exploited for arbitrary write in VMX process
  - ROP chain executes in VMX process context (vmx worker)
  - Host-level code execution achieved on ESXi-01
  - All 47 guest VMs memory accessed via vmkernel VMM interface
  - Persistent backdoor installed (/tmp/tardisks/backdoor.elf)
  mitre_tactics:
  - TA0004 — Privilege Escalation
  - TA0005 — Defense Evasion
  - TA0003 — Persistence
  - TA0006 — Credential Access
phases:
- id: svga_device_exploitation
  phase_type: triage
  title: SVGA Device Exploitation
  situation: The attacker has exploited the heap overflow in the SVGA device emulation on ESXi-01 (10.10.50.1) from guest VM web-vm-03 (10.10.40.33). The exploit triggered a use-after-free in the handleCommand function when processing SVGA_CMD_DEFINE_SURFACE commands with oversized parameters. The ROP chain executed in the VMX process context, achieving host-level code execution. VMware's integrity checker has flagged the modified VMX process memory. The attacker now has access to the ESXi host's vmkernel and can read memory from all 47 guest VMs.
  prompt: How do you respond to the hypervisor escape?
  guidance:
    what: 'Separate signal from noise: confirm the alert on ESXi-01, its severity, and the affected accounts.'
    action: How do you respond to the hypervisor escape?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: SVGA Device Exploitation. Asset in scope: ESXi-01.'
  hints:
  - Restarting clears the current exploit but does not address the underlying vulnerability or prevent re-exploitation.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately isolate
  - isolate esxi-01
  - esxi-01 network
  - network management
  - management networks
  - networks disable
  - svga devices
  - devices vms
  reference_answer: |-
    Immediately isolate ESXi-01 from the network (management and VM networks), disable SVGA devices on all VMs, patch ESXi to the latest version (ESXi 7.0U3g), preserve the ESXi host memory dump for forensic analysis, and alert the security team about the hypervisor compromise

    Why: Network isolation stops the attacker from accessing guest VMs or communicating externally. SVGA disablement eliminates the attack surface. Patching closes the vulnerability. Memory dump preserves forensic evidence.
  followup_good: 'From the compromised ESXi host (ESXi-01), the attacker has access to all 47 guest VMs through the vmkernel''s VMM interface. The attacker can read and write memory of any guest VM without detection. Credentials have been extracted from: DC-01 (domain admin credentials, krbtgt hash), DB-PROD-01 (database admin credentials, connection strings), APP-SRV-01 (application API keys), and 44 other VMs. The attacker has also discovered the ESXi management interface (10.10.50.1:443, root/[REDACTED]) and vCenter server (vcenter.corp.local). Total credentials extracted: approximately 2,800 across all 47 VMs.'
  followup_weak: |-
    Network isolation stops the attacker from accessing guest VMs or communicating externally.

    From the compromised ESXi host (ESXi-01), the attacker has access to all 47 guest VMs through the vmkernel's VMM interface. The attacker can read and write memory of any guest VM without detection. Credentials have been extracted from: DC-01 (domain admin credentials, krbtgt hash), DB-PROD-01 (database admin credentials, connection strings), APP-SRV-01 (application API keys), and 44 other VMs. The attacker has also discovered the ESXi management interface (10.10.50.1:443, root/[REDACTED]) and vCenter server (vcenter.corp.local). Total credentials extracted: approximately 2,800 across all 47 VMs.
