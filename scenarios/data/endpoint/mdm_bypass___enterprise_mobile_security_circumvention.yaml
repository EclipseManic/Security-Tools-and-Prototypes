phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A rogue device is enrolled in your MDM and has accessed corporate data. Marcus Webb's Azure AD account is still active 3 weeks after termination. The rogue device has 4.2 GB of sales data. There may be other deprovisioning failures.
  prompt: What do you do RIGHT NOW?
  guidance:
    what: Establish what fired on Intune MDM enrollment, which accounts are involved, and how urgent the signal is.
    action: What do you do RIGHT NOW?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Intune MDM enrollment.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - remotely wipe
  - wipe rogue
  - rogue device
  - device intune
  - intune immediately
  - immediately disable
  - marcus webb
  - webb account
  reference_answer: |-
    Remotely wipe the rogue device via Intune, immediately disable Marcus Webb's account and audit all terminated employees for active accounts, audit the Intune device inventory for other unauthorized enrollments, and lock the sales floor storage closet

    Why: Kills the rogue device (wipe), closes the credential gap (disable + audit), checks for other threats (inventory audit), and secures physical access (lock closet).
  followup_good: Marcus's account was not deprovisioned when he was terminated 3 weeks ago. The HR system (Workday) shows he was terminated on June 1. Azure AD still has his account active with a last sign-in of yesterday. The Intune enrollment for his original device was not removed. The DLP system shows his account accessed the file share on 12 occasions after termination.
  followup_weak: |-
    Kills the rogue device (wipe), closes the credential gap (disable + audit), checks for other threats (inventory audit), and secures physical access (lock closet).

    Marcus's account was not deprovisioned when he was terminated 3 weeks ago. The HR system (Workday) shows he was terminated on June 1. Azure AD still has his account active with a last sign-in of yesterday. The Intune enrollment for his original device was not removed. The DLP system shows his account accessed the file share on 12 occasions after termination.
