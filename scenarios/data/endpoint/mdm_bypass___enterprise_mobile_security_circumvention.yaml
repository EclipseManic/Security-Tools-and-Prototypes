- id: automated_offboarding_pipeline_phase_5
  phase_type: lessons
  title: Automated Offboarding Pipeline — Phase 5
  situation: The root cause is that HR termination did not trigger IT deprovisioning. Workday has a termination event but no automation connected it to Azure AD account disabling, Intune device removal, badge access revocation, and license reclamation.
  prompt: What automated offboarding pipeline do you build?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What automated offboarding pipeline do you build?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Automated Offboarding Pipeline — Phase 5. Asset in scope: Intune MDM enrollment.'
  hints:
  - Partial automation still leaves gaps (badge access, Intune devices, email forwarding).
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - build automated
  - automated pipeline
  - pipeline workday
  - workday termination
  - termination event
  - event azure
  - azure account
  - account disable
  reference_answer: |-
    Build an automated pipeline: Workday termination event → Azure AD account disable (immediate) → all active sessions revoked → Intune device wipe triggered → badge access revoked → email forwarding rules removed → license reclaimed → manager notified → 30-day account archive → permanent deletion

    Why: End-to-end automation eliminates human error: every termination automatically triggers all security actions within minutes, not weeks.
