- id: c2_communication_blending
  phase_type: containment
  title: C2 Communication Blending
  situation: The injected beacon uses svchost.exe's network stack to communicate over HTTPS to 198.51.100.78:443, blending with legitimate Windows Update traffic patterns. The C2 traffic uses a custom malleable C2 profile that mimics legitimate HTTPS request/response patterns including fake Content-Type headers, realistic response sizes, and domain fronting via cloudfront.net. Network analysis shows 247 HTTPS requests to 198.51.100.78 over the past 48 hours, with request sizes averaging 1.2 KB and response sizes averaging 4.8 KB. The traffic is encrypted with TLS 1.3 and appears as normal HTTPS from a Windows system.
  prompt: How do you detect and block the blended C2 communication?
  guidance:
    what: Decide how to stop the spread from APP-SRV-03 while preserving the evidence trail.
    action: How do you detect and block the blended C2 communication?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: C2 Communication Blending. Asset in scope: APP-SRV-03.'
  hints:
  - NDR is valuable for detection but does not prevent the C2 communication.
  - Proxy-based inspection is useful but domain fronting can bypass content inspection.
  ideal_concepts:
  - implement network
  - network allowlisting
  - allowlisting firewall
  - firewall servers
  - servers communicate
  - communicate approved
  - approved internal
  - internal destinations
  reference_answer: |-
    Implement network allowlisting at the firewall so servers can only communicate with approved internal destinations (no direct internet access), deploy SSL/TLS inspection for encrypted traffic analysis, and create network behavioral baselines to detect anomalous HTTPS connections

    Why: Network allowlisting is the strongest control — servers should never have direct internet access. SSL inspection reveals the true C2 traffic. Behavioral baselines detect anomalies.
  followup_good: 'Volatility memory forensics on the captured memory dump from APP-SRV-03 reveals: (1) Injected RWX region in svchost.exe (PID 4832) at 0x000001A800000000, (2) MZ header found in injected memory (PE file loaded reflectively), (3) Network connections from svchost.exe to 198.51.100.78:443 (TLS 1.3), (4) Suspicious API calls: VirtualAllocEx, WriteProcessMemory, CreateRemoteThread in svchost.exe call stack, (5) YARA rule matches for Cobalt Strike beacon in the injected memory region. The attacker has been active on this system for approximately 72 hours and may have performed additional actions before the injection.'
  followup_weak: |-
    Network allowlisting is the strongest control — servers should never have direct internet access.

