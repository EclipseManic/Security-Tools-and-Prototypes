briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to C2 Beacon Injected into Legitimate svchost.exe Process. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for C2 Beacon Injected into Legitimate svchost.exe Process. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for C2 Beacon Injected into Legitimate svchost.exe Process. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the C2 Beacon Injected into Legitimate svchost.exe Process incident. An attacker gained local administrator access to APP-SRV-03 (10.10.40.23, Windows Server 2022) and injected a Cobalt Strike beacon into a legitimate svchost.exe process (PID 4832) using CreateRemoteThread and VirtualAllocEx APIs to allocate memory in the target process, write the shellcode payload, and create a remote thread to execute it. The injection technique uses classic DLL injection with a reflective DLL loader that loads the beacon entirely from memory without writing any DLL files to disk. The svchost.exe process was chosen because it naturally runs multiple instances on every Windows system, handles network communications, and is rarely investigated by security tools. The injected beacon communicates over HTTPS to 198.51.100.78:443 using the legitimate process''s network stack, making the traffic appear as normal HTTPS from a Windows system. The compromise was detected when
  a scheduled endpoint audit using Volatility (volatility -f memory.dump malfind --pid 4832) identified the injected code region in svchost.exe''s virtual address space (RWX permissions at 0x000001A800000000), and network analysis showed HTTPS connections to 198.51.100.78 from a server that should have no direct internet access. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: C2 Beacon Injected into Legitimate svchost.exe Process
  opening: An attacker gained local administrator access to APP-SRV-03 (10.10.40.23, Windows Server 2022) and injected a Cobalt Strike beacon into a legitimate svchost.exe process (PID 4832) using CreateRemoteThread and VirtualAllocEx APIs to allocate memory in the target process, write the shellcode payload, and create a remote thread to execute it. The injection technique uses classic DLL injection with a reflective DLL…
  summary: An attacker gained local administrator access to APP-SRV-03 (10.10.40.23, Windows Server 2022) and injected a Cobalt Strike beacon into a legitimate svchost.exe process (PID 4832) using CreateRemoteThread and VirtualAllocEx APIs to allocate memory in the target process, write the shellcode payload, and create a remote thread to execute it. The injection technique uses classic DLL injection with a reflective DLL loader that loads the beacon entirely from memory without writing any DLL files to disk. The svchost.exe process was chosen because it naturally runs multiple instances on every Windows system, handles network communications, and is rarely investigated by security tools. The injected beacon communicates over HTTPS to 198.51.100.78:443 using the legitimate process's network stack, making the traffic appear as normal HTTPS from a Windows system. The compromise was detected when a scheduled endpoint audit using Volatility (volatility -f memory.dump malfind --pid 4832) identified
    the injected code region in svchost.exe's virtual address space (RWX permissions at 0x000001A800000000), and network analysis showed HTTPS connections to 198.51.100.78 from a server that should have no direct internet access.
  compromised_assets:
  - APP-SRV-03 (10.10.40.23) — Windows Server 2022
  - svchost.exe (PID 4832) — C2 beacon injected via reflective DLL
  - Memory space (RWX region at 0x000001A800000000, 256 KB)
  - Outbound HTTPS C2 channel to 198.51.100.78:443
  - Full remote access for attacker via Cobalt Strike
  detected_via: Volatility memory forensics (malfind plugin detecting RWX region in svchost.exe); anomalous outbound HTTPS from APP-SRV-03 to 198.51.100.78:443 (server should have no internet access); memory region with RWX permissions in svchost.exe
  kill_chain:
  - Local admin access obtained on APP-SRV-03
  - Cobalt Strike beacon compiled as reflective DLL
  - VirtualAllocEx allocates RWX memory in svchost.exe (PID 4832)
  - CreateRemoteThread executes injected code
  - Beacon communicates over HTTPS to 198.51.100.78:443
  - Memory forensics detects injected region (Volatility malfind)
  mitre_tactics:
  - TA0002 — Execution
  - TA0005 — Defense Evasion
  - TA0011 — Command and Control
phases:
- id: process_injection_execution
  phase_type: triage
  title: Process Injection Execution
  situation: The attacker has successfully injected a Cobalt Strike beacon (reflective DLL, 320 KB) into svchost.exe (PID 4832) on APP-SRV-03 (10.10.40.23) using CreateRemoteThread and VirtualAllocEx APIs. The injected code resides in a RWX (Read-Write-Execute) memory region at 0x000001A800000000 (256 KB). The beacon is now active and communicating with C2 server 198.51.100.78:443 over HTTPS. The server has no legitimate reason for outbound internet access. No DLL files were written to disk — the attack is entirely memory-resident.
  prompt: How do you respond to the confirmed process injection?
  guidance:
    what: Establish what fired on APP-SRV-03, which accounts are involved, and how urgent the signal is.
    action: How do you respond to the confirmed process injection?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Process Injection Execution. Asset in scope: APP-SRV-03.'
  hints:
  - Blocking the IP is correct but the attacker can rotate to new infrastructure.
  - Memory scanning tools may not reliably remove injected code without crashing the process.
  - Credential Guard protects credential material but does not detect or prevent process injection.
  ideal_concepts:
  - terminate injected
  - injected svchost
  - svchost exe
  - exe process
  - process isolate
  - isolate app-srv-03
  - app-srv-03 network
  - network deploy
  reference_answer: |-
    Terminate the injected svchost.exe process, isolate APP-SRV-03 from the network, deploy EDR with API-level monitoring for CreateRemoteThread and VirtualAllocEx, implement network allowlisting to block unauthorized outbound HTTPS, and preserve the process memory dump for forensic analysis

    Why: Terminating the process kills the active C2 beacon. Network isolation prevents lateral movement. EDR API monitoring detects future injection attempts. Network allowlisting blocks C2. Memory preservation supports forensics.
  followup_good: The injected beacon uses svchost.exe's network stack to communicate over HTTPS to 198.51.100.78:443, blending with legitimate Windows Update traffic patterns. The C2 traffic uses a custom malleable C2 profile that mimics legitimate HTTPS request/response patterns including fake Content-Type headers, realistic response sizes, and domain fronting via cloudfront.net. Network analysis shows 247 HTTPS requests to 198.51.100.78 over the past 48 hours, with request sizes averaging 1.2 KB and response sizes averaging 4.8 KB. The traffic is encrypted with TLS 1.3 and appears as normal HTTPS from a Windows system.
  followup_weak: |-
    Terminating the process kills the active C2 beacon.

    The injected beacon uses svchost.exe's network stack to communicate over HTTPS to 198.51.100.78:443, blending with legitimate Windows Update traffic patterns. The C2 traffic uses a custom malleable C2 profile that mimics legitimate HTTPS request/response patterns including fake Content-Type headers, realistic response sizes, and domain fronting via cloudfront.net. Network analysis shows 247 HTTPS requests to 198.51.100.78 over the past 48 hours, with request sizes averaging 1.2 KB and response sizes averaging 4.8 KB. The traffic is encrypted with TLS 1.3 and appears as normal HTTPS from a Windows system.
