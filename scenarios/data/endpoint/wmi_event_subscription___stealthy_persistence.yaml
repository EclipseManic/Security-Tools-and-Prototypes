- id: wmi_repository_obfuscation
  phase_type: containment
  title: WMI Repository Obfuscation
  situation: The persistence mechanism is entirely embedded in the WMI repository file (C:\Windows\System32\wbem\Repository\Objects.data, 120 MB). The repository is a binary file that is not scanned by most antivirus tools. The malicious subscription is stored as WMI objects within the repository, making it invisible to file-based scanning. The subscription components have legitimate-looking names (_SecurityUpdateCheck, _SystemHealthMonitor) that blend with other WMI system components. The repository is 120 MB and contains thousands of legitimate WMI objects, making manual identification difficult. The attacker's modifications add approximately 2 KB to the repository size.
  prompt: How do you detect and prevent WMI repository-based persistence?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you detect and prevent WMI repository-based persistence?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: WMI Repository Obfuscation. Asset in scope: DC-02.'
  hints:
  - Restricting subscription creation is valuable but may break legitimate WMI functionality.
  - EDR with WMI analysis is excellent for detection but should be combined with repository integrity monitoring for defense in depth.
  ideal_concepts:
  - implement wmi
  - wmi repository
  - repository integrity
  - integrity monitoring
  - monitoring computing
  - computing sha-256
  - sha-256 hashes
  - hashes objects
  reference_answer: |-
    Implement WMI repository integrity monitoring by computing SHA-256 hashes of Objects.data and comparing against known-good baselines, deploy Sysmon with WMI monitoring (Events 19/20/21), create PowerShell rules to detect encoded commands launched by WMI consumers, and establish a WMI subscription whitelist for the environment

    Why: Repository hash monitoring detects modifications. Sysmon WMI events provide real-time detection. PowerShell rules catch the encoded payload. A whitelist defines normal WMI behavior.
  followup_good: On every system boot, the WMI consumer executes PowerShell to decode and run the embedded C2 payload. The payload connects to 198.51.100.88:8080 via TCP and establishes a reverse shell. PowerShell Script Block Logging (Event ID 4104) has captured the decoded payload. The C2 channel has been active since March 13 with approximately 96 callbacks (one per boot over 4 days). The domain controller processes approximately 2,000 authentication requests per minute, making the additional network connection difficult to detect among normal traffic.
  followup_weak: |-
    Repository hash monitoring detects modifications.

    On every system boot, the WMI consumer executes PowerShell to decode and run the embedded C2 payload. The payload connects to 198.51.100.88:8080 via TCP and establishes a reverse shell. PowerShell Script Block Logging (Event ID 4104) has captured the decoded payload. The C2 channel has been active since March 13 with approximately 96 callbacks (one per boot over 4 days). The domain controller processes approximately 2,000 authentication requests per minute, making the additional network connection difficult to detect among normal traffic.
