  - TA0003 — Persistence
  - TA0005 — Defense Evasion
  - TA0011 — Command and Control
phases:
- id: wmi_subscription_creation
  phase_type: triage
  title: WMI Subscription Creation
  situation: 'The WMI audit has identified a permanent event subscription on DC-02 (10.10.1.11): Event Filter ''_SecurityUpdateCheck'' (query: SELECT * FROM Win32_StartupEvent), CommandLineEvent Consumer ''_SystemHealthMonitor'' (command: powershell.exe -WindowStyle Hidden -enc <base64>), and Filter-to-Consumer binding. The subscription was created on March 13 at 01:45 AM. The WMI repository (Objects.data) has been modified and its hash does not match the known-good baseline. No files have been written to disk — the entire persistence mechanism is embedded in the WMI repository.'
  prompt: How do you respond to the WMI event subscription persistence?
  guidance:
    what: 'Separate signal from noise: confirm the alert on DC-02, its severity, and the affected accounts.'
    action: How do you respond to the WMI event subscription persistence?
    why: Every later decision depends on an accurate picture of DC-02 and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: WMI Subscription Creation. Asset in scope: DC-02.'
  hints:
  - Password reset does not address the WMI persistence.
  - Monitoring is valuable but the existing subscription must be deleted first.
  ideal_concepts:
  - wmi event
  - event subscription
  - subscription filter
  - filter consumer
  - consumer binding
  - binding monitor
  - monitor wmi
  - wmi repository
  reference_answer: |-
    Delete the WMI event subscription (Filter, Consumer, and Binding), monitor WMI repository modifications via Sysmon (Event ID 19/20/21), implement WMI repository integrity monitoring with known-good baselines, and enable PowerShell script block logging globally

    Why: Deleting the subscription eliminates the persistence. Sysmon WMI monitoring detects future subscriptions. Repository integrity monitoring catches modifications. Script block logging detects the payload execution.
  followup_good: The persistence mechanism is entirely embedded in the WMI repository file (C:\Windows\System32\wbem\Repository\Objects.data, 120 MB). The repository is a binary file that is not scanned by most antivirus tools. The malicious subscription is stored as WMI objects within the repository, making it invisible to file-based scanning. The subscription components have legitimate-looking names (_SecurityUpdateCheck, _SystemHealthMonitor) that blend with other WMI system components. The repository is 120 MB and contains thousands of legitimate WMI objects, making manual identification difficult. The attacker's modifications add approximately 2 KB to the repository size.
  followup_weak: |-
    Deleting the subscription eliminates the persistence.

    The persistence mechanism is entirely embedded in the WMI repository file (C:\Windows\System32\wbem\Repository\Objects.data, 120 MB). The repository is a binary file that is not scanned by most antivirus tools. The malicious subscription is stored as WMI objects within the repository, making it invisible to file-based scanning. The subscription components have legitimate-looking names (_SecurityUpdateCheck, _SystemHealthMonitor) that blend with other WMI system components. The repository is 120 MB and contains thousands of legitimate WMI objects, making manual identification difficult. The attacker's modifications add approximately 2 KB to the repository size.
