  reference_answer: |-
    Delete the WMI subscription components, block 198.51.100.88:8080 at the perimeter, enable PowerShell Constrained Language Mode on the DC, deploy script block logging globally, and audit all WMI consumers across all domain controllers

    Why: Subscription deletion stops the C2. IP blocking prevents communication. Constrained Language Mode prevents PowerShell abuse. Global logging detects future attempts. DC audit identifies any additional compromises.
