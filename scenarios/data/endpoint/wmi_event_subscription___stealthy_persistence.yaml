briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to WMI Event Subscription Triggers Backdoor on System Startup. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for WMI Event Subscription Triggers Backdoor on System Startup. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for WMI Event Subscription Triggers Backdoor on System Startup. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the WMI Event Subscription Triggers Backdoor on System Startup incident. An attacker established persistent access on DC-02 (10.10.1.11, Windows Server 2022) using Windows Management Instrumentation (WMI) event subscriptions, creating a permanent event consumer that triggers a PowerShell payload on every system boot. The WMI subscription consists of three components: (1) Event Filter (__EventFilter, name: ''_SecurityUpdateCheck'') triggering on Win32_StartupEvent, (2) Event Consumer (CommandLineEventConsumer, name: ''_SystemHealthMonitor'') executing: powershell.exe -WindowStyle Hidden -enc <base64>, and (3) Filter-to-Consumer binding. The PowerShell command decodes a base64 payload stored as a WMI property value, making the persistence mechanism entirely embedded within the WMI repository (C:\Windows\System32\wbem\Repository\Objects.data, 120 MB) with no files on disk. The attacker named the components ''_SecurityUpdateCheck'' and ''_SystemHealthMonitor''
  to blend with legitimate WMI components. The WMI repository is not scanned by most antivirus tools. Detection required using wmic.exe to enumerate event subscriptions (wmic /namespace:\\root\subscription path __EventFilter get name,query) and comparing against a known-good WMI repository baseline. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: WMI Event Subscription Triggers Backdoor on System Startup
  opening: 'An attacker established persistent access on DC-02 (10.10.1.11, Windows Server 2022) using Windows Management Instrumentation (WMI) event subscriptions, creating a permanent event consumer that triggers a PowerShell payload on every system boot. The WMI subscription consists of three components: (1) Event Filter (__EventFilter, name: ''_SecurityUpdateCheck'') triggering on Win32_StartupEvent, (2) Event Consumer…'
  summary: 'An attacker established persistent access on DC-02 (10.10.1.11, Windows Server 2022) using Windows Management Instrumentation (WMI) event subscriptions, creating a permanent event consumer that triggers a PowerShell payload on every system boot. The WMI subscription consists of three components: (1) Event Filter (__EventFilter, name: ''_SecurityUpdateCheck'') triggering on Win32_StartupEvent, (2) Event Consumer (CommandLineEventConsumer, name: ''_SystemHealthMonitor'') executing: powershell.exe -WindowStyle Hidden -enc <base64>, and (3) Filter-to-Consumer binding. The PowerShell command decodes a base64 payload stored as a WMI property value, making the persistence mechanism entirely embedded within the WMI repository (C:\Windows\System32\wbem\Repository\Objects.data, 120 MB) with no files on disk. The attacker named the components ''_SecurityUpdateCheck'' and ''_SystemHealthMonitor'' to blend with legitimate WMI components. The WMI repository is not scanned by most antivirus
    tools. Detection required using wmic.exe to enumerate event subscriptions (wmic /namespace:\\root\subscription path __EventFilter get name,query) and comparing against a known-good WMI repository baseline.'
  compromised_assets:
  - DC-02 (10.10.1.11) — Windows Server 2022 domain controller
  - WMI repository (Objects.data — permanent event subscription embedded)
  - SYSTEM account execution context (WMI consumer runs as SYSTEM)
  - C2 channel (startup-triggered PowerShell reverse shell)
  - WMI Objects.data file (120 MB, persistence storage, no files on disk)
  detected_via: WMI event subscription enumeration audit (wmic __EventFilter query); WMI repository integrity baseline comparison (Objects.data hash mismatch); PowerShell execution alert from WMI consumer (Event ID 4104)
  kill_chain:
  - SYSTEM access obtained on DC-02 via privilege escalation
  - WMI Event Filter created (_SecurityUpdateCheck, Win32_StartupEvent)
  - CommandLineEvent Consumer configured (_SystemHealthMonitor, encoded PowerShell)
  - Filter-to-Consumer binding established
  - Persistent C2 channel on every system boot
  - No files written to disk — persistence entirely in WMI repository
