briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to PrintNightmare Vulnerability Enables Remote Code Execution as SYSTEM. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for PrintNightmare Vulnerability Enables Remote Code Execution as SYSTEM. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for PrintNightmare Vulnerability Enables Remote Code Execution as SYSTEM. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the PrintNightmare Vulnerability Enables Remote Code Execution as SYSTEM incident. An attacker exploited the PrintNightmare vulnerability (CVE-2021-34527) in the Windows Print Spooler service to achieve remote code execution as SYSTEM on a Windows Server 2019 domain controller (DC-03, 10.10.1.12). The vulnerability exists in the RpcAddPrinterDriverEx function, which allows an authenticated user to load arbitrary DLLs as SYSTEM via the printer driver installation path. The attacker used the public PoC to upload a malicious DLL (printui.dll, SHA256: 4c8a...) to a UNC path (\\198.51.100.42\share\printui.dll), then triggered the Print Spooler to load it via: rundll32.exe printui.dll,EntryPoint achieving SYSTEM privileges. From the domain controller, the attacker dumped the NTDS.dit database using ntdsutil.exe (ntdsutil ''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit), extracted all domain credentials (4,200 accounts), and created
  a Golden Ticket using the krbtgt hash (mimikatz ''kerberos::golden /user:Administrator /domain:corp.local /sid:... /krbtgt:<hash> /ptt''). The exploit was possible because the Print Spooler service was running on the DC (despite no printing requirements) and had not been patched for CVE-2021-34527. The attack was detected when Microsoft Defender for Identity flagged the NTDS.dit access attempt and the Print Spooler service crashed and restarted (a known side effect of the exploit). Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
