- id: ntds_dit_extraction
  phase_type: containment
  title: NTDS.dit Extraction
  situation: 'SYSTEM-level attacker on DC-03 has dumped the NTDS.dit database using ntdsutil.exe. The command executed was: ntdsutil ''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit. The IFM (Install From Media) backup contains the complete NTDS.dit database (1.8 GB) with all 4,200 domain user password hashes, plus the SYSTEM registry hive (SAM, SECURITY). The attacker also extracted the krbtgt NTLM hash (b1607d7b68f53e26328264664081fd2e) for Golden Ticket creation. Microsoft Defender for Identity has flagged the NTDS.dit access attempt. The attacker is preparing to exfiltrate the NTDS.dit data via SMB to external infrastructure.'
  prompt: How do you respond to the NTDS.dit extraction?
  guidance:
    what: Decide how to stop the spread from DC-03 while preserving the evidence trail.
    action: How do you respond to the NTDS.dit extraction?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: NTDS.dit Extraction. Asset in scope: DC-03.'
  hints:
  - Deleting the backup removes the local copy but the attacker may have already exfiltrated it.
  - Credential Guard protects credential material in memory but does not protect the NTDS.dit database file on disk.
  ideal_concepts:
  - isolate dc-03
  - dc-03 network
  - network immediately
  - immediately force
  - krbtgt password
  - password twice
  - twice back-to-back
  - back-to-back force
  reference_answer: |-
    Isolate DC-03 from the network immediately, force reset the krbtgt password twice (back-to-back), force reset all Domain Admin passwords, enable NTDS auditing and alert on ntdsutil.exe execution on DCs, and deploy network segmentation preventing workstations from directly accessing DCs

    Why: Isolation prevents NTDS.dit exfiltration. KRBTGT double reset invalidates Golden Tickets. DA password reset invalidates stolen hashes. NTDS auditing detects future attempts. Network segmentation prevents lateral movement.
  followup_good: The attacker has used the extracted krbtgt hash to create Golden Tickets for persistent domain-wide access. The Golden Ticket grants Domain Admin privileges with a 10-year lifetime. This persistence mechanism survives all user password resets — only a KRBTGT double reset can invalidate it. The attacker has confirmed the Golden Ticket works by authenticating to FS-FINANCE-01 and accessing sensitive financial data. The scope of the compromise requires assuming all Kerberos authentication since the attack may be forged.
  followup_weak: |-
    Isolation prevents NTDS.dit exfiltration.

    The attacker has used the extracted krbtgt hash to create Golden Tickets for persistent domain-wide access. The Golden Ticket grants Domain Admin privileges with a 10-year lifetime. This persistence mechanism survives all user password resets — only a KRBTGT double reset can invalidate it. The attacker has confirmed the Golden Ticket works by authenticating to FS-FINANCE-01 and accessing sensitive financial data. The scope of the compromise requires assuming all Kerberos authentication since the attack may be forged.
