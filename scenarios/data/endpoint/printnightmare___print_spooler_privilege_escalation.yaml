  prompt: How do you complete the Golden Ticket remediation?
  guidance:
    what: Find every foothold the attacker left on DC-03, including persistence and stolen credentials.
    action: How do you complete the Golden Ticket remediation?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Golden Ticket Persistence. Asset in scope: DC-03.'
  hints:
  - Single KRBTGT reset does not fully invalidate all tickets.
  - DC rebuild is thorough but extremely disruptive.
  - Network segmentation is valuable but does not address the existing Golden Ticket.
  ideal_concepts:
  - krbtgt password
  - password twice
  - twice hours
  - hours implement
  - implement kerberos
  - kerberos armoring
  - armoring fast
  - fast dcs
  reference_answer: |-
    Reset the KRBTGT password twice within 12 hours, implement Kerberos armoring (FAST) on all DCs, enforce 60-day KRBTGT rotation via automated GPO, deploy Golden Ticket detection rules in SIEM, and disable the Print Spooler service on all remaining DCs

    Why: Double KRBTGT reset invalidates all Golden Tickets. Kerberos armoring prevents future forging. Automated rotation prevents policy violations. SIEM rules detect future attempts. Print Spooler disablement prevents recurrence.
