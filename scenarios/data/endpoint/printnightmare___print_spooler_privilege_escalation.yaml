phases:
- id: print_spooler_exploitation
  phase_type: triage
  title: Print Spooler Exploitation
  situation: 'The attacker has exploited CVE-2021-34527 on the Print Spooler service running on DC-03 (10.10.1.12). The exploit uploaded a malicious DLL (printui.dll, SHA256: 4c8a...) to \\198.51.100.42\share\ and triggered RpcAddPrinterDriverEx to load it as SYSTEM. The Print Spooler service crashed and restarted (Event ID 7034). The attacker has achieved SYSTEM privileges on the domain controller. The Print Spooler was running on the DC despite no printing requirements. The vulnerability was disclosed 6 months ago but the DC had not been patched.'
  prompt: How do you respond to the PrintNightmare exploitation?
  guidance:
    what: 'Separate signal from noise: confirm the alert on DC-03, its severity, and the affected accounts.'
    action: How do you respond to the PrintNightmare exploitation?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Print Spooler Exploitation. Asset in scope: DC-03.'
  hints:
  - Patching is necessary but does not address the already-achieved SYSTEM access on DC-03.
  - Access restriction does not prevent exploitation — the vulnerability is in the Print Spooler service itself.
  - IPS rules are useful for detection but do not address the already-exploited DC-03.
  ideal_concepts:
  - immediately disable
  - print spooler
  - spooler service
  - service domain
  - domain controllers
  - controllers block
  - attacker unc
  - unc share
  reference_answer: |-
    Immediately disable the Print Spooler service on all domain controllers, block the attacker's UNC share IP (198.51.100.42) at the firewall, deploy the Microsoft emergency patch for CVE-2021-34527, and audit all domain controllers for Print Spooler service status

    Why: Disabling Print Spooler on DCs eliminates the attack surface. IP blocking prevents DLL upload. Emergency patch closes the vulnerability. DC audit identifies any other vulnerable systems.
  followup_good: 'SYSTEM-level attacker on DC-03 has dumped the NTDS.dit database using ntdsutil.exe. The command executed was: ntdsutil ''activate instance ntds'' ''ifm'' ''create full C:\temp\ntds'' quit quit. The IFM (Install From Media) backup contains the complete NTDS.dit database (1.8 GB) with all 4,200 domain user password hashes, plus the SYSTEM registry hive (SAM, SECURITY). The attacker also extracted the krbtgt NTLM hash (b1607d7b68f53e26328264664081fd2e) for Golden Ticket creation. Microsoft Defender for Identity has flagged the NTDS.dit access attempt. The attacker is preparing to exfiltrate the NTDS.dit data via SMB to external infrastructure.'
  followup_weak: |-
    Disabling Print Spooler on DCs eliminates the attack surface.

    SYSTEM-level attacker on DC-03 has dumped the NTDS.dit database using ntdsutil.exe. The command executed was: ntdsutil 'activate instance ntds' 'ifm' 'create full C:\temp\ntds' quit quit. The IFM (Install From Media) backup contains the complete NTDS.dit database (1.8 GB) with all 4,200 domain user password hashes, plus the SYSTEM registry hive (SAM, SECURITY). The attacker also extracted the krbtgt NTLM hash (b1607d7b68f53e26328264664081fd2e) for Golden Ticket creation. Microsoft Defender for Identity has flagged the NTDS.dit access attempt. The attacker is preparing to exfiltrate the NTDS.dit data via SMB to external infrastructure.
