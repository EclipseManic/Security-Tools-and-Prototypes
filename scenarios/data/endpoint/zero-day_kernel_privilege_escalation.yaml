- id: persistence_via_kernel_module
  phase_type: eradication
  title: Persistence via Kernel Module
  situation: 'The attacker has compiled and loaded a custom kernel module (rootkit.ko, 12 KB) that hooks the syscall table to hide processes, files, and network connections from userland tools including ps, netstat, lsof, and top. The module is named ''system_monitor'' in lsmod output to appear legitimate. Dmesg shows: ''system_monitor: loaded version 2.1.0''. The module creates a hidden kernel thread for C2 callback execution every 300 seconds to 198.51.100.47:8443. Module signing is not enforced on this system.'
  prompt: How do you respond to the kernel module persistence?
  guidance:
    what: Find every foothold the attacker left on Linux kernel, including persistence and stolen credentials.
    action: How do you respond to the kernel module persistence?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Persistence via Kernel Module. Asset in scope: Linux kernel.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - enforce module
  - module signing
  - signing module
  - module sig
  - sig enforce
  - enforce reboot
  - host trusted
  - trusted media
  reference_answer: |-
    Enforce module signing via module.sig_enforce=1, reboot the host from trusted media to perform offline forensic analysis, and block the C2 IP 198.51.100.47 at the network perimeter

    Why: Module signing prevents future unsigned module loading. Offline forensics from trusted media can detect the rootkit since it won't be active. Blocking the C2 IP stops callback communications.
  followup_good: Forensic analysis of the compromised host reveals that the attacker has extracted SSH root keys from /root/.ssh/authorized_keys and discovered network connections to db-srv-01 (10.10.30.11) and app-srv-02 (10.10.40.22). The attacker has also modified /etc/passwd to add a backdoor user (svc_monitor:x:0:0::/root:/bin/bash) and created a cron job (/etc/cron.d/system_check) that downloads and executes a script from 198.51.100.47 every 6 hours. Network firewall logs show attempted SSH connections from web-srv-03 to db-srv-01 at 03:22 AM. The attacker is preparing to pivot to higher-value targets.
  followup_weak: |-
    Module signing prevents future unsigned module loading.

    Forensic analysis of the compromised host reveals that the attacker has extracted SSH root keys from /root/.ssh/authorized_keys and discovered network connections to db-srv-01 (10.10.30.11) and app-srv-02 (10.10.40.22). The attacker has also modified /etc/passwd to add a backdoor user (svc_monitor:x:0:0::/root:/bin/bash) and created a cron job (/etc/cron.d/system_check) that downloads and executes a script from 198.51.100.47 every 6 hours. Network firewall logs show attempted SSH connections from web-srv-03 to db-srv-01 at 03:22 AM. The attacker is preparing to pivot to higher-value targets.
