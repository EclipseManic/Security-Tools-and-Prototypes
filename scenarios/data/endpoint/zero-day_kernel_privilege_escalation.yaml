  - web-srv-03 network
  - network level
  - level rotate
  - ssh keys
  - keys compromised
  - compromised accounts
  - accounts remove
  reference_answer: |-
    Isolate web-srv-03 at the network level, rotate all SSH keys for the compromised accounts, remove the backdoor user and cron job, block all C2 infrastructure at the perimeter, and audit SSH authorized_keys on all servers

    Why: Network isolation stops all lateral movement attempts. Key rotation invalidates stolen credentials. Removing backdoor user and cron job eliminates persistence. C2 blocking disrupts attacker communications.
