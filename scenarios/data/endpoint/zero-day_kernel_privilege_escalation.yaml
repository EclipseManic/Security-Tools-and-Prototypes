id: zero-day_kernel_privilege_escalation
name: Zero-Day Kernel Privilege Escalation
category: Endpoint
format_version: 2
difficulty: Expert
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Unpatched Kernel Vulnerability Enables Root Access. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Unpatched Kernel Vulnerability Enables Root Access. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Unpatched Kernel Vulnerability Enables Root Access. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Unpatched Kernel Vulnerability Enables Root Access incident. A red team engagement discovered a previously unknown integer overflow in the Linux kernel''s netfilter nf_tables subsystem (similar to CVE-2023-32233) that allows unprivileged local users to achieve arbitrary kernel memory write. The exploit chains a use-after-free in the nf_tables rule processing with a heap spray technique to overwrite the kernel''s cred structure, elevating a standard user account to root within 3 seconds. The vulnerability exists in kernels 5.10 through 6.3.1 and affects all Debian 11/12 and Ubuntu 22.04 LTS installations in the environment. The exploit was compiled as a position-independent ELF binary (nfexploit, SHA256: a3f8c9...) with anti-analysis techniques including syscall obfuscation and entropy randomization to evade kernel integrity monitoring. Once root was achieved on web-srv-03 (10.10.40.13, kernel 5.15.0-78-generic), the attacker loaded a custom kernel
  module (rootkit.ko) to establish persistence, modified the audit subsystem to suppress log entries (/etc/audit/auditd.conf audit_enabled = 0), and disabled SELinux enforcement (setenforce 0) before pivoting to domain-level targets via SSH keys found in /root/.ssh/authorized_keys. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
incident:
  title: Unpatched Kernel Vulnerability Enables Root Access
  opening: A red team engagement discovered a previously unknown integer overflow in the Linux kernel's netfilter nf_tables subsystem (similar to CVE-2023-32233) that allows unprivileged local users to achieve arbitrary kernel memory write. The exploit chains a use-after-free in the nf_tables rule processing with a heap spray technique to overwrite the kernel's cred structure, elevating a standard user account to root within 3…
  summary: 'A red team engagement discovered a previously unknown integer overflow in the Linux kernel''s netfilter nf_tables subsystem (similar to CVE-2023-32233) that allows unprivileged local users to achieve arbitrary kernel memory write. The exploit chains a use-after-free in the nf_tables rule processing with a heap spray technique to overwrite the kernel''s cred structure, elevating a standard user account to root within 3 seconds. The vulnerability exists in kernels 5.10 through 6.3.1 and affects all Debian 11/12 and Ubuntu 22.04 LTS installations in the environment. The exploit was compiled as a position-independent ELF binary (nfexploit, SHA256: a3f8c9...) with anti-analysis techniques including syscall obfuscation and entropy randomization to evade kernel integrity monitoring. Once root was achieved on web-srv-03 (10.10.40.13, kernel 5.15.0-78-generic), the attacker loaded a custom kernel module (rootkit.ko) to establish persistence, modified the audit subsystem to suppress log
    entries (/etc/audit/auditd.conf audit_enabled = 0), and disabled SELinux enforcement (setenforce 0) before pivoting to domain-level targets via SSH keys found in /root/.ssh/authorized_keys.'
  compromised_assets:
  - Linux kernel (versions 5.10–6.3.1) — nf_tables integer overflow
  - web-srv-03 (10.10.40.13) — Ubuntu 22.04 LTS, kernel 5.15.0-78-generic
  - Root access achieved on vulnerable host
  - Custom kernel module (rootkit.ko) loaded for persistence
  - SELinux enforcement (disabled via setenforce 0)
  - SSH root keys extracted from /root/.ssh/authorized_keys
  detected_via: 'Kernel integrity monitor anomaly (AIDE detected modification to /usr/src/linux/net/netfilter/nf_tables_api.c); unusual kernel module load event (dmesg showed ''rootkit: module loaded''); SELinux status change alert (audit2why reported enforcing→permissive transition)'
  kill_chain:
  - Local exploit execution on unprivileged account (uid=1001)
  - Integer overflow triggers use-after-free in nf_tables
  - Heap spray overwrites cred structure → uid=0
  - Root access achieved in under 3 seconds
  - Custom kernel module (rootkit.ko) loaded for persistence
  - Audit logs suppressed and SELinux disabled
  - SSH keys extracted for lateral pivot
  mitre_tactics:
  - TA0004 — Privilege Escalation
  - TA0005 — Defense Evasion
  - TA0003 — Persistence
  - TA0008 — Lateral Movement
phases:
- id: exploit_delivery_execution
  phase_type: triage
  title: Exploit Delivery & Execution
  situation: The attacker has compiled the nf_tables integer overflow exploit (nfexploit, 2.4 MB ELF binary) and is executing it from a standard user account (uid=1001, webdev) on web-srv-03 (10.10.40.13). The kernel version is 5.15.0-78-generic (Ubuntu 22.04 LTS) which is vulnerable. No kernel livepatch is applied. The exploit targets the nf_tables rule processing subsystem and uses a heap spray technique to achieve arbitrary kernel memory write.
  prompt: How do you respond to the privilege escalation attempt?
  guidance:
    what: 'Frame the decision for ''Exploit Delivery & Execution'': the asset at risk, the evidence available, and the time pressure.'
    action: How do you respond to the privilege escalation attempt?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Exploit Delivery & Execution. Asset in scope: Linux kernel.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately apply
  - apply kernel
  - kernel livepatch
  - livepatch tables
  - tables vulnerability
  - vulnerability restrict
  - restrict tables
  - tables access
  reference_answer: |-
    Immediately apply kernel livepatch for the nf_tables vulnerability, restrict nf_tables access to privileged users only via sysctl, and isolate the host for forensic analysis

    Why: Kernel livepatch closes the vulnerability without requiring a reboot. Restricting nf_tables prevents exploitation on other vulnerable hosts. Isolation preserves forensic evidence.
  followup_good: The exploit has completed and achieved root access (uid=0) on web-srv-03 within 3 seconds. The attacker now has a root shell and is exploring the system. The exploit used heap spraying to allocate controlled data into freed nf_tables rule structures, overwriting the target process's cred structure. The system has no Control Flow Integrity (CFI) enabled and ASLR is configured but the heap spray bypasses it. The attacker has root access and is examining available kernel modules and system configuration.
  followup_weak: |-
    Kernel livepatch closes the vulnerability without requiring a reboot.

    The exploit has completed and achieved root access (uid=0) on web-srv-03 within 3 seconds. The attacker now has a root shell and is exploring the system. The exploit used heap spraying to allocate controlled data into freed nf_tables rule structures, overwriting the target process's cred structure. The system has no Control Flow Integrity (CFI) enabled and ASLR is configured but the heap spray bypasses it. The attacker has root access and is examining available kernel modules and system configuration.
