  mitre_technique: T1068 — Exploitation for Privilege Escalation
- id: credential_structure_overwrite_root_access
  phase_type: analysis
  title: Credential Structure Overwrite & Root Access
  situation: The exploit has completed and achieved root access (uid=0) on web-srv-03 within 3 seconds. The attacker now has a root shell and is exploring the system. The exploit used heap spraying to allocate controlled data into freed nf_tables rule structures, overwriting the target process's cred structure. The system has no Control Flow Integrity (CFI) enabled and ASLR is configured but the heap spray bypasses it. The attacker has root access and is examining available kernel modules and system configuration.
  prompt: How do you respond to the confirmed root compromise?
  guidance:
    what: Test the initial theory against telemetry from Linux kernel before committing to a response.
    action: How do you respond to the confirmed root compromise?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Credential Structure Overwrite & Root Access. Asset in scope: Linux kernel.'
  hints:
  - Rebooting clears the current exploit state but does not address the underlying kernel vulnerability or prevent re-exploitation.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - deploy kernel
  - kernel address
  - address space
  - space layout
  - layout randomization
  - randomization hardening
  - hardening enable
  - control flow
  reference_answer: |-
    Deploy kernel address space layout randomization hardening and enable Control Flow Integrity (CFI) to prevent similar exploits, then quarantine the host and begin full forensic analysis of the root compromise

    Why: CFI prevents unauthorized control flow changes including credential overwrites. Combined with host quarantine and forensics, this addresses both the immediate compromise and future prevention.
  followup_good: 'The attacker has compiled and loaded a custom kernel module (rootkit.ko, 12 KB) that hooks the syscall table to hide processes, files, and network connections from userland tools including ps, netstat, lsof, and top. The module is named ''system_monitor'' in lsmod output to appear legitimate. Dmesg shows: ''system_monitor: loaded version 2.1.0''. The module creates a hidden kernel thread for C2 callback execution every 300 seconds to 198.51.100.47:8443. Module signing is not enforced on this system.'
  followup_weak: |-
    CFI prevents unauthorized control flow changes including credential overwrites.

    The attacker has compiled and loaded a custom kernel module (rootkit.ko, 12 KB) that hooks the syscall table to hide processes, files, and network connections from userland tools including ps, netstat, lsof, and top. The module is named 'system_monitor' in lsmod output to appear legitimate. Dmesg shows: 'system_monitor: loaded version 2.1.0'. The module creates a hidden kernel thread for C2 callback execution every 300 seconds to 198.51.100.47:8443. Module signing is not enforced on this system.
