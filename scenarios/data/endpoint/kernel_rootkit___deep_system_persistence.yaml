  summary: 'An advanced attacker who gained root access on DB-SRV-02 (10.10.30.12, CentOS 7, kernel 3.10.0-1160.el7) deployed a custom kernel rootkit (DKOM — Direct Kernel Object Manipulation) that hooks the syscall table to hide processes, files, and network connections from all userland tools including ps, netstat, lsof, and top. The rootkit (rootkit.ko, 18 KB, compiled for kernel 3.10.0-1160.el7) modifies the task_struct linked list to remove malicious processes from /proc enumeration, hooks tcp4_seq_show and udp4_seq_show functions to filter C2 connections (port 443 to 198.51.100.67 and port 8443 to 198.51.100.68) from netstat output, and uses a hidden kernel thread (kthread_run: ''system_monitor'') for periodic C2 callback execution every 300 seconds. The rootkit also intercepts getdents64 to hide /root/.backdoor/ and its associated files (backdoor.sh, creds.db, config.json). Detection required booting from a trusted external media (RHEL 9 live USB) and performing offline forensic analysis,
    which revealed the modified syscall table (address 0xffffffffa0500000), hidden processes consuming 3.2% CPU, and unauthorized network connections on ports 443 and 8443 to known C2 infrastructure.'
  compromised_assets:
  - DB-SRV-02 (10.10.30.12) — Linux kernel (syscall table modified)
  - Process enumeration (all userland tools return false data)
  - Network connection visibility (C2 connections hidden from netstat)
  - File system (hidden directory /root/.backdoor/)
  - Kernel thread (system_monitor) for C2 callbacks every 300 seconds
  - Rootkit (rootkit.ko) survives reboot via /etc/modules load
  detected_via: Offline forensic analysis from trusted boot media (RHEL 9 live USB); CPU usage anomaly (3.2% unexplained usage despite clean ps output); network traffic analysis (pcap) showing hidden connections to 198.51.100.67:443 and 198.51.100.68:8443
  kill_chain:
  - Root access obtained via privilege escalation exploit (prior compromise)
  - Custom DKOM rootkit compiled and loaded (rootkit.ko, 18 KB)
  - Syscall table hooked for process/file/network hiding
  - Kernel thread spawned for C2 callbacks (every 300 seconds)
  - All userland monitoring tools return false data
  - Rootkit survives reboot via /etc/modules configuration
