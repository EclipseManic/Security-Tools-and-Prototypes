  title: Rootkit Mechanism Analysis
  situation: 'Analysis of rootkit.ko reveals the following capabilities: (1) DKOM: modifies task_struct linked list to hide processes, (2) Syscall table hooking: intercepts getdents64 (file hiding), tcp4_seq_show (TCP connection hiding), udp4_seq_show (UDP hiding), kill_process (prevents kill of hidden processes), (3) Hidden kernel thread using kthread_run for C2 callbacks, (4) Network filtering: hides connections to ports 443 and 8443 on specific IPs (198.51.100.67, 198.51.100.68), (5) File hiding: intercepts getdents64 to hide /root/.backdoor/ directory, (6) Persistence: loaded via /etc/modules on boot, (7) Anti-analysis: checks for debugger presence and virtual machine artifacts. The rootkit was compiled from source found in /usr/src/backdoor/rootkit.c (attacker left source code on the system).'
  prompt: How do you leverage the rootkit analysis for broader threat intelligence?
  guidance:
    what: Decide how to stop the spread from DB-SRV-02 while preserving the evidence trail.
    action: How do you leverage the rootkit analysis for broader threat intelligence?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Rootkit Mechanism Analysis. Asset in scope: DB-SRV-02.'
  hints:
  - Deleting the source code is part of cleanup but should be done after forensic preservation.
  - Kernel updates are important but do not address the already-loaded rootkit or identify other compromised systems.
  ideal_concepts:
  - extract iocs
  - iocs rootkit
  - rootkit file
  - file hashes
  - hashes syscall
  - syscall hook
  - hook addresses
  - addresses create
  reference_answer: |-
    Extract IOCs from the rootkit (C2 IPs, file hashes, syscall hook addresses), create detection rules for other systems (YARA for rootkit.ko, Sigma rules for module loading), scan all other servers for the same rootkit or similar DKOM techniques, and share IOCs with threat intelligence communities

    Why: IOC extraction enables detection across the environment. YARA rules detect the rootkit binary. Sigma rules detect loading behavior. Scanning other servers identifies additional compromises. Sharing IOCs benefits the broader community.
  followup_good: 'The investigation has confirmed that DB-SRV-02 is fully compromised with kernel-level persistence. The rootkit has been active since March 5 (20 days). The attacker has root access, hidden processes, hidden network connections, and hidden files. The system hosts a production PostgreSQL database (DB-PROD-02) containing customer data. No evidence of data exfiltration has been found yet, but the hidden network connections suggest ongoing C2 communication. The CISO requires a complete remediation plan including: system rebuild, credential rotation, environment-wide scanning, and hardening measures to prevent recurrence.'
