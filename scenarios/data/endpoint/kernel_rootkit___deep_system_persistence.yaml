briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Kernel Rootkit Hiding Processes and Network Connections. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Kernel Rootkit Hiding Processes and Network Connections. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Kernel Rootkit Hiding Processes and Network Connections. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Kernel Rootkit Hiding Processes and Network Connections incident. An advanced attacker who gained root access on DB-SRV-02 (10.10.30.12, CentOS 7, kernel 3.10.0-1160.el7) deployed a custom kernel rootkit (DKOM — Direct Kernel Object Manipulation) that hooks the syscall table to hide processes, files, and network connections from all userland tools including ps, netstat, lsof, and top. The rootkit (rootkit.ko, 18 KB, compiled for kernel 3.10.0-1160.el7) modifies the task_struct linked list to remove malicious processes from /proc enumeration, hooks tcp4_seq_show and udp4_seq_show functions to filter C2 connections (port 443 to 198.51.100.67 and port 8443 to 198.51.100.68) from netstat output, and uses a hidden kernel thread (kthread_run: ''system_monitor'') for periodic C2 callback execution every 300 seconds. The rootkit also intercepts getdents64 to hide /root/.backdoor/ and its associated files (backdoor.sh, creds.db, config.json). Detection required
  booting from a trusted external media (RHEL 9 live USB) and performing offline forensic analysis, which revealed the modified syscall table (address 0xffffffffa0500000), hidden processes consuming 3.2% CPU, and unauthorized network connections on ports 443 and 8443 to known C2 infrastructure. Business impact: endpoint availability and integrity are at risk, and affected hosts may need reimaging before normal work resumes. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed.'
