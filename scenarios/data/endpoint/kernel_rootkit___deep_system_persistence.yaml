- id: system_remediation_environment_hardening
  phase_type: eradication
  title: System Remediation & Environment Hardening
  situation: 'The investigation has confirmed that DB-SRV-02 is fully compromised with kernel-level persistence. The rootkit has been active since March 5 (20 days). The attacker has root access, hidden processes, hidden network connections, and hidden files. The system hosts a production PostgreSQL database (DB-PROD-02) containing customer data. No evidence of data exfiltration has been found yet, but the hidden network connections suggest ongoing C2 communication. The CISO requires a complete remediation plan including: system rebuild, credential rotation, environment-wide scanning, and hardening measures to prevent recurrence.'
  prompt: How do you execute the complete remediation?
  guidance:
    what: Find every foothold the attacker left on DB-SRV-02, including persistence and stolen credentials.
    action: How do you execute the complete remediation?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: System Remediation & Environment Hardening. Asset in scope: DB-SRV-02.'
  hints:
  - Restoration from backup does not guarantee complete removal.
  - Kernel patches address specific vulnerabilities but do not remove the loaded rootkit module or the hidden backdoor files.
  - Memory forensics is valuable for detection but does not address the current compromise.
  ideal_concepts:
  - rebuild db-srv-02
  - db-srv-02 known-good
  - known-good installation
  - installation media
  - media backup
  - backup backups
  - backups contain
  - contain rootkit
  reference_answer: |-
    Rebuild DB-SRV-02 from known-good installation media (not backup, as backups may contain rootkit), enable Secure Boot with module signing enforcement, implement kernel integrity monitoring (AIDE/Draeger), rotate all credentials used on or accessible from the compromised system, scan all servers for the rootkit IOCs, and implement runtime kernel protection (SELinux enforcing mode)

    Why: Rebuild from clean media ensures complete rootkit removal. Secure Boot prevents unsigned module loading. Kernel monitoring detects future modifications. Credential rotation invalidates stolen secrets. Environment scanning identifies additional compromises. SELinux limits kernel-level actions.
