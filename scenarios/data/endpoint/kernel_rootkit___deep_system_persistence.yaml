phases:
- id: rootkit_detection_via_offline_forensics
  phase_type: triage
  title: Rootkit Detection via Offline Forensics
  situation: 'The SOC team has booted DB-SRV-02 from a trusted RHEL 9 live USB and is performing offline forensic analysis. Initial findings: (1) Modified syscall table at address 0xffffffffa0500000 with hooks on getdents64, tcp4_seq_show, udp4_seq_show, and kill_process, (2) Hidden processes: ''backdoor_c2'' (PID 4872, consuming 3.2% CPU), ''data_dump'' (PID 4873), (3) Hidden files: /root/.backdoor/ containing backdoor.sh, creds.db, config.json, (4) Unauthorized kernel module: rootkit.ko loaded at boot via /etc/modules, (5) Network connections to 198.51.100.67:443 and 198.51.100.68:8443 (C2 infrastructure). The rootkit has been active since March 5 (module compilation timestamp in ELF header).'
  prompt: How do you proceed with the rootkit investigation and removal?
  guidance:
    what: 'Frame the decision for ''Rootkit Detection via Offline Forensics'': the asset at risk, the evidence available, and the time pressure.'
    action: How do you proceed with the rootkit investigation and removal?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Rootkit Detection via Offline Forensics. Asset in scope: DB-SRV-02.'
  hints:
  - Reinstalling the kernel does not address the backdoor files, hidden processes, or the attacker's root access.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - capture full
  - full forensic
  - forensic image
  - image disk
  - disk memory
  - memory extract
  - extract rootkit
  - rootkit binary
  reference_answer: |-
    Capture a full forensic image of the disk and memory, extract the rootkit binary for analysis, document all hidden artifacts (processes, files, network connections, kernel hooks), block C2 IPs at the perimeter, and plan a complete system rebuild from known-good media

    Why: Forensic imaging preserves evidence for investigation and potential legal action. Rootkit analysis reveals capabilities and IOCs. Documentation creates a complete picture. IP blocking stops C2. Rebuild ensures complete removal.
  followup_good: 'Analysis of rootkit.ko reveals the following capabilities: (1) DKOM: modifies task_struct linked list to hide processes, (2) Syscall table hooking: intercepts getdents64 (file hiding), tcp4_seq_show (TCP connection hiding), udp4_seq_show (UDP hiding), kill_process (prevents kill of hidden processes), (3) Hidden kernel thread using kthread_run for C2 callbacks, (4) Network filtering: hides connections to ports 443 and 8443 on specific IPs (198.51.100.67, 198.51.100.68), (5) File hiding: intercepts getdents64 to hide /root/.backdoor/ directory, (6) Persistence: loaded via /etc/modules on boot, (7) Anti-analysis: checks for debugger presence and virtual machine artifacts. The rootkit was compiled from source found in /usr/src/backdoor/rootkit.c (attacker left source code on the system).'
  followup_weak: |-
    Forensic imaging preserves evidence for investigation and potential legal action.

    Analysis of rootkit.ko reveals the following capabilities: (1) DKOM: modifies task_struct linked list to hide processes, (2) Syscall table hooking: intercepts getdents64 (file hiding), tcp4_seq_show (TCP connection hiding), udp4_seq_show (UDP hiding), kill_process (prevents kill of hidden processes), (3) Hidden kernel thread using kthread_run for C2 callbacks, (4) Network filtering: hides connections to ports 443 and 8443 on specific IPs (198.51.100.67, 198.51.100.68), (5) File hiding: intercepts getdents64 to hide /root/.backdoor/ directory, (6) Persistence: loaded via /etc/modules on boot, (7) Anti-analysis: checks for debugger presence and virtual machine artifacts. The rootkit was compiled from source found in /usr/src/backdoor/rootkit.c (attacker left source code on the system).
