  mitre_technique: T1027 Obfuscated Files or Information
- id: user_notification_and_fraud_response_phase_4
  phase_type: eradication
  title: User Notification and Fraud Response — Phase 4
  situation: 12,000 users may have installed the tampered app. The malware steals banking credentials via accessibility service abuse. You've received reports of unauthorized transactions from 34 users. Financial regulators may need notification.
  prompt: How do you handle user notification and the fraud reports?
  guidance:
    what: Find every foothold the attacker left on 12,000+ user devices running tampered AcmePay APK, including persistence and stolen credentials.
    action: How do you handle user notification and the fraud reports?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: User Notification and Fraud Response — Phase 4. Asset in scope: 12,000+ user devices running tampered AcmePay APK.'
  hints:
  - Only 34 reported but all 12,000 may be compromised.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - users push
  - notification email
  - email in-app
  - in-app alert
  - provide self-check
  - self-check tool
  - tool verifies
  - verifies app
  reference_answer: |-
    Notify all users via push notification, email, and in-app alert; provide a self-check tool that verifies app integrity; work with banking partners to flag affected accounts; file regulatory report if required; create a dedicated incident response page with guidance

    Why: Comprehensive user protection: multi-channel notification reaches all potentially affected users, self-check tool helps users verify their installation, banking partnership enables fraud prevention, regulatory compliance.
  followup_good: 'The C2 server at the exfiltrated domain has been sinkholed by law enforcement in a prior operation. The WHOIS shows privacy protection. The tampered APK signing certificate uses a distinct hash pattern seen in two other tampered app campaigns '
  followup_weak: "Comprehensive user protection: multi-channel notification reaches all potentially affected users, self-check tool helps users verify their installation, banking partnership enables fraud prevention, regulatory compliance.\n\nThe C2 server at the exfiltrated domain has been sinkholed by law enforcement in a prior operation. The WHOIS shows privacy protection. The tampered APK signing certificate uses a distinct hash pattern seen in two other tampered app campaigns "
  next: recovery_and_validation
  mitre_tactic: Impact
  mitre_technique: T1530 Data from Cloud Storage
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. 12,000+ user devices running tampered AcmePay APK is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return 12,000+ user devices running tampered AcmePay APK to production?
  guidance:
    what: Separate business pressure to restore from the evidence required to restore safely.
    action: What must be true before you return 12,000+ user devices running tampered AcmePay APK to production?
    why: A fast restore that reintroduces the attacker is worse than a slower, verified recovery.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: 12,000+ user devices running tampered AcmePay APK.'
  hints:
  - Which backup or rebuild image is known-good for 12,000+ user devices running tampered AcmePay APK, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore 12,000+ user devices running tampered AcmePay APK from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: threat_intelligence_attribution_phase_5
  next_weak: ''
  mitre_tactic: Discovery
  mitre_technique: T1589 Gather Victim Identity Information
