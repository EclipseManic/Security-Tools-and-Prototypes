- id: post_incident_legal_phase_4
  phase_type: lessons
  title: Post-Incident & Legal — Phase 4
  situation: The receiving bank has frozen $1.8M of the $2.4M (the rest was already transferred out). Law enforcement has been engaged. The CISO wants a full incident report.
  prompt: What are the key recommendations in your report?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: What are the key recommendations in your report?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Post-Incident & Legal — Phase 4. Asset in scope: CEO''s identity.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement callback
  - callback verification
  - verification wire
  - wire transfers
  - transfers enforce
  - enforce dmarc
  - dmarc reject
  - reject register
  reference_answer: |-
    1) Implement callback verification for wire transfers over $50K. 2) Enforce DMARC p=reject. 3) Register look-alike domains proactively. 4) Executive awareness training. 5) Out-of-band verification for all financial transactions.

    Why: Addresses the root cause (lack of verification) with multiple defense-in-depth layers.
