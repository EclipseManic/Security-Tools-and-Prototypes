- id: financial_fraud_response_phase_4
  phase_type: eradication
  title: Financial Fraud Response — Phase 4
  situation: Three wire transfers totaling $287,000 were initiated. Two have already cleared to an offshore account in the Cayman Islands. One is still pending. The bank needs documentation for the fraud claim. Law enforcement may need to be involved.
  prompt: How do you handle the financial fraud?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you handle the financial fraud?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Financial Fraud Response — Phase 4. Asset in scope: Sarah Chen''s corporate phone number.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - file formal
  - formal fraud
  - fraud report
  - report bank
  - bank three
  - three transfers
  - transfers provide
  - provide full
  reference_answer: |-
    File a formal fraud report with the bank for all three transfers, provide full forensic documentation (attack timeline, evidence of SIM swap, screenshots of unauthorized access), contact the FBI IC3 for the cybercrime report, engage legal counsel for international wire recovery, and document the incident for cyber insurance claim

    Why: Comprehensive fraud response: bank reporting initiates recovery, forensic documentation supports the claim, FBI involvement is appropriate for this scale, legal counsel handles international recovery, insurance covers the loss.
  followup_good: Sarah Chen is the VP of Finance — a high-value target. The attacker found her information on LinkedIn and the corporate website. Other C-suite executives may be similarly targeted. The organization has 12 executives with SMS-based MFA.
  followup_weak: |-
    Comprehensive fraud response: bank reporting initiates recovery, forensic documentation supports the claim, FBI involvement is appropriate for this scale, legal counsel handles international recovery, insurance covers the loss.

    Sarah Chen is the VP of Finance — a high-value target. The attacker found her information on LinkedIn and the corporate website. Other C-suite executives may be similarly targeted. The organization has 12 executives with SMS-based MFA.
