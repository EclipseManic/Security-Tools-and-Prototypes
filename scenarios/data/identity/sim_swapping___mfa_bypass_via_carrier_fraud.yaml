id: sim_swapping___mfa_bypass_via_carrier_fraud
name: SIM Swapping — MFA Bypass via Carrier Fraud
category: Identity & Access
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to SIM Swap Attack Enables Corporate Account Takeover. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for SIM Swap Attack Enables Corporate Account Takeover. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for SIM Swap Attack Enables Corporate Account Takeover. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the SIM Swap Attack Enables Corporate Account Takeover incident. At 14:30 today, the VP of Finance (Sarah Chen) called the helpdesk in a panic: her corporate phone has no signal and she''s receiving 2FA codes for accounts she didn''t request. Investigation reveals that at 13:50, an attacker called T-Mobile customer service and successfully performed a SIM swap on Sarah''s number (555-867-5309), porting it to a new SIM the attacker controls. The attacker used publicly available information (Sarah''s LinkedIn, corporate website bio, and a data broker purchase of her date of birth and address) to pass T-Mobile''s identity verification. With control of Sarah''s phone number, the attacker: reset her Microsoft 365 password via SMS recovery (14:01), bypassed SMS-based MFA on the corporate VPN (14:08), accessed the corporate expense system (Concur) and initiated three wire transfers totaling $287,000 to an offshore account (14:15-14:25). The fraud was detected
  when the CFO noticed the wire transfers and called Sarah directly. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: SIM Swap Attack Enables Corporate Account Takeover
  opening: 'At 14:30 today, the VP of Finance (Sarah Chen) called the helpdesk in a panic: her corporate phone has no signal and she''s receiving 2FA codes for accounts she didn''t request. Investigation reveals that at 13:50, an attacker called T-Mobile customer service and successfully performed a SIM swap on Sarah''s number (555-867-5309), porting it to a new SIM the attacker controls.'
  summary: 'At 14:30 today, the VP of Finance (Sarah Chen) called the helpdesk in a panic: her corporate phone has no signal and she''s receiving 2FA codes for accounts she didn''t request. Investigation reveals that at 13:50, an attacker called T-Mobile customer service and successfully performed a SIM swap on Sarah''s number (555-867-5309), porting it to a new SIM the attacker controls. The attacker used publicly available information (Sarah''s LinkedIn, corporate website bio, and a data broker purchase of her date of birth and address) to pass T-Mobile''s identity verification. With control of Sarah''s phone number, the attacker: reset her Microsoft 365 password via SMS recovery (14:01), bypassed SMS-based MFA on the corporate VPN (14:08), accessed the corporate expense system (Concur) and initiated three wire transfers totaling $287,000 to an offshore account (14:15-14:25). The fraud was detected when the CFO noticed the wire transfers and called Sarah directly.'
