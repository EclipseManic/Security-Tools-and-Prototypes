phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The attacker controls Sarah's phone number. SMS-based MFA and password recovery are compromised. The wire transfers are processing. Sarah has no phone service. The attacker may still have active sessions.
  prompt: What do you do RIGHT NOW?
  guidance:
    what: 'Separate signal from noise: confirm the alert on Sarah Chen''s corporate phone number, its severity, and the affected accounts.'
    action: What do you do RIGHT NOW?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Sarah Chen''s corporate phone number.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately lock
  - lock sarah
  - sarah microsoft
  - microsoft account
  - account revoke
  - revoke sessions
  - sessions call
  - bank freeze
  reference_answer: |-
    Immediately lock Sarah's Microsoft 365 account and revoke all sessions, call the bank to freeze the wire transfers, contact T-Mobile to reverse the SIM swap and secure the number, disable SMS-based MFA for all privileged accounts, and place a carrier port-freeze PIN on all executive phone numbers

    Why: Multi-pronged containment: kills attacker's access (lock account + revoke sessions), stops financial loss (freeze wires), secures the phone number (reverse SIM swap), prevents MFA bypass (disable SMS MFA), and protects other executives (port-freeze PIN).
  followup_good: The immediate threat is contained. You need to reconstruct the full attack timeline. T-Mobile call records show the SIM swap at 13:50. Microsoft 365 audit logs show the password reset at 14:01. VPN logs show a login from a new device at 14:08. Concur logs show wire transfer authorizations at 14:15, 14:20, and 14:25. The attacker may have also accessed other systems.
  followup_weak: |-
    Multi-pronged containment: kills attacker's access (lock account + revoke sessions), stops financial loss (freeze wires), secures the phone number (reverse SIM swap), prevents MFA bypass (disable SMS MFA), and protects other executives (port-freeze PIN).

