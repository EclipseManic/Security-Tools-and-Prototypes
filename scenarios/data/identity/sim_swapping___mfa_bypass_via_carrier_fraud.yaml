- id: mfa_architecture_review_phase_3
  phase_type: containment
  title: MFA Architecture Review — Phase 3
  situation: The root cause of the MFA bypass is that SMS-based MFA and password recovery both rely on the same phone number. The attacker only needed to compromise one factor (the phone number) to bypass both the password and the MFA. Your organization uses SMS-based MFA for all 2,800 employees.
  prompt: What is the correct remediation for the MFA architecture?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: What is the correct remediation for the MFA architecture?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: MFA Architecture Review — Phase 3. Asset in scope: Sarah Chen''s corporate phone number.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - migrate privileged
  - privileged accounts
  - accounts app-based
  - app-based totp
  - totp hardware
  - hardware security
  - security keys
  - keys fido2
  reference_answer: |-
    Migrate all privileged accounts to app-based TOTP or hardware security keys (FIDO2), implement SIM swap detection (carrier API monitoring), separate password recovery from the primary phone number, and establish a port-freeze PIN policy for all employees

    Why: Eliminates the single point of failure (phone number), adds SIM swap detection as an early warning, separates recovery channels, and prevents future swaps.
  followup_good: Three wire transfers totaling $287,000 were initiated. Two have already cleared to an offshore account in the Cayman Islands. One is still pending. The bank needs documentation for the fraud claim. Law enforcement may need to be involved.
