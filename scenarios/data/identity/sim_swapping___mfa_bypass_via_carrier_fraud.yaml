- id: attack_timeline_reconstruction_phase_2
  phase_type: analysis
  title: Attack Timeline Reconstruction — Phase 2
  situation: The immediate threat is contained. You need to reconstruct the full attack timeline. T-Mobile call records show the SIM swap at 13:50. Microsoft 365 audit logs show the password reset at 14:01. VPN logs show a login from a new device at 14:08. Concur logs show wire transfer authorizations at 14:15, 14:20, and 14:25. The attacker may have also accessed other systems.
  prompt: How do you reconstruct the full attack scope?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on Sarah Chen's corporate phone number.
    action: How do you reconstruct the full attack scope?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Attack Timeline Reconstruction — Phase 2. Asset in scope: Sarah Chen''s corporate phone number.'
  hints:
  - Wire transfers are the financial impact but the attacker may have also exfiltrated data, set up email forwarding, or accessed other systems.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - azure sign-in
  - sign-in logs
  - logs sarah
  - sarah accounts
  - accounts review
  - review vpn
  - vpn connection
  - connection logs
  reference_answer: |-
    Pull Azure AD sign-in logs for all Sarah's accounts, review VPN connection logs for new devices/IPs, audit Concur for all actions during the compromise window, check for any new forwarding rules or delegate access in her email, and review T-Mobile call records for what info the attacker provided

    Why: Full scope assessment across all systems Sarah can access. The attacker may have done more than wire transfers — email forwarding, data access, etc.
  followup_good: The root cause of the MFA bypass is that SMS-based MFA and password recovery both rely on the same phone number. The attacker only needed to compromise one factor (the phone number) to bypass both the password and the MFA. Your organization uses SMS-based MFA for all 2,800 employees.
  followup_weak: |-
    Full scope assessment across all systems Sarah can access.

    The root cause of the MFA bypass is that SMS-based MFA and password recovery both rely on the same phone number. The attacker only needed to compromise one factor (the phone number) to bypass both the password and the MFA. Your organization uses SMS-based MFA for all 2,800 employees.
