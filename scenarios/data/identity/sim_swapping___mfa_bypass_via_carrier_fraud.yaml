    Eliminates the single point of failure (phone number), adds SIM swap detection as an early warning, separates recovery channels, and prevents future swaps.

    Three wire transfers totaling $287,000 were initiated. Two have already cleared to an offshore account in the Cayman Islands. One is still pending. The bank needs documentation for the fraud claim. Law enforcement may need to be involved.
