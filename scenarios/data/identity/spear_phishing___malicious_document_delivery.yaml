id: spear_phishing___malicious_document_delivery
name: Spear Phishing — Malicious Document Delivery
category: Identity & Access
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Spear Phishing — Weaponized PDF Delivered via Spoofed Industry Report. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Spear Phishing — Weaponized PDF Delivered via Spoofed Industry Report. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Spear Phishing — Weaponized PDF Delivered via Spoofed Industry Report. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Spear Phishing — Weaponized PDF Delivered via Spoofed Industry Report incident. At 10:15 on Monday, 5 employees in the Business Development department received an email from ''research@industry-insights[.]com'' with the subject ''2024 Market Analysis — Confidential Pre-Release''. The email was carefully crafted: it referenced a recent industry conference the recipients attended, mentioned the recipient''s company by name, and included a PDF attachment labeled ''Market_Analysis_2024_PreRelease.pdf''. The PDF contained an embedded JavaScript that exploited a known Adobe Acrobat vulnerability (CVE-2024-XXXX) to execute a PowerShell downloader. Of the 5 recipients, 2 opened the PDF on Windows workstations. 1 employee (Karen Mitchell) had an unpatched Acrobat version and was fully compromised. The PowerShell payload downloaded a RatPack RAT that established persistence via a scheduled task, keylogged for 2 hours, and exfiltrated browser saved passwords
  (including corporate SSO credentials) to an encrypted C2 channel. The SOC detected the beacon at 13:45 when the C2 IP was added to the threat intelligence blocklist. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: Spear Phishing — Weaponized PDF Delivered via Spoofed Industry Report
  opening: 'At 10:15 on Monday, 5 employees in the Business Development department received an email from ''research@industry-insights[.]com'' with the subject ''2024 Market Analysis — Confidential Pre-Release''. The email was carefully crafted: it referenced a recent industry conference the recipients attended, mentioned the recipient''s company by name, and included a PDF attachment labeled ''Market_Analysis_2024_PreRelease.pdf''.'
  summary: 'At 10:15 on Monday, 5 employees in the Business Development department received an email from ''research@industry-insights[.]com'' with the subject ''2024 Market Analysis — Confidential Pre-Release''. The email was carefully crafted: it referenced a recent industry conference the recipients attended, mentioned the recipient''s company by name, and included a PDF attachment labeled ''Market_Analysis_2024_PreRelease.pdf''. The PDF contained an embedded JavaScript that exploited a known Adobe Acrobat vulnerability (CVE-2024-XXXX) to execute a PowerShell downloader. Of the 5 recipients, 2 opened the PDF on Windows workstations. 1 employee (Karen Mitchell) had an unpatched Acrobat version and was fully compromised. The PowerShell payload downloaded a RatPack RAT that established persistence via a scheduled task, keylogged for 2 hours, and exfiltrated browser saved passwords (including corporate SSO credentials) to an encrypted C2 channel. The SOC detected the beacon at 13:45 when
    the C2 IP was added to the threat intelligence blocklist.'
