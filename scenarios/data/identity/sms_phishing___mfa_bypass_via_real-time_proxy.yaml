phases:
- id: session_termination_phase_1
  phase_type: triage
  title: Session Termination — Phase 1
  situation: The attacker has an active VPN session as Brian Cox, accessing from a Miami IP. They've been in the session for 45 minutes, downloading CRM data. The session is still active.
  prompt: What is your FIRST action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on Brian Cox''s VPN account, its severity, and the affected accounts.'
    action: What is your FIRST action?
    why: Every later decision depends on an accurate picture of Brian Cox's VPN account and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Session Termination — Phase 1. Asset in scope: Brian Cox''s VPN account.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately terminate
  - terminate brian
  - brian cox
  - cox active
  - active vpn
  - vpn session
  - session revoke
  - revoke his
  reference_answer: |-
    Immediately terminate Brian Cox's active VPN session; revoke his VPN tokens; force a password reset; enable enhanced monitoring on his account; block the Miami IP at the VPN gateway

    Why: Kill the active session, revoke credentials, and block the source — all simultaneously.
  followup_good: The phishing site (vpn-renew.acme-corp[.]com) is a look-alike domain hosted on a bulletproof VPS. Analysis reveals it's an EvilProxy instance — a phishing-as-a-service platform that relays credentials and MFA tokens in real-time to the real service. The platform captures session cookies after MFA, allowing session hijacking even after MFA is completed.
  followup_weak: |-
    Kill the active session, revoke credentials, and block the source — all simultaneously.

    The phishing site (vpn-renew.acme-corp[.]com) is a look-alike domain hosted on a bulletproof VPS. Analysis reveals it's an EvilProxy instance — a phishing-as-a-service platform that relays credentials and MFA tokens in real-time to the real service. The platform captures session cookies after MFA, allowing session hijacking even after MFA is completed.
