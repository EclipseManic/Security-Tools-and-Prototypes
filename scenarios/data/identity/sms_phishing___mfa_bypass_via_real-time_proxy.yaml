  mitre_technique: T1566.002 Spearphishing Link
- id: mfa_bypass_mitigation_phase_3
  phase_type: eradication
  title: MFA Bypass Mitigation — Phase 3
  situation: The attacker bypassed MFA using an EvilProxy relay that captured the push notification response. This technique works against SMS, push, and TOTP-based MFA. The only MFA methods resistant to EvilProxy are hardware security keys (FIDO2/WebAuthn).
  prompt: How do you harden MFA against proxy-based phishing?
  guidance:
    what: Find every foothold the attacker left on Brian Cox's VPN account, including persistence and stolen credentials.
    action: How do you harden MFA against proxy-based phishing?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: MFA Bypass Mitigation — Phase 3. Asset in scope: Brian Cox''s VPN account.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - deploy fido2
  - fido2 webauthn
  - webauthn hardware
  - hardware security
  - security keys
  - keys users
  - users phishing-resistant
  - phishing-resistant mfa
  reference_answer: |-
    Deploy FIDO2/WebAuthn hardware security keys for all users (phishing-resistant MFA); enforce number matching on push notifications as an interim measure; implement conditional access policies that check device compliance and risk signals

    Why: FIDO2 keys are the gold standard — they bind authentication to the domain and can't be proxied. Number matching and conditional access provide interim protection.
  followup_good: '340 customer records were downloaded from the CRM during the 45-minute VPN session. The records include: customer names, email addresses, phone numbers, contract values (ranging from $10K to $2.1M), contract terms, and internal notes. This data could be used for targeted phishing of your customers or competitive intelligence.'
  followup_weak: |-
    FIDO2 keys are the gold standard — they bind authentication to the domain and can't be proxied.

    340 customer records were downloaded from the CRM during the 45-minute VPN session. The records include: customer names, email addresses, phone numbers, contract values (ranging from $10K to $2.1M), contract terms, and internal notes. This data could be used for targeted phishing of your customers or competitive intelligence.
