briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Smishing + MFA Proxy — Compromised Executive Account via Real-Time Phishing. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Smishing + MFA Proxy — Compromised Executive Account via Real-Time Phishing. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Smishing + MFA Proxy — Compromised Executive Account via Real-Time Phishing. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Smishing + MFA Proxy — Compromised Executive Account via Real-Time Phishing incident. At 11:45 on Thursday, the VP of Sales (Brian Cox) received an SMS message from ''+1-800-ACME-SUP'' (spoofed to look like the company''s IT support number): ''ACME IT: Your VPN access expires in 2 hours. Renew now: https://vpn-renew.acme-corp[.]com''. Brian clicked the link, which presented a convincing replica of the company''s VPN login page. He entered his username and password. The site then prompted for MFA (push notification). The attacker''s EvilProxy server relayed Brian''s credentials and MFA token in real-time to the REAL VPN portal. The attacker established a VPN session as Brian within 30 seconds. The SOC detected the VPN login from an unusual IP (residential ISP in Miami — Brian is based in New York). The attacker spent 45 minutes in the VPN session, accessing the CRM system, downloading 340 customer records including contract values and contact information,
  and exfiltrating the data via an encrypted upload to a cloud storage service. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: Smishing + MFA Proxy — Compromised Executive Account via Real-Time Phishing
  opening: 'At 11:45 on Thursday, the VP of Sales (Brian Cox) received an SMS message from ''+1-800-ACME-SUP'' (spoofed to look like the company''s IT support number): ''ACME IT: Your VPN access expires in 2 hours. Renew now: https://vpn-renew.acme-corp[.]com''.'
  summary: 'At 11:45 on Thursday, the VP of Sales (Brian Cox) received an SMS message from ''+1-800-ACME-SUP'' (spoofed to look like the company''s IT support number): ''ACME IT: Your VPN access expires in 2 hours. Renew now: https://vpn-renew.acme-corp[.]com''. Brian clicked the link, which presented a convincing replica of the company''s VPN login page. He entered his username and password. The site then prompted for MFA (push notification). The attacker''s EvilProxy server relayed Brian''s credentials and MFA token in real-time to the REAL VPN portal. The attacker established a VPN session as Brian within 30 seconds. The SOC detected the VPN login from an unusual IP (residential ISP in Miami — Brian is based in New York). The attacker spent 45 minutes in the VPN session, accessing the CRM system, downloading 340 customer records including contract values and contact information, and exfiltrating the data via an encrypted upload to a cloud storage service.'
