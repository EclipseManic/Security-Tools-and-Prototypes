- id: evilproxy_infrastructure_analysis_phase_2
  phase_type: analysis
  title: EvilProxy Infrastructure Analysis — Phase 2
  situation: The phishing site (vpn-renew.acme-corp[.]com) is a look-alike domain hosted on a bulletproof VPS. Analysis reveals it's an EvilProxy instance — a phishing-as-a-service platform that relays credentials and MFA tokens in real-time to the real service. The platform captures session cookies after MFA, allowing session hijacking even after MFA is completed.
  prompt: How do you analyze the EvilProxy infrastructure?
  guidance:
    what: Test the initial theory against telemetry from Brian Cox's VPN account before committing to a response.
    action: How do you analyze the EvilProxy infrastructure?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: EvilProxy Infrastructure Analysis — Phase 2. Asset in scope: Brian Cox''s VPN account.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - analyze phishing
  - phishing site
  - site html
  - html proxies
  - proxies real
  - real vpn
  - vpn login
  - login identify
  reference_answer: |-
    Analyze the phishing site's HTML/JS (it proxies the real VPN login); identify the EvilProxy C2 infrastructure; report the domain and IP for takedown; search for other employees who may have received similar SMS messages; check for other EvilProxy campaigns targeting your domain

    Why: Full infrastructure analysis reveals the scope and helps identify other targets.
  followup_good: The attacker bypassed MFA using an EvilProxy relay that captured the push notification response. This technique works against SMS, push, and TOTP-based MFA. The only MFA methods resistant to EvilProxy are hardware security keys (FIDO2/WebAuthn).
  followup_weak: |-
    Full infrastructure analysis reveals the scope and helps identify other targets.

    The attacker bypassed MFA using an EvilProxy relay that captured the push notification response. This technique works against SMS, push, and TOTP-based MFA. The only MFA methods resistant to EvilProxy are hardware security keys (FIDO2/WebAuthn).
