phases:
- id: fund_recovery_phase_1
  phase_type: triage
  title: Fund Recovery — Phase 1
  situation: $450K was transferred to a Swiss bank account on Friday afternoon. The funds have been moved through 3 shell companies. Monday morning — the fraud was just discovered. The Swiss bank's fraud department needs to be contacted immediately.
  prompt: What is your FIRST priority action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on $450,000 transferred, its severity, and the affected accounts.'
    action: What is your FIRST priority action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Fund Recovery — Phase 1. Asset in scope: $450,000 transferred.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - contact bank
  - bank immediately
  - immediately initiate
  - initiate international
  - international wire
  - wire recall
  - recall notify
  - swiss bank
  reference_answer: |-
    Contact your bank immediately to initiate international wire recall; notify the Swiss bank's fraud department; engage legal counsel for international asset recovery; file with law enforcement (FBI IC3 and local field office)

    Why: International fund recovery requires simultaneous action: your bank, the receiving bank, legal channels, and law enforcement.
  followup_good: The compliance phone system recorded the 4-minute call. Audio analysis shows the voice is a high-quality deepfake — 97% voice match to the CEO's public speeches. The attacker used the CEO's 2023 earnings call, 2024 shareholder meeting, and 3 podcast appearances as training data. The deepfake even included natural speech patterns (the CEO's habit of saying 'look' at the start of sentences). The call came from a VoIP number registered to a disposable account.
  followup_weak: |-
