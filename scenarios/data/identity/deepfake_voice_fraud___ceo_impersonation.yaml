briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Deepfake Voice Attack — $450K Unauthorized Wire Transfer. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Deepfake Voice Attack — $450K Unauthorized Wire Transfer. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Deepfake Voice Attack — $450K Unauthorized Wire Transfer. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Deepfake Voice Attack — $450K Unauthorized Wire Transfer incident. At 15:20 on Friday, the VP of Finance (Lisa Wong) received a phone call from someone sounding exactly like the CEO (Mark Thompson). The voice matched the CEO''s tone, accent, speech patterns, and even referenced a recent board meeting detail. The caller said: ''Lisa, I''m at the airport and can''t use email. I need you to wire $450K to this account for the Quantum acquisition closing — the lawyers are waiting.'' Lisa recognized the voice and authorized the wire. The CEO was actually in a board meeting and had no knowledge of the transfer until Monday morning. The fraud was discovered at 09:00 Monday. The $450K was transferred to an account at a Swiss bank and has been moved through 3 shell companies. Analysis of the voice call (recorded by the company''s compliance phone system) reveals the voice was generated using a deepfake AI model trained on 45 minutes of the CEO''s public speeches
  and earnings calls. The attacker also had knowledge of the board meeting agenda (likely from a compromised email or LinkedIn OSINT). Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
