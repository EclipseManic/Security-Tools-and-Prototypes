  ideal_concepts:
  - preserve recorded
  - recorded call
  - evidence engage
  - engage forensic
  - forensic audio
  - audio analysis
  - analysis firm
  - firm document
  reference_answer: |-
    Preserve the recorded call as evidence; engage a forensic audio analysis firm to document the deepfake; catalog all public sources the attacker could have used to train the model (earnings calls, podcasts, interviews); notify the CEO about voice identity theft

    Why: Evidence preservation, forensic documentation, and understanding the attack vector (public voice data) are essential.
  followup_good: Lisa Wong approved a $450K wire transfer based solely on a phone call. The company has no out-of-band verification requirement for wire transfers. The attacker exploited this gap perfectly — they knew the CEO's voice would be trusted.
