    Voice authentication, controlled public exposure, and detection capabilities create multiple protection layers.

    Law enforcement has been engaged. The FBI IC3 report has been filed. The Swiss bank is cooperating but the shell companies make recovery difficult. The incident needs to be documented for the board and regulators.
