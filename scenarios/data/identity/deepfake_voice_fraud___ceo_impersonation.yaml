- id: verification_protocol_phase_3
  phase_type: containment
  title: Verification Protocol — Phase 3
  situation: Lisa Wong approved a $450K wire transfer based solely on a phone call. The company has no out-of-band verification requirement for wire transfers. The attacker exploited this gap perfectly — they knew the CEO's voice would be trusted.
  prompt: How do you implement verification controls to prevent deepfake voice fraud?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you implement verification controls to prevent deepfake voice fraud?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Verification Protocol — Phase 3. Asset in scope: $450,000 transferred.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - implement multi-person
  - multi-person authorization
  - authorization transfers
  - transfers require
  - require out-of-band
  - out-of-band verification
  - verification in-person
  - in-person video
  reference_answer: |-
    1) Implement multi-person authorization for transfers over $50K. 2) Require out-of-band verification (in-person or video call to a known device). 3) Establish a code word system for urgent financial requests. 4) Train executives to never authorize transfers by voice alone.

    Why: Multi-layered: authorization threshold, out-of-band verification, code words, and executive training. Voice alone is never sufficient.
  followup_good: The CEO's public speeches were used to train the deepfake model. The CEO gives frequent public talks, earnings calls, and podcast appearances. All of these are publicly available and were used as training data.
  followup_weak: |-
    Multi-layered: authorization threshold, out-of-band verification, code words, and executive training.

    The CEO's public speeches were used to train the deepfake model. The CEO gives frequent public talks, earnings calls, and podcast appearances. All of these are publicly available and were used as training data.
