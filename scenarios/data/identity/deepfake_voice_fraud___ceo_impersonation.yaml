- id: executive_voice_protection_phase_4
  phase_type: eradication
  title: Executive Voice Protection — Phase 4
  situation: The CEO's public speeches were used to train the deepfake model. The CEO gives frequent public talks, earnings calls, and podcast appearances. All of these are publicly available and were used as training data.
  prompt: How do you protect executive voice identities going forward?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you protect executive voice identities going forward?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Executive Voice Protection — Phase 4. Asset in scope: $450,000 transferred.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - implement voice
  - voice authentication
  - authentication financial
  - financial requests
  - requests limit
  - limit public
  - public recordings
  - recordings executives
  reference_answer: |-
    Implement voice authentication for financial requests; limit public recordings of executives where possible; register voice biometrics for key executives; develop an internal deepfake detection capability

    Why: Voice authentication, controlled public exposure, and detection capabilities create multiple protection layers.
  followup_good: Law enforcement has been engaged. The FBI IC3 report has been filed. The Swiss bank is cooperating but the shell companies make recovery difficult. The incident needs to be documented for the board and regulators.
