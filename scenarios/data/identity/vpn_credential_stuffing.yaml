  - legal counsel
  - counsel breach
  - breach notification
  - notification requirements
  - requirements employees
  - employees pii
  - pii triggers
  reference_answer: |-
    Engage legal counsel for breach notification requirements (1,847
    employees' PII triggers state breach notification laws in all 50
    US states). Notify CISA and FBI Cyber Division. Issue credit
    monitoring for affected employees. Retain a DFIR firm for full
    forensic timeline. Conduct a lessons-learned review and audit all
    service account privilege levels.

    Why: With 1,847 employees' SSNs and financial data exfiltrated, legal
    obligations are triggered in every US state. Engaging legal counsel
    ensures compliance with notification timelines. FBI and CISA
    notification is standard for nation-state-adjacent attacks. Credit
    monitoring is the expected remediation for PII breaches. A DFIR
    firm provides independent validation.
  followup_good: |-
    The scenario ends here.

    A credential stuffing attack compromised 3 employee accounts including a
