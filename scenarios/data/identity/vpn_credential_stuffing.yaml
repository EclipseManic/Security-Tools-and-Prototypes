  prompt: What is your recommended post-incident action plan?
  guidance:
    what: Summarize what happened, what was missed, and which controls failed on vpn-gw01.corp.acme.local.
    action: What is your recommended post-incident action plan?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Phase 4 — Data Breach Notification and Post-Incident. Asset in scope: vpn-gw01.corp.acme.local.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
