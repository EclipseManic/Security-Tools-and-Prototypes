- id: persistence_mechanism_and_exfiltration_channel
  phase_type: eradication
  title: Phase 3 — Persistence Mechanism and Exfiltration Channel
  situation: |
    Forensic analysis of DC-01 reveals the scheduled task 'GoogleUpdateSync'
    was created at 03:19 UTC, set to run every 15 minutes as SYSTEM. The
    task runs: cmd.exe /c powershell -ep bypass -c "Start-Process -WindowStyle
    Hidden -FilePath 'C:\Windows\Temp\svc_helper.exe'". The binary
    svc_helper.exe (SHA256: a1b2c3d4e5f6...) is a custom Go binary that
    establishes a TLS 1.3 C2 connection to 185.220.101.99:443. PCAP
    analysis shows the exfil channel used HTTPS POST requests to
    r2-backup-cdn.xyz with base64-encoded ZIP archives containing files
    from C:\Windows\NTDS\ and C:\Users\HR_Officers\Documents\. The external
    bucket was provisioned 3 days before the attack.
  prompt: How do you contain and remediate the persistence and exfil?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you contain and remediate the persistence and exfil?
    why: Cleaning the visible payload while leaving persistence in place invites a second incident.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Phase 3 — Persistence Mechanism and Exfiltration Channel. Asset in scope: vpn-gw01.corp.acme.local.'
  hints:
  - |-
    Deleting the task and rebooting addresses the immediate persistence
    but does not block the exfil channel, address the C2 infrastructure,
    or remediate potential Kerberos credential theft from NTDS.dit.
  - |-
    Rebuilding from backup is a valid remediation strategy but is
    slow and does not address the exfiltrated data or the attacker's
    C2 channel.
  ideal_concepts:
  - googleupdatesync scheduled
  - scheduled task
  - task quarantine
  - quarantine svc
  - svc helper
  - helper exe
  - exe block
  - r2-backup-cdn xyz
  reference_answer: |-
    Delete the GoogleUpdateSync scheduled task, quarantine svc_helper.exe,
    block 185.220.101.99 and r2-backup-cdn.xyz at the perimeter firewall,
    force NTDS.dit rotation by performing an authoritative AD restore,
    and rotate the krbtgt password twice to invalidate any Golden Ticket
    the attacker may have forged.

    Why: This addresses all persistence vectors: the scheduled task, the C2
    binary, the exfil channel, and potential Kerberos abuse. Rotating
    krbtgt twice is essential after domain controller compromise because
    the attacker likely dumped NTDS.dit and could forge Golden Tickets.
    Blocking at the perimeter stops data from leaving.
  followup_good: |
    Forensic triage confirms 2.3 GB exfiltrated including:
    C:\Windows\NTDS\ntds.dit (AD credential database), HR PII for 1,847
    employees (SSNs, salary records), and financial board meeting minutes.
    The exfil was completed between 03:08 and 03:28 UTC. The attacker's
    infrastructure (185.220.101.x range) is hosted on bulletproof hosting
    in Moldova. The Cloudflare R2 bucket was created using a disposable
    ProtonMail address. You need to determine the regulatory and legal
    next steps.
  followup_weak: |
    This addresses all persistence vectors: the scheduled task, the C2
    binary, the exfil channel, and potential Kerberos abuse.

    Forensic triage confirms 2.3 GB exfiltrated including:
    C:\Windows\NTDS\ntds.dit (AD credential database), HR PII for 1,847
    employees (SSNs, salary records), and financial board meeting minutes.
    The exfil was completed between 03:08 and 03:28 UTC. The attacker's
    infrastructure (185.220.101.x range) is hosted on bulletproof hosting
    in Moldova. The Cloudflare R2 bucket was created using a disposable
    ProtonMail address. You need to determine the regulatory and legal
    next steps.
  next: recovery_and_validation
  mitre_tactic: Persistence
  mitre_technique: T1053.005 — Scheduled Task
  role_prompts:
    analyst: What forensic and remediation steps do you take on DC-01?
    incident_manager: How do you coordinate the multi-step containment and remediation?
    ciso: What communication do you need to prepare for regulators and the board?
    executive: What is the full scope of data loss and what is the remediation timeline?
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. vpn-gw01.corp.acme.local is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return vpn-gw01.corp.acme.local to production?
  guidance:
    what: Separate business pressure to restore from the evidence required to restore safely.
    action: What must be true before you return vpn-gw01.corp.acme.local to production?
    why: Business trust depends on returning service with evidence that the environment is safe.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: vpn-gw01.corp.acme.local.'
  hints:
  - Which backup or rebuild image is known-good for vpn-gw01.corp.acme.local, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore vpn-gw01.corp.acme.local from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: data_breach_notification_and_post_incident
  next_weak: ''
  mitre_tactic: Exfiltration
  mitre_technique: T1567.002 — Exfiltration to Cloud Storage
  role_prompts: {}
