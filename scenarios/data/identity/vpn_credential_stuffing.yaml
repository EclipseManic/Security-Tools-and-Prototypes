briefings:
  analyst: |
    You are the Tier-1 SOC analyst on shift. Your SIEM just fired a
    high-severity correlation rule 'VPN Credential Stuffing Burst'.
    Triage the scope of the breach, identify compromised accounts and their
    privilege level, and take initial containment actions. Preserve all
    evidence and escalate to the incident manager at the right time.
  incident_manager: You are the Incident Manager coordinating the response to Credential Stuffing Attack on GlobalProtect VPN Gateway. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Credential Stuffing Attack on GlobalProtect VPN Gateway. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Credential Stuffing Attack on GlobalProtect VPN Gateway. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the Credential Stuffing Attack on GlobalProtect VPN Gateway incident. On 2025-11-14 at 02:17 UTC, the Palo Alto GlobalProtect VPN gateway
  (vpn-gw01.corp.acme.local, public IP 203.0.113.42) logged an abnormal
  spike: 4,812 failed authentication attempts in 47 minutes originating
  from Tor exit nodes (185.220.101.34, 185.220.101.45, 109.70.100.58).
  At 03:04 UTC, three accounts successfully authenticated:

    - j.hernandez (AD: CORP\j.hernandez) — source 185.220.101.34:49812
    - m.okafor (AD: CORP\m.okafor) — source 185.220.101.45:51203
    - svc-backup (service account, CORP\svc-backup) — source 109.70.100.58:48921

  The svc-backup account has domain admin privileges for backup operations.
  GeoIP logs show the three authenticated sessions then accessed internal
  resources: the HR file server (10.10.20.44), the financials SharePoint
  migration site, and the domain controller (10.10.1.10). DLP alerts
  triggered at 03:28 UTC when 2.3 GB of compressed archives were uploaded
  from svc-backup to an external Cloudflare R2 bucket (r2-backup-cdn.xyz).
  The SOC also found a new scheduled task 'GoogleUpdateSync' on DC-01
  creating a persistent reverse shell to 185.220.101.99:443. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.
