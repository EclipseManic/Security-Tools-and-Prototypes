id: ai-generated_phishing___llm-crafted_emails
name: AI-Generated Phishing — LLM-Crafted Emails
category: Identity & Access
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to AI Phishing Campaign — LLM-Generated Emails with Perfect Grammar and Personalization. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for AI Phishing Campaign — LLM-Generated Emails with Perfect Grammar and Personalization. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for AI Phishing Campaign — LLM-Generated Emails with Perfect Grammar and Personalization. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the AI Phishing Campaign — LLM-Generated Emails with Perfect Grammar and Personalization incident. At 08:00 on Monday, the SOC noticed a spike in reported phishing emails — 23 reports in 1 hour. Unlike typical phishing, these emails were flawlessly written: perfect grammar, natural tone, personalized content referencing each recipient''s recent projects, and contextually appropriate urgency. The emails impersonated the company''s COO (Jennifer Walsh) and requested ''quarterly budget reviews'' via a link to a credential harvesting site. Analysis reveals the emails were generated by an LLM — they contain no telltale signs of traditional phishing (grammar errors, generic salutations, mismatched domains). The sender domain was coo-jenniferwalsh[.]com — a highly targeted look-alike. Of the 23 recipients, 14 clicked the link, and 8 entered credentials. The credential harvesting site (hosted on Azure Blob Storage) captured credentials in real-time and relayed
  them via WebSocket to the attacker. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: AI Phishing Campaign — LLM-Generated Emails with Perfect Grammar and Personalization
  opening: 'At 08:00 on Monday, the SOC noticed a spike in reported phishing emails — 23 reports in 1 hour. Unlike typical phishing, these emails were flawlessly written: perfect grammar, natural tone, personalized content referencing each recipient''s recent projects, and contextually appropriate urgency.'
  summary: 'At 08:00 on Monday, the SOC noticed a spike in reported phishing emails — 23 reports in 1 hour. Unlike typical phishing, these emails were flawlessly written: perfect grammar, natural tone, personalized content referencing each recipient''s recent projects, and contextually appropriate urgency. The emails impersonated the company''s COO (Jennifer Walsh) and requested ''quarterly budget reviews'' via a link to a credential harvesting site. Analysis reveals the emails were generated by an LLM — they contain no telltale signs of traditional phishing (grammar errors, generic salutations, mismatched domains). The sender domain was coo-jenniferwalsh[.]com — a highly targeted look-alike. Of the 23 recipients, 14 clicked the link, and 8 entered credentials. The credential harvesting site (hosted on Azure Blob Storage) captured credentials in real-time and relayed them via WebSocket to the attacker.'
  compromised_assets:
