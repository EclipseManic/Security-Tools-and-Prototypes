phases:
- id: credential_revocation_phase_1
  phase_type: triage
  title: Credential Revocation — Phase 1
  situation: 8 employees entered their SSO credentials on the AI-generated phishing site. The credentials were relayed via WebSocket to the attacker in real-time. The phishing site is still active on Azure Blob Storage.
  prompt: What is your FIRST priority action?
  guidance:
    what: Establish what fired on 8 employees' credentials, which accounts are involved, and how urgent the signal is.
    action: What is your FIRST priority action?
    why: Every later decision depends on an accurate picture of 8 employees' credentials and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Credential Revocation — Phase 1. Asset in scope: 8 employees'' credentials.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - password reset
  - affected employees
  - employees revoke
  - revoke sso
  - sso sessions
  - sessions check
  - unauthorized access
  - access credentials
  reference_answer: |-
    Force password reset for all 8 affected employees; revoke their SSO sessions; check for unauthorized access using their credentials; report the Azure Blob Storage phishing site for takedown; block the look-alike domain at the email gateway

    Why: Credential reset, session revocation, access monitoring, and takedown — all simultaneously.
  followup_good: The 23 emails are analyzed. They were generated by an LLM — no grammar errors, perfect personalization, natural tone. The attacker used OSINT (LinkedIn, company website, press releases) to build context for each recipient. The emails referenced specific projects each employee was working on. The LLM output was indistinguishable from legitimate internal communications.
  followup_weak: |-
    Credential reset, session revocation, access monitoring, and takedown — all simultaneously.

    The 23 emails are analyzed. They were generated by an LLM — no grammar errors, perfect personalization, natural tone. The attacker used OSINT (LinkedIn, company website, press releases) to build context for each recipient. The emails referenced specific projects each employee was working on. The LLM output was indistinguishable from legitimate internal communications.
