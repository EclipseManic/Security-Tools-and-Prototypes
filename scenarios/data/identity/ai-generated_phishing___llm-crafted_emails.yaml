- id: email_security_update_phase_3
  phase_type: eradication
  title: Email Security Update — Phase 3
  situation: 'The AI-generated emails bypassed traditional phishing detection because they had: perfect grammar (no NLP flags), legitimate-looking sender (newly registered look-alike domain), appropriate urgency (budget review timing), and personalized content. Traditional rules based on grammar errors and generic content failed.'
  prompt: How do you update email security to catch AI-generated phishing?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you update email security to catch AI-generated phishing?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Email Security Update — Phase 3. Asset in scope: 8 employees'' credentials.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - deploy ai-based
  - ai-based email
  - email analysis
  - analysis nlp
  - nlp models
  - models trained
  - trained ai-generated
  - ai-generated content
  reference_answer: |-
    Deploy AI-based email analysis (NLP models trained on AI-generated content); implement brand impersonation detection; add behavioral analysis (unusual sender patterns); enforce DMARC/DKIM/SPF; implement link analysis with time-of-click protection; add external email banners

    Why: AI-powered detection, authentication protocols, and behavioral analysis address the limitations of rule-based detection.
  followup_good: The attacker used LinkedIn profiles, company press releases, and the corporate website to personalize each email. Employee names, projects, and roles were all publicly available. This OSINT enabled the LLM to generate perfectly targeted content.
  followup_weak: |-
    AI-powered detection, authentication protocols, and behavioral analysis address the limitations of rule-based detection.

    The attacker used LinkedIn profiles, company press releases, and the corporate website to personalize each email. Employee names, projects, and roles were all publicly available. This OSINT enabled the LLM to generate perfectly targeted content.
