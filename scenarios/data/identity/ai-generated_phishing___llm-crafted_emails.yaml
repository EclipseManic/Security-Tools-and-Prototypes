  mitre_technique: T1556 Modify Authentication Process
- id: ai_phishing_analysis_phase_2
  phase_type: analysis
  title: AI Phishing Analysis — Phase 2
  situation: The 23 emails are analyzed. They were generated by an LLM — no grammar errors, perfect personalization, natural tone. The attacker used OSINT (LinkedIn, company website, press releases) to build context for each recipient. The emails referenced specific projects each employee was working on. The LLM output was indistinguishable from legitimate internal communications.
  prompt: How do you analyze and respond to AI-generated phishing?
  guidance:
    what: Pivot from the alert to the log sources that reveal how far the attacker reached.
    action: How do you analyze and respond to AI-generated phishing?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: AI Phishing Analysis — Phase 2. Asset in scope: 8 employees'' credentials.'
  hints:
  - Technical IOCs help but understanding the AI generation method is equally important for detection.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - document phishing
  - phishing indicators
  - indicators perfect
  - perfect grammar
  - grammar high
  - high personalization
  - personalization llm
  - llm signature
  reference_answer: |-
    Document the AI phishing indicators (perfect grammar + high personalization = LLM signature); update email security rules to flag high-personalization external emails; share IOCs with ISAC; assess what OSINT the attacker used to personalize; brief the SOC on AI phishing detection techniques

    Why: Understanding AI phishing characteristics helps detect future campaigns. OSINT assessment reduces future exposure.
  followup_good: 'The AI-generated emails bypassed traditional phishing detection because they had: perfect grammar (no NLP flags), legitimate-looking sender (newly registered look-alike domain), appropriate urgency (budget review timing), and personalized content. Traditional rules based on grammar errors and generic content failed.'
  followup_weak: |-
    Understanding AI phishing characteristics helps detect future campaigns.

    The AI-generated emails bypassed traditional phishing detection because they had: perfect grammar (no NLP flags), legitimate-looking sender (newly registered look-alike domain), appropriate urgency (budget review timing), and personalized content. Traditional rules based on grammar errors and generic content failed.
