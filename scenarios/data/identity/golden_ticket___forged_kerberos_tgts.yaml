- id: domain_wide_lateral_movement_persistence
  phase_type: eradication
  title: Domain-Wide Lateral Movement & Persistence
  situation: 'The attacker has used Golden Tickets to install Cobalt Strike beacons on DC-01 (10.10.1.10, scheduled task ''SystemHealth''), DC-02 (10.10.1.11, WMI subscription), and DC-03 (10.10.1.12, registry Run key). All three domain controllers are compromised with persistent backdoors. The attacker also created a backdoor account (svc_monitor, SID 50001, password: Str0ngP@ss!) in Active Directory with Domain Admin privileges. The account was created on March 1 at 04:15 AM and has been used for ongoing access. Financial data from Q4_Reports has been exfiltrated to 198.51.100.78 (4.2 GB transferred over 3 sessions).'
  prompt: How do you respond to the domain-wide persistence and data exfiltration?
  guidance:
    what: Find every foothold the attacker left on KRBTGT NTLM hash, including persistence and stolen credentials.
    action: How do you respond to the domain-wide persistence and data exfiltration?
