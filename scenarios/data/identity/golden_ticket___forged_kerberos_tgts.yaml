  compromised_assets:
  - KRBTGT NTLM hash (enables Golden Ticket forging for entire domain)
  - DC-01 (10.10.1.10), DC-02 (10.10.1.11), DC-03 (10.10.1.12) — persistent backdoors
  - Finance file share (\\FS-FINANCE-01\Q4_Reports — quarterly earnings exfiltrated)
  - Domain-wide authentication integrity (all tickets potentially forged during 6-week window)
  - Backdoor account (svc_monitor, SID 50001) created in Active Directory
  detected_via: KRBTGT password age audit (not changed in 4 years, violates 60-day policy); network capture analysis revealing forged ticket signatures; unusual access patterns to finance share from non-finance users
  kill_chain:
  - KRBTGT hash extracted from DC-01 via DCSync (prior compromise)
  - Golden Ticket TGTs forged with Domain Admin SIDs and 10-year validity
  - Forged tickets used for domain-wide authentication (no DC interaction)
  - Finance data exfiltrated via forged access to Q4_Reports share
  - Persistent backdoors installed on 3 domain controllers via WMI
