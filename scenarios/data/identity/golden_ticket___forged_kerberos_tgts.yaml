briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Golden Ticket Attack Forging Domain-Wide Authentication. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Golden Ticket Attack Forging Domain-Wide Authentication. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Golden Ticket Attack Forging Domain-Wide Authentication. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Golden Ticket Attack Forging Domain-Wide Authentication incident. An attacker who previously compromised DC-01 (10.10.1.10, Windows Server 2022) and extracted the KRBTGT account''s NTLM hash (KRBTGT:502:aad3b435b51404eeaad3b435b51404ee:b1607d7b68f53e26328264664081fd2e) used Mimikatz to forge Golden Ticket TGTs (Ticket Granting Tickets) with arbitrary group memberships, including Domain Admin privileges (S-1-5-21-1234567890-1234567890-1234567890-500). The forged tickets were generated with a 10-year validity period and used to authenticate to every server in the domain without generating additional password changes or authentication events on the DC. The attacker used these forged tickets to: (1) access the finance file share (\\FS-FINANCE-01\Q4_Reports) and exfiltrate quarterly earnings reports before public release, (2) install Cobalt Strike beacons on DC-01, DC-02, and DC-03 via WMI, and (3) create a backdoor account (svc_monitor:x:50001) in Active
  Directory. Detection came 6 weeks later on April 28 when a forensic audit noticed that the KRBTGT password had not been changed in 4 years (violating the 60-day rotation policy) and network capture analysis revealed forged ticket signatures (incorrect encryption type and anomalous ticket lifetime). Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
