phases:
- id: krbtgt_hash_extraction
  phase_type: triage
  title: KRBTGT Hash Extraction
  situation: Forensic analysis has determined that the attacker used DCSync from a compromised workstation (WS-JMARTINEZ-04, 10.10.10.44) to extract the KRBTGT account's NTLM hash from DC-01 (10.10.1.10). The DCSync operation occurred on February 15 at 03:22 AM, using compromised Domain Admin credentials. The KRBTGT hash has been in the attacker's possession for 6 weeks. The KRBTGT password was last changed 4 years ago (March 2022), violating the 60-day rotation policy. All Kerberos authentication in the domain during the 6-week window may be forged.
  prompt: How do you address the KRBTGT hash compromise?
  guidance:
    what: 'Separate signal from noise: confirm the alert on KRBTGT NTLM hash, its severity, and the affected accounts.'
    action: How do you address the KRBTGT hash compromise?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: KRBTGT Hash Extraction. Asset in scope: KRBTGT NTLM hash.'
  hints:
  - A single KRBTGT reset does not fully invalidate all Golden Tickets.
  - Rotating DA passwords does not invalidate Golden Tickets.
  - Kerberos armoring is a good long-term measure but does not address the immediate threat of existing Golden Tickets.
  ideal_concepts:
  - immediately reset
  - krbtgt password
  - password twice
  - twice back-to-back
  - back-to-back hours
  - hours invalidate
  - invalidate golden
  - golden tickets
  reference_answer: |-
    Immediately reset the KRBTGT password twice (back-to-back within 12 hours) to invalidate all Golden Tickets, enforce 60-day KRBTGT password rotation via automated GPO, and restrict DCSync permissions to only DC computer accounts

    Why: Double KRBTGT reset invalidates all existing and cached Golden Tickets. Automated rotation prevents future password age violations. Restricting DCSync permissions prevents future hash extraction.
  followup_good: 'Network capture analysis from March 1-15 reveals Golden Ticket artifacts: TGTs with 10-year validity (unusual: normal is 10 hours), tickets using RC4 encryption when AES is configured, and authentication events that do not generate corresponding TGT requests on the DC. The attacker''s forged tickets have been used to access: FS-FINANCE-01 (\\FS-FINANCE-01\Q4_Reports), APP-SRV-01, DB-SRV-01, and all three domain controllers. Event ID 4769 (Kerberos Service Ticket Operation) logs show anomalous ticket properties across 47 unique source IPs.'
  followup_weak: |-
    Double KRBTGT reset invalidates all existing and cached Golden Tickets.

    Network capture analysis from March 1-15 reveals Golden Ticket artifacts: TGTs with 10-year validity (unusual: normal is 10 hours), tickets using RC4 encryption when AES is configured, and authentication events that do not generate corresponding TGT requests on the DC. The attacker's forged tickets have been used to access: FS-FINANCE-01 (\\FS-FINANCE-01\Q4_Reports), APP-SRV-01, DB-SRV-01, and all three domain controllers. Event ID 4769 (Kerberos Service Ticket Operation) logs show anomalous ticket properties across 47 unique source IPs.
