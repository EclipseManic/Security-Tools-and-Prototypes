  - detection rules
  - rules siem
  - siem monitor
  - monitor anomalous
  - anomalous ticket
  reference_answer: |-
    Deploy Golden Ticket detection rules in SIEM (monitor for anomalous ticket lifetimes, RC4 usage when AES is configured, and DC authentication bypass patterns), implement Kerberos armoring (FAST) on all DCs, and reset KRBTGT password twice

    Why: Detection rules identify existing Golden Tickets. Kerberos armoring prevents future ticket forging. KRBTGT double reset invalidates all existing forged tickets.
  followup_good: 'The attacker has used Golden Tickets to install Cobalt Strike beacons on DC-01 (10.10.1.10, scheduled task ''SystemHealth''), DC-02 (10.10.1.11, WMI subscription), and DC-03 (10.10.1.12, registry Run key). All three domain controllers are compromised with persistent backdoors. The attacker also created a backdoor account (svc_monitor, SID 50001, password: Str0ngP@ss!) in Active Directory with Domain Admin privileges. The account was created on March 1 at 04:15 AM and has been used for ongoing access. Financial data from Q4_Reports has been exfiltrated to 198.51.100.78 (4.2 GB transferred over 3 sessions).'
