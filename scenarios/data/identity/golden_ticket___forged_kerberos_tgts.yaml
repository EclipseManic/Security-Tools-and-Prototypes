  reference_answer: |-
    Delete all backdoor accounts (svc_monitor), remove persistence mechanisms from all 3 DCs (scheduled task, WMI subscription, registry Run key), block C2 IP 198.51.100.78, reset all Domain Admin passwords, and perform a complete domain health check

    Why: Removing all persistence mechanisms and backdoor accounts eliminates attacker access. C2 blocking disrupts communications. Password rotation invalidates stolen credentials. Domain health check identifies any additional compromise.
  followup_good: The scope of the compromise requires assuming all Kerberos authentication during the 6-week window (February 15 - April 28) was potentially forged. The KRBTGT password has been reset once but needs a second reset to fully invalidate all Golden Tickets. Additionally, 4,200 user accounts may have been accessed via forged tickets. The attacker had Domain Admin privileges and could have accessed any resource in the domain. Financial data exfiltration has been confirmed. The CISO has requested a comprehensive remediation plan.
