briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Pretexting — Vendor Impersonation Causing $187K Fraudulent Payment. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Pretexting — Vendor Impersonation Causing $187K Fraudulent Payment. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Pretexting — Vendor Impersonation Causing $187K Fraudulent Payment. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Pretexting — Vendor Impersonation Causing $187K Fraudulent Payment incident. At 10:30 on Wednesday, the Accounts Payable team received a phone call from someone claiming to be David Liu from Apex Cloud Services (a legitimate vendor). The caller knew the vendor''s account number, recent invoice numbers, and the name of the AP clerk who normally handles Apex invoices — all obtained from LinkedIn and a previous data breach at Apex. The caller said Apex was changing bank accounts and needed to update payment details. The AP clerk updated the bank details without requiring secondary verification (none existed). Three invoices totaling $187,000 were paid to the new account on Thursday. On Friday, the real Apex Cloud Services called about overdue payments. The fraud was discovered at 14:20 on Friday. The receiving bank account (opened 5 days ago at a online-only bank) has already been drained — the funds were moved through a cryptocurrency exchange within
  2 hours of receipt. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: Pretexting — Vendor Impersonation Causing $187K Fraudulent Payment
  opening: At 10:30 on Wednesday, the Accounts Payable team received a phone call from someone claiming to be David Liu from Apex Cloud Services (a legitimate vendor). The caller knew the vendor's account number, recent invoice numbers, and the name of the AP clerk who normally handles Apex invoices — all obtained from LinkedIn and a previous data breach at Apex.
  summary: At 10:30 on Wednesday, the Accounts Payable team received a phone call from someone claiming to be David Liu from Apex Cloud Services (a legitimate vendor). The caller knew the vendor's account number, recent invoice numbers, and the name of the AP clerk who normally handles Apex invoices — all obtained from LinkedIn and a previous data breach at Apex. The caller said Apex was changing bank accounts and needed to update payment details. The AP clerk updated the bank details without requiring secondary verification (none existed). Three invoices totaling $187,000 were paid to the new account on Thursday. On Friday, the real Apex Cloud Services called about overdue payments. The fraud was discovered at 14:20 on Friday. The receiving bank account (opened 5 days ago at a online-only bank) has already been drained — the funds were moved through a cryptocurrency exchange within 2 hours of receipt.
