- id: vendor_verification_controls_phase_3
  phase_type: eradication
  title: Vendor Verification Controls — Phase 3
  situation: 'The root cause is clear: the AP clerk changed bank details based solely on a phone call with no verification. There was no out-of-band confirmation process for payment detail changes. The company has 200+ vendors and processes 1,500 invoices per month.'
  prompt: How do you prevent vendor impersonation fraud going forward?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you prevent vendor impersonation fraud going forward?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Vendor Verification Controls — Phase 3. Asset in scope: $187,000 transferred.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - implement dual-authorization
  - dual-authorization bank
  - bank detail
  - detail changes
  - changes require
  - require out-of-band
  - out-of-band verification
  - verification callback
  reference_answer: |-
    Implement dual-authorization for all bank detail changes; require out-of-band verification (callback to known vendor number) before modifying payment details; add a 48-hour cooling period for bank changes

    Why: Three-layer defense: dual authorization (prevents single-point compromise), out-of-band verification (breaks the pretext), and cooling period (time to catch fraud).
  followup_good: The AP clerk's LinkedIn profile exposed their role and employer. Apex's data breach exposed vendor billing details. Your company website lists the AP department phone number publicly. The attacker used these three data sources to build a convincing pretext.
  followup_weak: |-
    Three-layer defense: dual authorization (prevents single-point compromise), out-of-band verification (breaks the pretext), and cooling period (time to catch fraud).

    The AP clerk's LinkedIn profile exposed their role and employer. Apex's data breach exposed vendor billing details. Your company website lists the AP department phone number publicly. The attacker used these three data sources to build a convincing pretext.
