phases:
- id: financial_recovery_phase_1
  phase_type: triage
  title: Financial Recovery — Phase 1
  situation: $187,000 was transferred to a fraudulent bank account on Thursday. The funds have been moved through a cryptocurrency exchange and are likely unrecoverable. The real Apex Cloud Services is awaiting payment. Multiple invoices need to be re-issued.
  prompt: What is your FIRST priority action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on $187,000 transferred, its severity, and the affected accounts.'
    action: What is your FIRST priority action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Financial Recovery — Phase 1. Asset in scope: $187,000 transferred.'
  hints:
  - Pay the real vendor, but first ensure you have proper verification to prevent this from happening again.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - contact bank
  - bank initiate
  - initiate fraud
  - fraud claim
  - claim wire
  - wire recall
  - recall notify
  - apex cloud
  reference_answer: |-
    Contact your bank to initiate a fraud claim and wire recall; notify Apex Cloud Services immediately; freeze the fraudulent account if possible; document everything for law enforcement

    Why: Bank fraud claims and wire recalls have time windows — every hour reduces recovery chances. Parallel notifications to vendor and bank.
  followup_good: 'Investigation reveals the attacker knew: Apex''s vendor account number, the AP clerk''s name, three recent invoice numbers, and the AP department''s direct phone number. LinkedIn shows the AP clerk''s profile lists ''Accounts Payable Specialist at [Company]'' and Apex Cloud Services'' employee David Liu is publicly listed. A data breach at Apex 6 months ago exposed vendor billing data.'
  followup_weak: |-
    Bank fraud claims and wire recalls have time windows — every hour reduces recovery chances.

    Investigation reveals the attacker knew: Apex's vendor account number, the AP clerk's name, three recent invoice numbers, and the AP department's direct phone number. LinkedIn shows the AP clerk's profile lists 'Accounts Payable Specialist at [Company]' and Apex Cloud Services' employee David Liu is publicly listed. A data breach at Apex 6 months ago exposed vendor billing data.
