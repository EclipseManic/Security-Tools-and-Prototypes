- id: pretext_analysis_phase_2
  phase_type: analysis
  title: Pretext Analysis — Phase 2
  situation: 'Investigation reveals the attacker knew: Apex''s vendor account number, the AP clerk''s name, three recent invoice numbers, and the AP department''s direct phone number. LinkedIn shows the AP clerk''s profile lists ''Accounts Payable Specialist at [Company]'' and Apex Cloud Services'' employee David Liu is publicly listed. A data breach at Apex 6 months ago exposed vendor billing data.'
  prompt: How did the attacker gather the intelligence used in the pretext?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on $187,000 transferred.
    action: How did the attacker gather the intelligence used in the pretext?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Pretext Analysis — Phase 2. Asset in scope: $187,000 transferred.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - linkedin osint
  - osint clerk
  - clerk apex
  - apex employees
  - employees apex
  - apex data
  - data breach
  - breach public
  reference_answer: |-
    1) LinkedIn OSINT on the AP clerk and Apex employees. 2) Apex data breach (public records). 3) Possibly the company website for AP contact info. 4) Social engineering Apex employees for internal details.

    Why: Mapping the full OSINT chain explains how the attacker had specific details and prevents future exposure.
  followup_good: 'The root cause is clear: the AP clerk changed bank details based solely on a phone call with no verification. There was no out-of-band confirmation process for payment detail changes. The company has 200+ vendors and processes 1,500 invoices per month.'
  followup_weak: |-
