  mitre_tactic: Credential Access
  mitre_technique: T1556 Modify Authentication Process
- id: campaign_analysis_phase_2
  phase_type: analysis
  title: Campaign Analysis — Phase 2
  situation: 'Analysis of the email campaign shows: 12 employees received the email, 8 scanned the QR code (detected via proxy logs showing requests to benefits-enrollment[.]acme-benefits.com from 8 unique IPs), and 5 entered credentials (the phishing site only returned credential capture confirmation for 5 sessions). The email bypassed the secure email gateway because it contained an image (QR code) instead of a text-based URL. The sender address was hr-benefits@acme-benefits.com — a look-alike domain.'
  prompt: How do you investigate the full scope of the campaign?
  guidance:
    what: Test the initial theory against telemetry from 5 employees' domain credentials before committing to a response.
    action: How do you investigate the full scope of the campaign?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Campaign Analysis — Phase 2. Asset in scope: 5 employees'' domain credentials.'
  hints:
  - Blocking prevents future visits but doesn't reveal the attacker's full infrastructure or other campaigns.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - analyze look-alike
  - look-alike domain
  - domain registration
  - registration whois
  - whois dns
  - dns history
  - history review
  - review cloudflare
  reference_answer: |-
    Analyze the look-alike domain registration (WHOIS, DNS history); review the Cloudflare Pages logs for the phishing site; check the Telegram bot endpoint for additional captured data; search for other QR code phishing emails in the mail queue; report the domain and Telegram bot for takedown

    Why: Full infrastructure analysis reveals the attacker's setup and helps identify other targets or campaigns.
  followup_good: The email bypassed the secure email gateway because it contained a QR code image instead of a text URL. The gateway's URL filtering couldn't analyze an embedded QR code. The look-alike domain (acme-benefits.com vs. acmebenefits.com) was registered with privacy protection.
  followup_weak: |-
    Full infrastructure analysis reveals the attacker's setup and helps identify other targets or campaigns.

    The email bypassed the secure email gateway because it contained a QR code image instead of a text URL. The gateway's URL filtering couldn't analyze an embedded QR code. The look-alike domain (acme-benefits.com vs. acmebenefits.com) was registered with privacy protection.
