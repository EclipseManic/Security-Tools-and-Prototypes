  mitre_tactic: Initial Access
  mitre_technique: T1566.002 Spearphishing Link
- id: email_security_hardening_phase_3
  phase_type: eradication
  title: Email Security Hardening — Phase 3
  situation: The email bypassed the secure email gateway because it contained a QR code image instead of a text URL. The gateway's URL filtering couldn't analyze an embedded QR code. The look-alike domain (acme-benefits.com vs. acmebenefits.com) was registered with privacy protection.
  prompt: How do you prevent QR code phishing from bypassing email security?
  guidance:
    what: Find every foothold the attacker left on 5 employees' domain credentials, including persistence and stolen credentials.
    action: How do you prevent QR code phishing from bypassing email security?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Email Security Hardening — Phase 3. Asset in scope: 5 employees'' domain credentials.'
  hints:
  - Education helps but technical controls (QR decoding in the gateway) provide systematic protection.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - deploy code
  - code analysis
  - analysis email
  - email gateway
  - gateway decode
  - decode codes
  - codes images
  - images check
  reference_answer: |-
    Deploy QR code analysis in the email gateway (decode QR codes in images and check URLs against threat intel); add look-alike domain monitoring; implement DMARC enforcement; add QR code awareness to phishing training

    Why: Technical control (QR decoding), brand protection (look-alike monitoring), email authentication (DMARC), and human factor (training).
  followup_good: The QR code was specifically designed to be scanned by personal mobile phones, which are outside the organization's MDM and security controls. The 8 employees who scanned the code used their personal devices, which may have cached the phishing site and could be at risk of drive-by attacks.
  followup_weak: |-
    Technical control (QR decoding), brand protection (look-alike monitoring), email authentication (DMARC), and human factor (training).

    The QR code was specifically designed to be scanned by personal mobile phones, which are outside the organization's MDM and security controls. The 8 employees who scanned the code used their personal devices, which may have cached the phishing site and could be at risk of drive-by attacks.
