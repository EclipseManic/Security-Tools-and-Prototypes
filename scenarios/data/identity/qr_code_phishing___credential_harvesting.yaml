  - code clear
  - clear browser
  - browser cache
  - cache cookies
  - cookies check
  reference_answer: |-
    Advise the 8 employees who scanned the QR code to clear browser cache/cookies; check personal devices for any suspicious apps installed after visiting the phishing site; consider implementing a mobile threat defense solution for BYOD devices that access company resources

    Why: Personal devices are a blind spot — guidance and mobile threat defense reduce the risk.
