id: qr_code_phishing___credential_harvesting
name: QR Code Phishing — Credential Harvesting
category: Identity & Access
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Quishing Campaign — HR Portal Credential Harvest via QR Codes. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Quishing Campaign — HR Portal Credential Harvest via QR Codes. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Quishing Campaign — HR Portal Credential Harvest via QR Codes. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Quishing Campaign — HR Portal Credential Harvest via QR Codes incident. At 08:30 on Wednesday, the SOC received 12 reports from employees who received an email appearing to be from HR: ''Annual Benefits Enrollment Required — Scan QR Code to Access Portal''. The email contained a QR code instead of a hyperlink, directing users to scan with their personal mobile phones. The QR code pointed to benefits-enrollment[.]acme-benefits.com — a phishing site mimicking the company''s benefits portal. The site was hosted on legitimate cloud infrastructure (Cloudflare Pages) to bypass email security URL filtering. 8 employees scanned the QR code; 5 entered their domain credentials on the fake portal. The phishing site captured credentials in real-time and forwarded them to an attacker-controlled Telegram bot. The SOC detected the campaign when employee Rachel Torres reported the email as suspicious after noticing the URL was slightly wrong. The phishing domain
  was registered 2 days ago and the site was taken down 30 minutes after the SOC reported it to Cloudflare. Business impact: account takeover could enable lateral movement and privilege abuse across the directory, so identity trust must be rebuilt. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess notification duties for any account or directory data accessed.'
incident:
  title: Quishing Campaign — HR Portal Credential Harvest via QR Codes
  opening: 'At 08:30 on Wednesday, the SOC received 12 reports from employees who received an email appearing to be from HR: ''Annual Benefits Enrollment Required — Scan QR Code to Access Portal''. The email contained a QR code instead of a hyperlink, directing users to scan with their personal mobile phones.'
  summary: 'At 08:30 on Wednesday, the SOC received 12 reports from employees who received an email appearing to be from HR: ''Annual Benefits Enrollment Required — Scan QR Code to Access Portal''. The email contained a QR code instead of a hyperlink, directing users to scan with their personal mobile phones. The QR code pointed to benefits-enrollment[.]acme-benefits.com — a phishing site mimicking the company''s benefits portal. The site was hosted on legitimate cloud infrastructure (Cloudflare Pages) to bypass email security URL filtering. 8 employees scanned the QR code; 5 entered their domain credentials on the fake portal. The phishing site captured credentials in real-time and forwarded them to an attacker-controlled Telegram bot. The SOC detected the campaign when employee Rachel Torres reported the email as suspicious after noticing the URL was slightly wrong. The phishing domain was registered 2 days ago and the site was taken down 30 minutes after the SOC reported it to Cloudflare.'
  compromised_assets:
  - 5 employees' domain credentials (captured via Telegram bot)
  - HR benefits portal trust relationship
  detected_via: Employee report (Rachel Torres) of suspicious QR code URL
  kill_chain:
  - Recon
  - Resource Development
  - Delivery
  - Credential Harvest
  mitre_tactics:
  - Initial Access
  - Credential Access
phases:
- id: credential_revocation_phase_1
  phase_type: triage
  title: Credential Revocation — Phase 1
  situation: 5 employees entered their domain credentials on the phishing site. The credentials were forwarded to a Telegram bot in real-time. The attacker may have already used them. The phishing site is now offline but the credentials are in attacker hands.
  prompt: What is your FIRST priority action?
  guidance:
    what: Establish what fired on 5 employees' domain credentials, which accounts are involved, and how urgent the signal is.
    action: What is your FIRST priority action?
    why: Every later decision depends on an accurate picture of 5 employees' domain credentials and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Credential Revocation — Phase 1. Asset in scope: 5 employees'' domain credentials.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - password reset
  - affected employees
  - employees immediately
  - immediately check
  - logins credentials
  - credentials suspicious
  - suspicious since
  - since time
  reference_answer: |-
    Force password reset for all 5 affected employees immediately; check for any logins using their credentials from suspicious IPs since the time they entered credentials; enable enhanced monitoring on their accounts

    Why: Credential reset stops immediate use. Timeline analysis determines if the attacker already gained access.
  followup_good: 'Analysis of the email campaign shows: 12 employees received the email, 8 scanned the QR code (detected via proxy logs showing requests to benefits-enrollment[.]acme-benefits.com from 8 unique IPs), and 5 entered credentials (the phishing site only returned credential capture confirmation for 5 sessions). The email bypassed the secure email gateway because it contained an image (QR code) instead of a text-based URL. The sender address was hr-benefits@acme-benefits.com — a look-alike domain.'
  followup_weak: |-
    Credential reset stops immediate use.

    Analysis of the email campaign shows: 12 employees received the email, 8 scanned the QR code (detected via proxy logs showing requests to benefits-enrollment[.]acme-benefits.com from 8 unique IPs), and 5 entered credentials (the phishing site only returned credential capture confirmation for 5 sessions). The email bypassed the secure email gateway because it contained an image (QR code) instead of a text-based URL. The sender address was hr-benefits@acme-benefits.com — a look-alike domain.
