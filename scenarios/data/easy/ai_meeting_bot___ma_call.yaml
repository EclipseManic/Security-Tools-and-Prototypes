id: ai_meeting_bot___ma_call
name: AI Meeting Bot — M&A Call
category: AI & ML
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Participant report after the meeting. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond M&A meeting.
  incident_manager: You are the Incident Manager coordinating the response to Unapproved AI Meeting Bot Records Confidential M&A Call. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Unapproved AI Meeting Bot Records Confidential M&A Call. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Unapproved AI Meeting Bot Records Confidential M&A Call. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Unapproved AI Meeting Bot Records Confidential M&A Call incident. The bot is a free consumer service that stores transcripts indefinitely. The call included deal valuation and legal strategy. Business impact: Deal secrets are stored by a third party and could be exposed or used for training. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Unapproved AI Meeting Bot Records Confidential M&A Call
  opening: An unapproved AI meeting assistant joined a confidential M&A call and recorded the transcript. The bot was invited by a participant who thought it was an approved note-taker.
  summary: The bot is a free consumer service that stores transcripts indefinitely. The call included deal valuation and legal strategy.
  compromised_assets:
  - M&A meeting
  - AI meeting assistant
  - Confidential transcript
  detected_via: Participant report after the meeting.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: ai_meeting_bot___ma_call_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: An unapproved AI meeting assistant joined a confidential M&A call and recorded the transcript. The bot was invited by a participant who thought it was an approved note-taker. Participant report after the meeting.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for M&A meeting.
  - Record what you find before you change anything.
  ideal_concepts:
  - bot vendor
  - participants
  - data shared
  - retention policy
  - meeting invite
  - vendor terms
  reference_answer: Identify the bot vendor, meeting participants, data shared, and retention policy; preserve the invite and vendor terms.
  followup_good: Triage confirms the activity is real. The meeting invite included an external bot. The vendor's privacy policy allows retention for model improvement. The transcript has not been shared internally.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The meeting invite included an external bot. The vendor's privacy policy allows retention for model improvement. The transcript has not been shared internally.
  next: ai_meeting_bot___ma_call_phase_2
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: ai_meeting_bot___ma_call_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The meeting invite included an external bot. The vendor's privacy policy allows retention for model improvement. The transcript has not been shared internally.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - remove bot
  - request deletion
  - notify legal
  - m&a
  - future meetings
  reference_answer: Remove the bot from future meetings, request deletion from the vendor, and notify legal and M&A.
  followup_good: Containment is in place. A free AI meeting bot was invited without security review and retained confidential audio.
  followup_weak: The activity continues while the team debates. Deal secrets are stored by a third party and could be exposed or used for training.
  next: ai_meeting_bot___ma_call_phase_3
  mitre_tactic: Data Manipulation
  mitre_technique: T1565.001 Stored Data Manipulation
- id: ai_meeting_bot___ma_call_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A free AI meeting bot was invited without security review and retained confidential audio.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - vendor data handling
  - confirm deletion
  - unapproved ai tools
  - review
  - transcript
  reference_answer: Review the vendor's data handling, confirm deletion, and check for other unapproved AI tools.
  followup_good: Adopt an approved meeting assistant with retention controls and train staff.
  followup_weak: The visible symptom is gone, but the root cause remains. Deal secrets are stored by a third party and could be exposed or used for training.
  next: ai_meeting_bot___ma_call_phase_4
  mitre_tactic: Persistence
  mitre_technique: T1556 Modify Authentication Process
- id: ai_meeting_bot___ma_call_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Adopt an approved meeting assistant with retention controls and train staff.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - approved assistant
  - retention controls
  - train staff
  - confirm deletion
  - validate
  reference_answer: Adopt an approved meeting assistant with retention controls, confirm the vendor deleted the transcript, and train staff before resuming AI note-taking.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: ai_meeting_bot___ma_call_phase_5
  mitre_tactic: Defense Evasion
  mitre_technique: T1070.004 File Deletion
- id: ai_meeting_bot___ma_call_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for AI Meeting Bot — M&A Call.
  prompt: What must change so AI Meeting Bot — M&A Call is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - block meeting bots
  - ai tool approval
  - meeting data classification
  - vendor review
  - user training
  reference_answer: Block unapproved meeting bots, require approval for AI tools, and classify meeting data.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
