id: vpn_password_spray___one_success
name: VPN Password Spray — One Success
category: Identity & Access
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. SIEM: distributed password spray with one successful VPN login. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond VPN concentrator.'
  incident_manager: You are the Incident Manager coordinating the response to Distributed VPN Password Spray Against Finance Account. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Distributed VPN Password Spray Against Finance Account. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Distributed VPN Password Spray Against Finance Account. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Distributed VPN Password Spray Against Finance Account incident. The successful session lasted 14 minutes and accessed the finance intranet but not the ERP. The account did not have MFA because it was excluded from the policy during a legacy migration. Business impact: The attacker has valid VPN access and could return unless the session and password are revoked. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Distributed VPN Password Spray Against Finance Account
  opening: At 02:10, the VPN concentrator logged 900 failed logins across 300 accounts from three cloud IPs. One account, a finance analyst, authenticated successfully.
  summary: The successful session lasted 14 minutes and accessed the finance intranet but not the ERP. The account did not have MFA because it was excluded from the policy during a legacy migration.
  compromised_assets:
  - VPN concentrator
  - Finance analyst account
  - Finance intranet
  detected_via: 'SIEM: distributed password spray with one successful VPN login.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: vpn_password_spray___one_success_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'At 02:10, the VPN concentrator logged 900 failed logins across 300 accounts from three cloud IPs. One account, a finance analyst, authenticated successfully. SIEM: distributed password spray with one successful VPN login.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for VPN concentrator.
  - Record what you find before you change anything.
  ideal_concepts:
  - targeted accounts
  - source ip
  - successful account
  - session duration
  - resources accessed
  - vpn logs
  reference_answer: Identify the targeted accounts, source IPs, successful account, session duration, and resources accessed; preserve VPN and SharePoint logs, and confirm the user was not traveling.
  followup_good: Triage confirms the activity is real. The successful login came from 91.219.xx.xx, a hosting provider. The session accessed the finance intranet and one SharePoint folder. The account is still in the legacy MFA exclusion group.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The successful login came from 91.219.xx.xx, a hosting provider. The session accessed the finance intranet and one SharePoint folder. The account is still in the legacy MFA exclusion group.
  next: vpn_password_spray___one_success_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1110.004 Credential Stuffing
- id: vpn_password_spray___one_success_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The successful login came from 91.219.xx.xx, a hosting provider. The session accessed the finance intranet and one SharePoint folder. The account is still in the legacy MFA exclusion group.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - terminate session
  - reset password
  - remove mfa exclusion
  - block ips
  - edge
  reference_answer: Terminate the VPN session, reset the account password, remove it from the MFA exclusion group, and block the source IPs at the edge.
  followup_good: Containment is in place. A legacy MFA exclusion left one account password-only, and the password matched a known breach corpus.
  followup_weak: The activity continues while the team debates. The attacker has valid VPN access and could return unless the session and password are revoked.
  next: vpn_password_spray___one_success_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1078 Valid Accounts
- id: vpn_password_spray___one_success_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A legacy MFA exclusion left one account password-only, and the password matched a known breach corpus.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - mailbox rules
  - oauth grants
  - new devices
  - downloaded files
  - rotate credentials
  reference_answer: Check for mailbox rules, OAuth grants, new devices, and downloaded files; rotate any other credentials stored in the account profile.
  followup_good: Re-enable the account with MFA enforced, verify the user's device is trusted, and monitor sign-ins for 48 hours.
  followup_weak: The visible symptom is gone, but the root cause remains. The attacker has valid VPN access and could return unless the session and password are revoked.
  next: vpn_password_spray___one_success_phase_4
  mitre_tactic: Initial Access
  mitre_technique: T1133 External Remote Services
- id: vpn_password_spray___one_success_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Re-enable the account with MFA enforced, verify the user's device is trusted, and monitor sign-ins for 48 hours.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - mfa enforced
  - trusted device
  - monitor sign-ins
  - conditional access
  - validate access
  reference_answer: Re-enable the account with MFA enforced, verify the user's device is trusted and compliant, and monitor sign-ins for 48 hours before closing the incident.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: vpn_password_spray___one_success_phase_5
  mitre_tactic: Credential Access
  mitre_technique: T1110.002 Password Cracking
- id: vpn_password_spray___one_success_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for VPN Password Spray — One Success.
  prompt: What must change so VPN Password Spray — One Success is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - remove mfa exclusions
  - number matching
  - spray alert
  - breach password
  - mfa coverage
  reference_answer: Remove all MFA exclusions, enforce number matching, alert on distributed sprays, and check passwords against breach data.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1539 Steal Web Session Cookie
