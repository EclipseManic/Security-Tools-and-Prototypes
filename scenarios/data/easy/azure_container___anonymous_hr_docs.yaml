id: azure_container___anonymous_hr_docs
name: Anonymous Azure Container — HR Documents
category: Cloud
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Cloud security scan plus search-engine exposure. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Azure Storage container hr-docs.
  incident_manager: You are the Incident Manager coordinating the response to Public Azure Storage Container Exposes HR Documents. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Public Azure Storage Container Exposes HR Documents. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Public Azure Storage Container Exposes HR Documents. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Public Azure Storage Container Exposes HR Documents incident. The container stores onboarding documents, offer letters, and payroll spreadsheets. Anonymous access has been enabled for three weeks. Business impact: Employee personal data is exposed, creating privacy and notification obligations. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Public Azure Storage Container Exposes HR Documents
  opening: An Azure Storage container holding HR documents allows anonymous read access. A security scan found the container URL indexed by a search engine.
  summary: The container stores onboarding documents, offer letters, and payroll spreadsheets. Anonymous access has been enabled for three weeks.
  compromised_assets:
  - Azure Storage container hr-docs
  - HR documents
  - Azure subscription
  detected_via: Cloud security scan plus search-engine exposure.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: azure_container___anonymous_hr_docs_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: An Azure Storage container holding HR documents allows anonymous read access. A security scan found the container URL indexed by a search engine. Cloud security scan plus search-engine exposure.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Azure Storage container hr-docs.
  - Record what you find before you change anything.
  ideal_concepts:
  - container contents
  - public access level
  - anonymous gets
  - exposure window
  - storage logs
  - hr data
  reference_answer: Confirm container contents, access level, anonymous access logs, and exposure window; preserve evidence.
  followup_good: Triage confirms the activity is real. The container's public access level is 'Container'. Access logs show 22 anonymous GETs from unknown IPs. Files include offer letters with salary data.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The container's public access level is 'Container'. Access logs show 22 anonymous GETs from unknown IPs. Files include offer letters with salary data.
  next: azure_container___anonymous_hr_docs_phase_2
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: azure_container___anonymous_hr_docs_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The container's public access level is 'Container'. Access logs show 22 anonymous GETs from unknown IPs. Files include offer letters with salary data.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - set private
  - rotate storage keys
  - block anonymous
  - account level
  - azure storage
  reference_answer: Set public access to private, rotate storage keys, and block anonymous access at the account level.
  followup_good: Containment is in place. The storage account was configured for public access during a migration and never restricted.
  followup_weak: The activity continues while the team debates. Employee personal data is exposed, creating privacy and notification obligations.
  next: azure_container___anonymous_hr_docs_phase_3
  mitre_tactic: Deployment
  mitre_technique: T1087 Account Discovery
- id: azure_container___anonymous_hr_docs_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The storage account was configured for public access during a migration and never restricted.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - review containers
  - enable logging
  - data classification
  - storage accounts
  - public access
  reference_answer: Review all containers and storage accounts, enable logging, and classify the data.
  followup_good: Notify privacy and legal, validate access controls, and monitor for further anonymous access.
  followup_weak: The visible symptom is gone, but the root cause remains. Employee personal data is exposed, creating privacy and notification obligations.
  next: azure_container___anonymous_hr_docs_phase_4
  mitre_tactic: Valid Accounts
  mitre_technique: T1078.004 Cloud Accounts
- id: azure_container___anonymous_hr_docs_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Notify privacy and legal, validate access controls, and monitor for further anonymous access.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - notify privacy
  - validate controls
  - monitor access
  - legal
  - validate
  reference_answer: Notify privacy and legal, validate that anonymous access is blocked at the account level, and monitor storage logs for further attempts.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: azure_container___anonymous_hr_docs_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: azure_container___anonymous_hr_docs_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Anonymous Azure Container — HR Documents.
  prompt: What must change so Anonymous Azure Container — HR Documents is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - disable anonymous access
  - public container scan
  - data classification
  - storage policy
  - azure config
  reference_answer: Disable anonymous storage access by policy, scan for public containers, and require data classification.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
