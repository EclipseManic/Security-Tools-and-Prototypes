id: dll_sideload___vendor_tool
name: DLL Sideload — Vendor Tool
category: Advanced Threats
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. EDR alert: signed binary loads unsigned DLL and beacons outbound. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Vendor support tool.'
  incident_manager: You are the Incident Manager coordinating the response to Malicious DLL Sideloaded by Signed Vendor Support Tool. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Malicious DLL Sideloaded by Signed Vendor Support Tool. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Malicious DLL Sideloaded by Signed Vendor Support Tool. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Malicious DLL Sideloaded by Signed Vendor Support Tool incident. The tool is legitimately signed but loads a DLL from its working directory. An attacker placed a malicious DLL next to a copy of the tool and convinced a user to run it. Business impact: The loader has code execution and persistence on a finance workstation. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Malicious DLL Sideloaded by Signed Vendor Support Tool
  opening: A vendor support tool started loading an unsigned DLL from the user's Downloads folder. EDR flagged the DLL as a loader that beacons to a remote host.
  summary: The tool is legitimately signed but loads a DLL from its working directory. An attacker placed a malicious DLL next to a copy of the tool and convinced a user to run it.
  compromised_assets:
  - Vendor support tool
  - WS-FIN-008
  - Sideloaded DLL
  detected_via: 'EDR alert: signed binary loads unsigned DLL and beacons outbound.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: dll_sideload___vendor_tool_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'A vendor support tool started loading an unsigned DLL from the user''s Downloads folder. EDR flagged the DLL as a loader that beacons to a remote host. EDR alert: signed binary loads unsigned DLL and beacons outbound.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Vendor support tool.
  - Record what you find before you change anything.
  ideal_concepts:
  - dll hash
  - signed binary
  - parent email
  - network destination
  - edr telemetry
  - downloads
  reference_answer: Identify the DLL hash, signed binary, parent email, and network destination; preserve the files and EDR telemetry.
  followup_good: Triage confirms the activity is real. The DLL is in Downloads and has the same name as a legitimate dependency. EDR shows the loader injecting into explorer.exe. The user received the tool from a 'vendor support' email.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The DLL is in Downloads and has the same name as a legitimate dependency. EDR shows the loader injecting into explorer.exe. The user received the tool from a 'vendor support' email.
  next: dll_sideload___vendor_tool_phase_2
  mitre_tactic: Defense Evasion
  mitre_technique: T1554 Compromise Host Software Binary
- id: dll_sideload___vendor_tool_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The DLL is in Downloads and has the same name as a legitimate dependency. EDR shows the loader injecting into explorer.exe. The user received the tool from a 'vendor support' email.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - isolate workstation
  - block dll
  - block destination
  - quarantine email
  - finance
  reference_answer: Isolate the workstation, block the DLL hash and destination, and quarantine the email.
  followup_good: 'Containment is in place. DLL search-order hijacking: the application loads a DLL from the current directory, and the user ran it from Downloads.'
  followup_weak: The activity continues while the team debates. The loader has code execution and persistence on a finance workstation.
  next: dll_sideload___vendor_tool_phase_3
  mitre_tactic: Defense Evasion
  mitre_technique: T1027.002 Software Packing
- id: dll_sideload___vendor_tool_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: 'Containment is holding. DLL search-order hijacking: the application loads a DLL from the current directory, and the user ran it from Downloads.'
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove dll
  - remove tool
  - injected processes
  - rotate credentials
  - scan
  reference_answer: Remove the DLL and tool copy, scan for injected processes, and rotate credentials used on the host.
  followup_good: Rebuild the host, install the vendor tool from the approved package, and monitor for beaconing.
  followup_weak: The visible symptom is gone, but the root cause remains. The loader has code execution and persistence on a finance workstation.
  next: dll_sideload___vendor_tool_phase_4
  mitre_tactic: Initial Access
  mitre_technique: T1195.002 Compromise Software Supply Chain
- id: dll_sideload___vendor_tool_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Rebuild the host, install the vendor tool from the approved package, and monitor for beaconing.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - rebuild host
  - approved package
  - monitor beaconing
  - vendor tool
  - validate
  reference_answer: Rebuild the host, install the vendor tool from the approved package, verify no beaconing, and monitor for 48 hours.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: dll_sideload___vendor_tool_phase_5
  mitre_tactic: Execution
  mitre_technique: T1204.002 Malicious File
- id: dll_sideload___vendor_tool_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for DLL Sideload — Vendor Tool.
  prompt: What must change so DLL Sideload — Vendor Tool is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - application control
  - block downloads
  - vendor software channel
  - dll sideloading
  - user awareness
  reference_answer: Use application control, block execution from Downloads, and verify vendor software through approved channels.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Defense Evasion
  mitre_technique: T1554 Compromise Host Software Binary
