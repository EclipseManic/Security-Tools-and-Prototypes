id: github_secret___aws_access_key
name: Leaked AWS Key — Public GitHub Repository
category: Identity & Access
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Secret-scanning alert plus GitHub notification. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond AWS IAM user ci-deploy.
  incident_manager: You are the Incident Manager coordinating the response to AWS Access Key Committed to a Public Repository. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for AWS Access Key Committed to a Public Repository. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for AWS Access Key Committed to a Public Repository. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the AWS Access Key Committed to a Public Repository incident. The key belongs to a CI deployment user with S3 and Lambda permissions. CloudTrail shows no API calls from outside the expected CI IP range yet, but the key is still active. Business impact: Anyone who cloned the repository can use the key until it is rotated. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: AWS Access Key Committed to a Public Repository
  opening: A developer accidentally pushed a .env file containing an AWS access key to a public GitHub repository. A scanning service alerted the security team 40 minutes later.
  summary: The key belongs to a CI deployment user with S3 and Lambda permissions. CloudTrail shows no API calls from outside the expected CI IP range yet, but the key is still active.
  compromised_assets:
  - AWS IAM user ci-deploy
  - Public GitHub repository
  - S3 deployment bucket
  detected_via: Secret-scanning alert plus GitHub notification.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: github_secret___aws_access_key_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A developer accidentally pushed a .env file containing an AWS access key to a public GitHub repository. A scanning service alerted the security team 40 minutes later. Secret-scanning alert plus GitHub notification.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for AWS IAM user ci-deploy.
  - Record what you find before you change anything.
  ideal_concepts:
  - access key
  - iam user
  - permissions
  - commit visibility
  - clone count
  - cloudtrail
  reference_answer: Confirm the key, IAM user, permissions, commit visibility, clone count, and CloudTrail activity; preserve the commit and alert details before rewriting history.
  followup_good: Triage confirms the activity is real. The commit is public and the key is active. CloudTrail shows only the CI runner's usual IPs, and the repository has been cloned 14 times since the push. The key has no MFA and broad S3 permissions.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The commit is public and the key is active. CloudTrail shows only the CI runner's usual IPs, and the repository has been cloned 14 times since the push. The key has no MFA and broad S3 permissions.
  next: github_secret___aws_access_key_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
- id: github_secret___aws_access_key_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The commit is public and the key is active. CloudTrail shows only the CI runner's usual IPs, and the repository has been cloned 14 times since the push. The key has no MFA and broad S3 permissions.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - disable access key
  - revoke sessions
  - remove secret
  - rewrite history
  - github
  reference_answer: Disable the access key, revoke its sessions, and remove the secret from the repository history.
  followup_good: Containment is in place. A .env file was committed because the repository lacked a pre-commit secret scan and the key was long-lived.
  followup_weak: The activity continues while the team debates. Anyone who cloned the repository can use the key until it is rotated.
  next: github_secret___aws_access_key_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1078 Valid Accounts
- id: github_secret___aws_access_key_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A .env file was committed because the repository lacked a pre-commit secret scan and the key was long-lived.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - oidc role
  - cloudtrail review
  - s3 changes
  - lambda changes
  - rotate key
  reference_answer: Replace the long-lived key with a short-lived OIDC role for CI, review CloudTrail for unauthorized calls, and check S3 and Lambda for changes.
  followup_good: Restore CI with the new role, verify deployments, and monitor for failed attempts using the old key.
  followup_weak: The visible symptom is gone, but the root cause remains. Anyone who cloned the repository can use the key until it is rotated.
  next: github_secret___aws_access_key_phase_4
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: github_secret___aws_access_key_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Restore CI with the new role, verify deployments, and monitor for failed attempts using the old key.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - restore ci
  - verify deployment
  - monitor cloudtrail
  - old key attempts
  - validate access
  reference_answer: Restore CI with the short-lived OIDC role, verify a deployment succeeds, and monitor CloudTrail for failed attempts with the old key before closing the incident.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: github_secret___aws_access_key_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: github_secret___aws_access_key_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Leaked AWS Key — Public GitHub Repository.
  prompt: What must change so Leaked AWS Key — Public GitHub Repository is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - pre-commit scan
  - block env files
  - oidc
  - public repo alert
  - least privilege
  reference_answer: Add pre-commit secret scanning, block .env files, use OIDC instead of long-lived keys, and alert on public repository changes.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
