id: cors_misconfiguration___customer_api
name: CORS Misconfiguration — Customer API
category: Web App
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Internal code review finding. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Customer API.
  incident_manager: You are the Incident Manager coordinating the response to Permissive CORS Policy Exposes Customer API Data. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Permissive CORS Policy Exposes Customer API Data. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Permissive CORS Policy Exposes Customer API Data. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Permissive CORS Policy Exposes Customer API Data incident. The API reflects the Origin header and sets Allow-Credentials true. It serves customer name, email, and order history. No malicious use is known. Business impact: Any website a logged-in customer visits could read their profile and order data. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Permissive CORS Policy Exposes Customer API Data
  opening: A frontend developer reported that the customer API returns Access-Control-Allow-Origin for any origin and allows credentials. A test page on another domain could read the user's profile.
  summary: The API reflects the Origin header and sets Allow-Credentials true. It serves customer name, email, and order history. No malicious use is known.
  compromised_assets:
  - Customer API
  - Browser sessions
  - Customer profile data
  detected_via: Internal code review finding.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: cors_misconfiguration___customer_api_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A frontend developer reported that the customer API returns Access-Control-Allow-Origin for any origin and allows credentials. A test page on another domain could read the user's profile. Internal code review finding.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Customer API.
  - Record what you find before you change anything.
  ideal_concepts:
  - cors behavior
  - affected endpoints
  - customer data
  - origin headers
  - access logs
  - staging
  reference_answer: Confirm the behavior in staging, identify affected endpoints and data, and check access logs for foreign Origin headers.
  followup_good: 'Triage confirms the activity is real. A curl request with Origin: https://evil.example returns the same origin in ACAO and Allow-Credentials: true. The API uses cookie-based auth and has no CSRF token for GET profile requests.'
  followup_weak: 'The alert is treated as noise and the team acts on assumptions. A curl request with Origin: https://evil.example returns the same origin in ACAO and Allow-Credentials: true. The API uses cookie-based auth and has no CSRF token for GET profile requests.'
  next: cors_misconfiguration___customer_api_phase_2
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: cors_misconfiguration___customer_api_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: 'Triage confirms the activity is real. A curl request with Origin: https://evil.example returns the same origin in ACAO and Allow-Credentials: true. The API uses cookie-based auth and has no CSRF token for GET profile requests.'
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - cors allowlist
  - remove credentials
  - approved origins
  - waf rule
  - middleware
  reference_answer: Restrict CORS to approved frontend origins, remove credential support where not needed, and add a WAF rule for unexpected origins.
  followup_good: Containment is in place. The CORS middleware reflects any origin instead of an allowlist and permits credentials.
  followup_weak: The activity continues while the team debates. Any website a logged-in customer visits could read their profile and order data.
  next: cors_misconfiguration___customer_api_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: cors_misconfiguration___customer_api_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The CORS middleware reflects any origin instead of an allowlist and permits credentials.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - update middleware
  - cors tests
  - review apis
  - allowlist
  - deploy
  reference_answer: Update the middleware allowlist, add tests for CORS behavior, and review other APIs for the same pattern.
  followup_good: Deploy the fix, verify legitimate frontend flows, and monitor for CORS errors or abuse.
  followup_weak: The visible symptom is gone, but the root cause remains. Any website a logged-in customer visits could read their profile and order data.
  next: cors_misconfiguration___customer_api_phase_4
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: cors_misconfiguration___customer_api_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Deploy the fix, verify legitimate frontend flows, and monitor for CORS errors or abuse.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - verify frontend
  - monitor cors
  - deploy fix
  - unexpected origins
  - validate
  reference_answer: Deploy the fix, verify all legitimate frontend flows, and monitor for CORS errors or attempts to use unexpected origins.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: cors_misconfiguration___customer_api_phase_5
  mitre_tactic: Initial Access
  mitre_technique: T1189 Drive-by Compromise
- id: cors_misconfiguration___customer_api_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for CORS Misconfiguration — Customer API.
  prompt: What must change so CORS Misconfiguration — Customer API is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - cors checklist
  - automated tests
  - api auth review
  - secure code
  - origin allowlist
  reference_answer: Add CORS configuration to the secure-code checklist and automated tests, and review API auth design.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
