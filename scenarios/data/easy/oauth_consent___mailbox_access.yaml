id: oauth_consent___mailbox_access
name: OAuth Consent — Mailbox Access
category: Identity & Access
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Azure AD alert: new consent grant with Mail.Read permissions. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Finance user account.'
  incident_manager: You are the Incident Manager coordinating the response to Illicit OAuth Consent Grants Mailbox Access. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Illicit OAuth Consent Grants Mailbox Access. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Illicit OAuth Consent Grants Mailbox Access. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Illicit OAuth Consent Grants Mailbox Access incident. The app registered in Azure AD and created a service principal with delegated mail access. It has been reading invoices and forwarding selected messages to an external address. Business impact: Invoice messages and attachments are being exfiltrated, and 14 users may be affected. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Illicit OAuth Consent Grants Mailbox Access
  opening: A finance user clicked 'Accept' on a permissions screen for an app called 'InvoiceCloud Sync'. The app requested read access to mail, contacts, and files. IT was never involved.
  summary: The app registered in Azure AD and created a service principal with delegated mail access. It has been reading invoices and forwarding selected messages to an external address.
  compromised_assets:
  - Finance user account
  - Azure AD enterprise app
  - Exchange Online mailbox
  detected_via: 'Azure AD alert: new consent grant with Mail.Read permissions.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: oauth_consent___mailbox_access_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'A finance user clicked ''Accept'' on a permissions screen for an app called ''InvoiceCloud Sync''. The app requested read access to mail, contacts, and files. IT was never involved. Azure AD alert: new consent grant with Mail.Read permissions.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Finance user account.
  - Record what you find before you change anything.
  ideal_concepts:
  - app publisher
  - permissions
  - consenting users
  - mailbox changes
  - audit logs
  - consent url
  reference_answer: Identify the app, publisher, permissions, consenting users, and mailbox changes; preserve Azure AD audit logs and the consent URL.
  followup_good: Triage confirms the activity is real. The enterprise app was created two days ago and has 14 users. Audit logs show mailbox reads and an inbox rule forwarding messages with 'invoice' in the subject to billing@invoicecloud-sync[.]com.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The enterprise app was created two days ago and has 14 users. Audit logs show mailbox reads and an inbox rule forwarding messages with 'invoice' in the subject to billing@invoicecloud-sync[.]com.
  next: oauth_consent___mailbox_access_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1566.002 Spearphishing Link
- id: oauth_consent___mailbox_access_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The enterprise app was created two days ago and has 14 users. Audit logs show mailbox reads and an inbox rule forwarding messages with 'invoice' in the subject to billing@invoicecloud-sync[.]com.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - revoke consent
  - service principal
  - disable sign-in
  - remove forwarding
  - block domain
  reference_answer: Revoke the app's consent and service principal, disable its sign-in, remove forwarding rules, and block the publisher domain.
  followup_good: Containment is in place. A user granted broad OAuth permissions to an unverified third-party app, and tenant consent settings allow users to consent.
  followup_weak: The activity continues while the team debates. Invoice messages and attachments are being exfiltrated, and 14 users may be affected.
  next: oauth_consent___mailbox_access_phase_3
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: oauth_consent___mailbox_access_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A user granted broad OAuth permissions to an unverified third-party app, and tenant consent settings allow users to consent.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - review mailboxes
  - oauth grants
  - sent mail
  - inbox rules
  - 14 users
  reference_answer: Review all 14 mailboxes for forwarding, OAuth grants, and sent mail; remove any related inbox rules.
  followup_good: Re-enable affected users with a consent warning, and monitor for new app registrations.
  followup_weak: The visible symptom is gone, but the root cause remains. Invoice messages and attachments are being exfiltrated, and 14 users may be affected.
  next: oauth_consent___mailbox_access_phase_4
  mitre_tactic: Collection
  mitre_technique: T1114 Email Collection
- id: oauth_consent___mailbox_access_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Re-enable affected users with a consent warning, and monitor for new app registrations.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - consent warning
  - monitor app registrations
  - mail flow
  - user access
  - validate
  reference_answer: Re-enable the affected users with a consent warning, verify legitimate mail flow, and monitor for new app registrations or consent grants.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: oauth_consent___mailbox_access_phase_5
  mitre_tactic: Persistence
  mitre_technique: T1556 Modify Authentication Process
- id: oauth_consent___mailbox_access_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for OAuth Consent — Mailbox Access.
  prompt: What must change so OAuth Consent — Mailbox Access is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - restrict user consent
  - admin approval
  - verified publishers
  - consent alert
  - oauth inventory
  reference_answer: Restrict user consent to verified publishers, require admin approval for mail/file scopes, and alert on new consent grants.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1078 Valid Accounts
