id: mailbox_rule___bec_payment
name: Mailbox Rule — BEC Payment Fraud
category: Cloud
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Microsoft 365 alert: suspicious inbox rule. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Finance clerk mailbox.'
  incident_manager: You are the Incident Manager coordinating the response to Suspicious Inbox Rule Hides Payment Threads. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Suspicious Inbox Rule Hides Payment Threads. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Suspicious Inbox Rule Hides Payment Threads. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Suspicious Inbox Rule Hides Payment Threads incident. The mailbox was accessed from a new location after a successful password login without MFA. The attacker likely read payment threads and may attempt invoice fraud. Business impact: Vendor payment fraud is likely if the attacker replies to an active thread. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Suspicious Inbox Rule Hides Payment Threads
  opening: A finance clerk's mailbox created a rule moving messages containing 'wire' and 'payment' to RSS Feeds and marking them read. The user did not create the rule.
  summary: The mailbox was accessed from a new location after a successful password login without MFA. The attacker likely read payment threads and may attempt invoice fraud.
  compromised_assets:
  - Finance clerk mailbox
  - Exchange Online
  - Payment approval process
  detected_via: 'Microsoft 365 alert: suspicious inbox rule.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: mailbox_rule___bec_payment_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'A finance clerk''s mailbox created a rule moving messages containing ''wire'' and ''payment'' to RSS Feeds and marking them read. The user did not create the rule. Microsoft 365 alert: suspicious inbox rule.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Finance clerk mailbox.
  - Record what you find before you change anything.
  ideal_concepts:
  - sign-in
  - inbox rule
  - mailbox changes
  - messages read
  - audit logs
  - accounts payable
  reference_answer: Identify the sign-in, rule, mailbox changes, and messages read; preserve audit logs and notify accounts payable.
  followup_good: Triage confirms the activity is real. The rule was created from 185.199.xx.xx. Sign-in logs show a successful password login with no MFA. Sent Items contain no fraud yet, but the attacker read several payment threads.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The rule was created from 185.199.xx.xx. Sign-in logs show a successful password login with no MFA. Sent Items contain no fraud yet, but the attacker read several payment threads.
  next: mailbox_rule___bec_payment_phase_2
  mitre_tactic: Collection
  mitre_technique: T1114 Email Collection
- id: mailbox_rule___bec_payment_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The rule was created from 185.199.xx.xx. Sign-in logs show a successful password login with no MFA. Sent Items contain no fraud yet, but the attacker read several payment threads.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - disable rule
  - revoke sessions
  - reset password
  - mfa re-registration
  - mailbox
  reference_answer: Disable the rule, revoke sessions, reset the password, and require MFA re-registration.
  followup_good: Containment is in place. Password-only authentication and a successful credential phishing led to mailbox access and a concealment rule.
  followup_weak: The activity continues while the team debates. Vendor payment fraud is likely if the attacker replies to an active thread.
  next: mailbox_rule___bec_payment_phase_3
  mitre_tactic: Initial Access
  mitre_technique: T1566 Phishing
- id: mailbox_rule___bec_payment_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. Password-only authentication and a successful credential phishing led to mailbox access and a concealment rule.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - mailbox rules
  - forwarding
  - oauth grants
  - sent items
  - delegation
  reference_answer: Review mailbox rules, forwarding, OAuth grants, and sent items; check for mailbox delegation.
  followup_good: Restore normal mail flow, confirm MFA, and monitor sign-ins and payment changes.
  followup_weak: The visible symptom is gone, but the root cause remains. Vendor payment fraud is likely if the attacker replies to an active thread.
  next: mailbox_rule___bec_payment_phase_4
  mitre_tactic: Valid Accounts
  mitre_technique: T1078.004 Cloud Accounts
- id: mailbox_rule___bec_payment_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Restore normal mail flow, confirm MFA, and monitor sign-ins and payment changes.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - mail flow
  - mfa enforced
  - monitor sign-ins
  - payment changes
  - validate
  reference_answer: Restore normal mail flow, confirm MFA is enforced, and monitor sign-ins and payment changes for 72 hours before closing the incident.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: mailbox_rule___bec_payment_phase_5
  mitre_tactic: Collection
  mitre_technique: T1530 Data from Cloud Storage
- id: mailbox_rule___bec_payment_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Mailbox Rule — BEC Payment Fraud.
  prompt: What must change so Mailbox Rule — BEC Payment Fraud is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - mfa for mailboxes
  - inbox rule alert
  - callback verification
  - payment controls
  - phishing training
  reference_answer: Enforce MFA for all mailboxes, alert on inbox-rule creation, and add callback verification for payment changes.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Collection
  mitre_technique: T1114 Email Collection
