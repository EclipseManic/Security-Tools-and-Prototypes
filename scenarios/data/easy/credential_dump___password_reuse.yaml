id: credential_dump___password_reuse
name: Credential Dump — Password Reuse
category: Advanced Threats
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Threat-intel monitoring alert. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond 40 employee accounts.
  incident_manager: You are the Incident Manager coordinating the response to Credential Dump Contains Valid Company Passwords. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Credential Dump Contains Valid Company Passwords. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Credential Dump Contains Valid Company Passwords. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Credential Dump Contains Valid Company Passwords incident. The dump is being circulated and the company has no evidence of login attempts yet. The three accounts belong to finance and IT. Business impact: Credential stuffing could compromise finance or IT accounts. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Credential Dump Contains Valid Company Passwords
  opening: A credential dump posted on a cybercrime forum contains 40 company email addresses and passwords. The passwords are from an old breach, but three users still use them.
  summary: The dump is being circulated and the company has no evidence of login attempts yet. The three accounts belong to finance and IT.
  compromised_assets:
  - 40 employee accounts
  - Credential dump
  - Finance and IT users
  detected_via: Threat-intel monitoring alert.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: credential_dump___password_reuse_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A credential dump posted on a cybercrime forum contains 40 company email addresses and passwords. The passwords are from an old breach, but three users still use them. Threat-intel monitoring alert.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for 40 employee accounts.
  - Record what you find before you change anything.
  ideal_concepts:
  - valid accounts
  - mfa status
  - recent sign-ins
  - credential dump
  - affected users
  - threat intel
  reference_answer: Confirm which accounts are valid, their MFA status, and recent sign-ins; preserve the intelligence and notify affected users.
  followup_good: Triage confirms the activity is real. The dump includes valid current passwords for three users. Two have MFA; one does not. No sign-ins from unusual locations have been recorded.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The dump includes valid current passwords for three users. Two have MFA; one does not. No sign-ins from unusual locations have been recorded.
  next: credential_dump___password_reuse_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
- id: credential_dump___password_reuse_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The dump includes valid current passwords for three users. Two have MFA; one does not. No sign-ins from unusual locations have been recorded.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - force reset
  - enable mfa
  - finance
  - it users
  - password
  reference_answer: Force password resets for the three accounts and enable MFA on the account without it.
  followup_good: Containment is in place. Employees reused passwords from a third-party breach, and one account lacks MFA.
  followup_weak: The activity continues while the team debates. Credential stuffing could compromise finance or IT accounts.
  next: credential_dump___password_reuse_phase_3
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: credential_dump___password_reuse_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. Employees reused passwords from a third-party breach, and one account lacks MFA.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - reused passwords
  - sign-in logs
  - credential stuffing
  - monitor
  - other accounts
  reference_answer: Check for other reused passwords, review sign-in logs for the dumped accounts, and monitor for credential stuffing.
  followup_good: Confirm all accounts have MFA, validate access, and monitor authentication.
  followup_weak: The visible symptom is gone, but the root cause remains. Credential stuffing could compromise finance or IT accounts.
  next: credential_dump___password_reuse_phase_4
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: credential_dump___password_reuse_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Confirm all accounts have MFA, validate access, and monitor authentication.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - mfa coverage
  - validate access
  - monitor authentication
  - affected users
  - new passwords
  reference_answer: Confirm all affected accounts have MFA and new passwords, validate access, and monitor authentication for credential-stuffing attempts.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: credential_dump___password_reuse_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: credential_dump___password_reuse_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Credential Dump — Password Reuse.
  prompt: What must change so Credential Dump — Password Reuse is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - breach password screening
  - mfa
  - phishing-resistant auth
  - password reuse
  - credential monitoring
  reference_answer: Screen passwords against breach data, enforce MFA, and move toward phishing-resistant authentication.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
