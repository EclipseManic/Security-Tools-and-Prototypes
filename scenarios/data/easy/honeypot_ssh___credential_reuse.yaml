id: honeypot_ssh___credential_reuse
name: Honeypot SSH — Credential Reuse
category: Advanced Threats
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Honeypot alert: credential reuse. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond SSH honeypot.'
  incident_manager: You are the Incident Manager coordinating the response to Honeypot Credential Reuse Exposes Internal Wiki Risk. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Honeypot Credential Reuse Exposes Internal Wiki Risk. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Honeypot Credential Reuse Exposes Internal Wiki Risk. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Honeypot Credential Reuse Exposes Internal Wiki Risk incident. The attacker found the honeypot through internet scanning and reused credentials from a breach. The real account has no MFA on the internal wiki. Business impact: The attacker has valid credentials for an internal system and may try them elsewhere. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Honeypot Credential Reuse Exposes Internal Wiki Risk
  opening: A honeypot SSH server recorded a successful login using a username and password that match a real employee's corporate account. The honeypot is intentionally exposed and has no real data.
  summary: The attacker found the honeypot through internet scanning and reused credentials from a breach. The real account has no MFA on the internal wiki.
  compromised_assets:
  - SSH honeypot
  - Employee account
  - Internal wiki
  detected_via: 'Honeypot alert: credential reuse.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: honeypot_ssh___credential_reuse_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'A honeypot SSH server recorded a successful login using a username and password that match a real employee''s corporate account. The honeypot is intentionally exposed and has no real data. Honeypot alert: credential reuse.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for SSH honeypot.
  - Record what you find before you change anything.
  ideal_concepts:
  - account owner
  - password reuse
  - wiki access
  - honeypot logs
  - source ip
  - mfa status
  reference_answer: Confirm the account owner, where the password is reused, and whether the internal wiki was accessed; preserve honeypot logs.
  followup_good: Triage confirms the activity is real. The honeypot logged the username and password, source IP, and commands typed. The same credentials work on the internal wiki, which has no MFA and is reachable from the VPN.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The honeypot logged the username and password, source IP, and commands typed. The same credentials work on the internal wiki, which has no MFA and is reachable from the VPN.
  next: honeypot_ssh___credential_reuse_phase_2
  mitre_tactic: Discovery
  mitre_technique: T1046 Network Service Discovery
- id: honeypot_ssh___credential_reuse_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The honeypot logged the username and password, source IP, and commands typed. The same credentials work on the internal wiki, which has no MFA and is reachable from the VPN.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - reset password
  - revoke sessions
  - mfa wiki
  - source ip
  - internal wiki
  reference_answer: Reset the password, revoke sessions, and require MFA for the wiki.
  followup_good: Containment is in place. The employee reused a breached password, and the internal wiki does not require MFA.
  followup_weak: The activity continues while the team debates. The attacker has valid credentials for an internal system and may try them elsewhere.
  next: honeypot_ssh___credential_reuse_phase_3
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
- id: honeypot_ssh___credential_reuse_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The employee reused a breached password, and the internal wiki does not require MFA.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - authentication logs
  - source ip
  - reused credentials
  - other accounts
  - wiki
  reference_answer: Search authentication logs for the source IP and account, and check for other reused credentials.
  followup_good: Restore access with MFA, monitor the account, and validate the wiki.
  followup_weak: The visible symptom is gone, but the root cause remains. The attacker has valid credentials for an internal system and may try them elsewhere.
  next: honeypot_ssh___credential_reuse_phase_4
  mitre_tactic: Credential Access
  mitre_technique: T1552.001 Credentials In Files
- id: honeypot_ssh___credential_reuse_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Restore access with MFA, monitor the account, and validate the wiki.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - mfa access
  - monitor account
  - validate wiki
  - source ip
  - restore
  reference_answer: Restore access with MFA, confirm the internal wiki is protected, and monitor the account and source IP for 72 hours.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: honeypot_ssh___credential_reuse_phase_5
  mitre_tactic: Defense Evasion
  mitre_technique: T1027 Obfuscated Files or Information
- id: honeypot_ssh___credential_reuse_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Honeypot SSH — Credential Reuse.
  prompt: What must change so Honeypot SSH — Credential Reuse is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - breached password blocking
  - mfa internal apps
  - honeypots
  - password reuse
  - early warning
  reference_answer: Block breached passwords, enforce MFA on internal apps, and use honeypots for early warning.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Discovery
  mitre_technique: T1046 Network Service Discovery
