id: sqli_waf___customer_search
name: SQL Injection — WAF Blocked Probe
category: Web App
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. WAF alert: SQLi signature cluster against /api/search. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Customer search API.'
  incident_manager: You are the Incident Manager coordinating the response to SQL Injection Probe Against Customer Search API. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for SQL Injection Probe Against Customer Search API. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for SQL Injection Probe Against Customer Search API. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the SQL Injection Probe Against Customer Search API incident. The probes came from a single IP and attempted UNION-based extraction from the products table. The 500 error may have exposed a stack trace, but no data returned. Business impact: A determined attacker could extract product or customer data if the error path is exploitable. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: SQL Injection Probe Against Customer Search API
  opening: The WAF blocked a burst of SQL-injection probes against the customer search endpoint. One request returned a 500 error before the block rule engaged.
  summary: The probes came from a single IP and attempted UNION-based extraction from the products table. The 500 error may have exposed a stack trace, but no data returned.
  compromised_assets:
  - Customer search API
  - WAF
  - Products database
  detected_via: 'WAF alert: SQLi signature cluster against /api/search.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: sqli_waf___customer_search_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'The WAF blocked a burst of SQL-injection probes against the customer search endpoint. One request returned a 500 error before the block rule engaged. WAF alert: SQLi signature cluster against /api/search.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Customer search API.
  - Record what you find before you change anything.
  ideal_concepts:
  - waf requests
  - 500 response
  - application logs
  - search handler
  - query results
  - preserve evidence
  reference_answer: Review the WAF requests, the 500 response, application logs, and the search handler code; preserve evidence and determine whether any query returned data.
  followup_good: Triage confirms the activity is real. WAF logs show 37 blocked requests and one 500 response. The application log shows a database syntax error but no query results. The endpoint uses parameterized queries elsewhere, but this handler concatenates the sort parameter.
  followup_weak: The alert is treated as noise and the team acts on assumptions. WAF logs show 37 blocked requests and one 500 response. The application log shows a database syntax error but no query results. The endpoint uses parameterized queries elsewhere, but this handler concatenates the sort parameter.
  next: sqli_waf___customer_search_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: sqli_waf___customer_search_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. WAF logs show 37 blocked requests and one 500 response. The application log shows a database syntax error but no query results. The endpoint uses parameterized queries elsewhere, but this handler concatenates the sort parameter.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - block source ip
  - disable verbose errors
  - virtual patch
  - waf rule
  - sort parameter
  reference_answer: Block the source IP temporarily, disable verbose SQL errors, and add a virtual patch or WAF rule for the sort parameter.
  followup_good: Containment is in place. The sort parameter is concatenated into SQL instead of using an allowlist, and verbose errors are returned to users.
  followup_weak: The activity continues while the team debates. A determined attacker could extract product or customer data if the error path is exploitable.
  next: sqli_waf___customer_search_phase_3
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: sqli_waf___customer_search_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The sort parameter is concatenated into SQL instead of using an allowlist, and verbose errors are returned to users.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - parameterized queries
  - sort allowlist
  - input validation
  - deploy fix
  - code review
  reference_answer: Replace string concatenation with parameterized queries or a strict sort allowlist, add input validation, and deploy the fix.
  followup_good: Re-enable the endpoint after regression testing, monitor for new SQLi attempts, and confirm errors no longer leak details.
  followup_weak: The visible symptom is gone, but the root cause remains. A determined attacker could extract product or customer data if the error path is exploitable.
  next: sqli_waf___customer_search_phase_4
  mitre_tactic: Discovery
  mitre_technique: T1046 Network Service Discovery
- id: sqli_waf___customer_search_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Re-enable the endpoint after regression testing, monitor for new SQLi attempts, and confirm errors no longer leak details.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - regression testing
  - monitor sqli
  - endpoint enabled
  - error handling
  - validate
  reference_answer: Re-enable the endpoint after regression testing, confirm legitimate search and sort flows work, and monitor for new SQLi attempts with errors no longer leaking details.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: sqli_waf___customer_search_phase_5
  mitre_tactic: Execution
  mitre_technique: T1059 Command and Scripting Interpreter
- id: sqli_waf___customer_search_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for SQL Injection — WAF Blocked Probe.
  prompt: What must change so SQL Injection — WAF Blocked Probe is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - secure code review
  - sast
  - database error alert
  - query construction
  - developer training
  reference_answer: Add secure-code review for query construction, run SAST on the search service, and alert on database syntax errors.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
