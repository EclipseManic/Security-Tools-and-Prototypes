id: ssh_open_world___staging_ec2
name: SSH Open to the World — Staging EC2
category: Cloud
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. Cloud security posture alert: public SSH. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond EC2 staging API.'
  incident_manager: You are the Incident Manager coordinating the response to Staging EC2 Instance Exposes SSH to the Internet. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Staging EC2 Instance Exposes SSH to the Internet. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Staging EC2 Instance Exposes SSH to the Internet. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Staging EC2 Instance Exposes SSH to the Internet incident. The security group was changed during a debugging session and never reverted. No successful login is visible, but the instance has a default ''ubuntu'' user and password authentication is enabled. Business impact: The instance could be compromised by brute force or a known SSH vulnerability. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Staging EC2 Instance Exposes SSH to the Internet
  opening: An EC2 instance has SSH open to 0.0.0.0/0. The instance hosts a staging API and has a public IP. Logs show 2,000 failed SSH attempts from scanners.
  summary: The security group was changed during a debugging session and never reverted. No successful login is visible, but the instance has a default 'ubuntu' user and password authentication is enabled.
  compromised_assets:
  - EC2 staging API
  - Security group
  - SSH service
  detected_via: 'Cloud security posture alert: public SSH.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: ssh_open_world___staging_ec2_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'An EC2 instance has SSH open to 0.0.0.0/0. The instance hosts a staging API and has a public IP. Logs show 2,000 failed SSH attempts from scanners. Cloud security posture alert: public SSH.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for EC2 staging API.
  - Record what you find before you change anything.
  ideal_concepts:
  - security group
  - ssh config
  - failed logins
  - successful logins
  - password auth
  - logs
  reference_answer: Confirm the security-group change, SSH configuration, authentication attempts, and any successful logins; preserve logs.
  followup_good: Triage confirms the activity is real. The security group allows 22/tcp from anywhere. SSH logs show brute-force attempts; password authentication is enabled and the ubuntu user has a weak password. No success is recorded.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The security group allows 22/tcp from anywhere. SSH logs show brute-force attempts; password authentication is enabled and the ubuntu user has a weak password. No success is recorded.
  next: ssh_open_world___staging_ec2_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: ssh_open_world___staging_ec2_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The security group allows 22/tcp from anywhere. SSH logs show brute-force attempts; password authentication is enabled and the ubuntu user has a weak password. No success is recorded.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - restrict ssh
  - bastion
  - disable password auth
  - block scanner
  - security group
  reference_answer: Restrict SSH to the bastion or VPN, disable password authentication, and block scanner IPs.
  followup_good: Containment is in place. A temporary security-group change was left in place, and SSH password authentication was enabled.
  followup_weak: The activity continues while the team debates. The instance could be compromised by brute force or a known SSH vulnerability.
  next: ssh_open_world___staging_ec2_phase_3
  mitre_tactic: Valid Accounts
  mitre_technique: T1078.004 Cloud Accounts
- id: ssh_open_world___staging_ec2_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. A temporary security-group change was left in place, and SSH password authentication was enabled.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - remove public rule
  - rotate credentials
  - patch instance
  - review security groups
  - ssh keys
  reference_answer: Remove the public rule, rotate credentials, patch the instance, and review other security groups.
  followup_good: Validate SSH through the bastion, monitor authentication, and confirm the API is healthy.
  followup_weak: The visible symptom is gone, but the root cause remains. The instance could be compromised by brute force or a known SSH vulnerability.
  next: ssh_open_world___staging_ec2_phase_4
  mitre_tactic: Discovery
  mitre_technique: T1087 Account Discovery
- id: ssh_open_world___staging_ec2_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Validate SSH through the bastion, monitor authentication, and confirm the API is healthy.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - bastion access
  - monitor authentication
  - api health
  - validate
  - security group
  reference_answer: Validate SSH through the bastion, monitor authentication for renewed attempts, and confirm the staging API is healthy before closing the incident.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: ssh_open_world___staging_ec2_phase_5
  mitre_tactic: Collection
  mitre_technique: T1005 Data from Local System
- id: ssh_open_world___staging_ec2_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for SSH Open to the World — Staging EC2.
  prompt: What must change so SSH Open to the World — Staging EC2 is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - security group guardrails
  - ssm bastion
  - disable password auth
  - patch cadence
  - cloud posture
  reference_answer: Enforce security-group guardrails, use SSM or a bastion instead of public SSH, and disable password authentication.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
