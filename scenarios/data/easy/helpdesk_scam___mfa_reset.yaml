id: helpdesk_scam___mfa_reset
name: Helpdesk Scam — MFA Reset
category: Identity & Access
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. User report of being locked out plus helpdesk ticket. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond Sales VP account.
  incident_manager: You are the Incident Manager coordinating the response to Social-Engineered MFA Reset on Sales VP Account. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Social-Engineered MFA Reset on Sales VP Account. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Social-Engineered MFA Reset on Sales VP Account. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Social-Engineered MFA Reset on Sales VP Account incident. The attacker enrolled a new authenticator and signed in from a cloud IP. The real employee called 20 minutes later to report being locked out. Business impact: The attacker had mailbox access and may have redirected sensitive messages. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Social-Engineered MFA Reset on Sales VP Account
  opening: A caller claiming to be a remote sales VP asked the helpdesk to reset MFA because 'my phone was stolen'. The technician reset it after verifying only the employee ID, which is visible on LinkedIn.
  summary: The attacker enrolled a new authenticator and signed in from a cloud IP. The real employee called 20 minutes later to report being locked out.
  compromised_assets:
  - Sales VP account
  - Helpdesk identity process
  - MFA enrollment
  detected_via: User report of being locked out plus helpdesk ticket.
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: helpdesk_scam___mfa_reset_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: A caller claiming to be a remote sales VP asked the helpdesk to reset MFA because 'my phone was stolen'. The technician reset it after verifying only the employee ID, which is visible on LinkedIn. User report of being locked out plus helpdesk ticket.
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for Sales VP account.
  - Record what you find before you change anything.
  ideal_concepts:
  - ticket
  - caller number
  - verification steps
  - new mfa device
  - mailbox changes
  - sign-in logs
  reference_answer: Identify the ticket, caller number, verification steps, new MFA device, and mailbox changes; preserve helpdesk and sign-in logs.
  followup_good: Triage confirms the activity is real. The helpdesk ticket shows an MFA reset 20 minutes before the real employee called. The new authenticator was enrolled from 103.86.xx.xx, and mailbox rules were created to forward finance mail.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The helpdesk ticket shows an MFA reset 20 minutes before the real employee called. The new authenticator was enrolled from 103.86.xx.xx, and mailbox rules were created to forward finance mail.
  next: helpdesk_scam___mfa_reset_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1598 Phishing for Information
- id: helpdesk_scam___mfa_reset_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The helpdesk ticket shows an MFA reset 20 minutes before the real employee called. The new authenticator was enrolled from 103.86.xx.xx, and mailbox rules were created to forward finance mail.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - revoke sessions
  - remove authenticator
  - reset password
  - disable forwarding
  - account
  reference_answer: Revoke the account's sessions, remove the new authenticator, reset the password, and disable mailbox forwarding rules.
  followup_good: Containment is in place. The helpdesk verified identity with publicly available information and reset MFA without a second factor or callback.
  followup_weak: The activity continues while the team debates. The attacker had mailbox access and may have redirected sensitive messages.
  next: helpdesk_scam___mfa_reset_phase_3
  mitre_tactic: Credential Access
  mitre_technique: T1621 Multi-Factor Authentication Request Generation
- id: helpdesk_scam___mfa_reset_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The helpdesk verified identity with publicly available information and reset MFA without a second factor or callback.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - sent mail
  - file access
  - deleted messages
  - oauth grants
  - new devices
  reference_answer: Review sent mail and file access, restore any deleted messages, and check for OAuth grants or new devices.
  followup_good: Re-enroll the real employee through in-person or video verification and monitor the account for 72 hours.
  followup_weak: The visible symptom is gone, but the root cause remains. The attacker had mailbox access and may have redirected sensitive messages.
  next: helpdesk_scam___mfa_reset_phase_4
  mitre_tactic: Persistence
  mitre_technique: T1556 Modify Authentication Process
- id: helpdesk_scam___mfa_reset_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Re-enroll the real employee through in-person or video verification and monitor the account for 72 hours.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - video verification
  - re-enroll mfa
  - monitor account
  - restore mailbox
  - validate access
  reference_answer: Re-enroll the real employee through in-person or video verification, restore legitimate mailbox access, and monitor the account for 72 hours.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: helpdesk_scam___mfa_reset_phase_5
  mitre_tactic: Collection
  mitre_technique: T1114 Email Collection
- id: helpdesk_scam___mfa_reset_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Helpdesk Scam — MFA Reset.
  prompt: What must change so Helpdesk Scam — MFA Reset is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - identity proofing
  - callback known number
  - mfa reset alert
  - mailbox rule alert
  - helpdesk training
  reference_answer: Require strong identity proofing for MFA resets, use callback to a known number, and flag helpdesk resets followed by mailbox rule changes.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1566 Phishing
