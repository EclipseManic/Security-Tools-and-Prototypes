id: unauthorized_rmm___helpdesk_laptop
name: Unauthorized RMM — Helpdesk Laptop
category: Endpoint
format_version: 2
difficulty: Easy
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: 'You are the Tier-1 SOC analyst on shift. EDR alert: remote-management binary launched with an external relay connection. Triage the alert, identify the account and asset in scope, preserve evidence, and contain the activity before it spreads beyond WS-IT-007 (Helpdesk laptop).'
  incident_manager: You are the Incident Manager coordinating the response to Unapproved Remote-Management Tool on Helpdesk Laptop. Drive containment, evidence preservation, escalation, and cross-team communications; keep the bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Unapproved Remote-Management Tool on Helpdesk Laptop. Weigh business impact, legal and regulatory duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Unapproved Remote-Management Tool on Helpdesk Laptop. Focus on business continuity, budget and resource approval, customer communications, and the timing of disclosure.
executive_brief: 'Executive summary of the Unapproved Remote-Management Tool on Helpdesk Laptop incident. The tool was installed without a change request and uses a consumer relay service. Its credentials were weak, and the vendor dashboard showed an unrecognized login from another country. Business impact: The relay account could give an outsider interactive access to a helpdesk laptop with admin tools and saved credentials. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties once data access is confirmed. Recovery must be validated from a trusted source before normal service resumes.'
incident:
  title: Unapproved Remote-Management Tool on Helpdesk Laptop
  opening: A helpdesk technician installed a free remote-management tool to troubleshoot a user's printer. Two days later, EDR flagged the same tool opening an outbound session to an unknown relay.
  summary: The tool was installed without a change request and uses a consumer relay service. Its credentials were weak, and the vendor dashboard showed an unrecognized login from another country.
  compromised_assets:
  - WS-IT-007 (Helpdesk laptop)
  - Consumer RMM relay account
  - Saved helpdesk credentials
  detected_via: 'EDR alert: remote-management binary launched with an external relay connection.'
  kill_chain:
  - Initial Access
  - Execution
  - Impact
  mitre_tactics:
  - Initial Access
  - Execution
  - Impact
phases:
- id: unauthorized_rmm___helpdesk_laptop_phase_1
  phase_type: triage
  title: Triage the Alert — Phase 1
  situation: 'A helpdesk technician installed a free remote-management tool to troubleshoot a user''s printer. Two days later, EDR flagged the same tool opening an outbound session to an unknown relay. EDR alert: remote-management binary launched with an external relay connection.'
  prompt: What should you verify first, and what evidence must you preserve?
  guidance:
    what: Confirm the alert is real, identify the account and asset in scope, and establish the time window.
    action: Validate the alert and preserve volatile evidence.
    why: Accurate scoping keeps a single-asset event from becoming a wider incident.
  hint: Start with the alert source and the asset named in it. Preserve the email, log, or alert before changing anything.
  hints:
  - Review authentication, endpoint, and network logs for WS-IT-007 (Helpdesk laptop).
  - Record what you find before you change anything.
  ideal_concepts:
  - identify tool
  - service name
  - install source
  - vendor login
  - preserve binary
  - network telemetry
  reference_answer: Identify the tool, version, install source, service name, and relay account; verify who installed it and whether the vendor portal shows unrecognized logins; preserve the binary and EDR network telemetry.
  followup_good: Triage confirms the activity is real. The RMM service is installed as a Windows service, starts at boot, and is reachable through a consumer relay. The vendor portal shows a login from 45.83.xx.xx that the technician did not make; no customer data access is visible yet.
  followup_weak: The alert is treated as noise and the team acts on assumptions. The RMM service is installed as a Windows service, starts at boot, and is reachable through a consumer relay. The vendor portal shows a login from 45.83.xx.xx that the technician did not make; no customer data access is visible yet.
  next: unauthorized_rmm___helpdesk_laptop_phase_2
  mitre_tactic: Execution
  mitre_technique: T1204 User Execution
- id: unauthorized_rmm___helpdesk_laptop_phase_2
  phase_type: containment
  title: Contain the Incident — Phase 2
  situation: Triage confirms the activity is real. The RMM service is installed as a Windows service, starts at boot, and is reachable through a consumer relay. The vendor portal shows a login from 45.83.xx.xx that the technician did not make; no customer data access is visible yet.
  prompt: What is the correct containment action?
  guidance:
    what: Stop the activity without destroying the evidence needed to prove scope.
    action: Contain the account, session, host, or public exposure.
    why: Every minute of continued access increases impact and cleanup cost.
  hint: 'Contain the smallest thing that stops the activity and keeps the evidence: account, session, host, or public exposure.'
  hints:
  - Choose the containment action that is reversible and preserves logs.
  - Confirm the containment actually took effect before moving on.
  ideal_concepts:
  - disable service
  - isolate ws-it-007
  - disable relay account
  - block domain
  - block ip
  reference_answer: Disable the RMM service, isolate WS-IT-007, disable the relay account, and block the relay domain and IP at the firewall.
  followup_good: Containment is in place. The technician installed an unapproved remote-access tool with a reused password and no MFA, creating an unmanaged remote entry point.
  followup_weak: The activity continues while the team debates. The relay account could give an outsider interactive access to a helpdesk laptop with admin tools and saved credentials.
  next: unauthorized_rmm___helpdesk_laptop_phase_3
  mitre_tactic: Persistence
  mitre_technique: T1547.001 Registry Run Keys
- id: unauthorized_rmm___helpdesk_laptop_phase_3
  phase_type: eradication
  title: Remove the Root Cause — Phase 3
  situation: Containment is holding. The technician installed an unapproved remote-access tool with a reused password and no MFA, creating an unmanaged remote entry point.
  prompt: What must be removed or corrected before this asset returns to service?
  guidance:
    what: Find and remove the root cause, not just the visible symptom.
    action: Eradicate the artifact and close the entry path.
    why: Cleaning the symptom while leaving persistence invites a second incident.
  hint: Remove the root cause and check for persistence. Rotate anything the attacker could reuse.
  hints:
  - Check for scheduled tasks, services, startup entries, and new accounts.
  - Rotate every credential or token the attacker could have touched.
  ideal_concepts:
  - uninstall tool
  - remove service
  - rotate credentials
  - scan remote access
  - startup entries
  reference_answer: Uninstall the tool and its service, remove leftover drivers and startup entries, rotate credentials stored on the laptop, and scan for additional remote-access software.
  followup_good: Rebuild WS-IT-007 if the vendor login cannot be fully accounted for, restore approved helpdesk tools, and monitor for new remote-access services.
  followup_weak: The visible symptom is gone, but the root cause remains. The relay account could give an outsider interactive access to a helpdesk laptop with admin tools and saved credentials.
  next: unauthorized_rmm___helpdesk_laptop_phase_4
  mitre_tactic: Defense Evasion
  mitre_technique: T1078 Valid Accounts
- id: unauthorized_rmm___helpdesk_laptop_phase_4
  phase_type: recovery
  title: Recover Safely — Phase 4
  situation: The root cause has been removed. Rebuild WS-IT-007 if the vendor login cannot be fully accounted for, restore approved helpdesk tools, and monitor for new remote-access services.
  prompt: What must be true before service resumes?
  guidance:
    what: Restore from a trusted source and prove the environment is clean.
    action: Validate integrity, rotate exposed credentials, and monitor for reinfection.
    why: A fast restore that reintroduces the attacker is worse than a slower verified recovery.
  hint: Recovery needs a trusted source, validation, and monitoring. Do not restore on top of an unresolved root cause.
  hints:
  - Identify the known-good backup or rebuild image and when it was validated.
  - Decide what monitoring proves the attacker has not returned.
  ideal_concepts:
  - rebuild host
  - approved tools
  - monitor services
  - vendor portal
  - validate clean
  reference_answer: Rebuild WS-IT-007 from a trusted image, restore only approved helpdesk tools, and monitor the endpoint and vendor portal for new remote-access sessions before returning it to production.
  followup_good: The asset returns from a trusted source, validation passes, and monitoring shows no reinfection.
  followup_weak: The asset is back online without full validation, and the same weakness remains.
  next: unauthorized_rmm___helpdesk_laptop_phase_5
  mitre_tactic: Defense Evasion
  mitre_technique: T1562.001 Disable or Modify Tools
- id: unauthorized_rmm___helpdesk_laptop_phase_5
  phase_type: lessons
  title: Post-Incident Review — Phase 5
  situation: Service has been restored and validated. Leadership wants a concise after-action review for Unauthorized RMM — Helpdesk Laptop.
  prompt: What must change so Unauthorized RMM — Helpdesk Laptop is detected earlier and cannot recur?
  guidance:
    what: Identify the root cause, detection gap, and control that failed.
    action: Assign owned and dated improvements.
    why: Without durable changes, the same cause will produce the same incident.
  hint: Turn the incident into one detection improvement and one preventive control with an owner and date.
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  ideal_concepts:
  - approved tool list
  - change approval
  - mfa remote access
  - edr service alert
  - asset inventory
  reference_answer: Publish an approved remote-support tool list, require change approval and MFA for remote access, and add EDR alerts for new remote-management services.
  followup_good: The review names the root cause and detection gap, assigns owned and dated actions, and tracks them to completion.
  followup_weak: The review retells the timeline but leaves ownership and verification vague, so the same incident can recur.
  next: ''
  mitre_tactic: Initial Access
  mitre_technique: T1078 Valid Accounts
