- id: process_improvement_phase_4
  phase_type: lessons
  title: Process Improvement — Phase 4
  situation: The race condition existed because the checkout flow was designed for a lower traffic period and never stress-tested for concurrent requests. The finance team didn't notice the fraud for 5 hours because there was no automated alerting for payment reversals on shipped orders.
  prompt: What process improvements prevent this type of fraud in the future?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What process improvements prevent this type of fraud in the future?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Process Improvement — Phase 4. Asset in scope: shop.acmecorp.com checkout system.'
  hints:
  - Alerting helps detect but doesn't prevent.
  - Valid approach but doesn't address the race condition itself.
  ideal_concepts:
  - implement automated
  - automated alerting
  - alerting payment
  - payment reversals
  - reversals add
  - stress testing
  - testing race
  - race conditions
  reference_answer: |-
    Implement automated alerting for payment reversals, add stress testing for race conditions in the CI/CD pipeline, implement real-time fraud detection for unusual order patterns, and add Stripe webhook monitoring for charge disputes

    Why: Prevents both the technical vulnerability (stress testing) and the detection gap (automated alerting).
