phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The XXE vulnerability is active. The attacker is reading server files and scanning internal networks. The XML parser has external entity processing enabled. The application is returning errors that leak file contents.
  prompt: What do you do to contain this attack?
  guidance:
    what: Establish what fired on pay.acmecorp.com, which accounts are involved, and how urgent the signal is.
    action: What do you do to contain this attack?
    why: Every later decision depends on an accurate picture of pay.acmecorp.com and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: pay.acmecorp.com.'
  hints:
  - Valid long-term strategy but immediate fix is disabling external entities in the XML parser.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - deploy waf
  - waf rule
  - rule block
  - xml entity
  - entity declarations
  - declarations requests
  - requests disable
  - external entity
  reference_answer: |-
    Deploy a WAF rule to block XML entity declarations in requests, disable external entity processing in the XML parser configuration, and block the attacker's IP 194.26.xx.xx

    Why: Multi-layer containment: WAF blocks the attack pattern, parser fix stops XXE at the root, IP block stops the known attacker.
  followup_good: The attacker successfully read /etc/passwd and server.xml via XXE. The error responses leaked file contents. The attacker also performed internal port scanning via SSRF. You need to determine exactly what data was exposed and whether the attacker used the SSRF to access internal services.
  followup_weak: |-
    Multi-layer containment: WAF blocks the attack pattern, parser fix stops XXE at the root, IP block stops the known attacker.

    The attacker successfully read /etc/passwd and server.xml via XXE. The error responses leaked file contents. The attacker also performed internal port scanning via SSRF. You need to determine exactly what data was exposed and whether the attacker used the SSRF to access internal services.
  next: exposed_data_assessment_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1190 Exploit Public-Facing Application
- id: exposed_data_assessment_phase_2
  phase_type: containment
  title: Exposed Data Assessment — Phase 2
  situation: The attacker successfully read /etc/passwd and server.xml via XXE. The error responses leaked file contents. The attacker also performed internal port scanning via SSRF. You need to determine exactly what data was exposed and whether the attacker used the SSRF to access internal services.
  prompt: How do you assess what the attacker accessed?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you assess what the attacker accessed?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Exposed Data Assessment — Phase 2. Asset in scope: pay.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - analyze xxe
  - xxe requests
  - requests waf
  - waf logs
  - logs review
  - review application
  - application error
  - error logs
  reference_answer: |-
    Analyze all 67 XXE requests from the WAF logs, review application error logs for file contents leaked in responses, check internal firewall logs for connections from the pay.acmecorp.com server to internal IPs, and review Tomcat access logs for the full request/response cycle

    Why: Complete assessment: which files were read (XXE), what was leaked (error responses), and what internal services were scanned (SSRF).
  followup_good: The Java XML parser was using default settings with external entity processing enabled. The server.xml was found to contain database connection strings with plaintext passwords. The .bashrc contained API keys for third-party services.
  followup_weak: |-
    Complete assessment: which files were read (XXE), what was leaked (error responses), and what internal services were scanned (SSRF).

