- id: xml_parser_hardening_phase_3
  phase_type: eradication
  title: XML Parser Hardening — Phase 3
  situation: The Java XML parser was using default settings with external entity processing enabled. The server.xml was found to contain database connection strings with plaintext passwords. The .bashrc contained API keys for third-party services.
  prompt: How do you prevent XXE and fix the exposed credentials?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you prevent XXE and fix the exposed credentials?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: XML Parser Hardening — Phase 3. Asset in scope: pay.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - external entity
  - entity processing
  - processing xml
  - xml parser
  - parser set
  - features feature
  - feature secure
  - secure processing
  reference_answer: |-
    Disable external entity processing in the XML parser (set features: FEATURE_SECURE_PROCESSING, disallow DTDs), rotate all exposed credentials, move secrets to a vault, and add XXE-specific WAF rules and DAST testing to the SDLC

    Why: Root cause fix (parser hardening), credential rotation, secrets management, and preventive testing.
