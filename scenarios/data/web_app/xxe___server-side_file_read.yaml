briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to XML External Entity Injection Exposes Internal Files. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for XML External Entity Injection Exposes Internal Files. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for XML External Entity Injection Exposes Internal Files. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the XML External Entity Injection Exposes Internal Files incident. Your organization runs a payment processing API at pay.acmecorp.com (Java/Spring Boot on Tomcat, RHEL 9). The API accepts XML payloads for payment processing at /api/v2/process-payment. At 10:15, the application began returning HTTP 500 errors with unusual response times (>30 seconds). Investigation revealed the attacker sent a crafted XML payload containing an external entity definition that reads /etc/passwd, /opt/tomcat/conf/server.xml, and /etc/shadow via file:// protocol. The XML parser (javax.xml.parsers) had external entity processing enabled. The attacker from IP 194.26.xx.xx made 67 requests over 20 minutes, successfully reading: /etc/passwd (confirmed in error responses), /opt/tomcat/conf/server.xml (database connection strings), /home/app-admin/.bashrc (environment variables with API keys), and attempted to read /etc/shadow (caused the 500 errors due to permissions). The attacker
  also used the XXE to perform SSRF via the http:// entity, scanning internal ports on 10.0.0.0/24. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: XML External Entity Injection Exposes Internal Files
  opening: Your organization runs a payment processing API at pay.acmecorp.com (Java/Spring Boot on Tomcat, RHEL 9). The API accepts XML payloads for payment processing at /api/v2/process-payment.
  summary: 'Your organization runs a payment processing API at pay.acmecorp.com (Java/Spring Boot on Tomcat, RHEL 9). The API accepts XML payloads for payment processing at /api/v2/process-payment. At 10:15, the application began returning HTTP 500 errors with unusual response times (>30 seconds). Investigation revealed the attacker sent a crafted XML payload containing an external entity definition that reads /etc/passwd, /opt/tomcat/conf/server.xml, and /etc/shadow via file:// protocol. The XML parser (javax.xml.parsers) had external entity processing enabled. The attacker from IP 194.26.xx.xx made 67 requests over 20 minutes, successfully reading: /etc/passwd (confirmed in error responses), /opt/tomcat/conf/server.xml (database connection strings), /home/app-admin/.bashrc (environment variables with API keys), and attempted to read /etc/shadow (caused the 500 errors due to permissions). The attacker also used the XXE to perform SSRF via the http:// entity, scanning internal ports on 10.0.0.0/24.'
  compromised_assets:
  - pay.acmecorp.com
  - Server configuration files
  - API keys from .bashrc
  - Internal network scan results
  detected_via: Application errors (HTTP 500) with unusual response times
