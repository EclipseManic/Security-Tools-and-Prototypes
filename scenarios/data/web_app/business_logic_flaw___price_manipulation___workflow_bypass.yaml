briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Business Logic Flaw Enables Price Manipulation and Inventory Theft. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Business Logic Flaw Enables Price Manipulation and Inventory Theft. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Business Logic Flaw Enables Price Manipulation and Inventory Theft. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Business Logic Flaw Enables Price Manipulation and Inventory Theft incident. Your organization runs an e-commerce platform at shop.acmecorp.com (Node.js/Express, MongoDB, Stripe for payments). At 10:00 today, the finance team flagged $340,000 in discrepancies between inventory and revenue. Investigation revealed the attacker exploited multiple business logic flaws: 1) The /api/cart/update-price endpoint accepts a ''price'' parameter from the client — the server uses this price instead of the database price. 2) The checkout flow processes payment first, then checks inventory — the attacker placed orders for out-of-stock items. 3) The coupon system allows unlimited stacking — the attacker applied 47 coupons to a single order. 4) The order status can be changed via the API without authentication — the attacker changed ''cancelled'' orders back to ''completed'' to trigger refunds while keeping the products. Over 3 days, the attacker purchased $340,000
  worth of electronics for $2,300 (using price manipulation + coupon stacking) and received refunds for cancelled orders while keeping the products. The attacker operated from 5 different accounts with stolen credit cards. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: Business Logic Flaw Enables Price Manipulation and Inventory Theft
  opening: Your organization runs an e-commerce platform at shop.acmecorp.com (Node.js/Express, MongoDB, Stripe for payments). At 10:00 today, the finance team flagged $340,000 in discrepancies between inventory and revenue.
  summary: 'Your organization runs an e-commerce platform at shop.acmecorp.com (Node.js/Express, MongoDB, Stripe for payments). At 10:00 today, the finance team flagged $340,000 in discrepancies between inventory and revenue. Investigation revealed the attacker exploited multiple business logic flaws: 1) The /api/cart/update-price endpoint accepts a ''price'' parameter from the client — the server uses this price instead of the database price. 2) The checkout flow processes payment first, then checks inventory — the attacker placed orders for out-of-stock items. 3) The coupon system allows unlimited stacking — the attacker applied 47 coupons to a single order. 4) The order status can be changed via the API without authentication — the attacker changed ''cancelled'' orders back to ''completed'' to trigger refunds while keeping the products. Over 3 days, the attacker purchased $340,000 worth of electronics for $2,300 (using price manipulation + coupon stacking) and received refunds for cancelled
    orders while keeping the products. The attacker operated from 5 different accounts with stolen credit cards.'
  compromised_assets:
