- id: business_logic_security_architecture_phase_3
  phase_type: lessons
  title: Business Logic Security Architecture — Phase 3
  situation: 'The business logic flaws exist because: prices are accepted from the client, inventory is checked after payment, coupons have no stacking limits, and order status changes have no authentication. The application assumes client-side values are trustworthy.'
  prompt: How do you build business logic security into the application?
  guidance:
    what: Translate the incident into concrete detection, prevention, and response improvements.
    action: How do you build business logic security into the application?
    why: Without durable changes, the same root cause will produce the same incident again.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Business Logic Security Architecture — Phase 3. Asset in scope: shop.acmecorp.com business logic.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - implement server-side
  - server-side price
  - price validation
  - validation always
  - always database
  - database prices
  - prices add
  - inventory checks
  reference_answer: |-
    Implement server-side price validation (always use database prices), add inventory checks before payment, enforce business rules (coupon limits, order quantity limits), add authentication and authorization to all state-changing endpoints, implement server-side validation for all business logic, and add anomaly detection for order patterns

    Why: Comprehensive business logic security: server-side validation, proper ordering, business rules, and anomaly detection.
