id: csrf___admin_account_takeover
name: CSRF — Admin Account Takeover
category: Web App
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to CSRF Attack Enables Admin Privilege Escalation. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for CSRF Attack Enables Admin Privilege Escalation. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for CSRF Attack Enables Admin Privilege Escalation. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the CSRF Attack Enables Admin Privilege Escalation incident. Your organization runs a self-hosted Jenkins CI/CD instance at jenkins.acmecorp.com (version 2.387, on Ubuntu 22.04). At 11:00 today, a developer reported that their build pipeline was modified without their knowledge — someone added a stage that runs arbitrary shell commands. Investigation revealed that a junior developer clicked a link in a fake ''Company Town Hall RSVP'' page hosted on rsvp-party-event.com. The page contained a hidden form that auto-submitted a POST request to jenkins.acmecorp.com/manage/configSubmit, changing the admin user''s password and adding a new API token. Jenkins 2.387 has CSRF protection disabled by default on older installations that were upgraded without enabling it. The attacker used the stolen Jenkins admin session to exfiltrate build secrets (AWS credentials, Docker registry passwords) from the Jenkins credential store. The attacker''s domain rsvp-party-event.com
  was registered 3 hours before the attack. Business impact: customer-facing service availability and data confidentiality are at risk, and customer notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: privacy counsel should assess breach-notification duties for exposed customer records.'
incident:
  title: CSRF Attack Enables Admin Privilege Escalation
  opening: Your organization runs a self-hosted Jenkins CI/CD instance at jenkins.acmecorp.com (version 2.387, on Ubuntu 22.04). At 11:00 today, a developer reported that their build pipeline was modified without their knowledge — someone added a stage that runs arbitrary shell commands.
  summary: Your organization runs a self-hosted Jenkins CI/CD instance at jenkins.acmecorp.com (version 2.387, on Ubuntu 22.04). At 11:00 today, a developer reported that their build pipeline was modified without their knowledge — someone added a stage that runs arbitrary shell commands. Investigation revealed that a junior developer clicked a link in a fake 'Company Town Hall RSVP' page hosted on rsvp-party-event.com. The page contained a hidden form that auto-submitted a POST request to jenkins.acmecorp.com/manage/configSubmit, changing the admin user's password and adding a new API token. Jenkins 2.387 has CSRF protection disabled by default on older installations that were upgraded without enabling it. The attacker used the stolen Jenkins admin session to exfiltrate build secrets (AWS credentials, Docker registry passwords) from the Jenkins credential store. The attacker's domain rsvp-party-event.com was registered 3 hours before the attack.
  compromised_assets:
  - jenkins.acmecorp.com
  - Jenkins admin credentials
  - Build secrets (AWS keys, Docker creds)
  detected_via: Developer complaint about modified pipeline + suspicious domain registration
  kill_chain:
  - Initial Access
  - Credential Access
  - Privilege Escalation
  - Collection
  mitre_tactics:
  - Initial Access
  - Credential Access
  - Privilege Escalation
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The attacker has modified the Jenkins admin credentials and has an active session. Build secrets have been accessed. The malicious pipeline stage is still in the Jenkinsfile for multiple repositories.
  prompt: What do you do to contain this attack?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What do you do to contain this attack?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: jenkins.acmecorp.com.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - jenkins admin
  - admin credentials
  - credentials immediately
  - immediately revoke
  - revoke active
  - active api
  - api tokens
  - tokens disable
  reference_answer: |-
    Rotate all Jenkins admin credentials immediately, revoke all active API tokens, disable CSRF-vulnerable endpoints, and remove the malicious pipeline stage from all repositories

    Why: Kills all compromised credentials and removes the persistence mechanism simultaneously.
  followup_good: The Jenkins credential store contained AWS access keys (for CI/CD deployments), Docker Hub passwords, and SSH keys for production servers. The attacker had admin access for 47 minutes before containment. You must assume all credentials are compromised.
  followup_weak: |-
    Kills all compromised credentials and removes the persistence mechanism simultaneously.

    The Jenkins credential store contained AWS access keys (for CI/CD deployments), Docker Hub passwords, and SSH keys for production servers. The attacker had admin access for 47 minutes before containment. You must assume all credentials are compromised.
  next: secret_rotation_phase_2
  mitre_tactic: Credential Access
  mitre_technique: T1550 Use Alternate Authentication Material
- id: secret_rotation_phase_2
  phase_type: containment
  title: Secret Rotation — Phase 2
  situation: The Jenkins credential store contained AWS access keys (for CI/CD deployments), Docker Hub passwords, and SSH keys for production servers. The attacker had admin access for 47 minutes before containment. You must assume all credentials are compromised.
  prompt: How do you handle the compromised credentials?
  guidance:
    what: Decide how to stop the spread from jenkins.acmecorp.com while preserving the evidence trail.
    action: How do you handle the compromised credentials?
    why: Stopping the spread is urgent, but destroying evidence makes the incident impossible to close.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Secret Rotation — Phase 2. Asset in scope: jenkins.acmecorp.com.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - immediately rotate
  - credentials stored
  - stored jenkins
  - jenkins aws
  - aws keys
  - keys docker
  - docker hub
  - hub ssh
  reference_answer: |-
    Immediately rotate ALL credentials that were stored in Jenkins (AWS keys, Docker Hub, SSH keys), check AWS CloudTrail for unauthorized access, and audit all production server SSH authorized_keys files

    Why: Assume full compromise of all stored credentials. Verify no unauthorized use while rotating.
  followup_good: Jenkins version 2.387 was upgraded from 2.289 two years ago. The CSRF protection was never enabled during the upgrade. The Jenkins documentation states that CSRF protection should be enabled for all installations. The misconfiguration allowed cross-origin form submissions to the /manage/ endpoints without any validation.
  followup_weak: |-
    Assume full compromise of all stored credentials.

    Jenkins version 2.387 was upgraded from 2.289 two years ago. The CSRF protection was never enabled during the upgrade. The Jenkins documentation states that CSRF protection should be enabled for all installations. The misconfiguration allowed cross-origin form submissions to the /manage/ endpoints without any validation.
  next: csrf_prevention_phase_3
  mitre_tactic: Collection
  mitre_technique: T1552.001 Credentials In Files
- id: csrf_prevention_phase_3
  phase_type: eradication
  title: CSRF Prevention — Phase 3
  situation: Jenkins version 2.387 was upgraded from 2.289 two years ago. The CSRF protection was never enabled during the upgrade. The Jenkins documentation states that CSRF protection should be enabled for all installations. The misconfiguration allowed cross-origin form submissions to the /manage/ endpoints without any validation.
  prompt: What is the correct CSRF remediation?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: What is the correct CSRF remediation?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: CSRF Prevention — Phase 3. Asset in scope: jenkins.acmecorp.com.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - jenkins csrf
  - csrf protection
  - protection crumb
  - crumb issuer
  - issuer add
  - samesite cookies
  - cookies implement
  - implement anti-csrf
  reference_answer: |-
    Enable Jenkins CSRF protection (crumb issuer), add SameSite cookies, implement anti-CSRF tokens on all state-changing endpoints, and audit other internal tools for similar misconfigurations

    Why: Fixes the root cause (CSRF protection disabled) and adds defense-in-depth (SameSite + anti-CSRF tokens).
