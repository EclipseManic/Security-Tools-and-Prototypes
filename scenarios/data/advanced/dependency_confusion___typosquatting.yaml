- id: eradication_prevention_phase_4
  phase_type: lessons
  title: Eradication & Prevention — Phase 4
  situation: 'The investigation reveals: 150,000 customer records were accessed (names, emails, phone numbers), $12,000 in cloud compute costs from mining, 4 backdoor IAM users created, and the attacker''s access spanned 3 AWS accounts. The CI/CD pipelines were configured to resolve dependencies from PyPI first, then internal repos. Internal package names were not registered on public registries. The company uses 847 internal Python packages.'
  prompt: What prevention measures do you implement?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What prevention measures do you implement?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Eradication & Prevention — Phase 4. Asset in scope: PyPI package ''requests-prod''.'
  hints:
  - One layer but doesn't address package name reservation, hash verification, or secrets management.
  - Detects secrets in env vars but doesn't prevent typosquatting or implement the other necessary controls.
  ideal_concepts:
  - register internal
  - internal package
  - package names
  - names pypi
  - pypi reserved
  - reserved private
  - private implement
  - implement package
  reference_answer: |-
    Register all 847 internal package names on PyPI as reserved (private), implement package index prioritization (internal-first resolution), deploy dependency pinning with hash verification, implement package scanning in CI/CD pipelines, deploy AWS SCP to restrict cross-account access, and implement environment variable injection via secrets manager instead of CI/CD variables

    Why: Comprehensive prevention: name reservation (stops typosquatting), index prioritization (internal-first), hash verification (integrity), package scanning (detection), SCP (access control), and secrets management (eliminates env var exposure).
