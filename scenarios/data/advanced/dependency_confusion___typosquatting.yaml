  mitre_technique: T1070.004 File Deletion
- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: 'Package analysis reveals the payload exfiltrated all environment variables matching patterns: AWS_*, DB_*, API_*, TOKEN_*, and SECRET_*. AWS CloudTrail shows the compromised keys were used to access 3 S3 buckets containing customer data, launch 2 EC2 instances for cryptocurrency mining, and create 4 new IAM users. Database logs show the connection strings were used to query customer records (150,000 rows accessed). The attacker''s infrastructure was traced to a bulletproof hosting provider.'
  prompt: How do you assess the full impact?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: How do you assess the full impact?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: PyPI package ''requests-prod''.'
  hints:
  - Mining is a resource cost but the customer data exposure and IAM compromise are more impactful from a security and regulatory perspective.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - assess customer
  - customer data
  - data exposure
  - exposure records
  - records determine
  - determine regulatory
  - regulatory implications
  - implications gdpr
  reference_answer: |-
    Assess customer data exposure (150,000 records), determine regulatory implications (GDPR, CCPA), inventory cryptocurrency mining costs and resource impact, identify the 4 unauthorized IAM users and all actions they performed, and evaluate the attacker's lateral movement possibilities with the stolen credentials

    Why: Full impact: data breach (customer records), regulatory (GDPR/CCPA), resource abuse (mining costs), IAM compromise (persistence), and lateral movement (further exposure).
  followup_good: 'The investigation reveals: 150,000 customer records were accessed (names, emails, phone numbers), $12,000 in cloud compute costs from mining, 4 backdoor IAM users created, and the attacker''s access spanned 3 AWS accounts. The CI/CD pipelines were configured to resolve dependencies from PyPI first, then internal repos. Internal package names were not registered on public registries. The company uses 847 internal Python packages.'
  followup_weak: |-
    Full impact: data breach (customer records), regulatory (GDPR/CCPA), resource abuse (mining costs), IAM compromise (persistence), and lateral movement (further exposure).

    The investigation reveals: 150,000 customer records were accessed (names, emails, phone numbers), $12,000 in cloud compute costs from mining, 4 backdoor IAM users created, and the attacker's access spanned 3 AWS accounts. The CI/CD pipelines were configured to resolve dependencies from PyPI first, then internal repos. Internal package names were not registered on public registries. The company uses 847 internal Python packages.
