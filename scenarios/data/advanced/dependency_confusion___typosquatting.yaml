  mitre_tactic: Impact
  mitre_technique: T1496 Resource Hijacking
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. PyPI package 'requests-prod' is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return PyPI package 'requests-prod' to production?
  guidance:
    what: 'Define what ''clean'' means for PyPI package ''requests-prod'': trusted backups, rebuilt hosts, rotated credentials, and validated controls.'
    action: What must be true before you return PyPI package 'requests-prod' to production?
    why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: PyPI package ''requests-prod''.'
  hints:
  - Which backup or rebuild image is known-good for PyPI package 'requests-prod', and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore PyPI package 'requests-prod' from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
  next: eradication_prevention_phase_4
  next_weak: ''
  mitre_tactic: Persistence
  mitre_technique: T1098 Account Manipulation
