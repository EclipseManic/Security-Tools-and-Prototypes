id: dependency_confusion___typosquatting
name: Dependency Confusion / Typosquatting
category: Advanced Threats
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Dependency Confusion / Typosquatting — Package Manager Attack. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Dependency Confusion / Typosquatting — Package Manager Attack. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Dependency Confusion / Typosquatting — Package Manager Attack. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Dependency Confusion / Typosquatting — Package Manager Attack incident. The development security team detected that a Python package ''requests-prod'' (internal package used for production API calls) was published to PyPI with version 9.9.9, which is higher than the internal version 2.1.3. The package appeared on PyPI 5 days ago. Analysis revealed the PyPI package contained the same module names as the internal package but included a hidden payload that exfiltrated environment variables (including API keys, database credentials, and cloud access tokens) to an external server. The package was downloaded by CI/CD pipelines in 12 microservices that auto-resolve dependencies from PyPI before checking internal repositories. The CI/CD pipelines ran in the production Kubernetes cluster. Environment variables from the production namespace were exfiltrated, including: AWS access keys for the production account, database connection strings for 3 PostgreSQL
  clusters, and API keys for 8 external services. Business impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
incident:
  title: Dependency Confusion / Typosquatting — Package Manager Attack
  opening: The development security team detected that a Python package 'requests-prod' (internal package used for production API calls) was published to PyPI with version 9.9.9, which is higher than the internal version 2.1.3. The package appeared on PyPI 5 days ago.
  summary: 'The development security team detected that a Python package ''requests-prod'' (internal package used for production API calls) was published to PyPI with version 9.9.9, which is higher than the internal version 2.1.3. The package appeared on PyPI 5 days ago. Analysis revealed the PyPI package contained the same module names as the internal package but included a hidden payload that exfiltrated environment variables (including API keys, database credentials, and cloud access tokens) to an external server. The package was downloaded by CI/CD pipelines in 12 microservices that auto-resolve dependencies from PyPI before checking internal repositories. The CI/CD pipelines ran in the production Kubernetes cluster. Environment variables from the production namespace were exfiltrated, including: AWS access keys for the production account, database connection strings for 3 PostgreSQL clusters, and API keys for 8 external services.'
  compromised_assets:
  - PyPI package 'requests-prod' (typosquatted)
  - 12 microservices in production Kubernetes cluster
  - AWS production access keys
  - 3 PostgreSQL database connection strings
  - 8 external service API keys
  detected_via: Package registry monitoring — internal package published externally with higher version
  kill_chain:
  - Initial Access
  - Execution
  - Collection
  - Exfiltration
  mitre_tactics:
  - Initial Access
  - Execution
  - Collection
  - Exfiltration
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A typosquatted package has been exfiltrating production credentials for 5 days. 12 microservices in production may have executed the malicious package. AWS keys, database credentials, and API keys are compromised. The CI/CD pipelines auto-resolve from PyPI. The attacker may have already used the exfiltrated credentials.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on PyPI package ''requests-prod'', its severity, and the affected accounts.'
    action: What is your FIRST containment action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: PyPI package ''requests-prod''.'
  hints:
  - Credential rotation and CI/CD configuration fix can be done without shutting down services.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately rotate
  - aws keys
  - keys database
  - database credentials
  - credentials api
  - api keys
  - keys affected
  - affected services
  reference_answer: |-
    Immediately rotate all AWS keys, database credentials, and API keys for the affected services, block the exfiltration endpoint at the network level, update CI/CD pipeline configuration to only resolve from internal package repositories, and quarantine the 12 affected microservices

    Why: Credential rotation stops ongoing exploitation, network blocking stops exfiltration, CI/CD fix prevents future感染, and quarantine limits blast radius of compromised services.
  followup_good: The malicious package has been identified and the exfiltration endpoint blocked. Credentials are being rotated. You need to determine what was exfiltrated, which services were affected, and whether the attacker used the stolen credentials. The malicious package's source code needs analysis to understand the full payload.
  followup_weak: |-
    Credential rotation stops ongoing exploitation, network blocking stops exfiltration, CI/CD fix prevents future感染, and quarantine limits blast radius of compromised services.

    The malicious package has been identified and the exfiltration endpoint blocked. Credentials are being rotated. You need to determine what was exfiltrated, which services were affected, and whether the attacker used the stolen credentials. The malicious package's source code needs analysis to understand the full payload.
  next: evidence_collection_phase_2
  mitre_tactic: Execution
  mitre_technique: T1059.006 Python
- id: evidence_collection_phase_2
  phase_type: analysis
  title: Evidence Collection — Phase 2
  situation: The malicious package has been identified and the exfiltration endpoint blocked. Credentials are being rotated. You need to determine what was exfiltrated, which services were affected, and whether the attacker used the stolen credentials. The malicious package's source code needs analysis to understand the full payload.
  prompt: How do you collect evidence from this package supply chain attack?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on PyPI package 'requests-prod'.
    action: How do you collect evidence from this package supply chain attack?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Collection — Phase 2. Asset in scope: PyPI package ''requests-prod''.'
  hints:
  - Important for broader scope but secondary to the immediate evidence collection for this specific attack.
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - analyze malicious
  - malicious pypi
  - pypi package
  - package source
  - source code
  - code payload
  - payload pull
  - logs microservices
  reference_answer: |-
    Analyze the malicious PyPI package source code and payload, pull CI/CD logs for all 12 microservices showing package installation events, audit AWS CloudTrail for unauthorized API calls using the compromised keys, check database logs for unauthorized access, and analyze network logs for exfiltration traffic patterns

    Why: Multi-source evidence: package analysis (payload), CI/CloudTrail/DB logs (scope and usage), and network analysis (exfiltration methods).
  followup_good: 'Package analysis reveals the payload exfiltrated all environment variables matching patterns: AWS_*, DB_*, API_*, TOKEN_*, and SECRET_*. AWS CloudTrail shows the compromised keys were used to access 3 S3 buckets containing customer data, launch 2 EC2 instances for cryptocurrency mining, and create 4 new IAM users. Database logs show the connection strings were used to query customer records (150,000 rows accessed). The attacker''s infrastructure was traced to a bulletproof hosting provider.'
  followup_weak: |-
    Multi-source evidence: package analysis (payload), CI/CloudTrail/DB logs (scope and usage), and network analysis (exfiltration methods).

    Package analysis reveals the payload exfiltrated all environment variables matching patterns: AWS_*, DB_*, API_*, TOKEN_*, and SECRET_*. AWS CloudTrail shows the compromised keys were used to access 3 S3 buckets containing customer data, launch 2 EC2 instances for cryptocurrency mining, and create 4 new IAM users. Database logs show the connection strings were used to query customer records (150,000 rows accessed). The attacker's infrastructure was traced to a bulletproof hosting provider.
