  prompt: What external actions do you take?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What external actions do you take?
    why: Without durable changes, the same root cause will produce the same incident again.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Intelligence Sharing & Post-Incident — Phase 5. Asset in scope: DC-PROD-03.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - report cisa
  - cisa fbi
  - fbi notify
  - solarwinds compromised
  - compromised build
  - build share
  - share iocs
  - iocs industry
  reference_answer: |-
    Report to CISA/FBI, notify SolarWinds of the compromised build, share IOCs with industry ISACs, engage a specialized IR firm for full attribution analysis, and prepare regulatory breach notifications

    Why: Nation-state supply chain attacks require federal notification, industry sharing, and legal/regulatory compliance. Isolation isn't enough.
