id: nation-state_espionage_campaign
name: Nation-State Espionage Campaign
category: Advanced Threats
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Supply-Chain Compromise — Orion Build System Infiltration. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Supply-Chain Compromise — Orion Build System Infiltration. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Supply-Chain Compromise — Orion Build System Infiltration. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Supply-Chain Compromise — Orion Build System Infiltration incident. At 04:12 UTC, a FireEye Red Team tool detection alert fired on domain controller DC-PROD-03. The alert identified a process ''OrionImprovementBusinessLayer'' executing PowerShell with obfuscated arguments from the SolarWinds Orion service account. Further investigation reveals the binary sunburst.dll was injected into the legitimate SolarWinds.Orion.Core.BusinessLayer.dll on this server 14 days ago via a tampered update (v2020.2.1). The injected code established a C2 channel to avsvmcloud[.]com via DNS-over-HTTPS, then used the service account''s Kerberos ticket to enumerate 327 domain accounts, accessed email of 11 senior executives, and staged 12 GB of data in a temporary S3 bucket under attacker control. The attacker also created a backdoor account ''solar.service'' with Domain Admin privileges. Detection occurred only because FireEye''s own tools were being targeted. Business
  impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
incident:
  title: Supply-Chain Compromise — Orion Build System Infiltration
  opening: At 04:12 UTC, a FireEye Red Team tool detection alert fired on domain controller DC-PROD-03. The alert identified a process 'OrionImprovementBusinessLayer' executing PowerShell with obfuscated arguments from the SolarWinds Orion service account.
  summary: At 04:12 UTC, a FireEye Red Team tool detection alert fired on domain controller DC-PROD-03. The alert identified a process 'OrionImprovementBusinessLayer' executing PowerShell with obfuscated arguments from the SolarWinds Orion service account. Further investigation reveals the binary sunburst.dll was injected into the legitimate SolarWinds.Orion.Core.BusinessLayer.dll on this server 14 days ago via a tampered update (v2020.2.1). The injected code established a C2 channel to avsvmcloud[.]com via DNS-over-HTTPS, then used the service account's Kerberos ticket to enumerate 327 domain accounts, accessed email of 11 senior executives, and staged 12 GB of data in a temporary S3 bucket under attacker control. The attacker also created a backdoor account 'solar.service' with Domain Admin privileges. Detection occurred only because FireEye's own tools were being targeted.
  compromised_assets:
  - DC-PROD-03 (Primary Domain Controller)
  - SolarWinds Orion server (ORION-APP-01)
  - 11 executive mailboxes
  - AWS S3 staging bucket (attacker-controlled)
  detected_via: FireEye Red Team tool anomaly + anomalous PowerShell under Orion service account
  kill_chain:
  - Supply Chain Compromise
  - Execution
  - Persistence
  - Privilege Escalation
  - Credential Access
  - Collection
  - Exfiltration
  mitre_tactics:
  - Initial Access
