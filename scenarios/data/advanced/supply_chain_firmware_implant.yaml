  mitre_technique: T1005 Data from Local System
- id: credential_key_rotation_phase_3
  phase_type: containment
  title: Credential & Key Rotation — Phase 3
  situation: Firmware analysis confirms the implant dumps host memory via DMA, which means every database credential, TLS private key, and encryption key processed on these 84 servers for the past 6 weeks is compromised. The servers host the primary PostgreSQL database cluster, the internal PKI CA, and 3 certificate-issuing services. The attacker may have forged certificates or decrypted archived traffic.
  prompt: How do you handle the credential and key compromise?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you handle the credential and key compromise?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Credential & Key Rotation — Phase 3. Asset in scope: 84 Dell PowerEdge servers.'
  hints:
  - The attacker may still have the exfiltrated keys.
  - Consider the affected accounts and their privilege level.
  ideal_concepts:
  - revoke reissue
  - reissue tls
  - tls certificates
  - certificates issued
  - issued internal
  - internal rotate
  - database credentials
  - credentials regenerate
  reference_answer: |-
    Revoke and reissue all TLS certificates issued by the internal CA, rotate all database credentials, regenerate the internal CA key pair, force-revoke all CRL entries, and rotate all application-level encryption keys

    Why: DMA-based memory access compromises everything in RAM — certificates, keys, and credentials must all be rotated. The internal CA is particularly critical since it could be used to forge trusted certificates.
  followup_good: All credentials and keys have been rotated. The 84 servers need clean BMC firmware. Dell has provided verified firmware v2.15.4 with secure boot validation. The update server has been rebuilt. You need to remediate all 84 servers and prevent recurrence.
  followup_weak: |-
    DMA-based memory access compromises everything in RAM — certificates, keys, and credentials must all be rotated.

    All credentials and keys have been rotated. The 84 servers need clean BMC firmware. Dell has provided verified firmware v2.15.4 with secure boot validation. The update server has been rebuilt. You need to remediate all 84 servers and prevent recurrence.
  next: firmware_remediation_supply_chain_hardening_phase_4
  mitre_tactic: Credential Access
  mitre_technique: 'T1552.006 Unsecured Credentials: Keys'
- id: firmware_remediation_supply_chain_hardening_phase_4
  phase_type: eradication
  title: Firmware Remediation & Supply Chain Hardening — Phase 4
  situation: All credentials and keys have been rotated. The 84 servers need clean BMC firmware. Dell has provided verified firmware v2.15.4 with secure boot validation. The update server has been rebuilt. You need to remediate all 84 servers and prevent recurrence.
  prompt: What is your firmware remediation and prevention plan?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: What is your firmware remediation and prevention plan?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Firmware Remediation & Supply Chain Hardening — Phase 4. Asset in scope: 84 Dell PowerEdge servers.'
  hints:
  - The update server was rebuilt but the DNS poisoning vulnerability may still exist.
  - The new hardware would still need firmware verification.
  ideal_concepts:
  - flash verified
  - verified firmware
  - firmware servers
  - servers dell
  - dell idrac
  - idrac secure
  - secure firmware
  - firmware update
  reference_answer: |-
    Flash verified firmware to all 84 servers via Dell's iDRAC secure firmware update with cryptographic verification, implement BMC firmware hash verification in the compliance audit, deploy DNSSEC to prevent future poisoning of the update server, and establish firmware bill-of-materials tracking

    Why: Secure firmware update with crypto verification + DNSSEC + firmware BOM tracking addresses both the immediate remediation and the root cause (DNS poisoning of the update supply chain).
  followup_good: Firmware remediation is complete. The incident exposed gaps in firmware supply chain security, DNS integrity for internal infrastructure, and the lack of BMC network segmentation. The attacker maintained 6-week access via a covert channel that blended with legitimate IPMI traffic.
  followup_weak: |-
    Secure firmware update with crypto verification + DNSSEC + firmware BOM tracking addresses both the immediate remediation and the root cause (DNS poisoning of the update supply chain).

    Firmware remediation is complete. The incident exposed gaps in firmware supply chain security, DNS integrity for internal infrastructure, and the lack of BMC network segmentation. The attacker maintained 6-week access via a covert channel that blended with legitimate IPMI traffic.
  next: recovery_and_validation
  mitre_tactic: Persistence
  mitre_technique: T1542 Pre-OS Boot
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. 84 Dell PowerEdge servers is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return 84 Dell PowerEdge servers to production?
  guidance:
    what: 'Define what ''clean'' means for 84 Dell PowerEdge servers: trusted backups, rebuilt hosts, rotated credentials, and validated controls.'
    action: What must be true before you return 84 Dell PowerEdge servers to production?
    why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: 84 Dell PowerEdge servers.'
  hints:
  - Which backup or rebuild image is known-good for 84 Dell PowerEdge servers, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore 84 Dell PowerEdge servers from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
