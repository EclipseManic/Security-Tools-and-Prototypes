  - Execution
  - Persistence
  - Collection
  - Exfiltration
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: 84 production servers have compromised BMC firmware that survives disk replacement. The implant communicates over IPMI (port 623/UDP) to an external endpoint at 203.0.113.xx. The BMC firmware has out-of-band access to host memory, disk, and network. All database credentials and encryption keys processed on these servers should be considered compromised.
  prompt: What is your first containment action?
  guidance:
    what: Establish what fired on 84 Dell PowerEdge servers, which accounts are involved, and how urgent the signal is.
    action: What is your first containment action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: 84 Dell PowerEdge servers.'
  hints:
  - The BMC firmware is persistent but the network containment stops exfiltration first.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - ipmi traffic
  - traffic port
  - port udp
  - udp outbound
  - outbound servers
  - servers isolate
  - isolate compromised
  - compromised update
  reference_answer: |-
    Block IPMI traffic (port 623/UDP) outbound on all servers, isolate the compromised update server, and begin rotating all credentials and keys that transited the 84 servers

    Why: Stops the C2 channel immediately, isolates the supply chain entry point, and begins credential rotation for the most critical impact (stolen keys/credentials).
  followup_good: 'The SOC team has isolated the update server and is analyzing the malicious BMC firmware binary. Reverse engineering reveals: (1) the implant hooks the BMC''s IPMI handler to provide a hidden ''admin'' shell, (2) it periodically dumps host OS memory via DMA, (3) it exfiltrates data in IPMI packets disguised as legitimate SOL (serial-over-LAN) traffic, (4) it contains a kill switch triggered by a specific IPMI command. The firmware update server''s DNS cache shows the poisoning redirected the update URL from dell.com to 198.51.100.xx for 3 days.'
  followup_weak: |-
    Stops the C2 channel immediately, isolates the supply chain entry point, and begins credential rotation for the most critical impact (stolen keys/credentials).

    The SOC team has isolated the update server and is analyzing the malicious BMC firmware binary. Reverse engineering reveals: (1) the implant hooks the BMC's IPMI handler to provide a hidden 'admin' shell, (2) it periodically dumps host OS memory via DMA, (3) it exfiltrates data in IPMI packets disguised as legitimate SOL (serial-over-LAN) traffic, (4) it contains a kill switch triggered by a specific IPMI command. The firmware update server's DNS cache shows the poisoning redirected the update URL from dell.com to 198.51.100.xx for 3 days.
  next: forensic_firmware_analysis_phase_2
  mitre_tactic: Initial Access
  mitre_technique: T1195.001 Compromise Software Dependencies and Development Tools
- id: forensic_firmware_analysis_phase_2
  phase_type: analysis
  title: Forensic Firmware Analysis — Phase 2
  situation: 'The SOC team has isolated the update server and is analyzing the malicious BMC firmware binary. Reverse engineering reveals: (1) the implant hooks the BMC''s IPMI handler to provide a hidden ''admin'' shell, (2) it periodically dumps host OS memory via DMA, (3) it exfiltrates data in IPMI packets disguised as legitimate SOL (serial-over-LAN) traffic, (4) it contains a kill switch triggered by a specific IPMI command. The firmware update server''s DNS cache shows the poisoning redirected the update URL from dell.com to 198.51.100.xx for 3 days.'
  prompt: How do you analyze the firmware implant's capabilities and scope?
  guidance:
    what: Test the initial theory against telemetry from 84 Dell PowerEdge servers before committing to a response.
    action: How do you analyze the firmware implant's capabilities and scope?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Forensic Firmware Analysis — Phase 2. Asset in scope: 84 Dell PowerEdge servers.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - extract implant
  - implant isolated
  - isolated analysis
  - analysis station
  - station identify
  - identify memory
  - memory regions
  - regions accesses
  reference_answer: |-
    Extract the implant on an isolated analysis station, identify all memory regions it accesses, decode the IPMI exfiltration protocol, and build network signatures to detect historical exfiltration traffic in PCAP archives

    Why: Full reverse engineering reveals the exact scope of data accessed, enables historical traffic analysis, and produces detection signatures for the covert channel.
  followup_good: Firmware analysis confirms the implant dumps host memory via DMA, which means every database credential, TLS private key, and encryption key processed on these 84 servers for the past 6 weeks is compromised. The servers host the primary PostgreSQL database cluster, the internal PKI CA, and 3 certificate-issuing services. The attacker may have forged certificates or decrypted archived traffic.
  followup_weak: |-
    Full reverse engineering reveals the exact scope of data accessed, enables historical traffic analysis, and produces detection signatures for the covert channel.

    Firmware analysis confirms the implant dumps host memory via DMA, which means every database credential, TLS private key, and encryption key processed on these 84 servers for the past 6 weeks is compromised. The servers host the primary PostgreSQL database cluster, the internal PKI CA, and 3 certificate-issuing services. The attacker may have forged certificates or decrypted archived traffic.
  next: credential_key_rotation_phase_3
