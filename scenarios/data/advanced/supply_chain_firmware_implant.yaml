id: supply_chain_firmware_implant
name: Supply Chain Firmware Implant
category: Advanced Threats
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Server Firmware Backdoor — Compromised BMC Firmware Update. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Server Firmware Backdoor — Compromised BMC Firmware Update. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Server Firmware Backdoor — Compromised BMC Firmware Update. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Server Firmware Backdoor — Compromised BMC Firmware Update incident. During a routine firmware compliance audit, the infrastructure security team discovered that 84 Dell PowerEdge servers in production cluster PROD-CLUSTER-07 are running BMC firmware version 2.15.3, but the organization''s approved firmware baseline is 2.15.1. Investigation revealed that the firmware update was distributed through a compromised internal update server (update-srv-internal.corp) which received the payload from an attacker-controlled mirror after a DNS poisoning attack redirected the upstream update source. The malicious BMC firmware contains a persistent implant that survives OS reinstallation and disk replacement. It establishes a covert channel over IPMI protocol, provides out-of-band shell access to the host OS, and has been active for 6 weeks. The implant exfiltrates memory contents including encryption keys and database credentials at regular intervals. Business
  impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
incident:
  title: Server Firmware Backdoor — Compromised BMC Firmware Update
  opening: During a routine firmware compliance audit, the infrastructure security team discovered that 84 Dell PowerEdge servers in production cluster PROD-CLUSTER-07 are running BMC firmware version 2.15.3, but the organization's approved firmware baseline is 2.15.1. Investigation revealed that the firmware update was distributed through a compromised internal update server (update-srv-internal.corp) which received the…
  summary: During a routine firmware compliance audit, the infrastructure security team discovered that 84 Dell PowerEdge servers in production cluster PROD-CLUSTER-07 are running BMC firmware version 2.15.3, but the organization's approved firmware baseline is 2.15.1. Investigation revealed that the firmware update was distributed through a compromised internal update server (update-srv-internal.corp) which received the payload from an attacker-controlled mirror after a DNS poisoning attack redirected the upstream update source. The malicious BMC firmware contains a persistent implant that survives OS reinstallation and disk replacement. It establishes a covert channel over IPMI protocol, provides out-of-band shell access to the host OS, and has been active for 6 weeks. The implant exfiltrates memory contents including encryption keys and database credentials at regular intervals.
  compromised_assets:
  - 84 Dell PowerEdge servers (BMC firmware compromised)
  - update-srv-internal.corp (DNS-poisoned update server)
  - IPMI covert channel (attacker-controlled endpoint)
  detected_via: Firmware compliance audit — version mismatch detection
  kill_chain:
  - Initial Access
  - Execution
