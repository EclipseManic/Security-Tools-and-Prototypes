  mitre_tactic: Exfiltration
  mitre_technique: T1027.003 Steganography
- id: steganographic_analysis_phase_2
  phase_type: analysis
  title: Steganographic Analysis — Phase 2
  situation: 'WS-RD-017 is isolated. Forensic imaging reveals: (1) a custom Python script ''aurora_encoder.py'' in m.webb''s Documents folder, (2) the script uses LSB steganography with a rotating XOR key derived from EXIF metadata, (3) the script has a config file pointing to three output channels: Imgur, a Discord webhook, and a Telegram bot, (4) the Discord and Telegram channels were also used — 210 messages to Discord and 89 to Telegram over the same period. Total exfiltration across all three channels: approximately 4.7 MB.'
  prompt: How do you fully characterize the exfiltration?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on m.webb workstation.
    action: How do you fully characterize the exfiltration?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Steganographic Analysis — Phase 2. Asset in scope: m.webb workstation.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - decode steganographic
  - steganographic content
  - content three
  - three channels
  - channels imgur
  - imgur discord
  - discord telegram
  - telegram identify
  reference_answer: |-
    Decode the steganographic content from all three channels (Imgur, Discord, Telegram) to identify the exact data exfiltrated, then correlate with classified document access logs to quantify the breach

    Why: Full decoding reveals what was stolen — critical for breach notification, damage assessment, and legal proceedings. Access log correlation confirms scope.
  followup_good: Decoded data confirms exfiltration of Project Aurora source code (v2.3.1 through v2.5.7), engineering schematics for a classified defense subsystem, and 14 internal API specifications. m.webb's browser history shows visits to steganography forums and a 'how-to' guide on hiding data in images. His financial records (obtained via HR) show a recent $25,000 deposit from an offshore account. He has a pending two-week vacation to a non-extradition country starting in 10 days.
  followup_weak: |-
    Full decoding reveals what was stolen — critical for breach notification, damage assessment, and legal proceedings.

    Decoded data confirms exfiltration of Project Aurora source code (v2.3.1 through v2.5.7), engineering schematics for a classified defense subsystem, and 14 internal API specifications. m.webb's browser history shows visits to steganography forums and a 'how-to' guide on hiding data in images. His financial records (obtained via HR) show a recent $25,000 deposit from an offshore account. He has a pending two-week vacation to a non-extradition country starting in 10 days.
