id: steganography-based_data_exfiltration
name: Steganography-Based Data Exfiltration
category: Advanced Threats
format_version: 2
difficulty: Hard
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Covert Channel Exfiltration — Data Hidden in Image Uploads. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Covert Channel Exfiltration — Data Hidden in Image Uploads. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Covert Channel Exfiltration — Data Hidden in Image Uploads. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Covert Channel Exfiltration — Data Hidden in Image Uploads incident. The DLP team flagged an unusual pattern: employee Marcus Webb (m.webb, Senior R&D Engineer) has been uploading an average of 47 JPEG images per day to a personal Imgur account over the past 3 weeks. The images appear to be innocuous landscape photos taken with his company phone. However, network forensics reveals each image contains approximately 15 KB of hidden data appended to the JPEG EOI marker using LSB (Least Significant Bit) steganography. The steganographic payload uses a custom encoding scheme with a rotating XOR key derived from image metadata. Analysis of the decoded data shows fragments of confidential engineering schematics, source code from the ''Project Aurora'' repository, and internal API documentation. Total estimated exfiltration: 2.1 MB across 1,410 images. Business impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party
  notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
incident:
  title: Covert Channel Exfiltration — Data Hidden in Image Uploads
  opening: 'The DLP team flagged an unusual pattern: employee Marcus Webb (m.webb, Senior R&D Engineer) has been uploading an average of 47 JPEG images per day to a personal Imgur account over the past 3 weeks. The images appear to be innocuous landscape photos taken with his company phone.'
  summary: 'The DLP team flagged an unusual pattern: employee Marcus Webb (m.webb, Senior R&D Engineer) has been uploading an average of 47 JPEG images per day to a personal Imgur account over the past 3 weeks. The images appear to be innocuous landscape photos taken with his company phone. However, network forensics reveals each image contains approximately 15 KB of hidden data appended to the JPEG EOI marker using LSB (Least Significant Bit) steganography. The steganographic payload uses a custom encoding scheme with a rotating XOR key derived from image metadata. Analysis of the decoded data shows fragments of confidential engineering schematics, source code from the ''Project Aurora'' repository, and internal API documentation. Total estimated exfiltration: 2.1 MB across 1,410 images.'
  compromised_assets:
  - m.webb workstation (WS-RD-017)
  - Imgur personal account (attacker-controlled or self-exfiltration)
  - Project Aurora source code repository
  - Engineering schematic repository
  detected_via: DLP volume anomaly — excessive image uploads to personal cloud storage
  kill_chain:
  - Collection
  - Exfiltration
  mitre_tactics:
  - Collection
  - Exfiltration
phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: m.webb is uploading steganographically-encoded data to Imgur at a rate of ~47 images/day. The exfiltration has been ongoing for 3 weeks (1,410 images, ~2.1 MB). m.webb is currently at his desk. His workstation WS-RD-017 has access to Project Aurora. The Imgur uploads are to a personal account, bypassing corporate DLP which only inspects approved cloud services.
  prompt: What is your first containment action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on m.webb workstation, its severity, and the affected accounts.'
    action: What is your first containment action?
    why: Every later decision depends on an accurate picture of m.webb workstation and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: m.webb workstation.'
  hints:
  - Consider pulling the relevant logs for the affected window.
  - Think about which accounts or assets could be affected.
  ideal_concepts:
  - isolate ws-rd-017
  - ws-rd-017 network
  - network block
  - imgur uploads
  - uploads proxy
  - proxy preserve
  - preserve workstation
  - workstation forensic
  reference_answer: |-
    Isolate WS-RD-017 from the network, block Imgur uploads at the proxy, and preserve the workstation for forensic imaging without alerting m.webb

    Why: Network isolation stops ongoing exfiltration. Proxy block prevents uploads. Silent forensic preservation maintains the investigation.
  followup_good: 'WS-RD-017 is isolated. Forensic imaging reveals: (1) a custom Python script ''aurora_encoder.py'' in m.webb''s Documents folder, (2) the script uses LSB steganography with a rotating XOR key derived from EXIF metadata, (3) the script has a config file pointing to three output channels: Imgur, a Discord webhook, and a Telegram bot, (4) the Discord and Telegram channels were also used — 210 messages to Discord and 89 to Telegram over the same period. Total exfiltration across all three channels: approximately 4.7 MB.'
  followup_weak: |-
    Network isolation stops ongoing exfiltration.

    WS-RD-017 is isolated. Forensic imaging reveals: (1) a custom Python script 'aurora_encoder.py' in m.webb's Documents folder, (2) the script uses LSB steganography with a rotating XOR key derived from EXIF metadata, (3) the script has a config file pointing to three output channels: Imgur, a Discord webhook, and a Telegram bot, (4) the Discord and Telegram channels were also used — 210 messages to Discord and 89 to Telegram over the same period. Total exfiltration across all three channels: approximately 4.7 MB.
