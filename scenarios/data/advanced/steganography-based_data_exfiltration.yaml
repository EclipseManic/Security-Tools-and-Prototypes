- id: insider_threat_assessment_phase_3
  phase_type: eradication
  title: Insider Threat Assessment — Phase 3
  situation: Decoded data confirms exfiltration of Project Aurora source code (v2.3.1 through v2.5.7), engineering schematics for a classified defense subsystem, and 14 internal API specifications. m.webb's browser history shows visits to steganography forums and a 'how-to' guide on hiding data in images. His financial records (obtained via HR) show a recent $25,000 deposit from an offshore account. He has a pending two-week vacation to a non-extradition country starting in 10 days.
  prompt: How do you handle the insider threat assessment?
  guidance:
    what: Find every foothold the attacker left on m.webb workstation, including persistence and stolen credentials.
    action: How do you handle the insider threat assessment?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Insider Threat Assessment — Phase 3. Asset in scope: m.webb workstation.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - engage legal
  - legal immediately
  - immediately coordinate
  - coordinate law
  - law enforcement
  - enforcement fbi
  - fbi preserve
  - preserve digital
  reference_answer: |-
    Engage HR and legal immediately, coordinate with law enforcement (FBI), preserve all digital evidence with chain of custody, restrict m.webb's access to additional systems, and monitor his communications under legal guidance

    Why: Financial indicators and pending travel suggest espionage. Law enforcement engagement is critical for criminal prosecution. Legal coordination ensures evidence admissibility.
  followup_good: 'The breach scope is: Project Aurora source code (all versions from past 3 weeks), classified defense subsystem schematics, and 14 API specifications. The source code and schematics are classified under ITAR regulations. The exfiltrated data has been on Imgur (public), Discord, and Telegram for up to 3 weeks. The data cannot be recalled.'
  followup_weak: |-
    Financial indicators and pending travel suggest espionage.

    The breach scope is: Project Aurora source code (all versions from past 3 weeks), classified defense subsystem schematics, and 14 API specifications. The source code and schematics are classified under ITAR regulations. The exfiltrated data has been on Imgur (public), Discord, and Telegram for up to 3 weeks. The data cannot be recalled.
