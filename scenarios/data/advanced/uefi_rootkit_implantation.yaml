- id: eradication_firmware_recovery_phase_4
  phase_type: eradication
  title: Eradication & Firmware Recovery — Phase 4
  situation: Firmware scanning confirms 3 additional servers have matching ESP modifications. All 4 compromised servers have SMBus hardware implants. The rootkit was active for 3 months, accessing the customer database of 2.3M records. Eradication requires flashing clean UEFI firmware, removing the hardware implants, and rebuilding the servers from verified media.
  prompt: What is your eradication and recovery plan?
  guidance:
    what: Confirm the root cause and remove the artifacts that would let the attacker return.
    action: What is your eradication and recovery plan?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Eradication & Firmware Recovery — Phase 4. Asset in scope: PROD-DB-01.'
  hints:
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - physically remove
  - smbus hardware
  - hardware implants
  - implants servers
  - servers flash
  - flash verified
  - verified clean
  - clean uefi
  reference_answer: |-
    Physically remove SMBus hardware implants from all 4 servers, flash verified clean UEFI firmware with Secure Boot re-enabled using updated DBX revocation lists, rebuild all servers from verified installation media, rotate all customer database credentials, and deploy hardware security modules (HSMs) for key storage

    Why: Physical removal eliminates the hardware implant. Verified firmware with updated DBX closes the Secure Boot bypass. HSMs protect keys from firmware-level access.
  followup_good: 'Eradication is complete. The incident exposed critical gaps: no firmware integrity monitoring was in place before the assessment, firmware update utilities were not validated, Secure Boot was not properly configured with DBX revocation lists, and server management ports had no physical access controls. The UEFI rootkit was one of the most sophisticated persistence mechanisms ever encountered.'
  followup_weak: |-
    Physical removal eliminates the hardware implant.

    Eradication is complete. The incident exposed critical gaps: no firmware integrity monitoring was in place before the assessment, firmware update utilities were not validated, Secure Boot was not properly configured with DBX revocation lists, and server management ports had no physical access controls. The UEFI rootkit was one of the most sophisticated persistence mechanisms ever encountered.
  next: recovery_and_validation
  mitre_tactic: Persistence
  mitre_technique: 'T1542.001 System Firmware: UEFI'
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. PROD-DB-01 is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return PROD-DB-01 to production?
  guidance:
    what: 'Define what ''clean'' means for PROD-DB-01: trusted backups, rebuilt hosts, rotated credentials, and validated controls.'
    action: What must be true before you return PROD-DB-01 to production?
    why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: PROD-DB-01.'
  hints:
  - Which backup or rebuild image is known-good for PROD-DB-01, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore PROD-DB-01 from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
