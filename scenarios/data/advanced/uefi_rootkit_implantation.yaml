phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: The UEFI rootkit on PROD-DB-01 provides OS-level persistence that survives disk replacement. The rootkit hooks Boot Services to intercept I/O, has a DXE driver that loads before the OS, and operates a covert network channel below the OS network stack. The customer database (2.3M records) is actively being accessed. Standard containment (reboot, re-image) will not remove the rootkit.
  prompt: What is your first containment action?
  guidance:
    what: Establish what fired on PROD-DB-01, which accounts are involved, and how urgent the signal is.
    action: What is your first containment action?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: PROD-DB-01.'
  hints:
  - Stops the active exfiltration but destroys volatile memory evidence.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - isolate prod-db-01
  - prod-db-01 network
  - network switch
  - switch level
  - level vlan
  - vlan quarantine
  - quarantine capture
  - capture full
  reference_answer: |-
    Isolate PROD-DB-01 at the network switch level (VLAN quarantine), capture full memory and firmware dumps for forensics, activate the disaster recovery database replica, and begin monitoring all network traffic from the isolated host for covert channels

    Why: Network isolation at the switch level is most effective for UEFI rootkits that operate below the OS network stack. DR replica maintains service. Traffic monitoring captures the covert channel behavior.
  followup_good: 'Firmware analysis reveals: (1) bootx64.efi was modified with a 12 KB patch that hooks EFI_BOOT_SERVICES.Protect(), (2) winload_debug.efi is a full UEFI application that loads a modified Windows bootloader with a rootkit driver (winload_debug.sys), (3) the DXE driver (amdkmpfd.efi masquerading as an AMD driver) installs hooks in the UEFI block I/O protocol, (4) Secure Boot was bypassed by exploiting a DBX revocation list gap in the vendor''s firmware update process, (5) the rootkit communicates via a covert channel using SMBus (I2C) to an external hardware device connected to the server''s management port.'
  followup_weak: |-
    Network isolation at the switch level is most effective for UEFI rootkits that operate below the OS network stack.

    Firmware analysis reveals: (1) bootx64.efi was modified with a 12 KB patch that hooks EFI_BOOT_SERVICES.Protect(), (2) winload_debug.efi is a full UEFI application that loads a modified Windows bootloader with a rootkit driver (winload_debug.sys), (3) the DXE driver (amdkmpfd.efi masquerading as an AMD driver) installs hooks in the UEFI block I/O protocol, (4) Secure Boot was bypassed by exploiting a DBX revocation list gap in the vendor's firmware update process, (5) the rootkit communicates via a covert channel using SMBus (I2C) to an external hardware device connected to the server's management port.
  next: firmware_forensic_analysis_phase_2
  mitre_tactic: Persistence
  mitre_technique: 'T1542.001 System Firmware: UEFI'
- id: firmware_forensic_analysis_phase_2
  phase_type: analysis
  title: Firmware Forensic Analysis — Phase 2
  situation: 'Firmware analysis reveals: (1) bootx64.efi was modified with a 12 KB patch that hooks EFI_BOOT_SERVICES.Protect(), (2) winload_debug.efi is a full UEFI application that loads a modified Windows bootloader with a rootkit driver (winload_debug.sys), (3) the DXE driver (amdkmpfd.efi masquerading as an AMD driver) installs hooks in the UEFI block I/O protocol, (4) Secure Boot was bypassed by exploiting a DBX revocation list gap in the vendor''s firmware update process, (5) the rootkit communicates via a covert channel using SMBus (I2C) to an external hardware device connected to the server''s management port.'
  prompt: How do you fully characterize the rootkit's capabilities?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on PROD-DB-01.
    action: How do you fully characterize the rootkit's capabilities?
    why: Acting on an unverified scope either misses the attacker or over-contains the business.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Firmware Forensic Analysis — Phase 2. Asset in scope: PROD-DB-01.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - disassemble dxe
  - dxe driver
  - driver bootkit
  - bootkit code
  - code document
  - document boot
  - boot services
  - services hooks
  reference_answer: |-
    Disassemble the DXE driver and bootkit code, document all Boot Services hooks, identify the SMBus covert channel protocol, extract the rootkit's detection evasion techniques, and build firmware-specific detection signatures

    Why: Full firmware reverse engineering reveals all persistence mechanisms, the covert channel protocol, and enables building detection tools for other potentially compromised systems.
  followup_good: The UEFI rootkit on PROD-DB-01 was delivered through a compromised firmware update utility. The same utility was used on 12 other production servers. SMBus covert channel analysis reveals the external hardware device is a custom PCB attached to the management port — this is a hardware implant. The database access logs show the rootkit's OS-level driver has been copying customer records to a staging area in unallocated disk space, which the SMBus channel exfiltrates.
  followup_weak: |-
    Full firmware reverse engineering reveals all persistence mechanisms, the covert channel protocol, and enables building detection tools for other potentially compromised systems.

    The UEFI rootkit on PROD-DB-01 was delivered through a compromised firmware update utility. The same utility was used on 12 other production servers. SMBus covert channel analysis reveals the external hardware device is a custom PCB attached to the management port — this is a hardware implant. The database access logs show the rootkit's OS-level driver has been copying customer records to a staging area in unallocated disk space, which the SMBus channel exfiltrates.
