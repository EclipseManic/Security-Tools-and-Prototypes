- id: scope_lateral_assessment_phase_3
  phase_type: containment
  title: Scope & Lateral Assessment — Phase 3
  situation: The UEFI rootkit on PROD-DB-01 was delivered through a compromised firmware update utility. The same utility was used on 12 other production servers. SMBus covert channel analysis reveals the external hardware device is a custom PCB attached to the management port — this is a hardware implant. The database access logs show the rootkit's OS-level driver has been copying customer records to a staging area in unallocated disk space, which the SMBus channel exfiltrates.
  prompt: How do you determine if other servers are compromised?
  guidance:
    what: 'Balance speed against disruption: what must be isolated now, and what can wait for scoping?'
    action: How do you determine if other servers are compromised?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Scope & Lateral Assessment — Phase 3. Asset in scope: PROD-DB-01.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - deploy firmware
  - firmware integrity
  - integrity scanning
  - scanning agents
  - agents servers
  - servers compromised
  - compromised update
  - update utility
  reference_answer: |-
    Deploy firmware integrity scanning agents to all 12 servers that used the compromised update utility, check for SMBus covert channel hardware devices on all servers, and compare ESP hashes against known-good baselines

    Why: Firmware integrity scanning detects the ESP modification. Physical inspection finds hardware implants. Hash comparison confirms compromise.
  followup_good: Firmware scanning confirms 3 additional servers have matching ESP modifications. All 4 compromised servers have SMBus hardware implants. The rootkit was active for 3 months, accessing the customer database of 2.3M records. Eradication requires flashing clean UEFI firmware, removing the hardware implants, and rebuilding the servers from verified media.
  followup_weak: |-
    Firmware integrity scanning detects the ESP modification.

    Firmware scanning confirms 3 additional servers have matching ESP modifications. All 4 compromised servers have SMBus hardware implants. The rootkit was active for 3 months, accessing the customer database of 2.3M records. Eradication requires flashing clean UEFI firmware, removing the hardware implants, and rebuilding the servers from verified media.
