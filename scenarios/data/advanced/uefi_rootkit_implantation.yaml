- id: long_term_firmware_security_phase_5
  phase_type: lessons
  title: Long-Term Firmware Security — Phase 5
  situation: 'Eradication is complete. The incident exposed critical gaps: no firmware integrity monitoring was in place before the assessment, firmware update utilities were not validated, Secure Boot was not properly configured with DBX revocation lists, and server management ports had no physical access controls. The UEFI rootkit was one of the most sophisticated persistence mechanisms ever encountered.'
  prompt: What long-term firmware security measures do you implement?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What long-term firmware security measures do you implement?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Long-Term Firmware Security — Phase 5. Asset in scope: PROD-DB-01.'
  hints:
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - deploy continuous
  - continuous firmware
  - firmware integrity
  - integrity monitoring
  - monitoring tpm-based
  - tpm-based measured
  - measured boot
  - boot remote
  reference_answer: |-
    Deploy continuous firmware integrity monitoring (TPM-based measured boot + remote attestation), implement firmware bill-of-materials tracking, enforce cryptographic verification of all firmware updates, install physical port locks on management interfaces, enable Secure Boot with strict DBX policies, and establish a firmware incident response playbook

    Why: TPM measured boot detects pre-OS tampering. Firmware BOM tracking ensures supply chain integrity. Physical port locks prevent hardware implant installation. DBX policies close Secure Boot bypasses.
