  phase_type: lessons
  title: Side-Channel Detection & Monitoring — Phase 5
  situation: Hardening measures are in place. However, the organization needs ongoing detection capability for side-channel attacks. The cache timing attack was only detected because of an unusually aggressive monitoring configuration. Other customers may attempt similar attacks. The cloud platform needs to provide side-channel resistance as a service-level guarantee.
