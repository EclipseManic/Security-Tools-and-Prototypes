phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: A side-channel attack is actively extracting cryptographic keys from a co-located VM via CPU cache timing. The attacker's VM (compute-analyst-039) shares the same physical CPU socket as the victim (prod-db-primary). The attack uses L3 cache monitoring via RDTSC timing instructions. The attacker has already extracted the AES-256 database key and RSA-2048 TLS key. Standard network isolation does not stop a CPU side-channel attack.
  prompt: What is your first containment action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on compute-analyst-039, its severity, and the affected accounts.'
    action: What is your first containment action?
    why: Rapid scoping decides everything downstream — triage is where containment starts.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: compute-analyst-039.'
  hints:
  - Stops the attack but may destroy forensic evidence in the attacker's VM.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - live-migrate compute-analyst-039
  - compute-analyst-039 physically
  - physically different
  - different cpu
  - cpu socket
  - socket different
  - different numa
  - numa node
  reference_answer: |-
    Live-migrate compute-analyst-039 to a physically different CPU socket (different NUMA node), disable hyperthreading on the socket hosting prod-db-primary, and enable cache partitioning (Intel CAT/AMD QoS) to prevent cross-VM cache contention

    Why: Live migration moves the attacker to a different physical CPU, immediately stopping the cache timing attack. Disabling hyperthreading eliminates the SMT side-channel. Cache partitioning prevents future cross-VM cache contention.
  followup_good: 'The attacker''s VM has been live-migrated. Forensic analysis of compute-analyst-039 reveals: (1) a custom side-channel framework called ''CacheWarp'' compiled from open-source research tools, (2) the framework implements Flush+Reload, Prime+Probe, and Evict+Time attacks targeting the AES T-table implementation, (3) the attacker used RDTSCP with calibration routines to achieve sub-nanosecond timing resolution, (4) the framework includes a key scheduler that correlates cache access patterns with AES key schedule operations to recover round keys, (5) extracted keys were exfiltrated via a covert DNS channel to keyval[.]xyz.'
  followup_weak: |-
    Live migration moves the attacker to a different physical CPU, immediately stopping the cache timing attack.

    The attacker's VM has been live-migrated. Forensic analysis of compute-analyst-039 reveals: (1) a custom side-channel framework called 'CacheWarp' compiled from open-source research tools, (2) the framework implements Flush+Reload, Prime+Probe, and Evict+Time attacks targeting the AES T-table implementation, (3) the attacker used RDTSCP with calibration routines to achieve sub-nanosecond timing resolution, (4) the framework includes a key scheduler that correlates cache access patterns with AES key schedule operations to recover round keys, (5) extracted keys were exfiltrated via a covert DNS channel to keyval[.]xyz.
