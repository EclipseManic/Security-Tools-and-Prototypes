  guidance:
    what: Summarize what happened, what was missed, and which controls failed on compute-analyst-039.
    action: What detection and monitoring measures do you deploy?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Side-Channel Detection & Monitoring — Phase 5. Asset in scope: compute-analyst-039.'
  hints:
  - Attackers can evade cache miss rate monitoring while still using other timing channels.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - deploy continuous
  - continuous cache
  - cache miss
  - miss rate
  - rate monitoring
  - monitoring per
  - per implement
  - implement rdtsc
  reference_answer: |-
    Deploy continuous L3 cache miss rate monitoring per VM, implement RDTSC/RDTSCP instruction frequency analysis in the hypervisor, add PMU (Performance Monitoring Unit) based detection for cache line eviction patterns, establish baseline cache behavior profiles per workload type, and create automated alerts for cache contention anomalies exceeding threshold

    Why: Multi-layered detection (cache miss rates + RDTSC frequency + PMU analysis) catches various side-channel attack variants. Behavioral baselines reduce false positives.
