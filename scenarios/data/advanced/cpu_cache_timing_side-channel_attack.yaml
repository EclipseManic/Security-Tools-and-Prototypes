briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Cache Timing Attack — Cross-VM Data Extraction in Cloud Environment. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Cache Timing Attack — Cross-VM Data Extraction in Cloud Environment. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Cache Timing Attack — Cross-VM Data Extraction in Cloud Environment. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Cache Timing Attack — Cross-VM Data Extraction in Cloud Environment incident. The cloud security team detected anomalous CPU cache behavior on hypervisor node HV-NODE-47 in the production cloud cluster. The monitoring system flagged excessive L3 cache contention from VM instance ''compute-analyst-039'' (customer: Meridian Corp). Forensic investigation reveals that compute-analyst-039 is co-located on the same physical CPU socket as VM ''prod-db-primary'' (customer: Solaris Financial). The attacker in compute-analyst-039 deployed a prime+probe side-channel attack that monitors L3 cache set access patterns to extract cryptographic keys from prod-db-primary. The attack uses Flush+Reload on shared memory pages and monitors memory access timing via the RDTSC instruction to infer cache line accesses. Over 72 hours, the attacker successfully extracted: (1) an AES-256 encryption key used for database encryption, (2) RSA-2048 private key used for TLS connections,
  (3) session tokens from the database connection pool. The attacker used the extracted keys to decrypt production database traffic and access Solaris Financial''s customer records (4.7M accounts). Business impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
