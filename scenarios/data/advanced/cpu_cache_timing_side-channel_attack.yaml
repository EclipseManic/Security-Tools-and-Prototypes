- id: side_channel_analysis_phase_2
  phase_type: analysis
  title: Side-Channel Analysis — Phase 2
  situation: 'The attacker''s VM has been live-migrated. Forensic analysis of compute-analyst-039 reveals: (1) a custom side-channel framework called ''CacheWarp'' compiled from open-source research tools, (2) the framework implements Flush+Reload, Prime+Probe, and Evict+Time attacks targeting the AES T-table implementation, (3) the attacker used RDTSCP with calibration routines to achieve sub-nanosecond timing resolution, (4) the framework includes a key scheduler that correlates cache access patterns with AES key schedule operations to recover round keys, (5) extracted keys were exfiltrated via a covert DNS channel to keyval[.]xyz.'
  prompt: How do you fully characterize the side-channel attack?
  guidance:
    what: Test the initial theory against telemetry from compute-analyst-039 before committing to a response.
    action: How do you fully characterize the side-channel attack?
    why: The quality of the recovery depends on how well the investigation proves what happened.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Side-Channel Analysis — Phase 2. Asset in scope: compute-analyst-039.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - reverse-engineer cachewarp
  - cachewarp framework
  - framework document
  - document attack
  - attack vectors
  - vectors analyze
  - analyze key
  - key extraction
  reference_answer: |-
    Reverse-engineer the CacheWarp framework to document all attack vectors, analyze the key extraction methodology, build detection signatures for RDTSC abuse patterns, and identify which AES implementation was targeted (T-table vs. AES-NI)

    Why: Understanding the exact attack methodology enables detection and mitigation. Identifying whether AES-NI was available determines if the attack targeted a software implementation weakness.
  followup_good: 'The extracted AES-256 key was used to decrypt database backups stored on disk. Analysis of access logs shows the attacker decrypted and accessed database snapshots from the past 30 days (7 daily snapshots). The RSA-2048 key was used to decrypt TLS traffic captured via a packet capture tool on the hypervisor''s mirror port. Total compromised data: 4.7M customer accounts including names, SSNs, account numbers, and transaction history. The attacker is Solaris Financial''s competitor using the cloud platform to conduct corporate espionage.'
  followup_weak: |-
    Understanding the exact attack methodology enables detection and mitigation.

