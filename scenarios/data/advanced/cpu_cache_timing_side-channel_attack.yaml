- id: hypervisor_security_hardening_phase_4
  phase_type: eradication
  title: Hypervisor Security Hardening — Phase 4
  situation: The attack exploited shared CPU cache between co-located VMs. The hypervisor had no cache partitioning enabled, hyperthreading was active, and VM placement did not consider security domain separation. The attacker chose their VM placement by requesting specific compute availability zones. Other customers' VMs may be at risk from similar side-channel attacks if they share CPU sockets.
  prompt: What hypervisor hardening measures do you implement?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: What hypervisor hardening measures do you implement?
    why: The incident is not over until the attacker's footholds are gone.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Hypervisor Security Hardening — Phase 4. Asset in scope: compute-analyst-039.'
  hints:
  - Eliminates side-channel risk but is economically infeasible for most cloud workloads.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - intel cache
  - cache allocation
  - allocation technology
  - technology cat
  - cat amd
  - amd qos
  - qos cache
  - cache partitioning
  reference_answer: |-
    Enable Intel Cache Allocation Technology (CAT) or AMD QoS for L3 cache partitioning across all nodes, disable hyperthreading for security-sensitive workloads, implement NUMA-aware VM placement policies that separate security domains, deploy RDTSC instruction monitoring in the hypervisor, and add side-channel resistance to the VM scheduling algorithm

    Why: Cache partitioning prevents cross-VM cache contention. HT disabled eliminates SMT side-channels. NUMA-aware placement separates security domains. RDTSC monitoring detects timing attacks.
  followup_good: Hardening measures are in place. However, the organization needs ongoing detection capability for side-channel attacks. The cache timing attack was only detected because of an unusually aggressive monitoring configuration. Other customers may attempt similar attacks. The cloud platform needs to provide side-channel resistance as a service-level guarantee.
  followup_weak: |-
    Cache partitioning prevents cross-VM cache contention.

    Hardening measures are in place. However, the organization needs ongoing detection capability for side-channel attacks. The cache timing attack was only detected because of an unusually aggressive monitoring configuration. Other customers may attempt similar attacks. The cloud platform needs to provide side-channel resistance as a service-level guarantee.
