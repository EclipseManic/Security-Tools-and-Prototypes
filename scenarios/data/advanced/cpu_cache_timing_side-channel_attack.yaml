  summary: 'The cloud security team detected anomalous CPU cache behavior on hypervisor node HV-NODE-47 in the production cloud cluster. The monitoring system flagged excessive L3 cache contention from VM instance ''compute-analyst-039'' (customer: Meridian Corp). Forensic investigation reveals that compute-analyst-039 is co-located on the same physical CPU socket as VM ''prod-db-primary'' (customer: Solaris Financial). The attacker in compute-analyst-039 deployed a prime+probe side-channel attack that monitors L3 cache set access patterns to extract cryptographic keys from prod-db-primary. The attack uses Flush+Reload on shared memory pages and monitors memory access timing via the RDTSC instruction to infer cache line accesses. Over 72 hours, the attacker successfully extracted: (1) an AES-256 encryption key used for database encryption, (2) RSA-2048 private key used for TLS connections, (3) session tokens from the database connection pool. The attacker used the extracted keys to decrypt
    production database traffic and access Solaris Financial''s customer records (4.7M accounts).'
