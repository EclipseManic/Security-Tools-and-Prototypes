- id: key_compromise_data_breach_assessment_phase_3
  phase_type: containment
  title: Key Compromise & Data Breach Assessment — Phase 3
  situation: 'The extracted AES-256 key was used to decrypt database backups stored on disk. Analysis of access logs shows the attacker decrypted and accessed database snapshots from the past 30 days (7 daily snapshots). The RSA-2048 key was used to decrypt TLS traffic captured via a packet capture tool on the hypervisor''s mirror port. Total compromised data: 4.7M customer accounts including names, SSNs, account numbers, and transaction history. The attacker is Solaris Financial''s competitor using the cloud platform to conduct corporate espionage.'
  prompt: How do you assess and respond to the data breach?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you assess and respond to the data breach?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Key Compromise & Data Breach Assessment — Phase 3. Asset in scope: compute-analyst-039.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - encryption keys
  - keys aes
  - aes database
  - database keys
  - keys rsa
  - rsa tls
  - tls keys
  - keys revoke
  reference_answer: |-
    Rotate all encryption keys (AES database keys, RSA TLS keys), revoke and reissue all TLS certificates, re-encrypt database backups with new keys, notify Solaris Financial of the breach, engage legal counsel for competitor espionage, and file breach notifications per regulatory requirements

    Why: Complete key rotation prevents further decryption of historical data. Re-encryption of backups ensures past snapshots are protected. Legal and regulatory steps address the corporate espionage aspect.
  followup_good: The attack exploited shared CPU cache between co-located VMs. The hypervisor had no cache partitioning enabled, hyperthreading was active, and VM placement did not consider security domain separation. The attacker chose their VM placement by requesting specific compute availability zones. Other customers' VMs may be at risk from similar side-channel attacks if they share CPU sockets.
  followup_weak: |-
    Complete key rotation prevents further decryption of historical data.

    The attack exploited shared CPU cache between co-located VMs. The hypervisor had no cache partitioning enabled, hyperthreading was active, and VM placement did not consider security domain separation. The attacker chose their VM placement by requesting specific compute availability zones. Other customers' VMs may be at risk from similar side-channel attacks if they share CPU sockets.
