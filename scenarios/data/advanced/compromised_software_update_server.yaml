phases:
- id: immediate_containment_phase_1
  phase_type: triage
  title: Immediate Containment — Phase 1
  situation: 234 workstations are running a trojanized binary with active reverse shell connections. The attacker has been inside for 72 hours and has AD knowledge. The software distribution server is the source of the compromised update. 486 additional workstations have NOT yet received the update but may receive it in the next maintenance cycle.
  prompt: What is your FIRST containment action?
  guidance:
    what: 'Frame the decision for ''Immediate Containment — Phase 1'': the asset at risk, the evidence available, and the time pressure.'
    action: What is your FIRST containment action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Immediate Containment — Phase 1. Asset in scope: Software Distribution Server 10.10.1.50.'
  hints:
  - Stops the source but EDR kill commands can't be pushed if the server is offline.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - immediately isolate
  - isolate software
  - software distribution
  - distribution server
  - server network
  - network push
  - edr kill
  - command terminate
  reference_answer: |-
    Immediately isolate the software distribution server from the network, push an EDR kill command to terminate update_helper.exe on all 234 affected workstations, block all C2 IP addresses at the perimeter firewall, and disable the compromised admin account

    Why: Multi-targeted containment: server isolation stops the source, EDR kill stops active C2, firewall blocks communication, and account disablement prevents attacker re-entry.
  followup_good: The software distribution server is isolated. EDR kill commands have been sent. The attacker's 72-hour access window needs to be investigated. The compromised update binary is signed with the company's legitimate certificate which may also be compromised. The attacker performed AD enumeration and accessed source code. Need to preserve evidence from the server, endpoints, and network.
  followup_weak: |-
    Multi-targeted containment: server isolation stops the source, EDR kill stops active C2, firewall blocks communication, and account disablement prevents attacker re-entry.

    The software distribution server is isolated. EDR kill commands have been sent. The attacker's 72-hour access window needs to be investigated. The compromised update binary is signed with the company's legitimate certificate which may also be compromised. The attacker performed AD enumeration and accessed source code. Need to preserve evidence from the server, endpoints, and network.
