- id: scope_assessment_phase_3
  phase_type: eradication
  title: Scope Assessment — Phase 3
  situation: 'Server forensics reveal: the attacker used the stolen VPN credential to access the server, replaced 3 update packages (not just one), and added a persistence mechanism via a modified scheduled task. The attacker enumerated 45 AD groups and downloaded 847 files from the source code repository. The code-signing certificate''s private key was exported from the server''s certificate store. The attacker may have signed additional malicious binaries. 486 workstations that haven''t received the update may have other compromised packages queued.'
  prompt: How do you determine the full scope of the supply chain compromise?
  guidance:
    what: Decide what must be rebuilt or rotated rather than merely cleaned.
    action: How do you determine the full scope of the supply chain compromise?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Scope Assessment — Phase 3. Asset in scope: Software Distribution Server 10.10.1.50.'
  hints:
  - They haven't received the update yet but may have it queued.
  - Rotate or reset any credentials the attacker may have touched.
  ideal_concepts:
  - audit replaced
  - replaced update
  - update packages
  - packages additional
  - additional payloads
  - payloads scan
  - scan non-affected
  - non-affected workstations
  reference_answer: |-
    Audit all 3 replaced update packages for additional payloads, scan all 486 non-affected workstations for queued malicious updates, enumerate all systems that used the code-signing certificate in the past 72 hours, check if the certificate private key was used to sign other binaries, and assess source code exposure for intellectual property theft

    Why: Full scope: additional packages (3 total), pending updates (486 workstations), certificate abuse (signing detection), key compromise (other signed binaries), and IP theft (source code).
  followup_good: 'Full investigation reveals: 3 update packages were trojanized (total 312 affected endpoints), the code-signing certificate was used to sign 7 additional malicious binaries deployed to 15 high-value targets, 847 source code files were exfiltrated (including unreleased product source), and the attacker established persistence on 4 domain controllers. The stolen VPN credential was from a sysadmin who reused their password across personal and work accounts.'
  followup_weak: |-
    Full scope: additional packages (3 total), pending updates (486 workstations), certificate abuse (signing detection), key compromise (other signed binaries), and IP theft (source code).

    Full investigation reveals: 3 update packages were trojanized (total 312 affected endpoints), the code-signing certificate was used to sign 7 additional malicious binaries deployed to 15 high-value targets, 847 source code files were exfiltrated (including unreleased product source), and the attacker established persistence on 4 domain controllers. The stolen VPN credential was from a sysadmin who reused their password across personal and work accounts.
