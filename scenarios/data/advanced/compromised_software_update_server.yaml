- id: eradication_supply_chain_hardening_phase_4
  phase_type: lessons
  title: Eradication & Supply Chain Hardening — Phase 4
  situation: 'Full investigation reveals: 3 update packages were trojanized (total 312 affected endpoints), the code-signing certificate was used to sign 7 additional malicious binaries deployed to 15 high-value targets, 847 source code files were exfiltrated (including unreleased product source), and the attacker established persistence on 4 domain controllers. The stolen VPN credential was from a sysadmin who reused their password across personal and work accounts.'
  prompt: What comprehensive supply chain security improvements do you implement?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What comprehensive supply chain security improvements do you implement?
    why: The post-incident review is what turns an incident into a defense.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Eradication & Supply Chain Hardening — Phase 4. Asset in scope: Software Distribution Server 10.10.1.50.'
  hints:
  - 'Addresses specific compromise but not the systemic issues: no update verification, no PAM, no MFA, no segmentation.'
  - One layer but doesn't address update integrity, certificate security, or network segmentation needed for supply chain security.
  ideal_concepts:
  - revoke reissue
  - reissue code-signing
  - code-signing certificate
  - certificate implement
  - implement hardware
  - hardware security
  - security module
  - module hsm
  reference_answer: |-
    Revoke and reissue the code-signing certificate, implement hardware security module (HSM) for certificate storage, deploy update package integrity verification (hash + signature), implement privileged access management (PAM) for all admin accounts, enable MFA for all administrative access, deploy network segmentation for software distribution infrastructure, and establish a software supply chain security program with SBOM requirements

    Why: Defense-in-depth: certificate security (HSM), update integrity (verification), access control (PAM, MFA), network segmentation, and supply chain program (SBOM, vendor management).
