- id: evidence_preservation_phase_2
  phase_type: analysis
  title: Evidence Preservation — Phase 2
  situation: The software distribution server is isolated. EDR kill commands have been sent. The attacker's 72-hour access window needs to be investigated. The compromised update binary is signed with the company's legitimate certificate which may also be compromised. The attacker performed AD enumeration and accessed source code. Need to preserve evidence from the server, endpoints, and network.
  prompt: How do you preserve evidence across the supply chain attack?
  guidance:
    what: Determine what the evidence says about scope, access, and privilege on Software Distribution Server 10.10.1.50.
    action: How do you preserve evidence across the supply chain attack?
    why: Evidence drives decisions — confirm the attacker's reach before acting.
  hint: 'Ask which evidence source would prove or disprove the attacker''s reach before you act on assumptions. Focus: Evidence Preservation — Phase 2. Asset in scope: Software Distribution Server 10.10.1.50.'
  hints:
  - Cross-reference findings with identity and privilege context.
  ideal_concepts:
  - image software
  - software distribution
  - distribution server
  - server disk
  - disk pull
  - edr telemetry
  - telemetry endpoints
  - endpoints hour
  reference_answer: |-
    Image the software distribution server's disk, pull EDR telemetry from all 234 endpoints for the 72-hour window, export network flow data for C2 communications, preserve the signed binary for certificate analysis, and dump AD logs for enumeration activity

    Why: Comprehensive evidence: server forensics (attack source), endpoint telemetry (scope), network data (C2 protocols), certificate analysis (key compromise), and AD logs (discovery activity).
  followup_good: 'Server forensics reveal: the attacker used the stolen VPN credential to access the server, replaced 3 update packages (not just one), and added a persistence mechanism via a modified scheduled task. The attacker enumerated 45 AD groups and downloaded 847 files from the source code repository. The code-signing certificate''s private key was exported from the server''s certificate store. The attacker may have signed additional malicious binaries. 486 workstations that haven''t received the update may have other compromised packages queued.'
  followup_weak: |-
    Comprehensive evidence: server forensics (attack source), endpoint telemetry (scope), network data (C2 protocols), certificate analysis (key compromise), and AD logs (discovery activity).

    Server forensics reveal: the attacker used the stolen VPN credential to access the server, replaced 3 update packages (not just one), and added a persistence mechanism via a modified scheduled task. The attacker enumerated 45 AD groups and downloaded 847 files from the source code repository. The code-signing certificate's private key was exported from the server's certificate store. The attacker may have signed additional malicious binaries. 486 workstations that haven't received the update may have other compromised packages queued.
