briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Compromised Software Update Server — Supply Chain Injection. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Compromised Software Update Server — Supply Chain Injection. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Compromised Software Update Server — Supply Chain Injection. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: 'Executive summary of the Compromised Software Update Server — Supply Chain Injection incident. At 08:15 UTC, the endpoint detection and response (EDR) platform triggered an alert on 234 workstations simultaneously: a signed binary ''update_helper.exe'' from the company''s internal software distribution server (10.10.1.50) was detected executing a reverse shell payload. The binary was signed with the company''s legitimate code-signing certificate. Investigation revealed that the software distribution server was compromised 72 hours ago through a stolen VPN credential belonging to a system administrator. The attacker replaced the legitimate update package with a trojanized version that included a C2 callback mechanism. The compromised update was pushed to all 234 workstations during the nightly maintenance window. The attacker has been inside the network for 72 hours through the reverse shell connections. Network forensics show the attacker has performed Active Directory
  enumeration, accessed a file share containing source code, and established persistence via a scheduled task. The company has 800 total endpoints. Business impact: a sophisticated adversary may retain persistent access, so full-scope hunting and third-party notification may be required. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel and threat-intel leads should assess notification duties and law-enforcement engagement.'
