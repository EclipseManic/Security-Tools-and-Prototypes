phases:
- id: volumetric_attack_mitigation
  phase_type: triage
  title: Phase 1 — Volumetric Attack Mitigation
  situation: At 13:22 UTC, the SYN flood begins at 4.2M packets/second. The Cogent edge router (ASR 1001) connection table is at 87% capacity. Cloudflare is in proxy mode but the cache-busting query parameters on the API endpoint bypass the CDN. The application layer flood is hitting your origin directly. You have 5-10 minutes before the connection table fills completely and all connections drop.
  prompt: What is your immediate mitigation action?
  guidance:
    what: 'Separate signal from noise: confirm the alert on Internet edge link, its severity, and the affected accounts.'
    action: What is your immediate mitigation action?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phase 1 — Volumetric Attack Mitigation. Asset in scope: Internet edge link.'
  hints:
  - Adding servers does not help when the attack is overwhelming network and database resources.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - two-pronged immediate
  - immediate response
  - response cogent
  - cogent edge
  - edge router
  - router apply
  - apply syn
  - syn rate-limit
  reference_answer: |-
    Two-pronged immediate response: (1) On the Cogent edge router, apply a SYN rate-limit policer: 'police rate 1m burst 10k' on the inbound interface to cap SYN packets. (2) Enable SYN cookies on the web cluster load balancer (F5 BIG-IP). (3) Activate Cloudflare's Under Attack mode on the /api/v2/products path, which forces JS challenge. (4) Contact Cogent NOC to request upstream scrubbing (BGP Flowspec or blackhole the worst /24 ranges).

    Why: Rate limiting SYN packets at the edge prevents connection table exhaustion. SYN cookies eliminate the state maintenance for half-open connections. Cloudflare Under Attack mode adds JS challenges that bots cannot pass. Upstream scrubbing from Cogent filters attack traffic before it reaches your network.
  followup_good: The SYN flood is partially mitigated by Cogent scrubbing (dropped to 800K pps). However, the HTTP GET flood on /api/v2/products is still at 180K req/sec. Cloudflare cache hit ratio remains at 11% because the attacker appends random query strings (?v=8x7k2m9...). The PostgreSQL primary CPU is at 98%, and the connection pool (max 200) is exhausted. web-04 and web-05 are still down. API response times are 14.2 seconds. The e-commerce checkout page depends on /api/v2/products for product data.
  followup_weak: |-
    Rate limiting SYN packets at the edge prevents connection table exhaustion.

