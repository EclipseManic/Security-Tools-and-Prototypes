briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Multi-Vector DDoS — SYN Flood + HTTP GET/POST Flood on Web Infrastructure. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Multi-Vector DDoS — SYN Flood + HTTP GET/POST Flood on Web Infrastructure. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Multi-Vector DDoS — SYN Flood + HTTP GET/POST Flood on Web Infrastructure. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the Multi-Vector DDoS — SYN Flood + HTTP GET/POST Flood on Web Infrastructure incident. On 2025-07-14 at 13:22 UTC, the NOC dashboard (Grafana + NetFlow) showed a sudden traffic spike from 2.4 Gbps to 34.7 Gbps on the internet edge link (Cogent, 100 Gbps). Packet analysis revealed two simultaneous attack vectors:

  1) Volumetric SYN flood: 4.2 million SYN packets/second targeting the public-facing web cluster (web-01 through web-06, VIP 198.51.100.10). Source IPs span 23,000 unique /24 ranges across 78 countries, indicating a large IoT botnet. SYN cookies are enabled but the connection table is filling (87% capacity at 13:28 UTC).

  2) Application layer HTTP GET flood: 180,000 requests/second to GET /api/v2/products (legitimate endpoint, 200 OK, ~45 KB response). The requests use randomized User-Agent strings and referrers, bypassing rate limiting. This endpoint hits the PostgreSQL primary database (10.10.10.50) with 3 queries per request.

  The combined attack caused: web-04 and web-05 to crash (OOM at 13:31 UTC), PostgreSQL CPU at 98%, API response time degraded from 120ms to 14.2 seconds, and the CDN (Cloudflare) cache hit ratio dropped from 94% to 11% due to cache-busting query parameters. Revenue impact: e-commerce checkout failures estimated at $47,000/minute. Business impact: network availability and traffic confidentiality are at risk, and perimeter and segmentation controls are under scrutiny. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess contractual and regulatory notification duties if traffic or data was exposed.
