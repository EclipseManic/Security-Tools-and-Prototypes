- id: application_layer_attack_mitigation
  phase_type: containment
  title: Phase 2 — Application Layer Attack Mitigation
  situation: The SYN flood is partially mitigated by Cogent scrubbing (dropped to 800K pps). However, the HTTP GET flood on /api/v2/products is still at 180K req/sec. Cloudflare cache hit ratio remains at 11% because the attacker appends random query strings (?v=8x7k2m9...). The PostgreSQL primary CPU is at 98%, and the connection pool (max 200) is exhausted. web-04 and web-05 are still down. API response times are 14.2 seconds. The e-commerce checkout page depends on /api/v2/products for product data.
  prompt: How do you mitigate the application layer attack?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: How do you mitigate the application layer attack?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Phase 2 — Application Layer Attack Mitigation. Asset in scope: Internet edge link.'
  hints:
  - Read replicas help with read scaling but the primary database is CPU-bound from the flood.
  - Consider the affected accounts and their privilege level.
  ideal_concepts:
  - layered application
  - application mitigation
  - mitigation big-ip
  - big-ip configure
  - configure irule
  - irule rate-limit
  - rate-limit api
  - api products
  reference_answer: |-
    Layered application mitigation: (1) At the F5 BIG-IP, configure an iRule to rate-limit /api/v2/products to 10K req/sec per source IP and drop requests with random query parameters (pattern: ?v=[a-z0-9]{6,10}), (2) At Cloudflare, enable 'Cache Everything' with cache key normalization that strips query parameters for this endpoint, (3) Add application-level caching (Redis) in front of PostgreSQL to serve cached product data, (4) Implement a circuit breaker pattern to fail-open cached product data when DB is overloaded, (5) Restart web-04 and web-05 with connection limits increased.

    Why: Rate limiting per source IP throttles bot traffic. Query parameter normalization restores CDN caching. Redis caching reduces database load. Circuit breaker prevents cascade failure. This combination addresses both the network and application layers of the attack.
  followup_good: 'The attack subsided at 15:47 UTC (2 hours 25 minutes duration). Peak metrics: 38.2 Gbps inbound, 180K HTTP req/sec, 4.2M SYN/sec. Financial impact: estimated $7.2M in lost revenue and SLA penalties. Your current infrastructure: Cloudflare Pro plan (no Enterprise DDoS protection), Cogent transit (no DDoS scrubbing service), F5 BIG-IP with basic rate limiting, no dedicated DDoS mitigation service. The CISO wants a resilience plan.'
  followup_weak: |-
    Rate limiting per source IP throttles bot traffic.

    The attack subsided at 15:47 UTC (2 hours 25 minutes duration). Peak metrics: 38.2 Gbps inbound, 180K HTTP req/sec, 4.2M SYN/sec. Financial impact: estimated $7.2M in lost revenue and SLA penalties. Your current infrastructure: Cloudflare Pro plan (no Enterprise DDoS protection), Cogent transit (no DDoS scrubbing service), F5 BIG-IP with basic rate limiting, no dedicated DDoS mitigation service. The CISO wants a resilience plan.
