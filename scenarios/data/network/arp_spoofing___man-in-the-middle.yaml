briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN incident. On 2025-10-21 at 14:23 UTC, the IDS (Suricata) on VLAN 30 (Finance, 10.10.30.0/24) triggered an 'ET ARP Spoofing' alert after detecting gratuitous ARP replies from MAC address aa:bb:cc:dd:ee:ff impersonating the default gateway (10.10.30.1, Cisco Catalyst 9300). The spoofed ARP replies were sent to 47 hosts on VLAN 30 over a 12-minute window.

  Simultaneously, network taps detected HTTP downgrade attacks: the attacker used sslstrip+ to redirect HTTPS requests for the payroll portal (payroll.acme.internal) to HTTP, capturing form submissions containing employee banking credentials. Wireshark PCAP analysis shows the attacker captured 23 POST requests to the payroll portal between 14:18 and 14:31 UTC, including plaintext banking routing numbers and account numbers.

  The spoofing host was traced to a Raspberry Pi 4 (hostname: raspi-unknown, 10.10.30.201) connected to switch port Gi1/0/23 on floor-switch-302. Physical security cameras show an unauthorized individual in the finance wing on Oct 21 at 14:05 UTC. The Pi was running Kali Linux with arpspoof and sslstrip+ installed. Business impact: network availability and traffic confidentiality are at risk, and perimeter and segmentation controls are under scrutiny. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess contractual and regulatory notification duties if traffic or data was exposed.
