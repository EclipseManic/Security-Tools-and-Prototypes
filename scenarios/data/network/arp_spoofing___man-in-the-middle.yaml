  reference_answer: |-
    Extract the 23 captured banking credentials, identify the affected employees by employee_id, notify them immediately to contact their banks and freeze accounts. Check if the cron job successfully uploaded any captures to the VPS before seizure. Block 45.33.32.156 at the perimeter. Initiate fraudulent transaction monitoring on all 23 accounts.

    Why: The 23 employees' banking credentials are at immediate risk of fraudulent use. Notification and account freezing must happen within hours. Checking whether data reached the VPS determines if external parties have the credentials. Transaction monitoring is essential even after notification.
