  reference_answer: |-
    Execute an emergency notification plan: (1) Contact all 23 employees by phone within 2 hours, (2) Each employee contacts their bank to freeze/check accounts, (3) File fraud alerts with all 3 credit bureaus for affected employees, (4) Engage legal for state breach notification filing (72-hour window), (5) Offer 24 months of credit monitoring through a vendor (IdentityForce or Experian), (6) Brief the CISO and board on the incident timeline and remediation steps.

    Why: Phone notification ensures immediate awareness since email may not be read quickly enough. Bank contact and credit freezes are the most effective fraud prevention. Legal filing within the state-mandated window avoids penalties. Credit monitoring is the standard remediation for financial data breaches.
