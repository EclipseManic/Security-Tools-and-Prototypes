- id: network_hardening_and_prevention
  phase_type: eradication
  title: Phase 3 — Network Hardening and Prevention
  situation: The CISO asks for a hardening plan to prevent recurrence. Your current VLAN 30 has no Dynamic ARP Inspection, no DHCP snooping, no 802.1X port authentication, and no NAC solution. Switch ports are in access mode with no port security limits. The finance portal (payroll.acme.internal) currently serves HTTP on port 80 with HTTPS on port 443 but does not enforce HSTS. What do you recommend?
  prompt: What security architecture changes do you propose?
  guidance:
    what: Find every foothold the attacker left on VLAN 30 gateway ARP cache, including persistence and stolen credentials.
    action: What security architecture changes do you propose?
    why: Credentials and entry paths must be removed, not just the malware that used them.
  hint: 'Look beyond the visible payload for persistence, stolen credentials, and the original entry path. Focus: Phase 3 — Network Hardening and Prevention. Asset in scope: VLAN 30 gateway ARP cache.'
  hints:
  - An inline NGFW adds latency and does not specifically prevent ARP spoofing at Layer 2.
  - ZTNA is a valid long-term strategy but does not prevent ARP-based MITM attacks on the local VLAN.
  ideal_concepts:
  - implement layered
  - layered defense
  - defense enable
  - dai finance
  - finance vlans
  - vlans arp
  - arp acls
  - acls gateway
  reference_answer: |-
    Implement a layered defense: (1) Enable DAI on all finance VLANs with ARP ACLs for the gateway, (2) Enable DHCP snooping to prevent rogue DHCP, (3) Deploy 802.1X with certificate-based authentication on all switch ports, (4) Enforce HSTS with long max-age on payroll.acme.internal, (5) Implement port security with MAC limiting (max 1 MAC per port), (6) Deploy a NAC solution (Cisco ISE or Aruba ClearPass) for device profiling.

    Why: Each layer addresses a specific attack vector: DAI stops ARP spoofing, DHCP snooping prevents rogue servers, 802.1X prevents unauthorized device connection, HSTS prevents SSL stripping, port security limits MAC flooding, and NAC provides device profiling and compliance enforcement.
  followup_good: 'Of the 23 captured credentials, forensic review of the payroll_captures_10-21.log shows: 8 employees had their checking account routing + account numbers captured, 7 had savings accounts, and 8 had both. The log also captured employee full names and email addresses from the form fields. The captured data was potentially accessible from the VPS (45.33.32.156) for up to 12 hours before you blocked it. Legal advises that state breach notification laws apply since financial account information was compromised.'
  followup_weak: |-
    Each layer addresses a specific attack vector: DAI stops ARP spoofing, DHCP snooping prevents rogue servers, 802.1X prevents unauthorized device connection, HSTS prevents SSL stripping, port security limits MAC flooding, and NAC provides device profiling and compliance enforcement.

