  title: Post-Incident Review & Hardening
  situation: Service has been restored and validated. Leadership wants a concise after-action review covering the root cause of ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN, the detection gap that let the attacker operate, and the control changes that will prevent a repeat. Findings must have owners and dates.
  prompt: What must change so an incident like ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN is detected earlier and cannot recur?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What must change so an incident like ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN is detected earlier and cannot recur?
    why: Without durable changes, the same root cause will produce the same incident again.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Post-Incident Review & Hardening. Asset in scope: VLAN 30 gateway ARP cache.'
  hints:
  - What was the earliest signal available, and why was it missed?
  - Which control would have stopped the attack chain the earliest?
  - Who owns each improvement, and when will it be verified?
  ideal_concepts:
  - root cause
  - detection gap
  - control improvement
  - owner and date
  - runbook update
  - training
  reference_answer: |-
    Document the root cause of ARP Cache Poisoning and SSL Stripping MITM on Finance VLAN, identify the detection gap that let the attacker operate, and assign owners and dates to concrete control changes. Update detections, runbooks, and training, track the actions to completion, and report the outcome to leadership.

    Why: Without durable changes, the same root cause will produce the same incident again.
  followup_good: The review names the root cause and detection gap, assigns owned and dated improvements, and ties them back to specific detections and controls. Leadership receives a tracked action plan.
  followup_weak: The review retells the timeline but leaves the root cause and detection gap vague. Without owners, dates, and verification, the same incident will recur.
