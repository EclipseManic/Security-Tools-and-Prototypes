phases:
- id: arp_anomaly_alert
  phase_type: triage
  title: Phase 1 — ARP Anomaly Alert
  situation: Suricata has fired 147 'ET ARP Spoofing Gratuitous ARP' alerts in the last 12 minutes from MAC aa:bb:cc:dd:ee:ff on VLAN 30. Your ARP table on the core switch shows the gateway IP 10.10.30.1 mapped to this unknown MAC. Port security on floor-switch-302 shows the MAC learned on Gi1/0/23, which is not in your switchport-to-device database. The finance team (12 users) reports intermittent website certificate warnings. What do you do first?
  prompt: What is your immediate response?
  guidance:
    what: Establish what fired on VLAN 30 gateway ARP cache, which accounts are involved, and how urgent the signal is.
    action: What is your immediate response?
    why: A wrong first read sends the whole response down the wrong path.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phase 1 — ARP Anomaly Alert. Asset in scope: VLAN 30 gateway ARP cache.'
  hints:
  - Flushing ARP caches is a temporary fix that does not address the root cause.
  - DAI is a valid hardening measure but does not stop the current attack.
  - Sending ARP corrections while the attacker is still poisoning will simply be overridden by the attacker's gratuitous ARP replies.
  ideal_concepts:
  - shut down
  - down switch
  - switch port
  - port gi1
  - gi1 immediately
  - immediately interface
  - interface gi1
  - gi1 shutdown
  reference_answer: |-
    Shut down switch port Gi1/0/23 immediately via 'interface Gi1/0/23; shutdown' on floor-switch-302 to cut the rogue device, then verify the ARP table returns to normal on all VLAN 30 hosts. Simultaneously pull PCAP from the network tap spanning VLAN 30 to determine what traffic was intercepted.

    Why: Physically disconnecting the rogue device is the fastest way to stop the active MITM attack. ARP poisoning persists in victim caches for minutes after the attacker stops, so the port shutdown should happen first, followed by verification. PCAP preservation is critical for determining data loss.
  followup_good: 'The Raspberry Pi (10.10.30.201) has been seized. Forensic analysis of the SD card reveals: (1) arpspoof was run targeting 10.10.30.1 as the gateway, (2) sslstrip+ was configured on port 8080, (3) a screen capture utility was recording all captured sessions to /var/log/captures/, (4) a file named payroll_captures_10-21.log contains 23 complete HTTP POST requests to payroll.acme.internal with fields: employee_id, routing_number, account_number, account_type, amount. The log shows the first capture at 14:18:07 and the last at 14:31:42. The Pi also had a cron job that would upload captures to 45.33.32.156 (Scanlines VPS) every 6 hours.'
  followup_weak: |-
    Physically disconnecting the rogue device is the fastest way to stop the active MITM attack.

    The Raspberry Pi (10.10.30.201) has been seized. Forensic analysis of the SD card reveals: (1) arpspoof was run targeting 10.10.30.1 as the gateway, (2) sslstrip+ was configured on port 8080, (3) a screen capture utility was recording all captured sessions to /var/log/captures/, (4) a file named payroll_captures_10-21.log contains 23 complete HTTP POST requests to payroll.acme.internal with fields: employee_id, routing_number, account_number, account_type, amount. The log shows the first capture at 14:18:07 and the last at 14:31:42. The Pi also had a cron job that would upload captures to 45.33.32.156 (Scanlines VPS) every 6 hours.
