- id: network_dhcp_security_architecture
  phase_type: lessons
  title: Phase 3 — Network DHCP Security Architecture
  situation: 'Post-incident audit reveals: (1) DHCP snooping is not enabled on any VLAN, (2) No dynamic ARP inspection is configured, (3) No IP source guard is deployed, (4) All switch ports are in access mode with no 802.1X, (5) The rogue device was able to connect to any port without authentication. The CISO wants a DHCP and network access security plan.'
  prompt: What network access security controls do you recommend?
  guidance:
    what: Identify the decisions that would have shortened the incident if they had been made earlier.
    action: What network access security controls do you recommend?
    why: Lessons are only real when they change a control, a detection, or a decision right.
  hint: 'Turn this incident into one detection improvement and one preventive control that outlast the report. Focus: Phase 3 — Network DHCP Security Architecture. Asset in scope: VLAN 25 DHCP scope.'
  hints:
  - NAC is part of the solution but must be complemented by DHCP snooping, DAI, and IP Source Guard for Layer 2 protection.
  - Update detection rules, playbooks, and training from this incident.
  ideal_concepts:
  - layer security
  - security architecture
  - architecture enable
  - dhcp snooping
  - snooping vlans
  - vlans trusted
  - trusted ports
  - ports mapped
  reference_answer: |-
    Layer 2 security architecture: (1) Enable DHCP snooping on ALL VLANs with trusted ports mapped to legitimate DHCP servers only, (2) Enable Dynamic ARP Inspection (DAI) using DHCP snooping bindings, (3) Enable IP Source Guard to prevent IP spoofing, (4) Deploy 802.1X port-based authentication with RADIUS (Cisco ISE), (5) Enable port security with sticky MAC (max 1 MAC per port), (6) Configure NAC for device profiling to detect IoT/rogue devices, (7) Implement network access control policies that quarantine unknown devices.

    Why: DHCP snooping blocks rogue DHCP at Layer 2. DAI uses snooping bindings to prevent ARP spoofing. IP Source Guard prevents IP impersonation. 802.1X prevents unauthorized device connection. Port security limits MAC addresses. NAC profiles devices. Together these create a comprehensive Layer 2 security architecture.
