id: rogue_dhcp_server___credential_theft_via_dns
name: Rogue DHCP Server — Credential Theft via DNS
category: Network
format_version: 2
difficulty: Medium
soc_tier: L1
roles:
- analyst
- incident_manager
- ciso
- executive
industries:
- all
briefings:
  analyst: You are the Tier-1 SOC analyst on shift. Your SIEM has fired an alert. Triage the scope, identify compromised assets, and take initial containment actions. Preserve evidence and escalate to the incident manager when the incident exceeds L1 scope.
  incident_manager: You are the Incident Manager coordinating the response to Rogue DHCP Server — DNS Hijacking and Credential Harvesting. Drive containment, evidence preservation, escalation, and cross-team communications; keep the war-room bridge aligned and document every major decision.
  ciso: You are the CISO accountable for Rogue DHCP Server — DNS Hijacking and Credential Harvesting. Weigh business impact, legal and regulatory notification duties, customer commitments, and the risk of disruptive containment.
  executive: You are the executive sponsor for Rogue DHCP Server — DNS Hijacking and Credential Harvesting. Focus on business continuity, budget and resource approval, customer and partner communications, and the timing of external disclosure.
executive_brief: |-
  Executive summary of the Rogue DHCP Server — DNS Hijacking and Credential Harvesting incident. On 2025-10-05 at 08:31 UTC, the network operations center received complaints from 14 users in the Marketing department (VLAN 25, 10.10.25.0/24) reporting that websites were loading slowly or displaying certificate warnings. The legitimate DHCP server (10.10.25.1, Cisco IOS DHCP on mktg-switch-251) was still responding, but a second DHCP server (10.10.25.254) was detected responding to DHCP OFFER messages faster (50ms vs 200ms).

  Analysis showed the rogue DHCP server was configured to hand out: IP addresses in the 10.10.25.200-230 range, a default gateway of 10.10.25.254 (the rogue device itself), and a DNS server of 10.10.25.254 (the rogue device running dnsmasq). The rogue DNS server intercepted all DNS queries and redirected outlook.office365.com to a phishing clone (hosted on the same device) that harvested O365 credentials via a realistic login portal. Between 08:15 and 08:31 UTC, 23 Marketing employees submitted their O365 credentials to the phishing portal.

  The rogue DHCP server was traced to a Raspberry Pi Zero 2W (MAC: bb:cc:dd:ee:ff:01) connected to switch port Gi1/0/19 on mktg-switch-251. Physical security found the device taped behind a desk in the Marketing bullpen. The device also ran a DHCP lease logging daemon that captured hostnames, MAC addresses, and requested hostnames of all 34 devices on VLAN 25. Business impact: network availability and traffic confidentiality are at risk, and perimeter and segmentation controls are under scrutiny. Immediate decisions: authorize containment that may interrupt service, preserve forensic evidence, and agree the external communication cadence with legal and communications. Regulatory exposure: counsel should assess contractual and regulatory notification duties if traffic or data was exposed.
