- id: phishing_portal_and_credential_impact
  phase_type: containment
  title: Phase 2 — Phishing Portal and Credential Impact
  situation: 'Forensic analysis of the Raspberry Pi Zero 2W reveals: (1) dnsmasq configured as DHCP + DNS server, (2) A Flask web server serving a cloned Outlook Web App login page (outlook.office365.com clone at 10.10.25.254:443), (3) A SQLite database (o365_creds.db) containing 23 captured O365 credentials with timestamps, source IPs, and user agents, (4) The captured credentials include 2 department managers and 1 Marketing VP (vp.marketing@acme.com), (5) The phishing portal was also capturing MFA TOTP codes via a real-time relay proxy to 198.51.100.88, (6) DHCP lease logs show the rogue device captured network topology for all 34 VLAN 25 hosts.'
  prompt: What credential remediation do you execute?
  guidance:
    what: Identify the smallest set of containment actions that removes the attacker's access.
    action: What credential remediation do you execute?
    why: Containment buys the time needed to investigate without letting the attacker expand.
  hint: 'Prioritize the move that limits blast radius without destroying the evidence you will need later. Focus: Phase 2 — Phishing Portal and Credential Impact. Asset in scope: VLAN 25 DHCP scope.'
  hints:
  - Consider the affected accounts and their privilege level.
  - Preserve evidence before disrupting anything.
  ideal_concepts:
  - comprehensive o365
  - o365 credential
  - credential response
  - response force
  - password reset
  - affected o365
  - o365 accounts
  - accounts azure
  reference_answer: |-
    Comprehensive O365 credential response: (1) Force password reset for all 23 affected O365 accounts via Azure AD admin, (2) Revoke all active sessions for these accounts ('Revoke Sessions' in Azure AD), (3) Enable Conditional Access policies requiring compliant device + MFA for all Marketing accounts, (4) Block 198.51.100.88 (TOTP relay) at the perimeter, (5) Audit O365 sign-in logs for unauthorized access using the 23 compromised accounts, (6) Notify the Marketing VP and department managers directly.

    Why: Password reset prevents continued access with captured credentials. Session revocation invalidates any active sessions the attacker may have established. The TOTP relay means MFA was also compromised — Conditional Access adds device compliance as an additional control. Sign-in audit determines if the attacker already accessed accounts.
  followup_good: 'Post-incident audit reveals: (1) DHCP snooping is not enabled on any VLAN, (2) No dynamic ARP inspection is configured, (3) No IP source guard is deployed, (4) All switch ports are in access mode with no 802.1X, (5) The rogue device was able to connect to any port without authentication. The CISO wants a DHCP and network access security plan.'
  followup_weak: |-
    Password reset prevents continued access with captured credentials.

    Post-incident audit reveals: (1) DHCP snooping is not enabled on any VLAN, (2) No dynamic ARP inspection is configured, (3) No IP source guard is deployed, (4) All switch ports are in access mode with no 802.1X, (5) The rogue device was able to connect to any port without authentication. The CISO wants a DHCP and network access security plan.
  next: recovery_and_validation
  mitre_tactic: Credential Access
  mitre_technique: T1111 — Multi-Factor Authentication Interception
- id: recovery_and_validation
  phase_type: recovery
  title: Recovery & Validation
  situation: Containment is holding and the attacker's active access has been removed. VLAN 25 DHCP scope is quarantined or offline, and business owners are asking when service can resume. Backups, rebuild images, and a change window are available — but the root cause must be proven fixed first.
  prompt: What must be true before you return VLAN 25 DHCP scope to production?
  guidance:
    what: Separate business pressure to restore from the evidence required to restore safely.
    action: What must be true before you return VLAN 25 DHCP scope to production?
    why: A fast restore that reintroduces the attacker is worse than a slower, verified recovery.
  hint: 'Trusted backups and proof of cleanliness come before speed; a fast restore can reopen the incident. Focus: Recovery & Validation. Asset in scope: VLAN 25 DHCP scope.'
  hints:
  - Which backup or rebuild image is known-good for VLAN 25 DHCP scope, and when was it validated?
  - Which credentials or certificates were exposed and must be rotated before restore?
  - What monitoring will prove the attacker has not returned after service resumes?
  ideal_concepts:
  - known-good backup
  - integrity validation
  - credential rotation
  - reinfection monitoring
  - staged restoration
  - business sign-off
  reference_answer: |-
    Restore VLAN 25 DHCP scope from a known-good backup or rebuild it from a trusted image, validate system and data integrity, rotate every credential and certificate exposed during the incident, and monitor the restored environment for reinfection before handing it back to the business.

    Why: Recovery is only complete when the root cause is fixed and the restored asset is proven clean; restoring compromised infrastructure reopens the incident.
  followup_good: Services are restored in stages from trusted sources, exposed credentials are rotated, and monitoring confirms no reinfection. The business signs off on the restored service with evidence attached.
  followup_weak: The asset is back online, but the root cause and credential exposure were not fully validated. The attacker still has a path back in, and the incident may reopen under a new alert.
