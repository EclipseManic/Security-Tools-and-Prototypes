phases:
- id: rogue_dhcp_detection
  phase_type: triage
  title: Phase 1 — Rogue DHCP Detection
  situation: DHCP snooping logs on mktg-switch-251 show DHCP OFFER messages from MAC bb:cc:dd:ee:ff:01 starting at 08:12 UTC. The legitimate DHCP server (10.10.25.1) is still active. 18 of 34 VLAN 25 clients received IP addresses from the rogue server (10.10.25.200-230 range). The rogue DHCP responses include DNS=10.10.25.254 and Gateway=10.10.25.254. DNS queries from affected hosts show all queries resolving to 10.10.25.254. What do you do?
  prompt: What is your first response?
  guidance:
    what: Establish what fired on VLAN 25 DHCP scope, which accounts are involved, and how urgent the signal is.
    action: What is your first response?
    why: Every later decision depends on an accurate picture of VLAN 25 DHCP scope and the accounts involved.
  hint: 'Start with the alert itself: which asset, account, and time window are actually in scope? Focus: Phase 1 — Rogue DHCP Detection. Asset in scope: VLAN 25 DHCP scope.'
  hints:
  - Restarting the legitimate DHCP server does not stop the rogue server from responding.
  - Consider pulling the relevant logs for the affected window.
  ideal_concepts:
  - shut down
  - down port
  - port gi1
  - gi1 mktg-switch-251
  - mktg-switch-251 isolate
  - isolate rogue
  - rogue dhcp
  - dhcp server
  reference_answer: |-
    Shut down port Gi1/0/19 on mktg-switch-251 to isolate the rogue DHCP server. Enable DHCP snooping on VLAN 25 immediately ('ip dhcp snooping; ip dhcp snooping vlan 25'). Mark Gi1/0/1 as trusted (legitimate DHCP server port). Force all 18 affected clients to renew DHCP leases by sending DHCPRELEASE or rebooting. Verify DNS resolution returns to legitimate servers.

    Why: Isolating the rogue device stops DHCP poisoning. DHCP snooping prevents future rogue DHCP by only accepting DHCP responses from trusted ports. Forcing DHCP renewal restores correct network configuration. This sequence contains the attack and hardens against recurrence.
  followup_good: 'Forensic analysis of the Raspberry Pi Zero 2W reveals: (1) dnsmasq configured as DHCP + DNS server, (2) A Flask web server serving a cloned Outlook Web App login page (outlook.office365.com clone at 10.10.25.254:443), (3) A SQLite database (o365_creds.db) containing 23 captured O365 credentials with timestamps, source IPs, and user agents, (4) The captured credentials include 2 department managers and 1 Marketing VP (vp.marketing@acme.com), (5) The phishing portal was also capturing MFA TOTP codes via a real-time relay proxy to 198.51.100.88, (6) DHCP lease logs show the rogue device captured network topology for all 34 VLAN 25 hosts.'
  followup_weak: |-
    Isolating the rogue device stops DHCP poisoning.

    Forensic analysis of the Raspberry Pi Zero 2W reveals: (1) dnsmasq configured as DHCP + DNS server, (2) A Flask web server serving a cloned Outlook Web App login page (outlook.office365.com clone at 10.10.25.254:443), (3) A SQLite database (o365_creds.db) containing 23 captured O365 credentials with timestamps, source IPs, and user agents, (4) The captured credentials include 2 department managers and 1 Marketing VP (vp.marketing@acme.com), (5) The phishing portal was also capturing MFA TOTP codes via a real-time relay proxy to 198.51.100.88, (6) DHCP lease logs show the rogue device captured network topology for all 34 VLAN 25 hosts.
