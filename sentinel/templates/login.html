<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} - sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main style="max-width: 420px; margin: 12vh auto;">
    <div class="brand" style="margin-bottom: 22px;">
      <span class="mark">SS</span>
      <div>
        <h1>{{ app_name }}</h1>
        <p>Windows service investigation console &middot; v{{ version }}</p>
      </div>
    </div>

    <div class="panel">
      <h3>Sign in</h3>
      <p class="hint">This console can change Windows services. Enter the analyst password
      configured for this installation.</p>

      {% if error %}
      <div class="banner bad" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login_submit') }}">
        <label class="field">Password
          <input type="password" name="password" autocomplete="current-password" autofocus required>
        </label>
        <button type="submit" class="primary" style="width:100%">Sign in</button>
      </form>
    </div>

    <p class="hint" style="text-align:center">Sessions last 8 hours. Failed attempts are rate limited and logged.</p>
  </main>
</body>
</html>
