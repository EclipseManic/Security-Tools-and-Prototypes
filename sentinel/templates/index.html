<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="sentinel-token" content="{{ token }}">
  <title>{{ app_name }} {{ version }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">SS</span>
      <div>
        <h1>{{ app_name }}</h1>
        <p>Windows service investigation console &middot; v{{ version }}</p>
      </div>
    </div>
    <div class="topbar-meta" id="topmeta"></div>
    <div class="topbar-actions">
      <button id="refresh-all" class="primary" data-action="refresh-all">Refresh data</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view">
    <div class="loading"><span class="spinner"></span> Loading ServiceSentinel…</div>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toasts" class="toasts"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
